<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="72" y="92" font-size="14" font-weight="700" fill="#1971c2">Performance · UI 지연</text>
  <line x1="72" y1="108" x2="252" y2="108" stroke="#1971c2" stroke-width="1.2"/>
  <text x="72" y="176" font-size="46" font-weight="800" fill="#212529">느린 UI는 어디서 느린가</text>
  <text x="72" y="231" font-size="46" font-weight="800" fill="#212529">상호작용 하나를 구간으로 나누기</text>
  <text x="72" y="282" font-size="17" font-weight="500" fill="#59636e">필드에서 하나를 고르고 가장 큰 구간 하나에만 다음 도구를 연다</text>

  <!-- timeline -->
  <text x="72" y="356" font-size="14" font-weight="600" fill="#59636e">클릭</text>
  <line x1="88" y1="364" x2="88" y2="470" stroke="#868e96" stroke-width="1.2"/>

  <rect x="88" y="380" width="170" height="44" rx="6" fill="#e7f0f8" stroke="#a5c4de"/>
  <text x="173" y="408" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">입력 지연</text>
  <rect x="258" y="380" width="290" height="44" rx="6" fill="#d0e4f5" stroke="#74a7d1"/>
  <text x="403" y="408" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">처리 시간</text>
  <rect x="548" y="380" width="170" height="44" rx="6" fill="#ece5f7" stroke="#b39ddb"/>
  <text x="633" y="408" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">표시 지연</text>

  <line x1="718" y1="364" x2="718" y2="470" stroke="#1971c2" stroke-width="2"/>
  <text x="718" y="356" font-size="14" font-weight="700" fill="#1971c2" text-anchor="middle">다음 프레임 (INP 끝)</text>

  <rect x="742" y="380" width="386" height="44" rx="6" fill="#fff4e6" stroke="#f0a35e" stroke-dasharray="6 4"/>
  <text x="935" y="408" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">네트워크 · 서버 (INP 밖)</text>

  <!-- tools -->
  <text x="173" y="458" font-size="14" fill="#59636e" text-anchor="middle">LoAF 스크립트 귀속</text>
  <text x="403" y="458" font-size="14" fill="#59636e" text-anchor="middle">프레임워크 프로파일러</text>
  <text x="633" y="458" font-size="14" fill="#59636e" text-anchor="middle">스타일 · 레이아웃 · 페인트</text>
  <text x="935" y="458" font-size="14" fill="#59636e" text-anchor="middle">Resource Timing · Server-Timing · traceparent</text>

  <text x="72" y="540" font-size="15" fill="#868e96">INP 기준: 75번째 백분위수 200ms 이하 좋음, 500ms 초과 나쁨 (web.dev)</text>
</svg>
