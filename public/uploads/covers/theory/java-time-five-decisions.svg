<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="72" y="92" font-size="14" font-weight="700" fill="#1971c2">Java · 시간</text>
  <line x1="72" y1="108" x2="212" y2="108" stroke="#1971c2" stroke-width="1.2"/>
  <text x="72" y="176" font-size="46" font-weight="800" fill="#212529">자바에서 시간을 스마트하게 다루는 방법이란?</text>
  <text x="72" y="231" font-size="30" font-weight="700" fill="#212529">정할 것 다섯 가지: 타입, 더하기, 재기, 문자열, 저장</text>
  <text x="72" y="282" font-size="17" font-weight="500" fill="#59636e">알리바바 클라우드의 정리를 실행해 보고 빠진 결정을 채웠다</text>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="72" y="336" width="196" height="60" rx="8" fill="#e7f0f8" stroke="#a5c4de"/><text x="170" y="372" fill="#1f2328">1 타입</text>
    <rect x="288" y="336" width="196" height="60" rx="8" fill="#e7f0f8" stroke="#a5c4de"/><text x="386" y="372" fill="#1f2328">2 더하기</text>
    <rect x="504" y="336" width="196" height="60" rx="8" fill="#fff4e6" stroke="#f0c98a"/><text x="602" y="372" fill="#1f2328">3 재기</text>
    <rect x="720" y="336" width="196" height="60" rx="8" fill="#fff4e6" stroke="#f0c98a"/><text x="818" y="372" fill="#1f2328">4 문자열</text>
    <rect x="936" y="336" width="196" height="60" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="1034" y="372" fill="#1f2328">5 저장</text>
  </g>

  <text x="72" y="462" font-size="15" font-weight="700" fill="#1f2328">JDK 21, MySQL 8.4, PostgreSQL 16으로 실행한 값</text>
  <text x="72" y="494" font-size="15" fill="#59636e">같은 미래 시각이 JDK에 든 시간대 자료의 판에 따라 한 시간 다른 순간이 된다</text>
  <text x="72" y="522" font-size="15" fill="#59636e">SimpleDateFormat을 여덟 스레드가 함께 쓰면 160만 번 중 78만 번 넘게 틀린 결과가 나온다</text>
  <text x="72" y="550" font-size="15" fill="#59636e">연결 설정이 없으면 서울에서 쓴 순간을 UTC 서버가 9시간 늦은 순간으로 읽는다</text>
  <text x="1128" y="592" font-size="14" font-weight="700" fill="#868e96" text-anchor="end">IT Oasis</text>
</svg>
