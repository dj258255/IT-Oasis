<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="순서를 뒤집어 demand를 먼저 검사하면: 값 42의 읽기전용 공유 페이지에 자식이 쓰면 store 폴트가 나는데, COW를 안 보고 힙 demand로 착각해 빈 페이지를 0으로 덮어 42가 사라진다. 그래서 COW를 먼저 검사해야 한다.">
  <defs>
    <style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;}</style>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c9d1d9"/></marker>
  </defs>
  <rect width="600" height="320" rx="14" fill="#0b0e14"/>
  <text x="300" y="32" text-anchor="middle" class="mono" font-size="12.5" fill="#5b6473">순서를 뒤집으면 (demand를 먼저 검사) — 깨지는 경로</text>
  <g class="mono" text-anchor="middle" font-size="12.5">
    <text x="300" y="66" fill="#c9d1d9">공유 페이지 (값 42, 읽기전용 — PTE_W 없음)</text>
    <text x="300" y="86" font-size="11.5" fill="#8a94a6">자식이 씀 → store 폴트 (scause=15)</text>
    <line x1="300" y1="92" x2="300" y2="116" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="300" y="136" fill="#dea584">COW를 안 보고 "힙 주소네 → demand"로 착각</text>
    <line x1="300" y1="144" x2="300" y2="168" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="300" y="188" fill="#c9d1d9">빈 페이지 kalloc → 0으로 덮음</text>
    <line x1="300" y1="196" x2="300" y2="220" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="196" y="230" width="208" height="34" rx="8" fill="#1a1014" stroke="#c66" stroke-width="1.5"/>
    <text x="300" y="252" fill="#e08" font-size="13">42가 사라짐  ✗</text>
    <text x="300" y="290" font-size="12" fill="#5ec46e">→ 그래서 COW를 "먼저" 검사해야 한다</text>
  </g>
</svg>
