<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="셸이 fork하면 부모와 자식으로 갈리고, 자식은 exec로 hello가 되어 실행 후 exit(ZOMBIE)하며 부모를 wakeup하고, 부모의 wait가 자식 pid를 반환한 뒤 다음 프롬프트를 출력한다.">
  <defs>
    <style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;}</style>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c9d1d9"/></marker>
  </defs>
  <rect width="640" height="440" rx="14" fill="#0b0e14"/>
  <g class="mono" font-size="13.5">
    <!-- Shell -->
    <rect x="252" y="24" width="136" height="30" rx="6" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/>
    <text x="320" y="44" text-anchor="middle" fill="#dea584">Shell</text>
    <text x="330" y="78" fill="#8a94a6" font-size="12">fork()</text>
    <!-- split -->
    <path d="M320,56 L320,68 L150,68 L150,92" fill="none" stroke="#2a3140" stroke-width="1.6"/>
    <path d="M320,68 L490,68 L490,92" fill="none" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="150" y1="68" x2="150" y2="92" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <!-- Parent / Child headers -->
    <rect x="92" y="92" width="116" height="28" rx="6" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/>
    <text x="150" y="111" text-anchor="middle" fill="#c9d1d9">부모</text>
    <rect x="432" y="92" width="116" height="28" rx="6" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/>
    <text x="490" y="111" text-anchor="middle" fill="#c9d1d9">자식</text>
    <!-- lifelines -->
    <line x1="150" y1="120" x2="150" y2="330" stroke="#2a3140" stroke-width="1.5" stroke-dasharray="4 5"/>
    <line x1="490" y1="120" x2="490" y2="300" stroke="#2a3140" stroke-width="1.5" stroke-dasharray="4 5"/>
    <!-- child path -->
    <text x="490" y="150" text-anchor="middle" fill="#8a94a6" font-size="12">exec("hello")</text>
    <text x="490" y="186" text-anchor="middle" fill="#c9d1d9">hello 실행</text>
    <text x="490" y="222" text-anchor="middle" fill="#8a94a6" font-size="12">exit()</text>
    <text x="490" y="250" text-anchor="middle" fill="#dea584" font-size="12">→ ZOMBIE</text>
    <!-- parent waits -->
    <text x="150" y="150" text-anchor="middle" fill="#8a94a6" font-size="12">wait()</text>
    <text x="150" y="186" text-anchor="middle" fill="#5b6473" font-size="12">(자식 종료 대기)</text>
    <!-- wakeup arrow child->parent -->
    <path d="M490,262 L490,286 L150,286 L150,312" fill="none" stroke="#3a944a" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="320" y="280" text-anchor="middle" fill="#5ec46e" font-size="12">wakeup</text>
    <!-- parent resumes -->
    <text x="150" y="332" text-anchor="middle" fill="#c9d1d9" font-size="12.5">wait 반환 (자식 pid)</text>
    <line x1="150" y1="344" x2="150" y2="372" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="206" y="382" width="228" height="32" rx="16" fill="#11241a" stroke="#3a944a" stroke-width="1.5"/>
    <text x="320" y="403" text-anchor="middle" fill="#5ec46e">다음 프롬프트 출력</text>
  </g>
</svg>
