<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="Layout of one DNS query: from the outside in, Ethernet header (14B), IP header (20B), UDP header (8B), then DNS.">
  <defs><style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;}</style></defs>
  <rect width="680" height="320" rx="14" fill="#0b0e14"/>
  <text x="340" y="36" text-anchor="middle" class="mono" font-size="13.5" fill="#5b6473">One DNS query — outer layers go out first (top)</text>
  <g class="mono">
    <rect x="40" y="56" width="600" height="50" rx="7" fill="#10243b" stroke="#2a7de1" stroke-width="1.5"/>
    <text x="58" y="78" font-size="13.5" fill="#7db3ee">Ethernet (14B)</text>
    <text x="58" y="97" font-size="11.5" fill="#8a94a6">dst MAC · src MAC · ethertype=0x0800</text>
    <rect x="40" y="114" width="600" height="50" rx="7" fill="#0f2a1c" stroke="#3a944a" stroke-width="1.5"/>
    <text x="58" y="136" font-size="13.5" fill="#5ec46e">IP (20B)</text>
    <text x="58" y="155" font-size="11.5" fill="#8a94a6">version·TTL · protocol=17(UDP) · src IP · dst IP · checksum</text>
    <rect x="40" y="172" width="600" height="50" rx="7" fill="#2b2410" stroke="#dea584" stroke-width="1.5"/>
    <text x="58" y="194" font-size="13.5" fill="#dea584">UDP (8B)</text>
    <text x="58" y="213" font-size="11.5" fill="#8a94a6">src port · dst port · length · checksum</text>
    <rect x="40" y="230" width="600" height="50" rx="7" fill="#1a1430" stroke="#9a86d8" stroke-width="1.5"/>
    <text x="58" y="252" font-size="13.5" fill="#b3a4e6">DNS</text>
    <text x="58" y="271" font-size="11.5" fill="#8a94a6">header · question (name → type)</text>
  </g>
</svg>
