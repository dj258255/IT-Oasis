<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="유저 모드 printf가 ecall로 권한 경계를 넘어 S-mode로 들어가 kernelvec가 레지스터·CSR을 저장하고, syscall 디스패치가 uart_putc를 실행한 뒤 sret로 다시 경계를 넘어 유저 모드로 복귀한다.">
  <defs>
    <style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;}</style>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c9d1d9"/></marker>
  </defs>
  <rect width="560" height="420" rx="14" fill="#0b0e14"/>
  <g class="mono" text-anchor="middle">
    <text x="280" y="40" font-size="13.5"><tspan fill="#7db3ee">User mode</tspan><tspan fill="#c9d1d9" dx="10">printf()</tspan></text>
    <text x="296" y="64" font-size="11.5" fill="#8a94a6" text-anchor="start">ecall</text>
    <line x1="280" y1="48" x2="280" y2="80" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="60" y1="92" x2="500" y2="92" stroke="#2a7de1" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="280" y="110" font-size="11.5" fill="#5b6473">권한 경계 (U → S)</text>
    <text x="280" y="146" font-size="13" fill="#c9d1d9">kernelvec</text>
    <text x="280" y="164" font-size="11.5" fill="#8a94a6">레지스터 · CSR을 트랩 프레임에 저장</text>
    <line x1="280" y1="176" x2="280" y2="200" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="280" y="220" font-size="13" fill="#c9d1d9">syscall 디스패치</text>
    <line x1="280" y1="232" x2="280" y2="256" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="280" y="276" font-size="13"><tspan fill="#dea584">uart_putc()</tspan><tspan fill="#5b6473" dx="8">← 실제 일 처리</tspan></text>
    <text x="296" y="300" font-size="11.5" fill="#8a94a6" text-anchor="start">sret</text>
    <line x1="280" y1="284" x2="280" y2="316" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="60" y1="328" x2="500" y2="328" stroke="#2a7de1" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="280" y="346" font-size="11.5" fill="#5b6473">권한 경계 (S → U)</text>
    <text x="280" y="384" font-size="13.5"><tspan fill="#7db3ee">User mode</tspan><tspan fill="#c9d1d9" dx="10">printf() 다음 줄로 복귀</tspan></text>
  </g>
</svg>
