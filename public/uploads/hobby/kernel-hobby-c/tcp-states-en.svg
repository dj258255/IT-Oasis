<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" role="img" aria-label="TCP states a passive-open server walks: LISTEN, SYN_RCVD, ESTABLISHED, CLOSE_WAIT, LAST_ACK, CLOSED. Our code walks them in straight-line code with no explicit state variable.">
  <defs>
    <style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;}</style>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c9d1d9"/></marker>
  </defs>
  <rect width="520" height="470" rx="14" fill="#0b0e14"/>
  <g class="mono" font-size="13.5" text-anchor="middle">
    <g><rect x="180" y="24" width="160" height="34" rx="7" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/><text x="260" y="46" fill="#c9d1d9">LISTEN</text></g>
    <text x="276" y="80" fill="#8a94a6" font-size="11.5" text-anchor="start">recv SYN → send SYN-ACK</text>
    <line x1="260" y1="58" x2="260" y2="92" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <g><rect x="180" y="96" width="160" height="34" rx="7" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/><text x="260" y="118" fill="#c9d1d9">SYN_RCVD</text></g>
    <text x="276" y="152" fill="#8a94a6" font-size="11.5" text-anchor="start">recv ACK (handshake done)</text>
    <line x1="260" y1="130" x2="260" y2="164" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <g><rect x="170" y="168" width="180" height="34" rx="7" fill="#0f2a1c" stroke="#3a944a" stroke-width="1.5"/><text x="260" y="190" fill="#5ec46e">ESTABLISHED</text></g>
    <text x="260" y="224" fill="#5b6473" font-size="11.5">receive data → echo back</text>
    <text x="276" y="244" fill="#8a94a6" font-size="11.5" text-anchor="start">recv peer's FIN</text>
    <line x1="260" y1="226" x2="260" y2="258" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <g><rect x="180" y="262" width="160" height="34" rx="7" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/><text x="260" y="284" fill="#c9d1d9">CLOSE_WAIT</text></g>
    <text x="276" y="318" fill="#8a94a6" font-size="11.5" text-anchor="start">send my FIN</text>
    <line x1="260" y1="296" x2="260" y2="330" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <g><rect x="180" y="334" width="160" height="34" rx="7" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/><text x="260" y="356" fill="#c9d1d9">LAST_ACK</text></g>
    <text x="276" y="390" fill="#8a94a6" font-size="11.5" text-anchor="start">final ACK</text>
    <line x1="260" y1="368" x2="260" y2="402" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <g><rect x="180" y="406" width="160" height="34" rx="7" fill="#1a1014" stroke="#a85" stroke-width="1.5"/><text x="260" y="428" fill="#dea584">CLOSED</text></g>
  </g>
</svg>
