<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-label="A page fault splits into three branches of one proc_pagefault handler: heap means kalloc then zero and map, mmap means kalloc then fs_read_page and read-only map, else returns 0 to kill. Returning 1 re-runs the same instruction.">
  <defs>
    <style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;}</style>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c9d1d9"/></marker>
  </defs>
  <rect width="680" height="360" rx="14" fill="#0b0e14"/>
  <g class="mono" text-anchor="middle">
    <text x="340" y="34" font-size="12.5" fill="#8a94a6">page fault (scause 12/13/15) · stval = faulting address</text>
    <text x="340" y="54" font-size="11" fill="#5b6473">sepc unchanged (to re-run that instruction)</text>
    <line x1="340" y1="60" x2="340" y2="80" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="222" y="84" width="236" height="32" rx="7" fill="#11151d" stroke="#2a3140" stroke-width="1.5"/>
    <text x="340" y="105" font-size="13" fill="#c9d1d9">proc_pagefault(stval, is_store)</text>
    <path d="M340,116 L340,134 M120,134 L560,134 M120,134 L120,156 M340,134 L340,156 M560,134 L560,156" fill="none" stroke="#2a3140" stroke-width="1.6"/>
    <line x1="120" y1="150" x2="120" y2="172" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="340" y1="150" x2="340" y2="172" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="560" y1="150" x2="560" y2="172" stroke="#2a3140" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="30" y="176" width="180" height="86" rx="8" fill="#0f2a1c" stroke="#3a944a" stroke-width="1.5"/>
    <text x="120" y="200" font-size="12.5" fill="#5ec46e">heap?</text>
    <text x="120" y="222" font-size="11.5" fill="#c9d1d9">kalloc → zero</text>
    <text x="120" y="242" font-size="11.5" fill="#8a94a6">map(R|W|U)</text>
    <rect x="250" y="176" width="180" height="86" rx="8" fill="#2b2410" stroke="#dea584" stroke-width="1.5"/>
    <text x="340" y="200" font-size="12.5" fill="#dea584">mmap?</text>
    <text x="340" y="222" font-size="11.5" fill="#c9d1d9">kalloc → fs_read_page</text>
    <text x="340" y="242" font-size="11.5" fill="#8a94a6">map(R|U, read-only)</text>
    <rect x="470" y="176" width="180" height="86" rx="8" fill="#1a1014" stroke="#a85" stroke-width="1.5"/>
    <text x="560" y="200" font-size="12.5" fill="#d99">else</text>
    <text x="560" y="222" font-size="11.5" fill="#8a94a6">(null · out of range)</text>
    <text x="560" y="242" font-size="11.5" fill="#c9d1d9">return 0 = kill</text>
    <text x="340" y="300" font-size="12" fill="#5ec46e">return 1 → re-run the same instruction</text>
  </g>
</svg>
