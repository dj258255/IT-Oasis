<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="Weak Generational Hypothesis - process 메서드에서 List temp = new ArrayList() 생성 후 사용, 메서드 끝나면 temp는 참조 없음 → 대부분의 객체는 단명함">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="560" height="200" rx="8" class="bg"/>
  <rect width="560" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="keyword">void <tspan class="ident">process</tspan>() {</text>
  <text x="40" y="88" class="text"><tspan class="type">List</tspan>&lt;<tspan class="type">String</tspan>&gt; <tspan class="var">temp</tspan> = <tspan class="keyword">new</tspan> <tspan class="type">ArrayList</tspan>&lt;&gt;();  <tspan class="comment">// 생성</tspan></text>
  <text x="40" y="112" class="comment">// ... 작업 ...</text>
  <text x="20" y="136" class="text">}  <tspan class="comment">// 메서드 끝나면 temp는 참조 없음 → 대부분 객체는 단명</tspan></text>
</svg>
