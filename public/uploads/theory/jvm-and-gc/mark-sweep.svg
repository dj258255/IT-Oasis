<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Mark 전/후 비교 - Mark 전: Root → A, A → B, A → C; D, E는 아무도 참조 안 함. Mark 후: Root → A✓, A → B✓, A → C✓, D, E는 표시 없음">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.08); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .root { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .obj { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .marked { fill: rgba(76, 175, 80, 0.28); stroke: #4CAF50; stroke-width: 1.5; }
      .unmarked { fill: rgba(255, 107, 107, 0.2); stroke: #FF6B6B; stroke-width: 1.25; }
      .lbl { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
      .frame-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
    </style>
    <marker id="ms-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="760" height="600" class="bg"/>
  <text x="380" y="28" text-anchor="middle" class="title">Mark 전/후 비교</text>

  <rect x="20" y="60" width="340" height="520" rx="10" class="frame"/>
  <text x="190" y="86" text-anchor="middle" class="frame-lbl">Mark 전</text>

  <rect x="140" y="120" width="100" height="44" rx="6" class="root"/>
  <text x="190" y="148" text-anchor="middle" class="lbl">Root</text>
  <line x1="190" y1="164" x2="190" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#ms-a)"/>
  <rect x="140" y="202" width="100" height="44" rx="6" class="obj"/>
  <text x="190" y="230" text-anchor="middle" class="lbl">A</text>
  <line x1="170" y1="246" x2="100" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#ms-a)"/>
  <line x1="210" y1="246" x2="280" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#ms-a)"/>
  <rect x="50" y="296" width="80" height="44" rx="6" class="obj"/>
  <text x="90" y="324" text-anchor="middle" class="lbl">B</text>
  <rect x="250" y="296" width="80" height="44" rx="6" class="obj"/>
  <text x="290" y="324" text-anchor="middle" class="lbl">C</text>
  <rect x="60" y="400" width="80" height="44" rx="6" class="obj"/>
  <text x="100" y="428" text-anchor="middle" class="lbl">D</text>
  <rect x="200" y="400" width="80" height="44" rx="6" class="obj"/>
  <text x="240" y="428" text-anchor="middle" class="lbl">E</text>
  <text x="190" y="490" text-anchor="middle" class="sub">D, E ← 아무도 참조 안 함</text>

  <rect x="400" y="60" width="340" height="520" rx="10" class="frame"/>
  <text x="570" y="86" text-anchor="middle" class="frame-lbl">Mark 후</text>

  <rect x="520" y="120" width="100" height="44" rx="6" class="root"/>
  <text x="570" y="148" text-anchor="middle" class="lbl">Root</text>
  <line x1="570" y1="164" x2="570" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#ms-a)"/>
  <rect x="520" y="202" width="100" height="44" rx="6" class="marked"/>
  <text x="570" y="230" text-anchor="middle" class="lbl">A ✓</text>
  <line x1="550" y1="246" x2="480" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#ms-a)"/>
  <line x1="590" y1="246" x2="660" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#ms-a)"/>
  <rect x="430" y="296" width="80" height="44" rx="6" class="marked"/>
  <text x="470" y="324" text-anchor="middle" class="lbl">B ✓</text>
  <rect x="630" y="296" width="80" height="44" rx="6" class="marked"/>
  <text x="670" y="324" text-anchor="middle" class="lbl">C ✓</text>
  <rect x="440" y="400" width="80" height="44" rx="6" class="unmarked"/>
  <text x="480" y="428" text-anchor="middle" class="lbl">D</text>
  <rect x="580" y="400" width="80" height="44" rx="6" class="unmarked"/>
  <text x="620" y="428" text-anchor="middle" class="lbl">E</text>
  <text x="570" y="490" text-anchor="middle" class="sub">D, E ← 표시 없음 (가비지)</text>
</svg>
