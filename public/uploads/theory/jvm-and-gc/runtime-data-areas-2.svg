<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Runtime Data Areas 2 - Method Area, Heap Area는 공유, Stack Areas는 Thread1/2/n 별 Stack Frame, PC Registers와 Native Method Stack도 스레드별 분리">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.06); stroke: rgba(255,238,215,0.3); stroke-width: 1.25; }
      .area { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .heap { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .stack { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .pc { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .native { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .lbl { font: 600 11px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .small { font: 500 10px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
      .frame-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
    </style>
  </defs>
  <rect width="760" height="280" class="bg"/>
  <text x="380" y="28" text-anchor="middle" class="title">Runtime Data Areas 구성</text>

  <rect x="20" y="50" width="720" height="200" rx="10" class="frame"/>
  <text x="380" y="74" text-anchor="middle" class="frame-lbl">Runtime Data Areas</text>

  <rect x="40" y="92" width="80" height="120" rx="6" class="area"/>
  <text x="80" y="156" text-anchor="middle" class="lbl">Method</text>
  <text x="80" y="172" text-anchor="middle" class="lbl">Area</text>

  <rect x="130" y="92" width="80" height="120" rx="6" class="heap"/>
  <text x="170" y="156" text-anchor="middle" class="lbl">Heap</text>
  <text x="170" y="172" text-anchor="middle" class="lbl">Area</text>

  <g>
    <text x="220" y="86" class="small" fill="#FFB74D">Stack Areas</text>
    <rect x="220" y="92" width="100" height="120" rx="6" class="stack"/>
    <text x="270" y="108" text-anchor="middle" class="small">Thread 1</text>
    <rect x="226" y="116" width="88" height="16" rx="3" fill="rgba(255,238,215,0.2)"/>
    <text x="270" y="128" text-anchor="middle" class="small">Stack Frame</text>
    <rect x="226" y="136" width="88" height="16" rx="3" fill="rgba(255,238,215,0.2)"/>
    <text x="270" y="148" text-anchor="middle" class="small">Stack Frame</text>

    <rect x="324" y="92" width="100" height="120" rx="6" class="stack"/>
    <text x="374" y="108" text-anchor="middle" class="small">Thread 2</text>
    <rect x="330" y="116" width="88" height="16" rx="3" fill="rgba(255,238,215,0.2)"/>
    <text x="374" y="128" text-anchor="middle" class="small">Stack Frame</text>

    <rect x="428" y="92" width="100" height="120" rx="6" class="stack"/>
    <text x="478" y="108" text-anchor="middle" class="small">Thread n</text>
    <rect x="434" y="116" width="88" height="16" rx="3" fill="rgba(255,238,215,0.2)"/>
    <text x="478" y="128" text-anchor="middle" class="small">Stack Frame</text>
  </g>

  <g>
    <text x="540" y="86" class="small" fill="#FFB74D">PC Registers</text>
    <rect x="540" y="92" width="100" height="36" rx="4" class="pc"/>
    <text x="590" y="115" text-anchor="middle" class="small">PC for Thread 1</text>
    <rect x="540" y="134" width="100" height="36" rx="4" class="pc"/>
    <text x="590" y="157" text-anchor="middle" class="small">PC for Thread 2</text>
    <rect x="540" y="176" width="100" height="36" rx="4" class="pc"/>
    <text x="590" y="199" text-anchor="middle" class="small">PC for Thread n</text>
  </g>

  <rect x="650" y="92" width="80" height="120" rx="6" class="native"/>
  <text x="690" y="148" text-anchor="middle" class="lbl">Native</text>
  <text x="690" y="164" text-anchor="middle" class="lbl">Method</text>
  <text x="690" y="180" text-anchor="middle" class="lbl">Stack</text>
</svg>
