<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="GC 개념 - C/C++은 malloc으로 수동 메모리 할당 후 free, 한 번만 놓쳐도 메모리 누수; Java는 GC가 알아서 처리해서 user=null만 해도 나중에 GC가 수거">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 13px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 13px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 13px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 13px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 13px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 13px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="640" height="280" rx="8" class="bg"/>
  <rect width="640" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="comment">// C에서는 직접 메모리를 free</text>
  <text x="20" y="88" class="keyword"><tspan class="type">int</tspan>* <tspan class="var">ptr</tspan> = <tspan class="ident">malloc</tspan>(<tspan class="keyword">sizeof</tspan>(<tspan class="type">int</tspan>));</text>
  <text x="20" y="108" class="text"><tspan class="ident">free</tspan>(<tspan class="var">ptr</tspan>);   <tspan class="comment">// 한 번만 놓쳐도 메모리 누수</tspan></text>

  <text x="20" y="160" class="comment">// Java는 GC가 알아서 처리</text>
  <text x="20" y="188" class="type">User <tspan class="var">user</tspan> = <tspan class="keyword">new</tspan> <tspan class="type">User</tspan>();</text>
  <text x="20" y="208" class="text"><tspan class="var">user</tspan> = <tspan class="keyword">null</tspan>;   <tspan class="comment">// 더 이상 참조 없음 → GC 대상</tspan></text>
</svg>
