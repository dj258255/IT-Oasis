<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="Escape Analysis - process 메서드에서 Point p = new Point(1, 2) 후 p가 메서드 바깥으로 나가지 않음을 JIT이 감지해 Heap 대신 Stack에 할당 가능">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .literal { font: 500 14px "Consolas", "Menlo", monospace; fill: #B5CEA8; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="560" height="240" rx="8" class="bg"/>
  <rect width="560" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="keyword">void <tspan class="ident">process</tspan>() {</text>
  <text x="40" y="88" class="text"><tspan class="type">Point</tspan> <tspan class="var">p</tspan> = <tspan class="keyword">new</tspan> <tspan class="type">Point</tspan>(<tspan class="literal">1</tspan>, <tspan class="literal">2</tspan>);  <tspan class="comment">// 힙 대신 스택에 할당 가능</tspan></text>
  <text x="40" y="116" class="text"><tspan class="type">int</tspan> <tspan class="var">sum</tspan> = <tspan class="var">p</tspan>.<tspan class="var">x</tspan> + <tspan class="var">p</tspan>.<tspan class="var">y</tspan>;</text>
  <text x="40" y="144" class="comment">// p는 이 메서드 밖으로 나가지 않음</text>
  <text x="20" y="172" class="text">}</text>
</svg>
