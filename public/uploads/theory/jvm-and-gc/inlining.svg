<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="Inlining 최적화 - 최적화 전 int result = getValue()처럼 메서드 호출이 있었다면 최적화 후 getValue() 몸체를 펼쳐 int result = this.value;로 변환">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="520" height="240" rx="8" class="bg"/>
  <rect width="520" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="comment">// 최적화 전</text>
  <text x="20" y="88" class="keyword"><tspan class="type">int</tspan> <tspan class="var">result</tspan> = <tspan class="ident">getValue</tspan>();</text>

  <text x="20" y="142" class="comment">// 최적화 후 (getValue가 인라이닝됨)</text>
  <text x="20" y="170" class="keyword"><tspan class="type">int</tspan> <tspan class="var">result</tspan> = <tspan class="keyword">this</tspan>.<tspan class="var">value</tspan>;</text>
</svg>
