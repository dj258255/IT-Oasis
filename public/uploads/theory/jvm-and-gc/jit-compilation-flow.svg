<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-label="JIT 컴파일 흐름 - 첫 실행: 인터프리터 → 바이트코드 → 프로파일링(실행 횟수 측정) → 임계값 초과(기본 10000) → Hot Spot 감지 → 네이티브 코드 생성 → 컴파일, 다음 호출 시: 메서드 호출 → 코드 캐시 확인 → 네이티브 코드 직접 실행">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.06); stroke: rgba(255,238,215,0.3); stroke-width: 1.25; }
      .step { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .profile { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .hotspot { fill: rgba(255, 107, 107, 0.26); stroke: #FF6B6B; stroke-width: 1.25; }
      .native { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .lbl { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 11px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
      .frame-lbl { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
    </style>
    <marker id="jf-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="780" height="440" class="bg"/>
  <text x="390" y="28" text-anchor="middle" class="title">JIT 컴파일 흐름</text>

  <rect x="20" y="60" width="540" height="340" rx="10" class="frame"/>
  <text x="290" y="84" text-anchor="middle" class="frame-lbl">첫 실행</text>

  <rect x="40" y="120" width="140" height="38" rx="6" class="step"/>
  <text x="110" y="144" text-anchor="middle" class="lbl">인터프리터로 실행</text>
  <line x1="180" y1="139" x2="218" y2="139" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#jf-a)"/>

  <rect x="220" y="120" width="120" height="38" rx="6" class="step"/>
  <text x="280" y="144" text-anchor="middle" class="lbl">바이트코드</text>
  <line x1="340" y1="139" x2="378" y2="139" stroke="#888" stroke-width="1.5" marker-end="url(#jf-a)"/>

  <rect x="380" y="110" width="140" height="58" rx="6" class="profile"/>
  <text x="450" y="132" text-anchor="middle" class="lbl">프로파일링</text>
  <text x="450" y="150" text-anchor="middle" class="sub">(실행 횟수 측정)</text>

  <rect x="200" y="200" width="160" height="46" rx="6" class="step"/>
  <text x="280" y="220" text-anchor="middle" class="lbl">실행 횟수 측정</text>
  <text x="280" y="238" text-anchor="middle" class="sub">(메서드/루프)</text>
  <line x1="280" y1="200" x2="350" y2="168" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#jf-a)"/>

  <rect x="40" y="260" width="160" height="60" rx="6" class="profile"/>
  <text x="120" y="286" text-anchor="middle" class="lbl">임계값 초과</text>
  <text x="120" y="304" text-anchor="middle" class="sub">(기본 10000)</text>
  <line x1="200" y1="290" x2="348" y2="290" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#jf-a)"/>

  <rect x="350" y="260" width="160" height="60" rx="6" class="hotspot"/>
  <text x="430" y="294" text-anchor="middle" class="lbl">Hot Spot 감지</text>

  <rect x="40" y="340" width="240" height="40" rx="6" class="native"/>
  <text x="160" y="364" text-anchor="middle" class="lbl">네이티브 코드 생성</text>
  <line x1="280" y1="360" x2="318" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#jf-a)"/>
  <rect x="320" y="340" width="180" height="40" rx="6" class="native"/>
  <text x="410" y="364" text-anchor="middle" class="lbl">컴파일 완료</text>

  <line x1="500" y1="360" x2="580" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#jf-a)"/>

  <rect x="590" y="60" width="180" height="340" rx="10" class="frame"/>
  <text x="680" y="84" text-anchor="middle" class="frame-lbl">다음 호출 시</text>

  <rect x="610" y="120" width="140" height="50" rx="6" class="step"/>
  <text x="680" y="150" text-anchor="middle" class="lbl">메서드 호출</text>
  <line x1="680" y1="170" x2="680" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#jf-a)"/>

  <rect x="610" y="194" width="140" height="50" rx="6" class="step"/>
  <text x="680" y="224" text-anchor="middle" class="lbl">코드 캐시 확인</text>
  <line x1="680" y1="244" x2="680" y2="262" stroke="#888" stroke-width="1.5" marker-end="url(#jf-a)"/>

  <rect x="600" y="268" width="160" height="60" rx="6" class="native"/>
  <text x="680" y="294" text-anchor="middle" class="lbl">네이티브 코드</text>
  <text x="680" y="312" text-anchor="middle" class="lbl">직접 실행</text>
</svg>
