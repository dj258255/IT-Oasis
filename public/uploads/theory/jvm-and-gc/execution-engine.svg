<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Execution Engine 구조 - Interpreter, JIT Compiler(Intermediate Code Generator, Code Optimizer, Target Code Generator, Profiler), Garbage Collection, Native Method Interface(JNI), Native Method Library">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.06); stroke: rgba(255,238,215,0.3); stroke-width: 1.25; }
      .interpreter { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .jit { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .jit-inner { fill: rgba(255, 238, 215, 0.18); stroke: rgba(255,238,215,0.3); stroke-width: 1; }
      .gc { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .native { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .lbl { font: 600 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .small { font: 500 10.5px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
      .frame-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
    </style>
  </defs>
  <rect width="760" height="280" class="bg"/>
  <text x="380" y="28" text-anchor="middle" class="title">Execution Engine</text>

  <rect x="20" y="50" width="500" height="200" rx="10" class="frame"/>
  <text x="270" y="74" text-anchor="middle" class="frame-lbl">Execution Engine</text>

  <rect x="40" y="100" width="100" height="100" rx="6" class="interpreter"/>
  <text x="90" y="156" text-anchor="middle" class="lbl">Interpreter</text>

  <rect x="160" y="90" width="240" height="140" rx="6" class="jit"/>
  <text x="280" y="110" text-anchor="middle" class="lbl">JIT Compiler</text>
  <rect x="180" y="120" width="120" height="20" rx="3" class="jit-inner"/>
  <text x="240" y="135" text-anchor="middle" class="small">Intermediate Code</text>
  <rect x="180" y="146" width="120" height="20" rx="3" class="jit-inner"/>
  <text x="240" y="161" text-anchor="middle" class="small">Code Optimizer</text>
  <rect x="180" y="172" width="120" height="20" rx="3" class="jit-inner"/>
  <text x="240" y="187" text-anchor="middle" class="small">Target Code</text>
  <rect x="320" y="146" width="70" height="46" rx="3" class="jit-inner"/>
  <text x="355" y="173" text-anchor="middle" class="small">Profiler</text>

  <rect x="420" y="100" width="80" height="100" rx="6" class="gc"/>
  <text x="460" y="148" text-anchor="middle" class="lbl">Garbage</text>
  <text x="460" y="164" text-anchor="middle" class="lbl">Collection</text>

  <rect x="540" y="100" width="100" height="100" rx="6" class="native"/>
  <text x="590" y="142" text-anchor="middle" class="lbl">Native</text>
  <text x="590" y="158" text-anchor="middle" class="lbl">Method</text>
  <text x="590" y="174" text-anchor="middle" class="lbl">Interface (JNI)</text>

  <rect x="660" y="100" width="80" height="100" rx="6" class="native"/>
  <text x="700" y="148" text-anchor="middle" class="lbl">Native</text>
  <text x="700" y="164" text-anchor="middle" class="lbl">Method</text>
  <text x="700" y="180" text-anchor="middle" class="lbl">Library</text>
</svg>
