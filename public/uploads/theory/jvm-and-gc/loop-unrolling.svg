<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="Loop Unrolling 최적화 - 최적화 전 for(i=0;i<4;i++) arr[i]=0; 최적화 후 arr[0]=0; arr[1]=0; arr[2]=0; arr[3]=0으로 루프 펼치기">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .literal { font: 500 14px "Consolas", "Menlo", monospace; fill: #B5CEA8; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="560" height="240" rx="8" class="bg"/>
  <rect width="560" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="comment">// 최적화 전</text>
  <text x="20" y="88" class="keyword">for</text> <text x="52" y="88" class="text">(<tspan class="type">int</tspan> <tspan class="var">i</tspan> = <tspan class="literal">0</tspan>; <tspan class="var">i</tspan> &lt; <tspan class="literal">4</tspan>; <tspan class="var">i</tspan>++) { <tspan class="var">arr</tspan>[<tspan class="var">i</tspan>] = <tspan class="literal">0</tspan>; }</text>

  <text x="20" y="142" class="comment">// 최적화 후 (루프 언롤링)</text>
  <text x="20" y="170" class="text"><tspan class="var">arr</tspan>[<tspan class="literal">0</tspan>] = <tspan class="literal">0</tspan>; <tspan class="var">arr</tspan>[<tspan class="literal">1</tspan>] = <tspan class="literal">0</tspan>; <tspan class="var">arr</tspan>[<tspan class="literal">2</tspan>] = <tspan class="literal">0</tspan>; <tspan class="var">arr</tspan>[<tspan class="literal">3</tspan>] = <tspan class="literal">0</tspan>;</text>
</svg>
