<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Full GC 프로세스 시퀀스 - Eden에서 A가 탄생 → Minor GC로 Survivor0로 → Minor GC로 Survivor1로 → 반복하면서 age 증가 → Minor GC로 Old Gen으로 승격 → Major/Full GC까지 생존">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .action { fill: rgba(255, 238, 215, 0.16); stroke: #FFB74D; stroke-width: 1.25; }
      .repeat { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .old-note { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="fgc-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="760" height="420" class="bg"/>
  <text x="380" y="28" text-anchor="middle" class="title">객체 수명 — Eden → Old Gen</text>

  <rect x="30" y="50" width="130" height="34" rx="6" class="actor"/>
  <text x="95" y="73" text-anchor="middle" class="lbl">Eden</text>
  <rect x="210" y="50" width="130" height="34" rx="6" class="actor"/>
  <text x="275" y="73" text-anchor="middle" class="lbl">Survivor0</text>
  <rect x="390" y="50" width="130" height="34" rx="6" class="actor"/>
  <text x="455" y="73" text-anchor="middle" class="lbl">Survivor1</text>
  <rect x="570" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="650" y="73" text-anchor="middle" class="lbl">Old Gen</text>
  <line x1="95" y1="84" x2="95" y2="390" class="lifeline"/>
  <line x1="275" y1="84" x2="275" y2="390" class="lifeline"/>
  <line x1="455" y1="84" x2="455" y2="390" class="lifeline"/>
  <line x1="650" y1="84" x2="650" y2="390" class="lifeline"/>

  <rect x="30" y="100" width="130" height="32" rx="6" class="action"/>
  <text x="95" y="120" text-anchor="middle" class="msg">A 탄생 (new)</text>

  <line x1="97" y1="160" x2="273" y2="160" stroke="#bbb" stroke-width="1.25" marker-end="url(#fgc-a)"/>
  <text x="185" y="154" text-anchor="middle" class="msg">Minor GC</text>

  <line x1="277" y1="192" x2="453" y2="192" stroke="#bbb" stroke-width="1.25" marker-end="url(#fgc-a)"/>
  <text x="365" y="186" text-anchor="middle" class="msg">Minor GC</text>

  <line x1="453" y1="222" x2="277" y2="222" stroke="#bbb" stroke-width="1.25" marker-end="url(#fgc-a)"/>
  <text x="365" y="216" text-anchor="middle" class="msg">Minor GC</text>

  <rect x="200" y="244" width="310" height="30" rx="6" class="repeat"/>
  <text x="355" y="264" text-anchor="middle" class="msg">… 반복 (age 증가)</text>

  <line x1="277" y1="304" x2="648" y2="304" stroke="#bbb" stroke-width="1.25" marker-end="url(#fgc-a)"/>
  <text x="460" y="298" text-anchor="middle" class="msg">Minor GC (승격)</text>

  <rect x="540" y="332" width="200" height="40" rx="6" class="old-note"/>
  <text x="640" y="358" text-anchor="middle" class="msg">Major/Full GC까지 생존</text>
</svg>
