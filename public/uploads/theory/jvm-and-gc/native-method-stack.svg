<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="Native Method Stack 코드 예시 - Example 클래스가 native 메서드 nativeMethod 선언하고 static 블록에서 System.loadLibrary로 mylib 로드">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 13px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 13px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 13px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 13px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .literal { font: 500 13px "Consolas", "Menlo", monospace; fill: #CE9178; }
      .text { font: 500 13px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="520" height="220" rx="8" class="bg"/>
  <rect width="520" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="keyword">public class <tspan class="type">Example</tspan> {</text>
  <text x="40" y="82" class="comment">// 네이티브 메서드 선언</text>
  <text x="40" y="104" class="keyword">public native <tspan class="type">void</tspan> <tspan class="ident">nativeMethod</tspan>();</text>
  <text x="40" y="138" class="keyword">static</text> <text x="92" y="138" class="text">{</text>
  <text x="60" y="160" class="text">System.<tspan class="ident">loadLibrary</tspan>(<tspan class="literal">"mylib"</tspan>);  <tspan class="comment">// libmylib.so 로드</tspan></text>
  <text x="40" y="182" class="text">}</text>
  <text x="20" y="204" class="text">}</text>
</svg>
