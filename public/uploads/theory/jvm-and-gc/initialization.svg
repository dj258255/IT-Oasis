<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="Initialization 단계 코드 예시 - class Example의 static int x = 10은 Prepare 단계에서 x=0 후 Initialize 단계에서 x=10, static List는 Initialize 단계에서 ArrayList 생성 후 add 호출">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 13px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 13px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 13px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .var { font: 500 13px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .literal { font: 500 13px "Consolas", "Menlo", monospace; fill: #B5CEA8; }
      .text { font: 500 13px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="600" height="240" rx="8" class="bg"/>
  <rect width="600" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="keyword">class <tspan class="type">Example</tspan> {</text>
  <text x="40" y="82" class="keyword">static <tspan class="type">int</tspan> <tspan class="var">x</tspan> = <tspan class="literal">10</tspan>;  <tspan class="comment">// Prepare: x=0, Initialize: x=10</tspan></text>
  <text x="40" y="104" class="keyword">static <tspan class="type">List</tspan>&lt;<tspan class="type">String</tspan>&gt; <tspan class="var">list</tspan>;</text>
  <text x="40" y="138" class="keyword">static</text> <text x="92" y="138" class="text">{</text>
  <text x="60" y="160" class="text"><tspan class="var">list</tspan> = <tspan class="keyword">new</tspan> <tspan class="type">ArrayList</tspan>&lt;&gt;();  <tspan class="comment">// Initialize 단계 실행</tspan></text>
  <text x="60" y="182" class="text"><tspan class="var">list</tspan>.<tspan class="type">add</tspan>(<tspan class="literal">"init"</tspan>);</text>
  <text x="40" y="204" class="text">}</text>
  <text x="20" y="224" class="text">}</text>
</svg>
