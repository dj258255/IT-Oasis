<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Object 크기 계산 예시 - class Example { int x, long y, byte z } 의 64-bit + Compressed OOPs 레이아웃: Mark 8, Class Pointer 4(compressed), int x 4, long y 8, byte z 1, padding 7 = 총 32 bytes">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 13px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .keyword { font: 500 13px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 13px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .var { font: 500 13px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 13px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="560" height="380" rx="8" class="bg"/>
  <rect width="560" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="keyword">class <tspan class="type">Example</tspan> {</text>
  <text x="40" y="84" class="keyword"><tspan class="type">int</tspan> <tspan class="var">x</tspan>;    <tspan class="comment">// 4 bytes</tspan></text>
  <text x="40" y="104" class="keyword"><tspan class="type">long</tspan> <tspan class="var">y</tspan>;   <tspan class="comment">// 8 bytes</tspan></text>
  <text x="40" y="124" class="keyword"><tspan class="type">byte</tspan> <tspan class="var">z</tspan>;   <tspan class="comment">// 1 byte</tspan></text>
  <text x="20" y="144" class="text">}</text>

  <text x="20" y="186" class="comment">// 실제 메모리 레이아웃 (64-bit, Compressed OOPs 사용 시)</text>
  <text x="20" y="208" class="comment">// Mark Word:     8 bytes</text>
  <text x="20" y="228" class="comment">// Class Pointer: 4 bytes (compressed)</text>
  <text x="20" y="248" class="comment">// int x:         4 bytes</text>
  <text x="20" y="268" class="comment">// long y:        8 bytes</text>
  <text x="20" y="288" class="comment">// byte z:        1 byte</text>
  <text x="20" y="308" class="comment">// Padding:       7 bytes (8바이트 정렬)</text>
  <text x="20" y="340" class="comment">// Total: 32 bytes</text>
</svg>
