<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Class Loader Subsystem - Class File → Loading(Bootstrap/Extension/Application) → Linking(Verify/Prepare/Resolve) → Initialization">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.06); stroke: rgba(255,238,215,0.3); stroke-width: 1.25; }
      .cls { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .stage1 { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .stage2 { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .stage3 { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .lbl { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
    </style>
    <marker id="cl-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="720" height="360" class="bg"/>
  <text x="360" y="28" text-anchor="middle" class="title">Class Loader Subsystem</text>

  <rect x="20" y="140" width="120" height="60" rx="8" class="cls"/>
  <text x="80" y="176" text-anchor="middle" class="lbl">Class File</text>
  <line x1="140" y1="170" x2="178" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#cl-a)"/>

  <rect x="180" y="60" width="540" height="240" rx="10" class="frame"/>
  <text x="450" y="84" text-anchor="middle" class="frame-lbl">Class Loader SubSystem</text>

  <rect x="200" y="100" width="160" height="180" rx="8" class="frame"/>
  <text x="280" y="120" text-anchor="middle" class="frame-lbl">Loading</text>
  <rect x="220" y="132" width="120" height="40" rx="4" class="stage1"/>
  <text x="280" y="156" text-anchor="middle" class="lbl">Bootstrap Loader</text>
  <rect x="220" y="180" width="120" height="40" rx="4" class="stage1"/>
  <text x="280" y="204" text-anchor="middle" class="lbl">Extension Loader</text>
  <rect x="220" y="228" width="120" height="40" rx="4" class="stage1"/>
  <text x="280" y="252" text-anchor="middle" class="lbl">Application Loader</text>

  <line x1="365" y1="190" x2="395" y2="190" stroke="#888" stroke-width="1.5" marker-end="url(#cl-a)"/>

  <rect x="400" y="100" width="160" height="180" rx="8" class="frame"/>
  <text x="480" y="120" text-anchor="middle" class="frame-lbl">Linking</text>
  <rect x="420" y="132" width="120" height="40" rx="4" class="stage2"/>
  <text x="480" y="156" text-anchor="middle" class="lbl">Verify</text>
  <rect x="420" y="180" width="120" height="40" rx="4" class="stage2"/>
  <text x="480" y="204" text-anchor="middle" class="lbl">Prepare</text>
  <rect x="420" y="228" width="120" height="40" rx="4" class="stage2"/>
  <text x="480" y="252" text-anchor="middle" class="lbl">Resolve</text>

  <line x1="565" y1="190" x2="595" y2="190" stroke="#888" stroke-width="1.5" marker-end="url(#cl-a)"/>

  <rect x="600" y="160" width="100" height="60" rx="8" class="stage3"/>
  <text x="650" y="196" text-anchor="middle" class="lbl">Initialization</text>
</svg>
