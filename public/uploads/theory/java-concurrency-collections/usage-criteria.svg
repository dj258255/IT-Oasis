<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="CopyOnWriteArrayList 사용 권장 / 지양 기준 비교표">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .head-ok { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #a8e6cf; }
      .head-no { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #ffb4b4; }
      .col-ok { fill: rgba(76, 175, 80, 0.12); stroke: #4CAF50; stroke-width: 1.5; }
      .col-no { fill: rgba(255, 107, 107, 0.12); stroke: #FF6B6B; stroke-width: 1.5; }
      .item-text { font: 500 14.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .mark-ok { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #4CAF50; }
      .mark-no { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #FF6B6B; }
    </style>
  </defs>
  <rect width="720" height="420" class="bg"/>

  <text x="360" y="40" text-anchor="middle" class="title">CopyOnWriteArrayList 사용 기준</text>

  <!-- 추천 칼럼 -->
  <rect x="30" y="70" width="320" height="330" rx="10" class="col-ok"/>
  <text x="190" y="102" text-anchor="middle" class="head-ok">추천</text>
  <g>
    <text x="52" y="150" class="mark-ok">OK</text>
    <text x="90" y="150" class="item-text">읽기가 쓰기보다 훨씬 많을 때</text>
    <text x="52" y="196" class="mark-ok">OK</text>
    <text x="90" y="196" class="item-text">리스너 목록 · 옵저버 패턴</text>
    <text x="52" y="242" class="mark-ok">OK</text>
    <text x="90" y="242" class="item-text">컬렉션 크기가 작은 경우</text>
    <text x="52" y="288" class="mark-ok">OK</text>
    <text x="90" y="288" class="item-text">반복 중 수정이 필요할 때</text>
    <text x="52" y="334" class="mark-ok">OK</text>
    <text x="90" y="334" class="item-text">읽기 잠금이 부담스러울 때</text>
    <text x="52" y="380" class="mark-ok">OK</text>
    <text x="90" y="380" class="item-text">snapshot 의미가 허용될 때</text>
  </g>

  <!-- 지양 칼럼 -->
  <rect x="370" y="70" width="320" height="330" rx="10" class="col-no"/>
  <text x="530" y="102" text-anchor="middle" class="head-no">지양</text>
  <g>
    <text x="394" y="150" class="mark-no">NO</text>
    <text x="432" y="150" class="item-text">쓰기가 빈번한 경우</text>
    <text x="394" y="196" class="mark-no">NO</text>
    <text x="432" y="196" class="item-text">컬렉션이 매우 클 때</text>
    <text x="394" y="242" class="mark-no">NO</text>
    <text x="432" y="242" class="item-text">메모리 제약이 큰 환경</text>
    <text x="394" y="288" class="mark-no">NO</text>
    <text x="432" y="288" class="item-text">즉시 일관성이 필요할 때</text>
    <text x="394" y="334" class="mark-no">NO</text>
    <text x="432" y="334" class="item-text">배치 수정이 많은 경우</text>
    <text x="394" y="380" class="mark-no">NO</text>
    <text x="432" y="380" class="item-text">짧은 TTL로 자주 갱신</text>
  </g>
</svg>
