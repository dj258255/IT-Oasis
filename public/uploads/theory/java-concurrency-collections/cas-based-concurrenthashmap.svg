<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" role="img" aria-label="Java 8 ConcurrentHashMap put(key, value) 흐름 - hash 계산, 버킷 비어있으면 CAS로 삽입, 충돌 시 synchronized로 세밀한 락 후 체이닝/트리 삽입">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .step { fill: rgba(100, 181, 246, 0.18); stroke: #64B5F6; stroke-width: 1.5; }
      .decision { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.5; }
      .path-yes { fill: rgba(76, 175, 80, 0.20); stroke: #4CAF50; stroke-width: 1.5; }
      .path-no { fill: rgba(255, 183, 77, 0.20); stroke: #FFB74D; stroke-width: 1.5; }
      .retry { fill: rgba(255, 107, 107, 0.18); stroke: #FF6B6B; stroke-width: 1.5; }
      .final { fill: rgba(76, 175, 80, 0.28); stroke: #4CAF50; stroke-width: 1.75; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .branch-label { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="cas-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#888"/>
    </marker>
  </defs>
  <rect width="520" height="680" class="bg"/>

  <rect x="170" y="20" width="180" height="40" rx="6" class="step"/>
  <text x="260" y="44" text-anchor="middle" class="label">put(key, value) 호출</text>
  <line x1="260" y1="60" x2="260" y2="76" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>

  <rect x="170" y="80" width="180" height="40" rx="6" class="step"/>
  <text x="260" y="104" text-anchor="middle" class="label">hash 키 계산</text>
  <line x1="260" y1="120" x2="260" y2="136" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>

  <rect x="160" y="140" width="200" height="50" rx="6" class="step"/>
  <text x="260" y="162" text-anchor="middle" class="label">tabAt으로 버킷 읽기</text>
  <text x="260" y="180" text-anchor="middle" class="label" style="font-weight: 500; fill: #cccccc;">(volatile read)</text>
  <line x1="260" y1="190" x2="260" y2="208" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>

  <!-- Decision (diamond-like rect) -->
  <polygon points="260,212 370,258 260,304 150,258" class="decision"/>
  <text x="260" y="254" text-anchor="middle" class="label">버킷이 비어있음?</text>

  <!-- Yes branch (left) -->
  <text x="180" y="318" class="branch-label">Yes</text>
  <line x1="180" y1="304" x2="120" y2="318" stroke="#888" stroke-width="1.5"/>
  <line x1="120" y1="318" x2="120" y2="338" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>
  <rect x="30" y="345" width="180" height="56" rx="6" class="path-yes"/>
  <text x="120" y="369" text-anchor="middle" class="label">CAS로 원자적 삽입</text>
  <text x="120" y="390" text-anchor="middle" class="label" style="font-family: 'Consolas','Menlo',monospace;">casTabAt</text>
  <line x1="120" y1="401" x2="120" y2="418" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>

  <!-- CAS success diamond -->
  <polygon points="120,422 200,460 120,498 40,460" class="decision"/>
  <text x="120" y="464" text-anchor="middle" class="label">CAS 성공?</text>

  <!-- Yes -> insert success -->
  <text x="140" y="516" class="branch-label">Yes</text>
  <line x1="120" y1="498" x2="120" y2="518" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>
  <rect x="30" y="525" width="180" height="50" rx="6" class="path-yes"/>
  <text x="120" y="548" text-anchor="middle" class="label">삽입 성공</text>
  <text x="120" y="567" text-anchor="middle" class="label" style="font-weight: 500; fill: #cccccc;">락 없이 완료</text>

  <!-- No (cas fail) -> retry -->
  <text x="205" y="474" class="branch-label">No</text>
  <path d="M 200 460 C 260 460, 260 460, 420 430" stroke="#888" stroke-width="1.5" fill="none"/>
  <rect x="370" y="430" width="120" height="42" rx="6" class="retry"/>
  <text x="430" y="456" text-anchor="middle" class="label">재시도</text>
  <path d="M 430 430 C 430 390, 390 300, 355 270" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#cas-arrow)"/>

  <!-- No branch (right) from main decision -->
  <text x="340" y="318" class="branch-label">No</text>
  <line x1="340" y1="304" x2="400" y2="318" stroke="#888" stroke-width="1.5"/>
  <line x1="400" y1="318" x2="400" y2="338" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>
  <rect x="310" y="345" width="180" height="56" rx="6" class="path-no"/>
  <text x="400" y="369" text-anchor="middle" class="label">충돌 발생</text>
  <text x="400" y="390" text-anchor="middle" class="label" style="font-weight: 500; fill: #cccccc;">버킷에 노드 존재</text>
  <line x1="400" y1="401" x2="400" y2="416" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>

  <rect x="300" y="423" width="200" height="58" rx="6" class="path-no"/>
  <text x="400" y="449" text-anchor="middle" class="label">해당 버킷만</text>
  <text x="400" y="470" text-anchor="middle" class="label">synchronized 락</text>
  <line x1="400" y1="481" x2="400" y2="500" stroke="#888" stroke-width="1.5" marker-end="url(#cas-arrow)"/>

  <rect x="310" y="507" width="180" height="56" rx="6" class="path-no"/>
  <text x="400" y="532" text-anchor="middle" class="label">체이닝 또는</text>
  <text x="400" y="553" text-anchor="middle" class="label">트리에 삽입</text>

  <!-- 작업 완료 final -->
  <path d="M 120 575 C 180 610, 220 620, 260 625" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#cas-arrow)"/>
  <path d="M 400 563 C 360 600, 320 620, 280 625" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#cas-arrow)"/>

  <rect x="180" y="630" width="160" height="38" rx="6" class="final"/>
  <text x="260" y="654" text-anchor="middle" class="label">작업 완료</text>
</svg>
