<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" role="img" aria-label="LongAdder - 여러 셀로 분산해 스레드마다 다른 셀에 증가로 경쟁 감소, sum 호출 시 모든 셀 합산">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .box-entry { fill: rgba(100, 181, 246, 0.18); stroke: #64B5F6; stroke-width: 1.5; }
      .box-good { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.5; }
      .box-sum { fill: rgba(255, 183, 77, 0.20); stroke: #FFB74D; stroke-width: 1.5; }
      .label { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .detail { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="la-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#888"/>
    </marker>
  </defs>
  <rect width="440" height="500" class="bg"/>

  <rect x="140" y="30" width="160" height="48" rx="8" class="box-entry"/>
  <text x="220" y="60" text-anchor="middle" class="label">LongAdder</text>
  <line x1="220" y1="80" x2="220" y2="108" stroke="#888" stroke-width="1.5" marker-end="url(#la-arrow)"/>

  <rect x="100" y="115" width="240" height="80" rx="8" class="box-good"/>
  <text x="220" y="145" text-anchor="middle" class="detail">여러 셀로 분산</text>
  <text x="220" y="168" text-anchor="middle" class="detail">Cell[0], Cell[1], … Cell[n]</text>
  <line x1="220" y1="200" x2="220" y2="225" stroke="#888" stroke-width="1.5" marker-end="url(#la-arrow)"/>

  <rect x="80" y="232" width="280" height="96" rx="8" class="box-good"/>
  <text x="220" y="261" text-anchor="middle" class="detail">스레드마다 다른 셀에 증가</text>
  <text x="220" y="284" text-anchor="middle" class="detail">→ 경쟁 감소</text>
  <text x="220" y="307" text-anchor="middle" class="detail">Thread-A → Cell[2], Thread-B → Cell[5] …</text>
  <line x1="220" y1="333" x2="220" y2="358" stroke="#888" stroke-width="1.5" marker-end="url(#la-arrow)"/>

  <rect x="100" y="365" width="240" height="90" rx="8" class="box-sum"/>
  <text x="220" y="395" text-anchor="middle" class="detail">sum() 호출 시</text>
  <text x="220" y="418" text-anchor="middle" class="detail">모든 셀 합산</text>
  <text x="220" y="440" text-anchor="middle" class="detail">sum = Σ Cell[i].value</text>
</svg>
