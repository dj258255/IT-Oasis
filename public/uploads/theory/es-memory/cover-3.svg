<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="80" y="100" font-size="18" font-weight="700" fill="#0ea5e9" letter-spacing="4">JVM MEMORY SERIES</text>
  <line x1="80" y1="115" x2="320" y2="115" stroke="#0ea5e9" stroke-width="2"/>

  <text x="80" y="310" font-size="220" font-weight="800" fill="url(#num)">03</text>

  <text x="80" y="420" font-size="56" font-weight="700" fill="#0f172a">Off-heap Memory</text>
  <text x="80" y="470" font-size="24" font-weight="400" fill="#475569">DirectByteBuffer · mmap · Foreign Memory</text>

  <g transform="translate(720, 180)">
    <rect x="0" y="0" width="420" height="270" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" rx="14"/>
    <text x="210" y="28" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">JVM Process (RSS)</text>

    <rect x="24" y="56" width="180" height="190" fill="#bae6fd" stroke="#0ea5e9" stroke-width="2" rx="10"/>
    <text x="114" y="100" font-size="18" font-weight="700" fill="#0c4a6e" text-anchor="middle">Heap</text>
    <text x="114" y="128" font-size="14" fill="#0369a1" text-anchor="middle">(-Xmx)</text>
    <text x="114" y="180" font-size="14" fill="#0369a1" text-anchor="middle">GC-managed</text>

    <rect x="224" y="56" width="180" height="86" fill="#fce7f3" stroke="#a855f7" stroke-width="2" rx="10"/>
    <text x="314" y="90" font-size="16" font-weight="700" fill="#581c87" text-anchor="middle">Direct Buffers</text>
    <text x="314" y="118" font-size="12" fill="#7e22ce" text-anchor="middle">NIO · Netty</text>

    <rect x="224" y="158" width="180" height="88" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="10"/>
    <text x="314" y="192" font-size="16" font-weight="700" fill="#3730a3" text-anchor="middle">mmap regions</text>
    <text x="314" y="220" font-size="12" fill="#4338ca" text-anchor="middle">file-backed</text>
  </g>
</svg>
