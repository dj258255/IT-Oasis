<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="80" y="100" font-size="18" font-weight="700" fill="#0ea5e9" letter-spacing="4">JVM MEMORY SERIES</text>
  <line x1="80" y1="115" x2="320" y2="115" stroke="#0ea5e9" stroke-width="2"/>

  <text x="80" y="310" font-size="220" font-weight="800" fill="url(#num)">05</text>

  <text x="80" y="420" font-size="56" font-weight="700" fill="#0f172a">Applied to Elasticsearch</text>
  <text x="80" y="470" font-size="24" font-weight="400" fill="#475569">50% Heap Rule · hybridfs · Circuit Breaker</text>

  <g transform="translate(720, 170)">
    <text x="210" y="-15" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">Host RAM Budget</text>

    <rect x="0" y="0" width="420" height="160" fill="white" stroke="#cbd5e1" stroke-width="2" rx="12"/>

    <rect x="2" y="2" width="207" height="156" fill="#bae6fd" rx="10"/>
    <text x="106" y="72" font-size="22" font-weight="700" fill="#0c4a6e" text-anchor="middle">JVM Heap</text>
    <text x="106" y="100" font-size="16" fill="#0369a1" text-anchor="middle">50%</text>
    <text x="106" y="126" font-size="12" fill="#0369a1" text-anchor="middle">≤ 26~30 GB</text>

    <rect x="211" y="2" width="207" height="156" fill="#fce7f3" rx="10"/>
    <text x="314" y="72" font-size="22" font-weight="700" fill="#581c87" text-anchor="middle">Page Cache</text>
    <text x="314" y="100" font-size="16" fill="#7e22ce" text-anchor="middle">50%</text>
    <text x="314" y="126" font-size="12" fill="#7e22ce" text-anchor="middle">Lucene index files</text>

    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="420" height="72" fill="white" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" rx="10"/>
      <text x="210" y="28" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Circuit Breakers (% of heap)</text>
      <text x="100" y="58" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Field 40%</text>
      <text x="210" y="58" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Request 60%</text>
      <text x="330" y="58" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Parent 95%</text>
    </g>
  </g>
</svg>
