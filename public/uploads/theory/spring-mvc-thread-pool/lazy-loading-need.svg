<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1160" role="img" aria-label="서블릿 Lazy Loading - 서버 시작 시 스레드 풀 200개만 생성 후 서블릿은 안 만듦, 첫 요청 시 UserServlet이 없으면 생성/init/메모리 보관/service 호출, 두 번째 요청은 이미 있으므로 바로 사용">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.08); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .step-init { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .step-setup { fill: rgba(100, 181, 246, 0.16); stroke: #64B5F6; stroke-width: 1.25; }
      .step-req { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .decision { fill: rgba(186, 104, 200, 0.2); stroke: #BA68C8; stroke-width: 1.25; }
      .step-new { fill: rgba(255, 107, 107, 0.2); stroke: #FF6B6B; stroke-width: 1.25; }
      .step-ready { fill: rgba(255, 238, 215, 0.16); stroke: #FFB74D; stroke-width: 1.25; }
      .step-service { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .stage-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .lbl { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="ll-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="460" height="1160" class="bg"/>
  <text x="230" y="28" text-anchor="middle" class="title">서블릿 Lazy Loading</text>

  <rect x="30" y="50" width="400" height="240" rx="10" class="frame"/>
  <text x="230" y="74" text-anchor="middle" class="stage-lbl">서버 시작</text>
  <rect x="110" y="86" width="240" height="36" rx="6" class="step-init"/>
  <text x="230" y="109" text-anchor="middle" class="lbl">Tomcat 시작</text>
  <line x1="230" y1="124" x2="230" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="110" y="146" width="240" height="36" rx="6" class="step-setup"/>
  <text x="230" y="169" text-anchor="middle" class="lbl">서블릿 컨테이너 준비</text>
  <line x1="230" y1="184" x2="230" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="110" y="206" width="240" height="36" rx="6" class="step-setup"/>
  <text x="230" y="229" text-anchor="middle" class="lbl">스레드 풀 200개 생성</text>
  <line x1="230" y1="244" x2="230" y2="260" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="90" y="266" width="280" height="20" rx="4" class="step-ready"/>
  <text x="230" y="281" text-anchor="middle" class="lbl">서블릿은 아직 안 만듦</text>

  <line x1="230" y1="296" x2="230" y2="318" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>

  <rect x="30" y="322" width="400" height="460" rx="10" class="frame"/>
  <text x="230" y="346" text-anchor="middle" class="stage-lbl">첫 요청 처리</text>
  <rect x="110" y="358" width="240" height="36" rx="6" class="step-req"/>
  <text x="230" y="381" text-anchor="middle" class="lbl">첫 요청 · GET /api/user</text>
  <line x1="230" y1="396" x2="230" y2="412" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <polygon points="230,418 330,458 230,498 130,458" class="decision"/>
  <text x="230" y="452" text-anchor="middle" class="lbl">UserServlet이</text>
  <text x="230" y="470" text-anchor="middle" class="lbl">있나?</text>
  <text x="205" y="518" class="lbl">없음</text>
  <line x1="230" y1="498" x2="230" y2="536" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="110" y="540" width="240" height="36" rx="6" class="step-new"/>
  <text x="230" y="563" text-anchor="middle" class="lbl">UserServlet 생성</text>
  <line x1="230" y1="578" x2="230" y2="594" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="110" y="600" width="240" height="36" rx="6" class="step-new"/>
  <text x="230" y="623" text-anchor="middle" class="lbl">init 메서드 호출</text>
  <line x1="230" y1="638" x2="230" y2="654" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="110" y="660" width="240" height="36" rx="6" class="step-ready"/>
  <text x="230" y="683" text-anchor="middle" class="lbl">메모리에 보관</text>
  <line x1="230" y1="698" x2="230" y2="714" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="110" y="720" width="240" height="36" rx="6" class="step-service"/>
  <text x="230" y="743" text-anchor="middle" class="lbl">service 메서드 호출</text>

  <line x1="230" y1="790" x2="230" y2="812" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>

  <rect x="30" y="816" width="400" height="320" rx="10" class="frame"/>
  <text x="230" y="840" text-anchor="middle" class="stage-lbl">두 번째 요청 처리</text>
  <rect x="110" y="852" width="240" height="36" rx="6" class="step-req"/>
  <text x="230" y="875" text-anchor="middle" class="lbl">두 번째 요청 · GET /api/user</text>
  <line x1="230" y1="890" x2="230" y2="906" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <polygon points="230,912 330,952 230,992 130,952" class="decision"/>
  <text x="230" y="946" text-anchor="middle" class="lbl">UserServlet이</text>
  <text x="230" y="964" text-anchor="middle" class="lbl">있나?</text>
  <text x="205" y="1014" class="lbl">있음</text>
  <line x1="230" y1="992" x2="230" y2="1036" stroke="#888" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect x="90" y="1040" width="280" height="50" rx="6" class="step-service"/>
  <text x="230" y="1064" text-anchor="middle" class="lbl">service 메서드 호출</text>
  <text x="230" y="1082" text-anchor="middle" class="lbl">(바로 사용)</text>
</svg>
