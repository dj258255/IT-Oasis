<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6B6B"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64B5F6"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="600" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Tomcat 요청 처리 흐름</text>

  <!-- ==================== NODE 1: 새로운 요청 ==================== -->
  <rect x="275" y="52" width="150" height="36" rx="8" fill="#3d5a80" stroke="#7c7cff" stroke-width="1.5"/>
  <text x="350" y="75" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="bold">새로운 요청</text>

  <!-- Arrow: 새로운 요청 → max-connections diamond -->
  <line x1="350" y1="88" x2="350" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ==================== DIAMOND 1: max-connections ==================== -->
  <polygon points="350,110 500,155 350,200 200,155" fill="#2d2d44" stroke="#7c7cff" stroke-width="1.5"/>
  <text x="350" y="151" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">max-connections</text>
  <text x="350" y="165" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">8192개 이내?</text>

  <!-- YES label (down) -->
  <text x="362" y="216" text-anchor="start" fill="#4CAF50" font-size="11" font-weight="bold">YES</text>

  <!-- Arrow: max-connections YES → Poller -->
  <line x1="350" y1="200" x2="350" y2="240" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- NO label (right) -->
  <text x="508" y="152" text-anchor="start" fill="#FF6B6B" font-size="11" font-weight="bold">NO</text>

  <!-- Arrow: max-connections NO → accept-count diamond -->
  <line x1="500" y1="155" x2="560" y2="155" stroke="#FF6B6B" stroke-width="1.5"/>
  <line x1="560" y1="155" x2="560" y2="310" stroke="#FF6B6B" stroke-width="1.5"/>
  <line x1="560" y1="310" x2="500" y2="310" stroke="#FF6B6B" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ==================== NODE 2: Poller가 연결 관리 ==================== -->
  <rect x="265" y="240" width="170" height="36" rx="8" fill="#2d3748" stroke="#64B5F6" stroke-width="1.5"/>
  <text x="350" y="263" text-anchor="middle" fill="#e0e0e0" font-size="12">Poller가 연결 관리</text>

  <!-- Arrow: Poller → threads.max diamond -->
  <line x1="350" y1="276" x2="350" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ==================== DIAMOND 2: threads.max ==================== -->
  <polygon points="350,290 480,335 350,380 220,335" fill="#2d2d44" stroke="#7c7cff" stroke-width="1.5"/>
  <text x="350" y="331" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">threads.max</text>
  <text x="350" y="345" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">200개 이내?</text>

  <!-- YES label (down) -->
  <text x="362" y="396" text-anchor="start" fill="#4CAF50" font-size="11" font-weight="bold">YES</text>

  <!-- Arrow: threads.max YES → 워커 스레드 할당 -->
  <line x1="350" y1="380" x2="350" y2="415" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- NO label (left) -->
  <text x="190" y="332" text-anchor="end" fill="#64B5F6" font-size="11" font-weight="bold">NO</text>

  <!-- Arrow: threads.max NO → 스레드 풀 큐에서 대기 -->
  <line x1="220" y1="335" x2="155" y2="335" stroke="#64B5F6" stroke-width="1.5"/>
  <line x1="155" y1="335" x2="155" y2="415" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- ==================== NODE 3: 워커 스레드 할당 → 요청 처리 ==================== -->
  <rect x="255" y="415" width="190" height="40" rx="8" fill="#2d3748" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="350" y="434" text-anchor="middle" fill="#4CAF50" font-size="12" font-weight="bold">워커 스레드 할당</text>
  <text x="350" y="449" text-anchor="middle" fill="#4CAF50" font-size="11">→ 요청 처리</text>

  <!-- ==================== NODE 4: 스레드 풀 큐에서 대기 ==================== -->
  <rect x="65" y="415" width="180" height="36" rx="8" fill="#2d3748" stroke="#64B5F6" stroke-width="1.5"/>
  <text x="155" y="438" text-anchor="middle" fill="#64B5F6" font-size="12">스레드 풀 큐에서 대기</text>

  <!-- ==================== DIAMOND 3: accept-count ==================== -->
  <polygon points="420,310 540,350 420,390 300,350" fill="#2d2d44" stroke="#7c7cff" stroke-width="1.5"/>
  <text x="420" y="346" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">accept-count</text>
  <text x="420" y="360" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">100개 이내?</text>

  <!-- YES label (down) -->
  <text x="432" y="406" text-anchor="start" fill="#64B5F6" font-size="11" font-weight="bold">YES</text>

  <!-- Arrow: accept-count YES → OS 레벨 큐에서 대기 -->
  <line x1="420" y1="390" x2="420" y2="490" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- NO label (right) -->
  <text x="548" y="347" text-anchor="start" fill="#FF6B6B" font-size="11" font-weight="bold">NO</text>

  <!-- Arrow: accept-count NO → Connection refused -->
  <line x1="540" y1="350" x2="580" y2="350" stroke="#FF6B6B" stroke-width="1.5"/>
  <line x1="580" y1="350" x2="580" y2="490" stroke="#FF6B6B" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ==================== NODE 5: OS 레벨 큐에서 대기 ==================== -->
  <rect x="330" y="490" width="180" height="36" rx="8" fill="#2d3748" stroke="#64B5F6" stroke-width="1.5"/>
  <text x="420" y="513" text-anchor="middle" fill="#64B5F6" font-size="12">OS 레벨 큐에서 대기</text>

  <!-- Arrow: OS 레벨 큐 → back to max-connections (loop) -->
  <line x1="330" y1="508" x2="120" y2="508" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="120" y1="508" x2="120" y2="155" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="120" y1="155" x2="200" y2="155" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="108" y="340" text-anchor="middle" fill="#888" font-size="9" transform="rotate(-90, 108, 340)">공간 확보 시 재시도</text>

  <!-- ==================== NODE 6: Connection refused ==================== -->
  <rect x="510" y="490" width="170" height="36" rx="8" fill="#3a1f1f" stroke="#FF6B6B" stroke-width="1.5"/>
  <text x="595" y="507" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="bold">Connection refused</text>
  <text x="595" y="520" text-anchor="middle" fill="#FF6B6B" font-size="10">(연결 거부)</text>

  <!-- Legend -->
  <rect x="20" y="555" width="660" height="30" rx="6" fill="#252540" opacity="0.6"/>
  <circle cx="60" cy="570" r="5" fill="#4CAF50"/>
  <text x="72" y="574" fill="#a0a0a0" font-size="10">처리 성공</text>
  <circle cx="170" cy="570" r="5" fill="#64B5F6"/>
  <text x="182" y="574" fill="#a0a0a0" font-size="10">대기</text>
  <circle cx="250" cy="570" r="5" fill="#FF6B6B"/>
  <text x="262" y="574" fill="#a0a0a0" font-size="10">거부/초과</text>
  <line x1="340" y1="570" x2="370" y2="570" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="378" y="574" fill="#a0a0a0" font-size="10">재시도 경로</text>
  <polygon points="490,565 500,570 490,575" fill="#2d2d44" stroke="#7c7cff" stroke-width="1"/>
  <text x="508" y="574" fill="#a0a0a0" font-size="10">조건 분기</text>
</svg>
