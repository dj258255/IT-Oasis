<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 960" role="img" aria-label="서블릿 생명주기 - 첫 요청에서 init 초기화 후 service 메서드로 첫 요청 처리, 메모리에 상주하며 두 번째/세 번째 요청도 service 호출로 재사용, 서버 종료 시 destroy 호출">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .req { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .init { fill: rgba(255, 107, 107, 0.2); stroke: #FF6B6B; stroke-width: 1.25; }
      .service { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .memory { fill: rgba(255, 238, 215, 0.16); stroke: #FFB74D; stroke-width: 1.25; }
      .destroy { fill: rgba(255, 107, 107, 0.24); stroke: #FF6B6B; stroke-width: 1.25; }
      .advantage { fill: rgba(76, 175, 80, 0.28); stroke: #4CAF50; stroke-width: 1.5; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
    </style>
    <marker id="sx-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="420" height="960" class="bg"/>
  <text x="210" y="28" text-anchor="middle" class="title">서블릿 생명주기</text>

  <rect x="110" y="50" width="200" height="40" rx="6" class="req"/>
  <text x="210" y="75" text-anchor="middle" class="lbl">첫 요청</text>
  <line x1="210" y1="90" x2="210" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <rect x="100" y="116" width="220" height="60" rx="8" class="init"/>
  <text x="210" y="141" text-anchor="middle" class="lbl">init 메서드</text>
  <text x="210" y="161" text-anchor="middle" class="sub">초기화</text>
  <line x1="210" y1="176" x2="210" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <rect x="100" y="202" width="220" height="60" rx="8" class="service"/>
  <text x="210" y="227" text-anchor="middle" class="lbl">service 메서드</text>
  <text x="210" y="247" text-anchor="middle" class="sub">첫 요청 처리</text>
  <line x1="210" y1="262" x2="210" y2="282" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <rect x="110" y="288" width="200" height="40" rx="6" class="memory"/>
  <text x="210" y="313" text-anchor="middle" class="lbl">메모리에 상주</text>
  <line x1="210" y1="328" x2="210" y2="348" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <rect x="100" y="354" width="220" height="60" rx="8" class="service"/>
  <text x="210" y="379" text-anchor="middle" class="lbl">service 메서드</text>
  <text x="210" y="399" text-anchor="middle" class="sub">두 번째 요청</text>
  <line x1="210" y1="414" x2="210" y2="434" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <rect x="100" y="440" width="220" height="60" rx="8" class="service"/>
  <text x="210" y="465" text-anchor="middle" class="lbl">service 메서드</text>
  <text x="210" y="485" text-anchor="middle" class="sub">세 번째 요청</text>
  <line x1="210" y1="500" x2="210" y2="520" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <rect x="180" y="526" width="60" height="36" rx="6" class="req"/>
  <text x="210" y="548" text-anchor="middle" class="lbl">…</text>
  <line x1="210" y1="562" x2="210" y2="582" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <rect x="100" y="588" width="220" height="60" rx="8" class="destroy"/>
  <text x="210" y="613" text-anchor="middle" class="lbl">destroy 메서드</text>
  <text x="210" y="633" text-anchor="middle" class="sub">서버 종료 시</text>
  <line x1="210" y1="648" x2="210" y2="668" stroke="#888" stroke-width="1.5" marker-end="url(#sx-a)"/>

  <text x="210" y="690" text-anchor="middle" class="sub">서블릿 생명주기 끝</text>

  <line x1="210" y1="700" x2="210" y2="760" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#sx-a)"/>

  <rect x="60" y="766" width="300" height="110" rx="10" class="advantage"/>
  <text x="210" y="794" text-anchor="middle" class="lbl">장점</text>
  <text x="210" y="820" text-anchor="middle" class="sub">init은 단 한 번만 실행</text>
  <text x="210" y="842" text-anchor="middle" class="sub">service는 재사용</text>
  <text x="210" y="864" text-anchor="middle" class="sub">빠른 응답 속도</text>
</svg>
