<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-label="서블릿 방식 - JVM 프로세스 50MB 하나에서 스레드 1/2/3(1MB씩) 생성 후 요청 1/2/3 받아 처리 후 요청 4/5/6 재사용, 총 53MB로 스레드 풀 재사용, 빠른 응답 속도">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.08); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .jvm { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.5; }
      .req { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .thread { fill: rgba(76, 175, 80, 0.18); stroke: #4CAF50; stroke-width: 1.25; }
      .result { fill: rgba(76, 175, 80, 0.28); stroke: #4CAF50; stroke-width: 1.5; }
      .stage-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .lbl { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="sv2-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="820" height="520" class="bg"/>
  <text x="410" y="26" text-anchor="middle" class="title">서블릿 방식 · 스레드 풀 재사용</text>

  <rect x="20" y="46" width="780" height="340" rx="10" class="frame"/>
  <text x="410" y="66" text-anchor="middle" class="stage-lbl">서블릿 방식</text>

  <rect x="40" y="140" width="160" height="56" rx="6" class="jvm"/>
  <text x="120" y="164" text-anchor="middle" class="lbl">JVM 프로세스</text>
  <text x="120" y="182" text-anchor="middle" class="lbl">50MB</text>

  <!-- 3 requests in -->
  <rect x="40" y="84" width="90" height="32" rx="6" class="req"/>
  <text x="85" y="104" text-anchor="middle" class="lbl">요청 1</text>
  <rect x="40" y="210" width="90" height="32" rx="6" class="req"/>
  <text x="85" y="230" text-anchor="middle" class="lbl">요청 2</text>
  <rect x="40" y="280" width="90" height="32" rx="6" class="req"/>
  <text x="85" y="300" text-anchor="middle" class="lbl">요청 3</text>

  <!-- Threads -->
  <rect x="290" y="84" width="160" height="50" rx="6" class="thread"/>
  <text x="370" y="105" text-anchor="middle" class="lbl">스레드 1</text>
  <text x="370" y="122" text-anchor="middle" class="lbl">1MB</text>
  <rect x="290" y="180" width="160" height="50" rx="6" class="thread"/>
  <text x="370" y="201" text-anchor="middle" class="lbl">스레드 2</text>
  <text x="370" y="218" text-anchor="middle" class="lbl">1MB</text>
  <rect x="290" y="276" width="160" height="50" rx="6" class="thread"/>
  <text x="370" y="297" text-anchor="middle" class="lbl">스레드 3</text>
  <text x="370" y="314" text-anchor="middle" class="lbl">1MB</text>

  <!-- Arrows: requests → threads -->
  <line x1="130" y1="100" x2="288" y2="108" stroke="#888" stroke-width="1.5" marker-end="url(#sv2-a)"/>
  <line x1="130" y1="226" x2="288" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#sv2-a)"/>
  <line x1="130" y1="296" x2="288" y2="304" stroke="#888" stroke-width="1.5" marker-end="url(#sv2-a)"/>

  <!-- JVM provides threads -->
  <path d="M 200 150 C 230 130, 260 115, 288 109" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#sv2-a)"/>
  <path d="M 200 170 C 230 190, 260 200, 288 208" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#sv2-a)"/>
  <path d="M 200 195 C 230 245, 260 290, 288 302" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#sv2-a)"/>

  <!-- 재사용 → 요청 4/5/6 -->
  <line x1="450" y1="110" x2="530" y2="110" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#sv2-a)"/>
  <text x="490" y="102" text-anchor="middle" class="lbl">재사용</text>
  <rect x="540" y="90" width="100" height="40" rx="6" class="req"/>
  <text x="590" y="115" text-anchor="middle" class="lbl">요청 4</text>

  <line x1="450" y1="206" x2="530" y2="206" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#sv2-a)"/>
  <text x="490" y="198" text-anchor="middle" class="lbl">재사용</text>
  <rect x="540" y="186" width="100" height="40" rx="6" class="req"/>
  <text x="590" y="211" text-anchor="middle" class="lbl">요청 5</text>

  <line x1="450" y1="302" x2="530" y2="302" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#sv2-a)"/>
  <text x="490" y="294" text-anchor="middle" class="lbl">재사용</text>
  <rect x="540" y="282" width="100" height="40" rx="6" class="req"/>
  <text x="590" y="307" text-anchor="middle" class="lbl">요청 6</text>

  <!-- Bottom result -->
  <line x1="410" y1="386" x2="410" y2="406" stroke="#888" stroke-width="1.5" marker-end="url(#sv2-a)"/>
  <rect x="210" y="410" width="400" height="80" rx="10" class="result"/>
  <text x="410" y="434" text-anchor="middle" class="stage-lbl">총 메모리: 53MB</text>
  <text x="410" y="456" text-anchor="middle" class="lbl">스레드 풀로 재사용</text>
  <text x="410" y="476" text-anchor="middle" class="lbl">빠른 응답 속도</text>
</svg>
