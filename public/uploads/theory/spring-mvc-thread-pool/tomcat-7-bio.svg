<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" role="img" aria-label="Tomcat 7 BIO 방식 - 클라이언트 연결 수락 → 스레드 풀에서 스레드 1개 할당 → DB 쿼리/파일 읽기 등 요청 처리 → 응답 전송 → 연결 종료될 때까지 스레드 점유. 문제: 스레드가 계속 대기 상태로 묶이고 다른 요청 처리 불가, 동시 연결 수 = 스레드 풀 크기">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .client { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .pool { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .handle { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .response { fill: rgba(76, 175, 80, 0.16); stroke: #4CAF50; stroke-width: 1.25; }
      .hold { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .problem { fill: rgba(255, 107, 107, 0.3); stroke: #FF6B6B; stroke-width: 1.5; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
      .warn { font: 700 12.5px "Segoe UI", Arial, sans-serif; fill: #ffcccb; }
    </style>
    <marker id="bio-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="420" height="780" class="bg"/>
  <text x="210" y="28" text-anchor="middle" class="title">Tomcat 7 BIO 동작</text>

  <rect x="110" y="50" width="200" height="40" rx="6" class="client"/>
  <text x="210" y="75" text-anchor="middle" class="lbl">클라이언트 연결 수락</text>
  <line x1="210" y1="90" x2="210" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#bio-a)"/>

  <rect x="100" y="116" width="220" height="60" rx="8" class="pool"/>
  <text x="210" y="141" text-anchor="middle" class="lbl">스레드 풀에서</text>
  <text x="210" y="161" text-anchor="middle" class="lbl">스레드 1개 할당</text>
  <line x1="210" y1="176" x2="210" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#bio-a)"/>

  <rect x="100" y="202" width="220" height="68" rx="8" class="handle"/>
  <text x="210" y="225" text-anchor="middle" class="lbl">요청 처리</text>
  <text x="210" y="247" text-anchor="middle" class="sub">DB 쿼리, 파일 읽기 등</text>
  <line x1="210" y1="270" x2="210" y2="288" stroke="#888" stroke-width="1.5" marker-end="url(#bio-a)"/>

  <rect x="110" y="294" width="200" height="40" rx="6" class="response"/>
  <text x="210" y="319" text-anchor="middle" class="lbl">응답 전송</text>
  <line x1="210" y1="334" x2="210" y2="354" stroke="#888" stroke-width="1.5" marker-end="url(#bio-a)"/>

  <rect x="100" y="360" width="220" height="60" rx="8" class="hold"/>
  <text x="210" y="385" text-anchor="middle" class="lbl">연결 종료될 때까지</text>
  <text x="210" y="405" text-anchor="middle" class="lbl">스레드 점유</text>

  <text x="210" y="446" text-anchor="middle" class="warn">문제점</text>

  <rect x="60" y="462" width="300" height="140" rx="10" class="problem"/>
  <text x="210" y="488" text-anchor="middle" class="lbl">스레드가 계속 대기 상태로 묶임</text>
  <text x="210" y="514" text-anchor="middle" class="lbl">다른 요청 처리 불가</text>
  <text x="210" y="550" text-anchor="middle" class="lbl">동시 연결 수 =</text>
  <text x="210" y="572" text-anchor="middle" class="lbl">스레드 풀 크기</text>
</svg>
