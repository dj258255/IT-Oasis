<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-label="CGI 방식 메모리 중복 - 프로세스 1과 프로세스 2가 각각 Code/Data/Heap/Stack 메모리를 독립 보유하여 같은 프로그램이지만 메모리 중복 사용">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame-outer { fill: rgba(255, 238, 215, 0.08); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .frame-proc { fill: rgba(255, 238, 215, 0.12); stroke: rgba(255,238,215,0.4); stroke-width: 1.25; }
      .code-dup { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .heap-stack { fill: rgba(100, 181, 246, 0.18); stroke: #64B5F6; stroke-width: 1.25; }
      .note { fill: rgba(186, 104, 200, 0.2); stroke: #BA68C8; stroke-width: 1.25; }
      .problem { fill: rgba(255, 107, 107, 0.28); stroke: #FF6B6B; stroke-width: 1.5; }
      .title-stage { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .lbl { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .warn { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #ffcccb; }
    </style>
    <marker id="cv-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="780" height="660" class="bg"/>
  <text x="390" y="30" text-anchor="middle" class="title">CGI 방식 — 메모리 중복</text>

  <rect x="30" y="50" width="720" height="500" rx="12" class="frame-outer"/>

  <rect x="60" y="80" width="310" height="440" rx="10" class="frame-proc"/>
  <text x="215" y="102" text-anchor="middle" class="title-stage">프로세스 2</text>
  <rect x="85" y="116" width="260" height="40" rx="6" class="code-dup"/>
  <text x="215" y="141" text-anchor="middle" class="lbl">Code: hello.cgi 중복</text>
  <rect x="85" y="170" width="260" height="40" rx="6" class="code-dup"/>
  <text x="215" y="195" text-anchor="middle" class="lbl">Data: 전역 변수 중복</text>
  <rect x="85" y="224" width="260" height="40" rx="6" class="heap-stack"/>
  <text x="215" y="249" text-anchor="middle" class="lbl">Heap: 동적 할당</text>
  <rect x="85" y="278" width="260" height="40" rx="6" class="heap-stack"/>
  <text x="215" y="303" text-anchor="middle" class="lbl">Stack: 함수 호출</text>
  <rect x="85" y="332" width="260" height="40" rx="6" class="note"/>
  <text x="215" y="357" text-anchor="middle" class="lbl">독립된 메모리 공간</text>

  <rect x="410" y="80" width="310" height="440" rx="10" class="frame-proc"/>
  <text x="565" y="102" text-anchor="middle" class="title-stage">프로세스 1</text>
  <rect x="435" y="116" width="260" height="40" rx="6" class="code-dup"/>
  <text x="565" y="141" text-anchor="middle" class="lbl">Code: hello.cgi</text>
  <rect x="435" y="170" width="260" height="40" rx="6" class="code-dup"/>
  <text x="565" y="195" text-anchor="middle" class="lbl">Data: 전역 변수</text>
  <rect x="435" y="224" width="260" height="40" rx="6" class="heap-stack"/>
  <text x="565" y="249" text-anchor="middle" class="lbl">Heap: 동적 할당</text>
  <rect x="435" y="278" width="260" height="40" rx="6" class="heap-stack"/>
  <text x="565" y="303" text-anchor="middle" class="lbl">Stack: 함수 호출</text>
  <rect x="435" y="332" width="260" height="40" rx="6" class="note"/>
  <text x="565" y="357" text-anchor="middle" class="lbl">독립된 메모리 공간</text>

  <line x1="390" y1="550" x2="390" y2="580" stroke="#888" stroke-width="1.5" marker-end="url(#cv-a)"/>

  <rect x="200" y="585" width="380" height="60" rx="10" class="problem"/>
  <text x="390" y="610" text-anchor="middle" class="warn">문제점</text>
  <text x="390" y="632" text-anchor="middle" class="lbl">같은 프로그램인데 메모리 중복 사용</text>
</svg>
