<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="CGI 방식 세 요청 처리 - 요청 1/2/3 각각 프로세스 1/2/3 생성(5MB씩) 후 종료, 총 15MB 사용, 매번 초기화 비용과 DB 연결 재생성으로 느린 응답 속도">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .frame { fill: rgba(255, 238, 215, 0.08); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .req { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .proc { fill: rgba(255, 183, 77, 0.24); stroke: #FFB74D; stroke-width: 1.25; }
      .end { fill: rgba(255, 107, 107, 0.28); stroke: #FF6B6B; stroke-width: 1.25; }
      .problem { fill: rgba(255, 107, 107, 0.2); stroke: #FF6B6B; stroke-width: 1.5; }
      .stage-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .lbl { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="sv1-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="820" height="360" class="bg"/>
  <text x="410" y="26" text-anchor="middle" class="title">CGI 방식 · 3개 요청 처리</text>

  <rect x="20" y="46" width="560" height="296" rx="10" class="frame"/>
  <text x="300" y="66" text-anchor="middle" class="stage-lbl">CGI 방식</text>

  <rect x="40" y="80" width="100" height="40" rx="6" class="req"/>
  <text x="90" y="105" text-anchor="middle" class="lbl">요청 1</text>
  <line x1="140" y1="100" x2="180" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#sv1-a)"/>
  <rect x="185" y="76" width="150" height="48" rx="6" class="proc"/>
  <text x="260" y="98" text-anchor="middle" class="lbl">프로세스 1 생성</text>
  <text x="260" y="116" text-anchor="middle" class="lbl">5MB</text>
  <line x1="335" y1="100" x2="375" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#sv1-a)"/>
  <rect x="380" y="80" width="90" height="40" rx="6" class="end"/>
  <text x="425" y="105" text-anchor="middle" class="lbl">종료</text>

  <rect x="40" y="160" width="100" height="40" rx="6" class="req"/>
  <text x="90" y="185" text-anchor="middle" class="lbl">요청 2</text>
  <line x1="140" y1="180" x2="180" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#sv1-a)"/>
  <rect x="185" y="156" width="150" height="48" rx="6" class="proc"/>
  <text x="260" y="178" text-anchor="middle" class="lbl">프로세스 2 생성</text>
  <text x="260" y="196" text-anchor="middle" class="lbl">5MB</text>
  <line x1="335" y1="180" x2="375" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#sv1-a)"/>
  <rect x="380" y="160" width="90" height="40" rx="6" class="end"/>
  <text x="425" y="185" text-anchor="middle" class="lbl">종료</text>

  <rect x="40" y="240" width="100" height="40" rx="6" class="req"/>
  <text x="90" y="265" text-anchor="middle" class="lbl">요청 3</text>
  <line x1="140" y1="260" x2="180" y2="260" stroke="#888" stroke-width="1.5" marker-end="url(#sv1-a)"/>
  <rect x="185" y="236" width="150" height="48" rx="6" class="proc"/>
  <text x="260" y="258" text-anchor="middle" class="lbl">프로세스 3 생성</text>
  <text x="260" y="276" text-anchor="middle" class="lbl">5MB</text>
  <line x1="335" y1="260" x2="375" y2="260" stroke="#888" stroke-width="1.5" marker-end="url(#sv1-a)"/>
  <rect x="380" y="240" width="90" height="40" rx="6" class="end"/>
  <text x="425" y="265" text-anchor="middle" class="lbl">종료</text>

  <line x1="480" y1="180" x2="600" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#sv1-a)"/>

  <rect x="600" y="70" width="200" height="220" rx="10" class="problem"/>
  <text x="700" y="96" text-anchor="middle" class="stage-lbl">총 메모리: 15MB</text>
  <text x="700" y="130" text-anchor="middle" class="lbl">문제점</text>
  <text x="700" y="152" text-anchor="middle" class="lbl">프로세스 생성 / 종료</text>
  <text x="700" y="170" text-anchor="middle" class="lbl">오버헤드</text>
  <text x="700" y="198" text-anchor="middle" class="lbl">초기화 비용 매번 발생</text>
  <text x="700" y="226" text-anchor="middle" class="lbl">DB 연결 매번 새로 생성</text>
  <text x="700" y="260" text-anchor="middle" class="lbl">느린 응답 속도</text>
</svg>
