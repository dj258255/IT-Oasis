<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="프록시 개념 - 내가 쓴 코드는 @Transactional만 붙이면 되지만 Spring 프록시가 감싸면 transactionManager.getTransaction → target.updateUser → commit, 예외 시 rollback 패턴으로 변환">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 13px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 13px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 13px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 13px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 13px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 13px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 13px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="720" height="380" rx="8" class="bg"/>
  <rect width="720" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="58" class="comment">// 내가 쓴 코드</text>
  <text x="20" y="78" class="annot">@Transactional</text>
  <text x="20" y="98" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">updateUser</tspan>(<tspan class="type">Long</tspan> <tspan class="var">id</tspan>, <tspan class="type">String</tspan> <tspan class="var">name</tspan>) {</text>
  <text x="40" y="118" class="text"><tspan class="type">User</tspan> <tspan class="var">user</tspan> = userRepository.<tspan class="ident">findById</tspan>(<tspan class="var">id</tspan>);</text>
  <text x="40" y="138" class="text"><tspan class="var">user</tspan>.<tspan class="ident">setName</tspan>(<tspan class="var">name</tspan>);</text>
  <text x="20" y="158" class="text">}</text>

  <text x="20" y="200" class="comment">// Spring이 프록시로 감싸면 대충 이런 느낌</text>
  <text x="20" y="220" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">updateUser</tspan>(<tspan class="type">Long</tspan> <tspan class="var">id</tspan>, <tspan class="type">String</tspan> <tspan class="var">name</tspan>) {</text>
  <text x="40" y="240" class="text"><tspan class="type">TransactionStatus</tspan> <tspan class="var">status</tspan> = transactionManager.<tspan class="ident">getTransaction</tspan>(definition);</text>
  <text x="40" y="260" class="keyword">try</text> <text x="74" y="260" class="text">{</text>
  <text x="60" y="280" class="text">target.<tspan class="ident">updateUser</tspan>(<tspan class="var">id</tspan>, <tspan class="var">name</tspan>);  <tspan class="comment">// 실제 메서드 호출</tspan></text>
  <text x="60" y="300" class="text">transactionManager.<tspan class="ident">commit</tspan>(<tspan class="var">status</tspan>);</text>
  <text x="40" y="320" class="text">} <tspan class="keyword">catch</tspan> (<tspan class="type">RuntimeException</tspan> <tspan class="var">e</tspan>) {</text>
  <text x="60" y="340" class="text">transactionManager.<tspan class="ident">rollback</tspan>(<tspan class="var">status</tspan>);</text>
  <text x="60" y="358" class="text"><tspan class="keyword">throw</tspan> <tspan class="var">e</tspan>;</text>
</svg>
