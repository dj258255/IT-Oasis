<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" role="img" aria-label="물리 트랜잭션과 논리 트랜잭션 - 1개의 물리 트랜잭션(커넥션 1개) 안에 논리 트랜잭션 1(외부)과 논리 트랜잭션 2(내부)가 중첩">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .physical { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.5; }
      .logical { fill: rgba(100, 181, 246, 0.24); stroke: #64B5F6; stroke-width: 1.25; }
      .lbl { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
    </style>
  </defs>
  <rect width="580" height="460" class="bg"/>
  <text x="290" y="28" text-anchor="middle" class="title">물리 트랜잭션과 논리 트랜잭션</text>

  <rect x="50" y="60" width="480" height="370" rx="12" class="physical"/>
  <text x="290" y="92" text-anchor="middle" class="lbl">물리 트랜잭션 (커넥션 1개)</text>

  <rect x="130" y="130" width="320" height="100" rx="10" class="logical"/>
  <text x="290" y="170" text-anchor="middle" class="lbl">논리 트랜잭션 1</text>
  <text x="290" y="194" text-anchor="middle" class="sub">(외부)</text>

  <rect x="130" y="280" width="320" height="100" rx="10" class="logical"/>
  <text x="290" y="320" text-anchor="middle" class="lbl">논리 트랜잭션 2</text>
  <text x="290" y="344" text-anchor="middle" class="sub">(내부)</text>
</svg>
