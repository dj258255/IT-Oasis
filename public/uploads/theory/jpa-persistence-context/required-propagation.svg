<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="REQUIRED 전파 - outer @Transactional이 트랜잭션 시작, inner도 @Transactional(REQUIRED 기본값)라 같은 트랜잭션에 참여">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="720" height="280" rx="8" class="bg"/>
  <rect width="720" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Transactional</text>
  <text x="20" y="82" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">outer</tspan>() {</text>
  <text x="40" y="104" class="text">userRepository.<tspan class="ident">save</tspan>(user1);</text>
  <text x="40" y="126" class="text"><tspan class="ident">inner</tspan>();  <tspan class="comment">// 같은 트랜잭션에 참여</tspan></text>
  <text x="20" y="148" class="text">}</text>

  <text x="20" y="186" class="annot">@Transactional  <tspan class="comment">// REQUIRED가 기본값</tspan></text>
  <text x="20" y="208" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">inner</tspan>() {</text>
  <text x="40" y="230" class="text">userRepository.<tspan class="ident">save</tspan>(user2);</text>
  <text x="20" y="252" class="text">}</text>
</svg>
