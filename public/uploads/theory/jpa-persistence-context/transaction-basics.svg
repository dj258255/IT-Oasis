<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="@Transactional 기본 사용 - transferMoney 메서드에 @Transactional을 붙여 withdraw, deposit이 한 트랜잭션 안에서 실행, 둘 중 하나라도 실패 시 둘 다 롤백">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .literal { font: 500 14px "Consolas", "Menlo", monospace; fill: #B5CEA8; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="720" height="220" rx="8" class="bg"/>
  <rect width="720" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Transactional</text>
  <text x="20" y="82" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">transferMoney</tspan>(<tspan class="type">Long</tspan> <tspan class="var">fromId</tspan>, <tspan class="type">Long</tspan> <tspan class="var">toId</tspan>, <tspan class="type">int</tspan> <tspan class="var">amount</tspan>) {</text>
  <text x="40" y="106" class="text">accountRepository.<tspan class="ident">withdraw</tspan>(<tspan class="var">fromId</tspan>, <tspan class="var">amount</tspan>);</text>
  <text x="40" y="128" class="text">accountRepository.<tspan class="ident">deposit</tspan>(<tspan class="var">toId</tspan>, <tspan class="var">amount</tspan>);</text>
  <text x="40" y="152" class="comment">// 둘 다 성공하거나, 실패 시 둘 다 롤백</text>
  <text x="20" y="174" class="text">}</text>
</svg>
