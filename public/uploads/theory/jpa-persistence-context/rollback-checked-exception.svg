<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="rollbackFor 옵션 - rollbackFor에 IOException.class를 명시하면 Checked Exception도 롤백">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
      .ok { font: 500 14px "Consolas", "Menlo", monospace; fill: #4CAF50; }
    </style>
  </defs>
  <rect width="760" height="200" rx="8" class="bg"/>
  <rect width="760" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Transactional(rollbackFor = <tspan class="type">IOException</tspan>.class)</text>
  <text x="20" y="82" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">method</tspan>() <tspan class="keyword">throws</tspan> <tspan class="type">IOException</tspan> {</text>
  <text x="40" y="104" class="keyword">throw new</text> <text x="115" y="104" class="text"><tspan class="type">IOException</tspan>();  <tspan class="ok">// 이제 롤백됨</tspan></text>
  <text x="20" y="126" class="text">}</text>
</svg>
