<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="@Version 엔티티 동일 - Post 엔티티의 @Version 필드 정의">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="760" height="220" rx="8" class="bg"/>
  <rect width="760" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Entity</text>
  <text x="20" y="82" class="keyword">public class <tspan class="type">Post</tspan> {</text>
  <text x="40" y="104" class="annot">@Id @GeneratedValue</text>
  <text x="40" y="126" class="keyword">private <tspan class="type">Long</tspan> <tspan class="var">id</tspan>;</text>
  <text x="40" y="156" class="annot">@Version</text>
  <text x="40" y="178" class="keyword">private <tspan class="type">Long</tspan> <tspan class="var">version</tspan>;  <tspan class="comment">// 수정될 때마다 증가</tspan></text>
  <text x="40" y="208" class="keyword">private <tspan class="type">String</tspan> <tspan class="var">title</tspan>;</text>
</svg>
