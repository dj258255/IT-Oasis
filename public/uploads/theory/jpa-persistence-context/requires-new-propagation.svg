<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="REQUIRES_NEW 전파 - outer가 try/catch로 inner 호출, inner는 별도 트랜잭션(REQUIRES_NEW)으로 실행되어 inner가 롤백돼도 outer는 계속 진행">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 13px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 13px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 13px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 13px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 13px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .text { font: 500 13px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="760" height="320" rx="8" class="bg"/>
  <rect width="760" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="58" class="annot">@Transactional</text>
  <text x="20" y="78" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">outer</tspan>() {</text>
  <text x="40" y="98" class="text">userRepository.<tspan class="ident">save</tspan>(user1);</text>
  <text x="40" y="118" class="keyword">try</text> <text x="74" y="118" class="text">{</text>
  <text x="60" y="138" class="text"><tspan class="ident">inner</tspan>();  <tspan class="comment">// 별도 트랜잭션</tspan></text>
  <text x="40" y="158" class="text">} <tspan class="keyword">catch</tspan> (<tspan class="type">Exception</tspan> e) {</text>
  <text x="60" y="178" class="comment">// inner가 롤백돼도 outer는 계속 진행</text>
  <text x="40" y="198" class="text">}</text>
  <text x="20" y="218" class="text">}</text>

  <text x="20" y="252" class="annot">@Transactional(propagation = <tspan class="type">Propagation</tspan>.REQUIRES_NEW)</text>
  <text x="20" y="272" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">inner</tspan>() {</text>
  <text x="40" y="292" class="text">userRepository.<tspan class="ident">save</tspan>(user2);</text>
  <text x="40" y="312" class="keyword">throw new</text> <text x="116" y="312" class="text"><tspan class="type">RuntimeException</tspan>();  <tspan class="comment">// inner만 롤백</tspan></text>
</svg>
