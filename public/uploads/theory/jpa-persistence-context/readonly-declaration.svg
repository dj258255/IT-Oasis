<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-label="readOnly = true 선언 - 조회 전용 메서드에 readOnly 옵션을 줘서 dirty checking과 flush를 생략해 성능 향상">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .literal { font: 500 14px "Consolas", "Menlo", monospace; fill: #B5CEA8; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="760" height="180" rx="8" class="bg"/>
  <rect width="760" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Transactional(readOnly = <tspan class="literal">true</tspan>)</text>
  <text x="20" y="82" class="keyword">public <tspan class="type">User</tspan> <tspan class="ident">getUser</tspan>(<tspan class="type">Long</tspan> <tspan class="var">id</tspan>) {</text>
  <text x="40" y="104" class="text"><tspan class="keyword">return</tspan> userRepository.<tspan class="ident">findById</tspan>(<tspan class="var">id</tspan>);</text>
  <text x="20" y="126" class="text">}</text>
</svg>
