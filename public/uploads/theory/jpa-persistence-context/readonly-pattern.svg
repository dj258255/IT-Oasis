<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="readOnly 함정 - readOnly = true인데 setTitle로 변경을 시도하면 dirty checking이 비활성화되어 변경이 반영되지 않음">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .literal { font: 500 14px "Consolas", "Menlo", monospace; fill: #B5CEA8; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
      .warn { font: 500 14px "Consolas", "Menlo", monospace; fill: #FF6B6B; }
    </style>
  </defs>
  <rect width="760" height="220" rx="8" class="bg"/>
  <rect width="760" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Transactional(readOnly = <tspan class="literal">true</tspan>)  <tspan class="warn">// 실수로 readOnly</tspan></text>
  <text x="20" y="82" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">updatePostTitle</tspan>(<tspan class="type">Long</tspan> <tspan class="var">postId</tspan>, <tspan class="type">String</tspan> <tspan class="var">newTitle</tspan>) {</text>
  <text x="40" y="104" class="text"><tspan class="type">Post</tspan> <tspan class="var">post</tspan> = postRepository.<tspan class="ident">findById</tspan>(<tspan class="var">postId</tspan>).<tspan class="ident">orElseThrow</tspan>();</text>
  <text x="40" y="126" class="text"><tspan class="var">post</tspan>.<tspan class="ident">setTitle</tspan>(<tspan class="var">newTitle</tspan>);  <tspan class="warn">// 변경이 반영되지 않음!</tspan></text>
  <text x="20" y="148" class="text">}</text>
</svg>
