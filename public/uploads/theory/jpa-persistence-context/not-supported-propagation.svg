<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="NOT_SUPPORTED 전파 - sendEmail은 외부 API 호출이라 트랜잭션 필요 없고 오래 걸릴 수 있어서 NOT_SUPPORTED로 트랜잭션 분리">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="760" height="200" rx="8" class="bg"/>
  <rect width="760" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Transactional(propagation = <tspan class="type">Propagation</tspan>.NOT_SUPPORTED)</text>
  <text x="20" y="82" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">sendEmail</tspan>(<tspan class="type">String</tspan> <tspan class="var">to</tspan>, <tspan class="type">String</tspan> <tspan class="var">content</tspan>) {</text>
  <text x="40" y="104" class="comment">// 외부 API 호출 - 트랜잭션 필요 없고, 오래 걸릴 수 있음</text>
  <text x="40" y="126" class="text">emailClient.<tspan class="ident">send</tspan>(<tspan class="var">to</tspan>, <tspan class="var">content</tspan>);</text>
  <text x="20" y="148" class="text">}</text>
</svg>
