<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="프록시 패턴 - 클라이언트가 프록시를 거쳐 실제 객체에 접근, 프록시는 트랜잭션 시작 → 메서드 실행 → 커밋 또는 롤백 처리">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .client { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .proxy { fill: rgba(255, 183, 77, 0.26); stroke: #FFB74D; stroke-width: 1.5; }
      .real { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .stage { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="pp-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="760" height="320" class="bg"/>
  <text x="380" y="30" text-anchor="middle" class="title">프록시 패턴</text>

  <rect x="20" y="160" width="120" height="50" rx="8" class="client"/>
  <text x="80" y="190" text-anchor="middle" class="lbl">클라이언트</text>
  <line x1="140" y1="185" x2="178" y2="185" stroke="#888" stroke-width="1.5" marker-end="url(#pp-a)"/>

  <rect x="180" y="160" width="120" height="50" rx="8" class="proxy"/>
  <text x="240" y="190" text-anchor="middle" class="lbl">프록시</text>

  <line x1="270" y1="160" x2="320" y2="80" stroke="#888" stroke-width="1.5" marker-end="url(#pp-a)"/>
  <rect x="320" y="60" width="140" height="50" rx="8" class="real"/>
  <text x="390" y="90" text-anchor="middle" class="lbl">실제 객체</text>

  <line x1="300" y1="200" x2="338" y2="220" stroke="#888" stroke-width="1.5" marker-end="url(#pp-a)"/>
  <rect x="340" y="220" width="120" height="50" rx="8" class="stage"/>
  <text x="400" y="250" text-anchor="middle" class="lbl">트랜잭션 시작</text>

  <line x1="460" y1="245" x2="498" y2="245" stroke="#888" stroke-width="1.5" marker-end="url(#pp-a)"/>
  <rect x="500" y="220" width="120" height="50" rx="8" class="stage"/>
  <text x="560" y="250" text-anchor="middle" class="lbl">메서드 실행</text>

  <line x1="620" y1="245" x2="658" y2="245" stroke="#888" stroke-width="1.5" marker-end="url(#pp-a)"/>
  <rect x="660" y="220" width="80" height="50" rx="8" class="stage"/>
  <text x="700" y="244" text-anchor="middle" class="lbl">커밋 /</text>
  <text x="700" y="262" text-anchor="middle" class="lbl">롤백</text>
</svg>
