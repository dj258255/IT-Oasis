      .dot3 { fill: #4CAF50; }
      .comment { font: 500 13px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 13px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 13px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 13px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 13px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .text { font: 500 13px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
