<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-label="self-invocation 함정 - UserService 안에서 outer가 inner를 직접 호출하면 @Transactional이 동작하지 않음 (프록시를 거치지 않기 때문)">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
