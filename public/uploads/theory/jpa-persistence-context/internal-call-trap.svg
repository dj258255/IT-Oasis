  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="58" class="annot">@Service</text>
  <text x="20" y="78" class="keyword">public class <tspan class="type">UserService</tspan> {</text>

  <text x="40" y="108" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">outer</tspan>() {</text>
  <text x="60" y="128" class="text"><tspan class="ident">inner</tspan>(); <tspan class="warn">// @Transactional 안 먹힘!</tspan></text>
  <text x="40" y="148" class="text">}</text>

  <text x="40" y="178" class="annot">@Transactional</text>
  <text x="40" y="198" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">inner</tspan>() {</text>
  <text x="60" y="218" class="text"><tspan class="comment">// DB 작업</tspan></text>
</svg>
