<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="MANDATORY 전파 - addOrderItem이 MANDATORY로 선언되면 외부 트랜잭션 안에서만 호출 가능, 트랜잭션 없이 호출 시 예외 발생">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .top { fill: #2d2d3f; }
      .dot1 { fill: #FF6B6B; }
      .dot2 { fill: #FFB74D; }
      .dot3 { fill: #4CAF50; }
      .comment { font: 500 14px "Consolas", "Menlo", monospace; fill: #6A9955; }
      .annot { font: 500 14px "Consolas", "Menlo", monospace; fill: #FFB74D; }
      .keyword { font: 500 14px "Consolas", "Menlo", monospace; fill: #C586C0; }
      .type { font: 500 14px "Consolas", "Menlo", monospace; fill: #4EC9B0; }
      .ident { font: 500 14px "Consolas", "Menlo", monospace; fill: #DCDCAA; }
      .var { font: 500 14px "Consolas", "Menlo", monospace; fill: #9CDCFE; }
      .text { font: 500 14px "Consolas", "Menlo", monospace; fill: #d4d4d4; }
    </style>
  </defs>
  <rect width="760" height="200" rx="8" class="bg"/>
  <rect width="760" height="32" rx="8" class="top"/>
  <circle cx="20" cy="16" r="6" class="dot1"/>
  <circle cx="40" cy="16" r="6" class="dot2"/>
  <circle cx="60" cy="16" r="6" class="dot3"/>

  <text x="20" y="60" class="annot">@Transactional(propagation = <tspan class="type">Propagation</tspan>.MANDATORY)</text>
  <text x="20" y="82" class="keyword">public <tspan class="type">void</tspan> <tspan class="ident">addOrderItem</tspan>(<tspan class="type">Order</tspan> <tspan class="var">order</tspan>, <tspan class="type">Item</tspan> <tspan class="var">item</tspan>) {</text>
  <text x="40" y="104" class="comment">// 반드시 외부 트랜잭션 안에서만 호출되어야 함</text>
  <text x="40" y="126" class="text"><tspan class="var">order</tspan>.<tspan class="ident">addItem</tspan>(<tspan class="var">item</tspan>);</text>
  <text x="20" y="148" class="text">}</text>
</svg>
