<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgs2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glows2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="rowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="colGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgs2)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>

  <g transform="translate(80, 80)">
    <rect width="240" height="36" rx="18" fill="none" stroke="url(#glows2)" stroke-width="1.5"/>
    <text x="120" y="24" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">DB STORAGE INTERNALS · ②</text>
  </g>

  <text x="80" y="200" fill="#f8fafc" font-size="60" font-weight="800">Row Store vs</text>
  <text x="80" y="276" fill="#f8fafc" font-size="60" font-weight="800">Column Store</text>

  <text x="80" y="332" fill="#94a3b8" font-size="22" font-weight="500">같이 읽는 데이터를 같이 둘 것인가, 같이 계산하는 데이터를 같이 둘 것인가</text>

  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#rowGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="28" y="44" fill="#93c5fd" font-size="18" font-weight="700" letter-spacing="1">ROW STORE</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">한 행의 모든 컬럼을 인접</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">OLTP — 점-쿼리 + 짧은 트랜잭션</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">PostgreSQL · MySQL InnoDB · Oracle</text>
  </g>

  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#colGrad)" stroke="#facc15" stroke-width="1.5"/>
    <text x="28" y="44" fill="#fde68a" font-size="18" font-weight="700" letter-spacing="1">COLUMN STORE</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">같은 컬럼 값을 인접</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">OLAP — 집계 + 광범위 스캔</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">ClickHouse · Parquet · Snowflake · BigQuery</text>
  </g>
</svg>
