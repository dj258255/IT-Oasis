<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgvm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrVM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="url(#bgvm)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">Visibility Map — 페이지마다 2비트</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">Heap relation마다 별도 파일(_vm)로 저장 · conservative + transient</text>

  <!-- Heap pages row -->
  <g transform="translate(80, 130)">
    <text x="0" y="-10" fill="#facc15" font-size="13" font-weight="700" letter-spacing="1">HEAP RELATION (8KB pages)</text>
    <g>
      <rect x="0"   y="0" width="100" height="80" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="50" y="32" fill="#cbd5e1" font-size="11" text-anchor="middle">Page 0</text>
      <text x="50" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">live + dead</text>
      <text x="50" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">mixed</text>

      <rect x="116" y="0" width="100" height="80" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
      <text x="166" y="32" fill="#bbf7d0" font-size="11" text-anchor="middle">Page 1</text>
      <text x="166" y="52" fill="#86efac" font-size="10" text-anchor="middle">all visible</text>
      <text x="166" y="68" fill="#86efac" font-size="10" text-anchor="middle">+ all frozen</text>

      <rect x="232" y="0" width="100" height="80" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
      <text x="282" y="32" fill="#bbf7d0" font-size="11" text-anchor="middle">Page 2</text>
      <text x="282" y="52" fill="#86efac" font-size="10" text-anchor="middle">all visible</text>

      <rect x="348" y="0" width="100" height="80" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="398" y="32" fill="#cbd5e1" font-size="11" text-anchor="middle">Page 3</text>
      <text x="398" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">recent UPDATE</text>
      <text x="398" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">→ cleared</text>

      <rect x="464" y="0" width="100" height="80" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
      <text x="514" y="32" fill="#bbf7d0" font-size="11" text-anchor="middle">Page 4</text>
      <text x="514" y="52" fill="#86efac" font-size="10" text-anchor="middle">all visible</text>

      <rect x="580" y="0" width="100" height="80" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="630" y="32" fill="#cbd5e1" font-size="11" text-anchor="middle">Page 5</text>
      <text x="630" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">in-flight tx</text>

      <text x="720" y="44" fill="#64748b" font-size="14" text-anchor="middle">…</text>
    </g>
  </g>

  <!-- Visibility Map row -->
  <g transform="translate(80, 280)">
    <text x="0" y="-10" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="1">VISIBILITY MAP (_vm 파일, 페이지당 2비트)</text>
    <g>
      <rect x="0"   y="0" width="100" height="80" rx="6" fill="#0f172a" stroke="#22d3ee"/>
      <text x="50" y="30" fill="#a5f3fc" font-size="11" text-anchor="middle">P0</text>
      <text x="50" y="52" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">0 0</text>
      <text x="50" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">vis · frozen</text>

      <rect x="116" y="0" width="100" height="80" rx="6" fill="#0f172a" stroke="#22d3ee"/>
      <text x="166" y="30" fill="#a5f3fc" font-size="11" text-anchor="middle">P1</text>
      <text x="166" y="52" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">1 1</text>
      <text x="166" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">vis · frozen</text>

      <rect x="232" y="0" width="100" height="80" rx="6" fill="#0f172a" stroke="#22d3ee"/>
      <text x="282" y="30" fill="#a5f3fc" font-size="11" text-anchor="middle">P2</text>
      <text x="282" y="52" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">1 0</text>
      <text x="282" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">vis · frozen</text>

      <rect x="348" y="0" width="100" height="80" rx="6" fill="#0f172a" stroke="#22d3ee"/>
      <text x="398" y="30" fill="#a5f3fc" font-size="11" text-anchor="middle">P3</text>
      <text x="398" y="52" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">0 0</text>
      <text x="398" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">cleared</text>

      <rect x="464" y="0" width="100" height="80" rx="6" fill="#0f172a" stroke="#22d3ee"/>
      <text x="514" y="30" fill="#a5f3fc" font-size="11" text-anchor="middle">P4</text>
      <text x="514" y="52" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">1 0</text>
      <text x="514" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">vis only</text>

      <rect x="580" y="0" width="100" height="80" rx="6" fill="#0f172a" stroke="#22d3ee"/>
      <text x="630" y="30" fill="#a5f3fc" font-size="11" text-anchor="middle">P5</text>
      <text x="630" y="52" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">0 0</text>
      <text x="630" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">unknown</text>
    </g>
  </g>

  <!-- Vertical arrows -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" opacity="0.7">
    <line x1="130" y1="220" x2="130" y2="270" marker-end="url(#arrVM)"/>
    <line x1="246" y1="220" x2="246" y2="270" marker-end="url(#arrVM)"/>
    <line x1="362" y1="220" x2="362" y2="270" marker-end="url(#arrVM)"/>
    <line x1="478" y1="220" x2="478" y2="270" marker-end="url(#arrVM)"/>
    <line x1="594" y1="220" x2="594" y2="270" marker-end="url(#arrVM)"/>
    <line x1="710" y1="220" x2="710" y2="270" marker-end="url(#arrVM)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(820, 130)">
    <rect width="320" height="270" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="32" fill="#facc15" font-size="13" font-weight="700">두 비트의 의미</text>

    <g transform="translate(20, 56)">
      <rect width="14" height="14" fill="#4ade80"/>
      <text x="22" y="12" fill="#e2e8f0" font-size="12">all-visible = 1</text>
      <text x="22" y="32" fill="#94a3b8" font-size="11">→ heap 안 봐도 visible 확정</text>
      <text x="22" y="50" fill="#94a3b8" font-size="11">→ Index-Only Scan 가능</text>
    </g>

    <g transform="translate(20, 130)">
      <rect width="14" height="14" fill="#22c55e"/>
      <text x="22" y="12" fill="#e2e8f0" font-size="12">all-frozen = 1 (PG 9.6+)</text>
      <text x="22" y="32" fill="#94a3b8" font-size="11">→ anti-wraparound VACUUM도</text>
      <text x="22" y="48" fill="#94a3b8" font-size="11">  통째로 skip</text>
    </g>

    <g transform="translate(20, 200)">
      <rect width="14" height="14" fill="#f87171"/>
      <text x="22" y="12" fill="#e2e8f0" font-size="12">0 = 모를 때 / 변경 후</text>
      <text x="22" y="32" fill="#94a3b8" font-size="11">write activity → 즉시 0</text>
      <text x="22" y="48" fill="#94a3b8" font-size="11">VACUUM이 다시 1로 set</text>
    </g>
  </g>
</svg>
