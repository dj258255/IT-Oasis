<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgs3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glows3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgs3)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>

  <g transform="translate(80, 80)">
    <rect width="280" height="36" rx="18" fill="none" stroke="url(#glows3)" stroke-width="1.5"/>
    <text x="140" y="24" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">DB STORAGE INTERNALS · ③</text>
  </g>

  <text x="80" y="200" fill="#f8fafc" font-size="60" font-weight="800">HOT Update와</text>
  <text x="80" y="276" fill="#f8fafc" font-size="60" font-weight="800">Visibility Map</text>

  <text x="80" y="332" fill="#94a3b8" font-size="22" font-weight="500">PostgreSQL이 자기 자신의 비용을 줄이는 두 가지 메커니즘</text>

  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#hotGrad)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="28" y="44" fill="#fdba74" font-size="18" font-weight="700" letter-spacing="1">HOT UPDATE</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">조건부로 인덱스 갱신 회피</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">변경 컬럼이 인덱스 밖 + 같은 페이지 free space</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">→ write amplification 대폭 감소</text>
  </g>

  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#vmGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="28" y="44" fill="#93c5fd" font-size="18" font-weight="700" letter-spacing="1">VISIBILITY MAP</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">조건부로 Index-Only Scan</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">all-visible 비트 set → heap fetch 회피</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">VACUUM이 갱신, write activity로 즉시 clear</text>
  </g>
</svg>
