<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgs1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glows1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="heapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="idxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgs1)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>

  <g transform="translate(80, 80)">
    <rect width="240" height="36" rx="18" fill="none" stroke="url(#glows1)" stroke-width="1.5"/>
    <text x="120" y="24" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">DB STORAGE INTERNALS · ①</text>
  </g>

  <text x="80" y="200" fill="#f8fafc" font-size="60" font-weight="800">Heap, Page, Index,</text>
  <text x="80" y="276" fill="#f8fafc" font-size="60" font-weight="800">B-Tree</text>

  <text x="80" y="332" fill="#94a3b8" font-size="22" font-weight="500">DB는 행 단위로 일하지 않는다 — 페이지 단위로 일한다</text>

  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#heapGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="28" y="44" fill="#93c5fd" font-size="18" font-weight="700" letter-spacing="1">HEAP · PAGE</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">DB의 IO 단위는 페이지</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">PostgreSQL 8KB · InnoDB 16KB</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">한 행 SELECT도 페이지 단위로 buffer pool에</text>
  </g>

  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#idxGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="28" y="44" fill="#c4b5fd" font-size="18" font-weight="700" letter-spacing="1">INDEX · B+TREE</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">필요한 페이지 집합을 줄인다</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">노드 = 페이지 (fanout 100~300)</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">트리 깊이 3~4면 수억 행도 lookup</text>
  </g>
</svg>
