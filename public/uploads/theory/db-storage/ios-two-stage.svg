<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgios" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrIOS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrIOSY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrIOSN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#bgios)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">Index-Only Scan은 두 단계 조건을 모두 통과해야 한다</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">covering 조건(plan 단계) + visibility 조건(런타임)</text>

  <!-- Query node -->
  <g transform="translate(540, 120)">
    <rect width="120" height="56" rx="10" fill="#0c4a6e" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="60" y="24" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">SELECT 쿼리</text>
    <text x="60" y="44" fill="#94a3b8" font-size="11" text-anchor="middle">id 컬럼만 조회</text>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(420, 220)">
    <rect width="360" height="80" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
    <text x="180" y="28" fill="#facc15" font-size="13" font-weight="700" text-anchor="middle">STAGE 1 — Covering 조건 (plan time)</text>
    <text x="180" y="54" fill="#cbd5e1" font-size="13" text-anchor="middle">참조 컬럼 모두가 인덱스에 있는가?</text>
    <text x="180" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">e.g. INCLUDE (...) 또는 multi-column index</text>
  </g>

  <line x1="600" y1="180" x2="600" y2="218" stroke="#94a3b8" marker-end="url(#arrIOS)"/>

  <!-- Stage 1 fail branch -->
  <g transform="translate(80, 340)">
    <rect width="280" height="100" rx="12" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="140" y="28" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle">NO → 일반 Index Scan</text>
    <text x="140" y="54" fill="#cbd5e1" font-size="12" text-anchor="middle">매 행마다 heap 방문 필요</text>
    <text x="140" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">IOS 자체 불가능</text>
    <text x="140" y="90" fill="#94a3b8" font-size="11" text-anchor="middle">EXPLAIN: "Index Scan"</text>
  </g>
  <line x1="450" y1="300" x2="280" y2="338" stroke="#f87171" marker-end="url(#arrIOSN)"/>
  <text x="350" y="320" fill="#fda4af" font-size="11" font-weight="700">NO</text>

  <!-- Stage 2 -->
  <line x1="600" y1="300" x2="600" y2="338" stroke="#4ade80" marker-end="url(#arrIOSY)"/>
  <text x="610" y="320" fill="#4ade80" font-size="11" font-weight="700">YES → IOS plan</text>

  <g transform="translate(420, 340)">
    <rect width="360" height="80" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="180" y="28" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">STAGE 2 — Visibility 조건 (런타임)</text>
    <text x="180" y="54" fill="#cbd5e1" font-size="13" text-anchor="middle">VM에서 페이지의 all-visible 비트 = 1?</text>
    <text x="180" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">write activity로 즉시 clear되는 보수적 비트</text>
  </g>

  <!-- Stage 2 results -->
  <g transform="translate(80, 480)">
    <rect width="320" height="100" rx="12" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="160" y="28" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle">VM = 0 → Heap Fetch</text>
    <text x="160" y="54" fill="#cbd5e1" font-size="12" text-anchor="middle">IOS plan으로 잡혔어도 heap 방문</text>
    <text x="160" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">EXPLAIN: Heap Fetches &gt; 0</text>
    <text x="160" y="90" fill="#94a3b8" font-size="11" text-anchor="middle">VM stale일 때의 전형적 패턴</text>
  </g>
  <line x1="450" y1="420" x2="280" y2="478" stroke="#f87171" marker-end="url(#arrIOSN)"/>
  <text x="350" y="455" fill="#fda4af" font-size="11" font-weight="700">NO</text>

  <g transform="translate(800, 480)">
    <rect width="320" height="100" rx="12" fill="#1e293b" stroke="#14532d" stroke-width="1.5"/>
    <text x="160" y="28" fill="#86efac" font-size="13" font-weight="700" text-anchor="middle">VM = 1 → 진짜 IOS</text>
    <text x="160" y="54" fill="#cbd5e1" font-size="12" text-anchor="middle">heap 안 봄 (페이지 차원)</text>
    <text x="160" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">EXPLAIN: Heap Fetches = 0</text>
    <text x="160" y="90" fill="#facc15" font-size="11">hint bits 미설정이면 CLOG lookup</text>
  </g>
  <line x1="750" y1="420" x2="920" y2="478" stroke="#4ade80" marker-end="url(#arrIOSY)"/>
  <text x="830" y="455" fill="#86efac" font-size="11" font-weight="700">YES</text>
</svg>
