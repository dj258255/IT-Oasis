<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <rect width="980" height="440" fill="#f8fafc"/>
  <text x="490" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">B+Tree — 노드 = 한 페이지, fanout 100~300</text>
  <text x="490" y="56" font-size="12" fill="#475569" text-anchor="middle">트리 탐색 한 단계 = 디스크 페이지 접근 한 번 — 자료구조와 IO 패턴이 한 단위로 묶인 설계</text>

  <!-- Root -->
  <g transform="translate(420, 96)">
    <rect width="140" height="40" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="2"/>
    <text x="70" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">[25, 60]</text>
  </g>
  <text x="586" y="120" font-size="11" fill="#94a3b8">Root</text>

  <!-- Internal nodes -->
  <g transform="translate(180, 190)">
    <rect width="120" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">[5, 15]</text>
  </g>
  <g transform="translate(430, 190)">
    <rect width="120" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">[30, 45]</text>
  </g>
  <g transform="translate(680, 190)">
    <rect width="120" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="60" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">[70, 90]</text>
  </g>
  <text x="816" y="214" font-size="11" fill="#94a3b8">Internal</text>

  <!-- Connections root → internal -->
  <line x1="470" y1="136" x2="240" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="490" y1="136" x2="490" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="510" y1="136" x2="740" y2="190" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Leaf nodes -->
  <g font-size="11" font-family="ui-monospace, Menlo, monospace">
    <g transform="translate(60, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">3,4</text>
    </g>
    <g transform="translate(170, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">8,12</text>
    </g>
    <g transform="translate(280, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">17,22</text>
    </g>
    <g transform="translate(390, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">28,29</text>
    </g>
    <g transform="translate(500, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">35,40</text>
    </g>
    <g transform="translate(610, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">50,55</text>
    </g>
    <g transform="translate(720, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">65,68</text>
    </g>
    <g transform="translate(830, 280)">
      <rect width="100" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="50" y="23" text-anchor="middle" fill="#14532d">75,85</text>
    </g>
  </g>
  <text x="940" y="304" font-size="11" fill="#94a3b8" text-anchor="end">Leaf level — sorted keys + pointers</text>

  <!-- internal → leaf connectors (light) -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="220" y1="230" x2="110" y2="280"/>
    <line x1="240" y1="230" x2="220" y2="280"/>
    <line x1="260" y1="230" x2="330" y2="280"/>
    <line x1="470" y1="230" x2="440" y2="280"/>
    <line x1="490" y1="230" x2="550" y2="280"/>
    <line x1="510" y1="230" x2="660" y2="280"/>
    <line x1="720" y1="230" x2="770" y2="280"/>
    <line x1="740" y1="230" x2="880" y2="280"/>
  </g>

  <!-- Leaf sibling links -->
  <g stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3">
    <line x1="160" y1="298" x2="170" y2="298"/>
    <line x1="270" y1="298" x2="280" y2="298"/>
    <line x1="380" y1="298" x2="390" y2="298"/>
    <line x1="490" y1="298" x2="500" y2="298"/>
    <line x1="600" y1="298" x2="610" y2="298"/>
    <line x1="710" y1="298" x2="720" y2="298"/>
    <line x1="820" y1="298" x2="830" y2="298"/>
  </g>
  <text x="490" y="332" font-size="11" font-weight="700" text-anchor="middle" fill="#16a34a">↔ leaf 양방향 링크 — range query에 효율적</text>

  <!-- Properties -->
  <g transform="translate(60, 360)">
    <rect width="860" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="20" y="22" font-size="12" fill="#713f12">• 모든 데이터는 leaf에만 — internal node는 경로 안내</text>
    <text x="20" y="40" font-size="12" fill="#713f12">• Key는 정렬 — 왼쪽으로 갈수록 작고 오른쪽으로 갈수록 큼</text>
    <text x="20" y="58" font-size="12" fill="#713f12">• 균형 트리 — 어느 leaf까지의 깊이도 같음, 항상 O(log N) 검색</text>
  </g>
</svg>
