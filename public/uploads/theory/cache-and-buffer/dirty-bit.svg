<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="캐시 라인 구조 - Valid Bit, Tag, Dirty Bit, Data 필드와 Clean/Dirty 두 가지 상태 예시">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .cell-label { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #1a1a2e; }
      .state-label { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .note { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #aaaaaa; }
      .struct-fill { fill: #e1f5ff; stroke: #64B5F6; stroke-width: 1.5; }
      .clean-line { fill: #a8e6cf; stroke: #4CAF50; stroke-width: 1.5; }
      .dirty-bit-clean { fill: #a8e6cf; stroke: #4CAF50; stroke-width: 1.5; }
      .dirty-line { fill: #ffd4d4; stroke: #FF6B6B; stroke-width: 1.5; }
      .dirty-bit-set { fill: #FF6B6B; stroke: #c62828; stroke-width: 1.5; }
      .arrow { stroke: #888; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="db-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#888"/>
    </marker>
  </defs>
  <rect width="720" height="440" class="bg"/>

  <text x="360" y="38" text-anchor="middle" class="title">캐시 라인 구조</text>

  <!-- Structure header -->
  <text x="60" y="78" class="sub">구조</text>
  <g>
    <rect x="60" y="90" width="120" height="56" rx="6" class="struct-fill"/>
    <text x="120" y="125" text-anchor="middle" class="cell-label">Valid Bit</text>
    <rect x="185" y="90" width="120" height="56" rx="6" class="struct-fill"/>
    <text x="245" y="125" text-anchor="middle" class="cell-label">Tag</text>
    <rect x="310" y="90" width="140" height="56" rx="6" class="struct-fill"/>
    <text x="380" y="125" text-anchor="middle" class="cell-label">Dirty Bit</text>
    <rect x="455" y="90" width="200" height="56" rx="6" class="struct-fill"/>
    <text x="555" y="125" text-anchor="middle" class="cell-label">Data</text>
  </g>

  <!-- Line 1 - Clean (green) -->
  <text x="60" y="200" class="sub" fill="#a8e6cf">라인 1 — Clean</text>
  <g>
    <rect x="60" y="215" width="120" height="56" rx="6" class="clean-line"/>
    <text x="120" y="250" text-anchor="middle" class="cell-label">1</text>
    <rect x="185" y="215" width="120" height="56" rx="6" class="clean-line"/>
    <text x="245" y="250" text-anchor="middle" class="cell-label">0x40</text>
    <rect x="310" y="215" width="140" height="56" rx="6" class="dirty-bit-clean"/>
    <text x="380" y="250" text-anchor="middle" class="cell-label">0</text>
    <rect x="455" y="215" width="200" height="56" rx="6" class="clean-line"/>
    <text x="555" y="250" text-anchor="middle" class="cell-label">데이터</text>
  </g>
  <text x="360" y="296" text-anchor="middle" class="note">→ 읽기만 했음 (메모리와 동일, 교체 시 그냥 버림)</text>

  <!-- Line 2 - Dirty (red) -->
  <text x="60" y="340" class="sub" fill="#ffcccb">라인 2 — Dirty</text>
  <g>
    <rect x="60" y="355" width="120" height="56" rx="6" class="dirty-line"/>
    <text x="120" y="390" text-anchor="middle" class="cell-label">1</text>
    <rect x="185" y="355" width="120" height="56" rx="6" class="dirty-line"/>
    <text x="245" y="390" text-anchor="middle" class="cell-label">0x50</text>
    <rect x="310" y="355" width="140" height="56" rx="6" class="dirty-bit-set"/>
    <text x="380" y="390" text-anchor="middle" class="cell-label" fill="#ffffff">1</text>
    <rect x="455" y="355" width="200" height="56" rx="6" class="dirty-line"/>
    <text x="555" y="390" text-anchor="middle" class="cell-label">데이터*</text>
  </g>
  <text x="360" y="430" text-anchor="middle" class="note">→ 쓰기 발생 (교체 전 메모리에 반드시 write-back)</text>
</svg>
