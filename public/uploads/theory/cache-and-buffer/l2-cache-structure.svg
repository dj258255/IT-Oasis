<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-label="L2 Cache 구조 - L2 캐시는 코어당 256KB-1MB 용량, 접근 시간 10-20 사이클(약 3-10ns), 통합 캐시(명령어+데이터)">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .top { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.5; }
      .size { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .time { fill: rgba(255, 238, 215, 0.2); stroke: #FFB74D; stroke-width: 1.25; }
      .type { fill: rgba(255, 183, 77, 0.3); stroke: #FFB74D; stroke-width: 1.25; }
      .lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="l2-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="620" height="280" class="bg"/>
  <text x="310" y="28" text-anchor="middle" class="title">L2 Cache 구조</text>

  <rect x="220" y="55" width="180" height="46" rx="8" class="top"/>
  <text x="310" y="83" text-anchor="middle" class="lbl">L2 캐시</text>

  <path d="M 270 101 C 220 130, 170 145, 140 160" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#l2-a)"/>
  <line x1="310" y1="101" x2="310" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#l2-a)"/>
  <path d="M 350 101 C 400 130, 450 145, 480 160" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#l2-a)"/>

  <rect x="30" y="165" width="220" height="90" rx="8" class="size"/>
  <text x="140" y="193" text-anchor="middle" class="lbl">용량</text>
  <text x="140" y="215" text-anchor="middle" class="sub">256KB ~ 1MB</text>
  <text x="140" y="237" text-anchor="middle" class="sub">코어당</text>

  <rect x="230" y="165" width="160" height="90" rx="8" class="time"/>
  <text x="310" y="193" text-anchor="middle" class="lbl">접근 시간</text>
  <text x="310" y="215" text-anchor="middle" class="sub">10~20 사이클</text>
  <text x="310" y="237" text-anchor="middle" class="sub">약 3~10ns</text>

  <rect x="370" y="165" width="220" height="90" rx="8" class="type"/>
  <text x="480" y="193" text-anchor="middle" class="lbl">통합 캐시</text>
  <text x="480" y="215" text-anchor="middle" class="sub">명령어 + 데이터</text>
</svg>
