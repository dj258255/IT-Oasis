<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 780" role="img" aria-label="메모리 계층 구조 - CPU 레지스터 → L1 → L2 → L3 → RAM → SSD/HDD 순서로 속도는 느려지고 용량은 커짐">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .top { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .reg { fill: rgba(76, 175, 80, 0.32); stroke: #4CAF50; stroke-width: 1.5; }
      .l1 { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .l2 { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.25; }
      .l3 { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .ram { fill: rgba(255, 107, 107, 0.18); stroke: #FF6B6B; stroke-width: 1.25; }
      .disk { fill: rgba(255, 107, 107, 0.34); stroke: #FF6B6B; stroke-width: 1.5; }
      .lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="mh-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="440" height="780" class="bg"/>
  <text x="220" y="28" text-anchor="middle" class="title">메모리 계층 구조</text>

  <rect x="120" y="50" width="200" height="40" rx="8" class="top"/>
  <text x="220" y="75" text-anchor="middle" class="lbl">메모리 계층 구조</text>
  <line x1="220" y1="90" x2="220" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#mh-a)"/>

  <rect x="100" y="118" width="240" height="80" rx="8" class="reg"/>
  <text x="220" y="142" text-anchor="middle" class="lbl">CPU 레지스터</text>
  <text x="220" y="164" text-anchor="middle" class="sub">가장 빠름</text>
  <text x="220" y="184" text-anchor="middle" class="sub">수십 바이트</text>
  <line x1="220" y1="198" x2="220" y2="216" stroke="#888" stroke-width="1.5" marker-end="url(#mh-a)"/>

  <rect x="100" y="222" width="240" height="68" rx="8" class="l1"/>
  <text x="220" y="246" text-anchor="middle" class="lbl">L1 캐시</text>
  <text x="220" y="268" text-anchor="middle" class="sub">수 사이클 · 32~128KB</text>
  <line x1="220" y1="290" x2="220" y2="308" stroke="#888" stroke-width="1.5" marker-end="url(#mh-a)"/>

  <rect x="100" y="314" width="240" height="68" rx="8" class="l2"/>
  <text x="220" y="338" text-anchor="middle" class="lbl">L2 캐시</text>
  <text x="220" y="360" text-anchor="middle" class="sub">10~20 사이클 · 256KB~1MB</text>
  <line x1="220" y1="382" x2="220" y2="400" stroke="#888" stroke-width="1.5" marker-end="url(#mh-a)"/>

  <rect x="100" y="406" width="240" height="68" rx="8" class="l3"/>
  <text x="220" y="430" text-anchor="middle" class="lbl">L3 캐시</text>
  <text x="220" y="452" text-anchor="middle" class="sub">30~70 사이클 · 4~32MB</text>
  <line x1="220" y1="474" x2="220" y2="492" stroke="#888" stroke-width="1.5" marker-end="url(#mh-a)"/>

  <rect x="100" y="498" width="240" height="68" rx="8" class="ram"/>
  <text x="220" y="522" text-anchor="middle" class="lbl">주 메모리 RAM</text>
  <text x="220" y="544" text-anchor="middle" class="sub">100~300 사이클 · 수 GB</text>
  <line x1="220" y1="566" x2="220" y2="584" stroke="#888" stroke-width="1.5" marker-end="url(#mh-a)"/>

  <rect x="100" y="590" width="240" height="78" rx="8" class="disk"/>
  <text x="220" y="614" text-anchor="middle" class="lbl">보조 기억장치</text>
  <text x="220" y="634" text-anchor="middle" class="sub">SSD / HDD</text>
  <text x="220" y="654" text-anchor="middle" class="sub">수백만 사이클 · 수백 GB~TB</text>
</svg>
