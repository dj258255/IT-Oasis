<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="L3 Cache 구조 - 코어 1, 2, 3이 각자 L1과 L2 캐시를 가지고, 공유하는 L3 캐시(4-32MB)를 통해 메인 메모리에 접근">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .core-frame { fill: rgba(255, 238, 215, 0.08); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .core-lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .l1 { fill: rgba(76, 175, 80, 0.28); stroke: #4CAF50; stroke-width: 1.25; }
      .l2 { fill: rgba(76, 175, 80, 0.18); stroke: #4CAF50; stroke-width: 1.25; }
      .l3 { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.5; }
      .mem { fill: rgba(255, 107, 107, 0.2); stroke: #FF6B6B; stroke-width: 1.5; }
      .cache-lbl { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="l3-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="640" height="520" class="bg"/>
  <text x="320" y="28" text-anchor="middle" class="title">L3 Cache 구조 (공유 캐시)</text>

  <!-- 3 core frames -->
  <rect x="30"  y="55" width="180" height="180" rx="10" class="core-frame"/>
  <text x="120" y="78" text-anchor="middle" class="core-lbl">코어 1</text>
  <rect x="60" y="92" width="120" height="50" rx="6" class="l1"/>
  <text x="120" y="123" text-anchor="middle" class="cache-lbl">L1 캐시</text>
  <line x1="120" y1="142" x2="120" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#l3-a)"/>
  <rect x="60" y="166" width="120" height="50" rx="6" class="l2"/>
  <text x="120" y="197" text-anchor="middle" class="cache-lbl">L2 캐시</text>

  <rect x="230" y="55" width="180" height="180" rx="10" class="core-frame"/>
  <text x="320" y="78" text-anchor="middle" class="core-lbl">코어 2</text>
  <rect x="260" y="92" width="120" height="50" rx="6" class="l1"/>
  <text x="320" y="123" text-anchor="middle" class="cache-lbl">L1 캐시</text>
  <line x1="320" y1="142" x2="320" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#l3-a)"/>
  <rect x="260" y="166" width="120" height="50" rx="6" class="l2"/>
  <text x="320" y="197" text-anchor="middle" class="cache-lbl">L2 캐시</text>

  <rect x="430" y="55" width="180" height="180" rx="10" class="core-frame"/>
  <text x="520" y="78" text-anchor="middle" class="core-lbl">코어 3</text>
  <rect x="460" y="92" width="120" height="50" rx="6" class="l1"/>
  <text x="520" y="123" text-anchor="middle" class="cache-lbl">L1 캐시</text>
  <line x1="520" y1="142" x2="520" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#l3-a)"/>
  <rect x="460" y="166" width="120" height="50" rx="6" class="l2"/>
  <text x="520" y="197" text-anchor="middle" class="cache-lbl">L2 캐시</text>

  <!-- L3 shared -->
  <path d="M 120 235 C 180 280, 240 300, 280 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#l3-a)"/>
  <line x1="320" y1="235" x2="320" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#l3-a)"/>
  <path d="M 520 235 C 460 280, 400 300, 360 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#l3-a)"/>

  <rect x="200" y="325" width="240" height="80" rx="8" class="l3"/>
  <text x="320" y="354" text-anchor="middle" class="lbl">L3 캐시</text>
  <text x="320" y="378" text-anchor="middle" class="cache-lbl">4~32MB · 공유</text>
  <line x1="320" y1="405" x2="320" y2="428" stroke="#888" stroke-width="1.5" marker-end="url(#l3-a)"/>

  <rect x="240" y="435" width="160" height="60" rx="8" class="mem"/>
  <text x="320" y="472" text-anchor="middle" class="lbl">메인 메모리</text>
</svg>
