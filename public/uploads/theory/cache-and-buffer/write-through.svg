<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" role="img" aria-label="Write-Through - CPU 쓰기 요청 시 캐시와 메모리에 동시에 쓰기를 수행해 일관성 유지, 쓰기 완료 후 양쪽 모두 업데이트됨">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .cpu { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .cache-w { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .mem { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .done { fill: rgba(255, 238, 215, 0.16); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .sync { fill: rgba(255, 183, 77, 0.28); stroke: #FFB74D; stroke-width: 1.5; }
      .lbl { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="wt-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="520" height="500" class="bg"/>
  <text x="260" y="28" text-anchor="middle" class="title">Write-Through 동작</text>

  <rect x="150" y="50" width="220" height="68" rx="8" class="cpu"/>
  <text x="260" y="76" text-anchor="middle" class="lbl">CPU 데이터 쓰기 요청</text>
  <text x="260" y="98" text-anchor="middle" class="sub">A = 10</text>
  <line x1="260" y1="118" x2="260" y2="138" stroke="#888" stroke-width="1.5" marker-end="url(#wt-a)"/>

  <rect x="150" y="146" width="220" height="60" rx="8" class="cache-w"/>
  <text x="260" y="172" text-anchor="middle" class="lbl">캐시에 쓰기</text>
  <text x="260" y="192" text-anchor="middle" class="sub">A: 10</text>

  <path d="M 180 206 C 150 240, 120 260, 110 280" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#wt-a)"/>
  <path d="M 340 206 C 370 240, 400 260, 410 280" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#wt-a)"/>

  <rect x="20" y="286" width="180" height="60" rx="8" class="mem"/>
  <text x="110" y="312" text-anchor="middle" class="lbl">메모리에 쓰기</text>
  <text x="110" y="332" text-anchor="middle" class="sub">A: 10</text>

  <rect x="320" y="286" width="180" height="60" rx="8" class="sync"/>
  <text x="410" y="312" text-anchor="middle" class="lbl">동시에</text>
  <text x="410" y="332" text-anchor="middle" class="sub">캐시와 메모리 업데이트</text>

  <path d="M 110 346 C 110 400, 180 420, 220 430" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#wt-a)"/>

  <rect x="160" y="440" width="200" height="44" rx="8" class="done"/>
  <text x="260" y="468" text-anchor="middle" class="lbl">쓰기 완료</text>
</svg>
