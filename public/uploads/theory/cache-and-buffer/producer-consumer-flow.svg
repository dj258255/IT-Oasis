<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" role="img" aria-label="Producer-Consumer 흐름 - 생산자가 100ms마다 produce(0~4)를 버퍼에 넣고, 소비자가 간헐적으로 consume으로 꺼내는 시퀀스">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .time { fill: rgba(255, 238, 215, 0.14); stroke: rgba(255,238,215,0.3); stroke-width: 1; }
      .buf-state { fill: rgba(255, 183, 77, 0.2); stroke: #FFB74D; stroke-width: 1.25; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .code { font: 500 12px "Consolas", "Menlo", monospace; fill: #e0e0e0; }
    </style>
    <marker id="pc-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="640" height="820" class="bg"/>
  <text x="320" y="28" text-anchor="middle" class="title">Producer-Consumer 흐름</text>

  <rect x="30"  y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="110" y="73" text-anchor="middle" class="lbl">생산자</text>
  <rect x="240" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="320" y="73" text-anchor="middle" class="lbl">버퍼</text>
  <rect x="450" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="530" y="73" text-anchor="middle" class="lbl">소비자</text>
  <line x1="110" y1="84" x2="110" y2="780" class="lifeline"/>
  <line x1="320" y1="84" x2="320" y2="780" class="lifeline"/>
  <line x1="530" y1="84" x2="530" y2="780" class="lifeline"/>

  <rect x="20" y="100" width="600" height="22" rx="4" class="time"/>
  <text x="320" y="116" text-anchor="middle" class="msg">시간: 0ms</text>

  <line x1="110" y1="144" x2="318" y2="144" stroke="#bbb" stroke-width="1.25" marker-end="url(#pc-a)"/>
  <text x="214" y="138" text-anchor="middle" class="code">produce(0)</text>
  <rect x="270" y="154" width="100" height="24" rx="4" class="buf-state"/>
  <text x="320" y="171" text-anchor="middle" class="code">[0]</text>

  <rect x="20" y="188" width="600" height="22" rx="4" class="time"/>
  <text x="320" y="204" text-anchor="middle" class="msg">시간: 100ms</text>

  <line x1="110" y1="232" x2="318" y2="232" stroke="#bbb" stroke-width="1.25" marker-end="url(#pc-a)"/>
  <text x="214" y="226" text-anchor="middle" class="code">produce(1)</text>
  <rect x="270" y="242" width="100" height="24" rx="4" class="buf-state"/>
  <text x="320" y="259" text-anchor="middle" class="code">[0, 1]</text>

  <rect x="20" y="276" width="600" height="22" rx="4" class="time"/>
  <text x="320" y="292" text-anchor="middle" class="msg">시간: 200ms</text>

  <line x1="110" y1="320" x2="318" y2="320" stroke="#bbb" stroke-width="1.25" marker-end="url(#pc-a)"/>
  <text x="214" y="314" text-anchor="middle" class="code">produce(2)</text>
  <rect x="270" y="330" width="100" height="24" rx="4" class="buf-state"/>
  <text x="320" y="347" text-anchor="middle" class="code">[0, 1, 2]</text>

  <line x1="322" y1="376" x2="528" y2="376" stroke="#bbb" stroke-width="1.25" marker-end="url(#pc-a)"/>
  <text x="426" y="370" text-anchor="middle" class="code">consume() → 0</text>

  <rect x="20" y="392" width="600" height="22" rx="4" class="time"/>
  <text x="320" y="408" text-anchor="middle" class="msg">시간: 300ms</text>

  <line x1="110" y1="436" x2="318" y2="436" stroke="#bbb" stroke-width="1.25" marker-end="url(#pc-a)"/>
  <text x="214" y="430" text-anchor="middle" class="code">produce(3)</text>
  <rect x="270" y="446" width="100" height="24" rx="4" class="buf-state"/>
  <text x="320" y="463" text-anchor="middle" class="code">[1, 2, 3]</text>

  <rect x="20" y="480" width="600" height="22" rx="4" class="time"/>
  <text x="320" y="496" text-anchor="middle" class="msg">시간: 400ms</text>

  <line x1="110" y1="524" x2="318" y2="524" stroke="#bbb" stroke-width="1.25" marker-end="url(#pc-a)"/>
  <text x="214" y="518" text-anchor="middle" class="code">produce(4)</text>
  <rect x="270" y="534" width="100" height="24" rx="4" class="buf-state"/>
  <text x="320" y="551" text-anchor="middle" class="code">[1, 2, 3, 4]</text>

  <line x1="322" y1="580" x2="528" y2="580" stroke="#bbb" stroke-width="1.25" marker-end="url(#pc-a)"/>
  <text x="426" y="574" text-anchor="middle" class="code">consume() → 1</text>

  <rect x="30"  y="738" width="160" height="34" rx="6" class="actor"/>
  <text x="110" y="761" text-anchor="middle" class="lbl">생산자</text>
  <rect x="240" y="738" width="160" height="34" rx="6" class="actor"/>
  <text x="320" y="761" text-anchor="middle" class="lbl">버퍼</text>
  <rect x="450" y="738" width="160" height="34" rx="6" class="actor"/>
  <text x="530" y="761" text-anchor="middle" class="lbl">소비자</text>
</svg>
