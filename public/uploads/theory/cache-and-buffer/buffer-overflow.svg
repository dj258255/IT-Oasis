<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 540" role="img" aria-label="버퍼 오버플로우 - 높은 주소의 리턴 주소 아래 10바이트 버퍼가 할당되어 있는데 오버플로우 발생 시 버퍼를 넘어선 데이터가 리턴 주소를 덮어쓰는 메모리 레이아웃">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .addr { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .ret { fill: rgba(255, 107, 107, 0.24); stroke: #FF6B6B; stroke-width: 1.5; }
      .buf { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .overflow { fill: rgba(255, 107, 107, 0.38); stroke: #FF6B6B; stroke-width: 1.75; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .warn { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #ffcccb; }
      .sub { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
    </style>
    <marker id="bo-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="380" height="540" class="bg"/>
  <text x="190" y="28" text-anchor="middle" class="title">Buffer Overflow 메모리 레이아웃</text>

  <rect x="110" y="55" width="160" height="54" rx="8" class="addr"/>
  <text x="190" y="88" text-anchor="middle" class="lbl">높은 주소</text>
  <line x1="190" y1="109" x2="190" y2="128" stroke="#888" stroke-width="1.5" marker-end="url(#bo-a)"/>

  <rect x="110" y="132" width="160" height="54" rx="8" class="ret"/>
  <text x="190" y="165" text-anchor="middle" class="lbl">리턴 주소</text>
  <line x1="190" y1="186" x2="190" y2="205" stroke="#888" stroke-width="1.5" marker-end="url(#bo-a)"/>

  <rect x="100" y="210" width="180" height="64" rx="8" class="buf"/>
  <text x="190" y="234" text-anchor="middle" class="lbl">buffer[10]</text>
  <text x="190" y="255" text-anchor="middle" class="sub">할당된 버퍼 · 10 bytes</text>
  <line x1="190" y1="274" x2="190" y2="294" stroke="#888" stroke-width="1.5" marker-end="url(#bo-a)"/>

  <rect x="50" y="300" width="280" height="104" rx="8" class="overflow"/>
  <text x="190" y="326" text-anchor="middle" class="warn">오버플로우</text>
  <text x="190" y="350" text-anchor="middle" class="lbl">버퍼를 넘어선 데이터가</text>
  <text x="190" y="372" text-anchor="middle" class="lbl">리턴 주소를 덮어씀</text>
  <text x="190" y="392" text-anchor="middle" class="sub">(아래로 자라는 스택에서 위로 타고 올라감)</text>
  <line x1="190" y1="406" x2="190" y2="426" stroke="#888" stroke-width="1.5" marker-end="url(#bo-a)"/>

  <rect x="110" y="432" width="160" height="54" rx="8" class="addr"/>
  <text x="190" y="465" text-anchor="middle" class="lbl">낮은 주소</text>
</svg>
