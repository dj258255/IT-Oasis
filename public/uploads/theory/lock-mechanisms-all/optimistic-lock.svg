<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" role="img" aria-label="낙관적 락 - 트랜잭션 A/B가 동시에 stock=10, version=1 읽기, A가 stock=7로 UPDATE WHERE id=1 AND version=1 → version=2 변경 성공, B가 stock=5로 같은 조건 UPDATE → version=2이라 0 rows 영향, OptimisticLockException 발생">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .state { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.25; }
      .ok { fill: rgba(76, 175, 80, 0.26); stroke: #4CAF50; stroke-width: 1.25; }
      .fail { fill: rgba(255, 107, 107, 0.24); stroke: #FF6B6B; stroke-width: 1.25; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="ol-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="620" height="580" class="bg"/>
  <text x="310" y="28" text-anchor="middle" class="title">낙관적 락 (@Version)</text>

  <rect x="20" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="100" y="73" text-anchor="middle" class="lbl">트랜잭션A</text>
  <rect x="230" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="310" y="73" text-anchor="middle" class="lbl">DB</text>
  <rect x="440" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="520" y="73" text-anchor="middle" class="lbl">트랜잭션B</text>
  <line x1="100" y1="84" x2="100" y2="550" class="lifeline"/>
  <line x1="310" y1="84" x2="310" y2="550" class="lifeline"/>
  <line x1="520" y1="84" x2="520" y2="550" class="lifeline"/>

  <rect x="220" y="100" width="180" height="34" rx="6" class="state"/>
  <text x="310" y="123" text-anchor="middle" class="msg">초기: stock=10, version=1</text>

  <line x1="102" y1="160" x2="308" y2="160" stroke="#bbb" stroke-width="1.25" marker-end="url(#ol-a)"/>
  <text x="200" y="154" text-anchor="middle" class="msg">findById(1)</text>
  <line x1="308" y1="184" x2="102" y2="184" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ol-a)"/>
  <text x="200" y="178" text-anchor="middle" class="msg">stock=10, version=1</text>

  <line x1="518" y1="216" x2="312" y2="216" stroke="#bbb" stroke-width="1.25" marker-end="url(#ol-a)"/>
  <text x="415" y="210" text-anchor="middle" class="msg">findById(1)</text>
  <line x1="308" y1="240" x2="518" y2="240" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ol-a)"/>
  <text x="415" y="234" text-anchor="middle" class="msg">stock=10, version=1</text>

  <line x1="102" y1="280" x2="308" y2="280" stroke="#bbb" stroke-width="1.25" marker-end="url(#ol-a)"/>
  <text x="200" y="266" text-anchor="middle" class="msg">UPDATE SET stock=7, version=2</text>
  <text x="200" y="280" text-anchor="middle" class="msg">WHERE id=1 AND version=1</text>
  <rect x="220" y="288" width="180" height="32" rx="6" class="ok"/>
  <text x="310" y="308" text-anchor="middle" class="msg">1 row · 성공 (version=2)</text>

  <line x1="518" y1="356" x2="312" y2="356" stroke="#bbb" stroke-width="1.25" marker-end="url(#ol-a)"/>
  <text x="415" y="342" text-anchor="middle" class="msg">UPDATE SET stock=5, version=2</text>
  <text x="415" y="356" text-anchor="middle" class="msg">WHERE id=1 AND version=1</text>
  <rect x="220" y="364" width="180" height="32" rx="6" class="fail"/>
  <text x="310" y="384" text-anchor="middle" class="msg">0 rows · 실패 (version=2)</text>

  <line x1="308" y1="420" x2="518" y2="420" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ol-a)"/>
  <text x="415" y="414" text-anchor="middle" class="msg">OptimisticLockException</text>

  <rect x="160" y="450" width="300" height="50" rx="8" class="state"/>
  <text x="310" y="476" text-anchor="middle" class="msg">최종: stock=7, version=2</text>
  <text x="310" y="492" text-anchor="middle" class="msg">B는 재시도하거나 사용자에게 알림</text>
</svg>
