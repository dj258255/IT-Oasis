<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="AOP 기반 분산 락 구현 - 컨트롤러 호출 → AOP Aspect가 락 획득 → 비즈니스 로직 실행 → 락 해제">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .aop { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .ok { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .work { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="ao-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="600" height="480" class="bg"/>
  <text x="300" y="28" text-anchor="middle" class="title">AOP 기반 분산 락 구현</text>

  <rect x="20" y="50" width="120" height="34" rx="6" class="actor"/>
  <text x="80" y="73" text-anchor="middle" class="lbl">Controller</text>
  <rect x="180" y="50" width="120" height="34" rx="6" class="aop"/>
  <text x="240" y="73" text-anchor="middle" class="lbl">AOP Aspect</text>
  <rect x="340" y="50" width="120" height="34" rx="6" class="actor"/>
  <text x="400" y="73" text-anchor="middle" class="lbl">Redis</text>
  <rect x="490" y="50" width="100" height="34" rx="6" class="work"/>
  <text x="540" y="73" text-anchor="middle" class="lbl">Service</text>
  <line x1="80" y1="84" x2="80" y2="450" class="lifeline"/>
  <line x1="240" y1="84" x2="240" y2="450" class="lifeline"/>
  <line x1="400" y1="84" x2="400" y2="450" class="lifeline"/>
  <line x1="540" y1="84" x2="540" y2="450" class="lifeline"/>

  <line x1="82" y1="116" x2="238" y2="116" stroke="#bbb" stroke-width="1.25" marker-end="url(#ao-a)"/>
  <text x="160" y="110" text-anchor="middle" class="msg">@DistributedLock 호출</text>

  <line x1="242" y1="156" x2="398" y2="156" stroke="#bbb" stroke-width="1.25" marker-end="url(#ao-a)"/>
  <text x="320" y="150" text-anchor="middle" class="msg">SETNX lock 획득</text>
  <rect x="350" y="166" width="100" height="28" rx="6" class="ok"/>
  <text x="400" y="184" text-anchor="middle" class="msg">성공</text>

  <line x1="242" y1="220" x2="538" y2="220" stroke="#bbb" stroke-width="1.25" marker-end="url(#ao-a)"/>
  <text x="390" y="214" text-anchor="middle" class="msg">비즈니스 로직 실행</text>

  <rect x="490" y="232" width="100" height="32" rx="6" class="work"/>
  <text x="540" y="252" text-anchor="middle" class="msg">로직 처리</text>

  <line x1="538" y1="288" x2="242" y2="288" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ao-a)"/>
  <text x="390" y="282" text-anchor="middle" class="msg">결과 반환</text>

  <line x1="242" y1="320" x2="398" y2="320" stroke="#bbb" stroke-width="1.25" marker-end="url(#ao-a)"/>
  <text x="320" y="314" text-anchor="middle" class="msg">DEL lock</text>
  <rect x="350" y="330" width="100" height="28" rx="6" class="ok"/>
  <text x="400" y="348" text-anchor="middle" class="msg">해제 완료</text>

  <line x1="238" y1="394" x2="82" y2="394" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ao-a)"/>
  <text x="160" y="388" text-anchor="middle" class="msg">결과 반환</text>
</svg>
