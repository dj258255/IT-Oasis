<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" role="img" aria-label="분산 락 기본 구현 - 클라이언트가 Redis SETNX로 락 획득, 임계영역 실행, DEL로 해제">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .ok { fill: rgba(76, 175, 80, 0.26); stroke: #4CAF50; stroke-width: 1.25; }
      .work { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.25; }
      .fail { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="bi-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="620" height="540" class="bg"/>
  <text x="310" y="28" text-anchor="middle" class="title">분산 락 기본 구현 (Redis)</text>

  <rect x="30" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="110" y="73" text-anchor="middle" class="lbl">클라이언트 A</text>
  <rect x="230" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="310" y="73" text-anchor="middle" class="lbl">Redis</text>
  <rect x="430" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="510" y="73" text-anchor="middle" class="lbl">클라이언트 B</text>
  <line x1="110" y1="84" x2="110" y2="510" class="lifeline"/>
  <line x1="310" y1="84" x2="310" y2="510" class="lifeline"/>
  <line x1="510" y1="84" x2="510" y2="510" class="lifeline"/>

  <line x1="112" y1="120" x2="308" y2="120" stroke="#bbb" stroke-width="1.25" marker-end="url(#bi-a)"/>
  <text x="210" y="114" text-anchor="middle" class="msg">SETNX lockKey value</text>
  <rect x="240" y="130" width="140" height="32" rx="6" class="ok"/>
  <text x="310" y="150" text-anchor="middle" class="msg">성공 (1)</text>
  <line x1="308" y1="184" x2="112" y2="184" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#bi-a)"/>
  <text x="210" y="178" text-anchor="middle" class="msg">락 획득</text>

  <rect x="20" y="200" width="180" height="32" rx="6" class="work"/>
  <text x="110" y="220" text-anchor="middle" class="msg">임계영역 실행</text>

  <line x1="508" y1="262" x2="312" y2="262" stroke="#bbb" stroke-width="1.25" marker-end="url(#bi-a)"/>
  <text x="410" y="256" text-anchor="middle" class="msg">SETNX lockKey value</text>
  <rect x="240" y="272" width="140" height="32" rx="6" class="fail"/>
  <text x="310" y="292" text-anchor="middle" class="msg">실패 (0 · 이미 점유)</text>
  <line x1="308" y1="324" x2="510" y2="324" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#bi-a)"/>
  <text x="410" y="318" text-anchor="middle" class="msg">획득 실패 · 대기</text>

  <line x1="112" y1="370" x2="308" y2="370" stroke="#bbb" stroke-width="1.25" marker-end="url(#bi-a)"/>
  <text x="210" y="364" text-anchor="middle" class="msg">DEL lockKey</text>
  <rect x="240" y="380" width="140" height="32" rx="6" class="ok"/>
  <text x="310" y="400" text-anchor="middle" class="msg">락 해제</text>

  <line x1="508" y1="440" x2="312" y2="440" stroke="#bbb" stroke-width="1.25" marker-end="url(#bi-a)"/>
  <text x="410" y="434" text-anchor="middle" class="msg">SETNX lockKey value</text>
  <rect x="240" y="450" width="140" height="32" rx="6" class="ok"/>
  <text x="310" y="470" text-anchor="middle" class="msg">성공 (1) · B 획득</text>
</svg>
