<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" role="img" aria-label="Compare-and-Swap 동작 - 스레드 A/B가 동시에 value = 5를 읽고 +1해서 newValue = 6 계산, A가 먼저 CAS(5, 6)으로 성공해 value = 6, B의 CAS(5, 6)는 실패(현재 6), B가 다시 읽기 후 CAS(6, 7) 성공">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .state { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.25; }
      .ok { fill: rgba(76, 175, 80, 0.26); stroke: #4CAF50; stroke-width: 1.25; }
      .fail { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="cas-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="620" height="480" class="bg"/>
  <text x="310" y="28" text-anchor="middle" class="title">Compare-and-Swap (CAS)</text>

  <rect x="20"  y="50" width="140" height="34" rx="6" class="actor"/>
  <text x="90" y="73" text-anchor="middle" class="lbl">스레드A</text>
  <rect x="230" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="310" y="73" text-anchor="middle" class="lbl">value 변수 (5)</text>
  <rect x="460" y="50" width="140" height="34" rx="6" class="actor"/>
  <text x="530" y="73" text-anchor="middle" class="lbl">스레드B</text>
  <line x1="90" y1="84" x2="90" y2="450" class="lifeline"/>
  <line x1="310" y1="84" x2="310" y2="450" class="lifeline"/>
  <line x1="530" y1="84" x2="530" y2="450" class="lifeline"/>

  <line x1="92" y1="118" x2="308" y2="118" stroke="#bbb" stroke-width="1.25" marker-end="url(#cas-a)"/>
  <text x="200" y="112" text-anchor="middle" class="msg">read · value = 5</text>
  <line x1="528" y1="148" x2="312" y2="148" stroke="#bbb" stroke-width="1.25" marker-end="url(#cas-a)"/>
  <text x="420" y="142" text-anchor="middle" class="msg">read · value = 5</text>

  <rect x="20" y="160" width="140" height="32" rx="6" class="state"/>
  <text x="90" y="180" text-anchor="middle" class="msg">newValue = 5+1 = 6</text>
  <rect x="460" y="160" width="140" height="32" rx="6" class="state"/>
  <text x="530" y="180" text-anchor="middle" class="msg">newValue = 5+1 = 6</text>

  <line x1="92" y1="216" x2="308" y2="216" stroke="#bbb" stroke-width="1.25" marker-end="url(#cas-a)"/>
  <text x="200" y="210" text-anchor="middle" class="msg">CAS(expected=5, new=6)</text>
  <rect x="240" y="226" width="140" height="32" rx="6" class="ok"/>
  <text x="310" y="246" text-anchor="middle" class="msg">value = 6 · 성공</text>

  <line x1="528" y1="278" x2="312" y2="278" stroke="#bbb" stroke-width="1.25" marker-end="url(#cas-a)"/>
  <text x="420" y="272" text-anchor="middle" class="msg">CAS(expected=5, new=6)</text>
  <rect x="240" y="288" width="140" height="32" rx="6" class="fail"/>
  <text x="310" y="308" text-anchor="middle" class="msg">현재 6 · 실패</text>

  <line x1="528" y1="340" x2="312" y2="340" stroke="#bbb" stroke-width="1.25" marker-end="url(#cas-a)"/>
  <text x="420" y="334" text-anchor="middle" class="msg">read · value = 6 (재시도)</text>

  <rect x="460" y="350" width="140" height="32" rx="6" class="state"/>
  <text x="530" y="370" text-anchor="middle" class="msg">newValue = 7</text>

  <line x1="528" y1="404" x2="312" y2="404" stroke="#bbb" stroke-width="1.25" marker-end="url(#cas-a)"/>
  <text x="420" y="398" text-anchor="middle" class="msg">CAS(expected=6, new=7)</text>
  <rect x="240" y="414" width="140" height="32" rx="6" class="ok"/>
  <text x="310" y="434" text-anchor="middle" class="msg">value = 7 · 성공</text>
</svg>
