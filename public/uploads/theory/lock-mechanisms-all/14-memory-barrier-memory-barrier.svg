<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" role="img" aria-label="Memory Barrier - CPU의 명령어 재정렬을 막아주는 동기화 장치, 정상은 인스턴스 = new Singleton() 후 다른 스레드가 정상 객체 받음, 재정렬 시 객체 일부만 초기화 상태에서 다른 스레드가 사용 가능 → 메모리 배리어로 방지">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .ok { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .bad { fill: rgba(255, 107, 107, 0.24); stroke: #FF6B6B; stroke-width: 1.25; }
      .barrier { fill: rgba(255, 183, 77, 0.3); stroke: #FFB74D; stroke-width: 1.5; }
      .stage { fill: rgba(255, 238, 215, 0.14); stroke: rgba(255,238,215,0.3); stroke-width: 1; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .stage-lbl { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
    </style>
    <marker id="mb-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="620" height="460" class="bg"/>
  <text x="310" y="28" text-anchor="middle" class="title">Memory Barrier 동작</text>

  <rect x="30"  y="50" width="140" height="34" rx="6" class="actor"/>
  <text x="100" y="73" text-anchor="middle" class="lbl">스레드A</text>
  <rect x="240" y="50" width="140" height="34" rx="6" class="actor"/>
  <text x="310" y="73" text-anchor="middle" class="lbl">CPU</text>
  <rect x="450" y="50" width="140" height="34" rx="6" class="actor"/>
  <text x="520" y="73" text-anchor="middle" class="lbl">instance 변수</text>
  <line x1="100" y1="84" x2="100" y2="430" class="lifeline"/>
  <line x1="310" y1="84" x2="310" y2="430" class="lifeline"/>
  <line x1="520" y1="84" x2="520" y2="430" class="lifeline"/>

  <rect x="20" y="100" width="580" height="22" rx="4" class="stage"/>
  <text x="310" y="116" text-anchor="middle" class="stage-lbl">정상 실행 순서 보장</text>

  <line x1="102" y1="146" x2="308" y2="146" stroke="#bbb" stroke-width="1.25" marker-end="url(#mb-a)"/>
  <text x="205" y="140" text-anchor="middle" class="msg">1. 객체 메모리 할당</text>

  <line x1="312" y1="172" x2="518" y2="172" stroke="#bbb" stroke-width="1.25" marker-end="url(#mb-a)"/>
  <text x="415" y="166" text-anchor="middle" class="msg">2. 생성자 실행 (필드 초기화)</text>

  <rect x="240" y="184" width="140" height="32" rx="6" class="barrier"/>
  <text x="310" y="204" text-anchor="middle" class="msg">Memory Barrier</text>

  <line x1="312" y1="234" x2="518" y2="234" stroke="#bbb" stroke-width="1.25" marker-end="url(#mb-a)"/>
  <text x="415" y="228" text-anchor="middle" class="msg">3. instance 변수에 참조 대입</text>

  <rect x="240" y="246" width="280" height="32" rx="6" class="ok"/>
  <text x="380" y="266" text-anchor="middle" class="msg">다른 스레드는 완전히 초기화된 객체만 본다</text>

  <rect x="20" y="294" width="580" height="22" rx="4" class="stage"/>
  <text x="310" y="310" text-anchor="middle" class="stage-lbl">재정렬 시 (메모리 배리어 없을 때)</text>

  <line x1="102" y1="338" x2="308" y2="338" stroke="#bbb" stroke-width="1.25" marker-end="url(#mb-a)"/>
  <text x="205" y="332" text-anchor="middle" class="msg">1. 객체 할당 + 참조 대입</text>

  <rect x="240" y="350" width="280" height="32" rx="6" class="bad"/>
  <text x="380" y="370" text-anchor="middle" class="msg">2. 생성자 실행 (아직 초기화 안됨)</text>

  <rect x="60" y="392" width="500" height="32" rx="6" class="bad"/>
  <text x="310" y="412" text-anchor="middle" class="msg">→ 다른 스레드가 절반 초기화된 객체에 접근할 위험</text>
</svg>
