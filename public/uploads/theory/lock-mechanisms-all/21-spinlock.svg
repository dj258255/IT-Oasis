<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" role="img" aria-label="스핀락 동작 - 스레드A의 lock()이 CAS(false, true) 성공해 임계영역 진입, 스레드B의 lock()은 CAS 실패해 계속 CPU 사용하며 재시도(스핀), 스레드A unlock() 후 스레드B가 락 획득">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .state-free { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.25; }
      .state-lock { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .ok { fill: rgba(76, 175, 80, 0.26); stroke: #4CAF50; stroke-width: 1.25; }
      .spin { fill: rgba(255, 183, 77, 0.26); stroke: #FFB74D; stroke-width: 1.25; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="sp-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="620" height="580" class="bg"/>
  <text x="310" y="28" text-anchor="middle" class="title">Spinlock 동작</text>

  <rect x="20"  y="50" width="140" height="34" rx="6" class="actor"/>
  <text x="90" y="73" text-anchor="middle" class="lbl">스레드A</text>
  <rect x="230" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="310" y="73" text-anchor="middle" class="lbl">locked 변수</text>
  <rect x="460" y="50" width="140" height="34" rx="6" class="actor"/>
  <text x="530" y="73" text-anchor="middle" class="lbl">스레드B</text>
  <line x1="90" y1="84" x2="90" y2="550" class="lifeline"/>
  <line x1="310" y1="84" x2="310" y2="550" class="lifeline"/>
  <line x1="530" y1="84" x2="530" y2="550" class="lifeline"/>

  <rect x="230" y="100" width="160" height="26" rx="6" class="state-free"/>
  <text x="310" y="118" text-anchor="middle" class="msg">false</text>

  <line x1="92" y1="146" x2="308" y2="146" stroke="#bbb" stroke-width="1.25" marker-end="url(#sp-a)"/>
  <text x="200" y="140" text-anchor="middle" class="msg">lock() · CAS(false, true)</text>
  <rect x="230" y="156" width="160" height="26" rx="6" class="state-lock"/>
  <text x="310" y="174" text-anchor="middle" class="msg">true · 스레드A 획득</text>

  <rect x="20" y="194" width="140" height="32" rx="6" class="ok"/>
  <text x="90" y="214" text-anchor="middle" class="msg">임계영역 진입</text>

  <line x1="528" y1="248" x2="312" y2="248" stroke="#bbb" stroke-width="1.25" marker-end="url(#sp-a)"/>
  <text x="420" y="242" text-anchor="middle" class="msg">lock() · CAS(false, true)</text>
  <rect x="230" y="258" width="160" height="26" rx="6" class="state-lock"/>
  <text x="310" y="276" text-anchor="middle" class="msg">실패 (이미 true)</text>

  <rect x="440" y="296" width="180" height="32" rx="6" class="spin"/>
  <text x="530" y="316" text-anchor="middle" class="msg">계속 재시도 (CPU 사용)</text>

  <line x1="528" y1="350" x2="312" y2="350" stroke="#bbb" stroke-width="1.25" marker-end="url(#sp-a)"/>
  <text x="420" y="344" text-anchor="middle" class="msg">CAS(false, true) → 실패</text>

  <rect x="440" y="362" width="180" height="32" rx="6" class="spin"/>
  <text x="530" y="382" text-anchor="middle" class="msg">계속 재시도 (CPU 사용)</text>

  <line x1="92" y1="418" x2="308" y2="418" stroke="#bbb" stroke-width="1.25" marker-end="url(#sp-a)"/>
  <text x="200" y="412" text-anchor="middle" class="msg">unlock() · locked = false</text>
  <rect x="230" y="428" width="160" height="26" rx="6" class="state-free"/>
  <text x="310" y="446" text-anchor="middle" class="msg">false</text>

  <line x1="528" y1="476" x2="312" y2="476" stroke="#bbb" stroke-width="1.25" marker-end="url(#sp-a)"/>
  <text x="420" y="470" text-anchor="middle" class="msg">CAS(false, true) → 성공</text>
  <rect x="230" y="486" width="160" height="26" rx="6" class="state-lock"/>
  <text x="310" y="504" text-anchor="middle" class="msg">true · 스레드B 획득</text>
</svg>
