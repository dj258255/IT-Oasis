<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 760" role="img" aria-label="비관적 락 사용 - 트랜잭션 A가 SELECT FOR UPDATE로 Exclusive Lock 획득, B는 같은 SELECT FOR UPDATE 시 Lock 대기, A의 commit 후 B가 락 획득해 재고 부족 검증 후 rollback, 최종 재고 정확히 3개">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .state { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.25; }
      .lock { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .wait { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .ok { fill: rgba(76, 175, 80, 0.28); stroke: #4CAF50; stroke-width: 1.5; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="ps2-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="660" height="760" class="bg"/>
  <text x="330" y="28" text-anchor="middle" class="title">재고 차감 — 비관적 락</text>

  <rect x="30" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="110" y="73" text-anchor="middle" class="lbl">트랜잭션A</text>
  <rect x="250" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="330" y="73" text-anchor="middle" class="lbl">DB</text>
  <rect x="470" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="550" y="73" text-anchor="middle" class="lbl">트랜잭션B</text>
  <line x1="110" y1="84" x2="110" y2="730" class="lifeline"/>
  <line x1="330" y1="84" x2="330" y2="730" class="lifeline"/>
  <line x1="550" y1="84" x2="550" y2="730" class="lifeline"/>

  <rect x="240" y="100" width="180" height="32" rx="6" class="state"/>
  <text x="330" y="120" text-anchor="middle" class="msg">초기 재고: 10개</text>

  <line x1="112" y1="160" x2="328" y2="160" stroke="#bbb" stroke-width="1.25" marker-end="url(#ps2-a)"/>
  <text x="220" y="146" text-anchor="middle" class="msg">findByIdForUpdate(1)</text>
  <text x="220" y="160" text-anchor="middle" class="msg">SELECT FOR UPDATE</text>
  <rect x="240" y="170" width="180" height="32" rx="6" class="lock"/>
  <text x="330" y="190" text-anchor="middle" class="msg">Exclusive Lock 획득</text>
  <line x1="328" y1="220" x2="112" y2="220" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ps2-a)"/>
  <text x="220" y="214" text-anchor="middle" class="msg">stock = 10</text>

  <line x1="548" y1="252" x2="332" y2="252" stroke="#bbb" stroke-width="1.25" marker-end="url(#ps2-a)"/>
  <text x="440" y="238" text-anchor="middle" class="msg">findByIdForUpdate(1)</text>
  <text x="440" y="252" text-anchor="middle" class="msg">SELECT FOR UPDATE</text>
  <rect x="460" y="262" width="180" height="32" rx="6" class="wait"/>
  <text x="550" y="282" text-anchor="middle" class="msg">Lock 대기 중...</text>

  <line x1="112" y1="320" x2="328" y2="320" stroke="#bbb" stroke-width="1.25" marker-end="url(#ps2-a)"/>
  <text x="220" y="314" text-anchor="middle" class="msg">decreaseStock(7)</text>
  <rect x="240" y="330" width="180" height="32" rx="6" class="state"/>
  <text x="330" y="350" text-anchor="middle" class="msg">stock = 3</text>

  <line x1="112" y1="386" x2="328" y2="386" stroke="#bbb" stroke-width="1.25" marker-end="url(#ps2-a)"/>
  <text x="220" y="380" text-anchor="middle" class="msg">commit</text>
  <rect x="240" y="396" width="180" height="32" rx="6" class="ok"/>
  <text x="330" y="416" text-anchor="middle" class="msg">Lock 해제</text>

  <line x1="328" y1="446" x2="548" y2="446" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ps2-a)"/>
  <text x="440" y="440" text-anchor="middle" class="msg">대기 해제 · stock = 3</text>

  <line x1="548" y1="478" x2="332" y2="478" stroke="#bbb" stroke-width="1.25" marker-end="url(#ps2-a)"/>
  <text x="440" y="472" text-anchor="middle" class="msg">decreaseStock(5)</text>
  <rect x="240" y="488" width="180" height="48" rx="6" class="wait"/>
  <text x="330" y="506" text-anchor="middle" class="msg">재고 부족 검증</text>
  <text x="330" y="524" text-anchor="middle" class="msg">3 - 5 &lt; 0</text>

  <line x1="328" y1="560" x2="548" y2="560" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ps2-a)"/>
  <text x="440" y="554" text-anchor="middle" class="msg">재고 부족 오류</text>

  <line x1="548" y1="592" x2="332" y2="592" stroke="#bbb" stroke-width="1.25" marker-end="url(#ps2-a)"/>
  <text x="440" y="586" text-anchor="middle" class="msg">rollback</text>

  <rect x="170" y="630" width="320" height="60" rx="10" class="ok"/>
  <text x="330" y="654" text-anchor="middle" class="lbl">최종 재고: 3개</text>
  <text x="330" y="676" text-anchor="middle" class="msg">정확한 결과</text>
</svg>
