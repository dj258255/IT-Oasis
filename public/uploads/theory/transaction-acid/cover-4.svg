<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="walGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fsyncGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>

  <g transform="translate(80, 80)">
    <rect width="240" height="36" rx="18" fill="none" stroke="url(#glow4)" stroke-width="1.5"/>
    <text x="120" y="24" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="2">TRANSACTION ACID · ④</text>
  </g>

  <text x="80" y="200" fill="#f8fafc" font-size="62" font-weight="800">Durability는</text>
  <text x="80" y="278" fill="#f8fafc" font-size="62" font-weight="800">어떻게 디스크까지 살아남는가</text>

  <text x="80" y="332" fill="#94a3b8" font-size="22" font-weight="500">WAL · fsync · group commit · doublewrite — 다이얼로 trade-off를 직접 조절하는 글자</text>

  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#walGrad)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="28" y="44" fill="#fdba74" font-size="18" font-weight="700" letter-spacing="1">WAL · GROUP COMMIT</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">델타만 빠르게, 묶어서</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">변경 델타를 순차 쓰기로 디스크에 먼저</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">동시 커밋들의 fsync를 한 번에 묶음</text>
  </g>

  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#fsyncGrad)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="28" y="44" fill="#fbcfe8" font-size="18" font-weight="700" letter-spacing="1">fsync · DOUBLEWRITE</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">OS도 디스크도 거짓말한다</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">page cache → fsync → 디스크 캐시 → 매체</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">torn page는 doublewrite / full_page_writes로</text>
  </g>
</svg>
