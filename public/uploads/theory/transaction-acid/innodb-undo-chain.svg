<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ucArr" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L0,14 L13,7 z" fill="#7c2d12"/>
    </marker>
  </defs>
  <rect width="920" height="360" fill="#fff"/>

  <text x="460" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">InnoDB — 현재 버전은 in-place, 옛 버전은 Undo Log 체인을 따라가 재구성</text>

  <g transform="translate(80, 76)">
    <rect width="320" height="100" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#7c2d12">Clustered Index (sales)</text>
    <g transform="translate(20, 42)">
      <rect width="280" height="48" rx="8" fill="#fff" stroke="#7c2d12"/>
      <text x="14" y="20" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">product_id=1   qty=15  (최신)</text>
      <text x="14" y="38" font-size="11" font-style="italic" fill="#7c2d12">DB_ROLL_PTR → undo entry A</text>
    </g>
  </g>

  <g transform="translate(540, 76)">
    <rect width="300" height="100" rx="12" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#713f12">Undo Log</text>
    <g transform="translate(20, 42)">
      <rect width="260" height="48" rx="8" fill="#fff" stroke="#ca8a04"/>
      <text x="14" y="20" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">entry A   qty=10  (이전 값)</text>
      <text x="14" y="38" font-size="11" font-style="italic" fill="#713f12">옛 스냅샷 reader가 따라감</text>
    </g>
  </g>

  <!-- straight thicker arrow with labeled badge -->
  <line x1="400" y1="116" x2="540" y2="116" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ucArr)"/>
  <g transform="translate(470, 100)">
    <rect x="-32" y="-14" width="64" height="22" rx="11" fill="#fff" stroke="#7c2d12" stroke-width="1"/>
    <text x="0" y="2" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">roll_ptr</text>
  </g>

  <g transform="translate(80, 200)">
    <rect width="760" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#1e3a8a">옛 스냅샷이 필요한 Reader</text>
    <text x="20" y="42" font-size="12" fill="#1e3a8a">현재 행(qty=15) → undo entry A 적용 → 옛 버전(qty=10) 재구성.</text>
    <text x="20" y="56" font-size="12" fill="#1e3a8a">새로운 reader가 더 옛 버전을 원하면 체인을 더 거슬러 올라간다.</text>
  </g>

  <g transform="translate(80, 278)">
    <rect width="760" height="62" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#7f1d1d">정리 비용 — purge thread + History List Length</text>
    <text x="20" y="42" font-size="12" fill="#7f1d1d">긴 트랜잭션이 옛 스냅샷을 잡고 있으면 그 시점 이후 undo가 정리되지 않아 chain이 길어짐.</text>
    <text x="20" y="58" font-size="12" fill="#7f1d1d">→ snapshot read 비용 증가, HLL 누적, purge 지연 → 성능 저하.</text>
  </g>
</svg>
