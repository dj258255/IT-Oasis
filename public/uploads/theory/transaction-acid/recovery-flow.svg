<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#f8fafc"/>

  <text x="480" y="40" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">크래시 후 복구 — 두 학파</text>

  <!-- ARIES (InnoDB / SQL Server) -->
  <g transform="translate(40, 80)">
    <rect width="880" height="160" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="20" y="34" font-size="16" font-weight="700" fill="#7c2d12">ARIES 스타일 — InnoDB · SQL Server</text>

    <g transform="translate(40, 60)">
      <rect width="220" height="80" rx="10" fill="#fff" stroke="#7c2d12"/>
      <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">① Analysis</text>
      <text x="110" y="56" font-size="11.5" text-anchor="middle" fill="#475569">활성 txn / dirty page</text>
      <text x="110" y="72" font-size="11.5" text-anchor="middle" fill="#475569">목록 재구성</text>
    </g>
    <line x1="270" y1="100" x2="320" y2="100" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ax)"/>

    <g transform="translate(330, 60)">
      <rect width="220" height="80" rx="10" fill="#fff" stroke="#7c2d12"/>
      <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">② Redo</text>
      <text x="110" y="56" font-size="11.5" text-anchor="middle" fill="#475569">WAL을 순방향으로 재생</text>
      <text x="110" y="72" font-size="11.5" text-anchor="middle" fill="#475569">(미커밋 변경 포함)</text>
    </g>
    <line x1="560" y1="100" x2="610" y2="100" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ax)"/>

    <g transform="translate(620, 60)">
      <rect width="220" height="80" rx="10" fill="#fff" stroke="#7c2d12"/>
      <text x="110" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">③ Undo</text>
      <text x="110" y="56" font-size="11.5" text-anchor="middle" fill="#475569">미커밋 txn 변경을</text>
      <text x="110" y="72" font-size="11.5" text-anchor="middle" fill="#475569">Undo Log로 역재생</text>
    </g>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(40, 270)">
    <rect width="880" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="20" y="34" font-size="16" font-weight="700" fill="#1e3a8a">PostgreSQL — 명시적 Undo phase 없음</text>

    <g transform="translate(40, 60)">
      <rect width="260" height="100" rx="10" fill="#fff" stroke="#1e3a8a"/>
      <text x="130" y="34" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">① Redo</text>
      <text x="130" y="58" font-size="11.5" text-anchor="middle" fill="#475569">WAL 재생으로</text>
      <text x="130" y="76" font-size="11.5" text-anchor="middle" fill="#475569">물리 페이지 복원</text>
      <text x="130" y="92" font-size="11.5" text-anchor="middle" fill="#475569">(미커밋 튜플도 그대로 복원됨)</text>
    </g>
    <line x1="310" y1="110" x2="360" y2="110" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ax)"/>

    <g transform="translate(370, 60)">
      <rect width="260" height="100" rx="10" fill="#fff" stroke="#1e3a8a"/>
      <text x="130" y="34" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">② 가시성 규칙</text>
      <text x="130" y="58" font-size="11.5" text-anchor="middle" fill="#475569">CLOG 조회 → ABORTED txn</text>
      <text x="130" y="76" font-size="11.5" text-anchor="middle" fill="#475569">의 튜플은 안 보이게</text>
      <text x="130" y="92" font-size="11.5" text-anchor="middle" fill="#475569">(xmin/xmax + hint bit)</text>
    </g>
    <line x1="640" y1="110" x2="690" y2="110" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ax)"/>

    <g transform="translate(700, 60)">
      <rect width="160" height="100" rx="10" fill="#fff" stroke="#1e3a8a"/>
      <text x="80" y="34" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">③ VACUUM</text>
      <text x="80" y="58" font-size="11.5" text-anchor="middle" fill="#475569">백그라운드로</text>
      <text x="80" y="76" font-size="11.5" text-anchor="middle" fill="#475569">물리 청소</text>
    </g>
  </g>
</svg>
