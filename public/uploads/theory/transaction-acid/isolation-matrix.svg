<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <rect width="1080" height="410" fill="#fff"/>

  <text x="540" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Isolation level × Read phenomenon — 어떤 anomaly를 막는가</text>
  <text x="540" y="56" font-size="12" fill="#475569" text-anchor="middle">Lost Update는 ANSI 표준 외 anomaly(Berenson 1995, P4)이지만 실무에서 매우 중요해 함께 표기 · 실제 DB는 표준보다 강하게 구현하기도 함</text>

  <!-- Header row: 220 + 180 + 200 + 240 + 200 = 1040 -->
  <g transform="translate(20, 86)">
    <!-- corner cell -->
    <rect width="220" height="60" fill="#e2e8f0" stroke="#94a3b8"/>
    <line x1="0" y1="0" x2="220" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#0f172a">Read phenomenon</text>
    <text x="206" y="50" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Isolation level</text>

    <g transform="translate(220, 0)">
      <rect width="180" height="60" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="90" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Dirty Read</text>
    </g>
    <g transform="translate(400, 0)">
      <rect width="200" height="60" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="100" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Lost Update</text>
    </g>
    <g transform="translate(600, 0)">
      <rect width="240" height="60" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="120" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Non-repeatable Read</text>
    </g>
    <g transform="translate(840, 0)">
      <rect width="200" height="60" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="100" y="36" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Phantom Read</text>
    </g>
  </g>

  <!-- Row 1: SERIALIZABLE -->
  <g transform="translate(20, 146)">
    <rect width="220" height="48" fill="#fff" stroke="#94a3b8"/>
    <text x="14" y="30" font-size="13" font-weight="700" fill="#1e3a8a">SERIALIZABLE</text>

    <g transform="translate(220, 0)"><rect width="180" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(400, 0)"><rect width="200" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(600, 0)"><rect width="240" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="120" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(840, 0)"><rect width="200" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
  </g>

  <!-- Row 2: SNAPSHOT -->
  <g transform="translate(20, 194)">
    <rect width="220" height="48" fill="#fff" stroke="#94a3b8"/>
    <text x="14" y="22" font-size="13" font-weight="700" fill="#0f766e">SNAPSHOT</text>
    <text x="14" y="40" font-size="10" fill="#475569" font-style="italic">(SI — write skew는 별개)</text>

    <g transform="translate(220, 0)"><rect width="180" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(400, 0)"><rect width="200" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(600, 0)"><rect width="240" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="120" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(840, 0)"><rect width="200" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
  </g>

  <!-- Row 3: REPEATABLE READ -->
  <g transform="translate(20, 242)">
    <rect width="220" height="48" fill="#fff" stroke="#94a3b8"/>
    <text x="14" y="30" font-size="13" font-weight="700" fill="#713f12">REPEATABLE READ</text>

    <g transform="translate(220, 0)"><rect width="180" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(400, 0)"><rect width="200" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(600, 0)"><rect width="240" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="120" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(840, 0)"><rect width="200" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
  </g>

  <!-- Row 4: READ COMMITTED -->
  <g transform="translate(20, 290)">
    <rect width="220" height="48" fill="#fff" stroke="#94a3b8"/>
    <text x="14" y="30" font-size="13" font-weight="700" fill="#7c2d12">READ COMMITTED</text>

    <g transform="translate(220, 0)"><rect width="180" height="48" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">don't occur</text></g>
    <g transform="translate(400, 0)"><rect width="200" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
    <g transform="translate(600, 0)"><rect width="240" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="120" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
    <g transform="translate(840, 0)"><rect width="200" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
  </g>

  <!-- Row 5: READ UNCOMMITTED -->
  <g transform="translate(20, 338)">
    <rect width="220" height="48" fill="#fff" stroke="#94a3b8"/>
    <text x="14" y="30" font-size="13" font-weight="700" fill="#7f1d1d">READ UNCOMMITTED</text>

    <g transform="translate(220, 0)"><rect width="180" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="90" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
    <g transform="translate(400, 0)"><rect width="200" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
    <g transform="translate(600, 0)"><rect width="240" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="120" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
    <g transform="translate(840, 0)"><rect width="200" height="48" fill="#fee2e2" stroke="#94a3b8"/><text x="100" y="30" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">may occur</text></g>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 392)" font-size="10.5" fill="#475569">
    <rect x="0" y="-10" width="14" height="12" rx="2" fill="#dcfce7" stroke="#94a3b8"/>
    <text x="20" y="0">don't occur — 막음</text>
    <rect x="160" y="-10" width="14" height="12" rx="2" fill="#fee2e2" stroke="#94a3b8"/>
    <text x="180" y="0">may occur — 발생 가능</text>
  </g>
</svg>
