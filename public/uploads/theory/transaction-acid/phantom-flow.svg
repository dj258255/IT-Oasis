<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <rect width="920" height="430" fill="#fff"/>

  <text x="460" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Phantom Read — 없던 행이 갑자기 나타나는 시나리오</text>
  <text x="460" y="56" font-size="13" fill="#475569" text-anchor="middle">범위 쿼리에서 발생 — 읽은 적 없는 행은 잠글 수 없기 때문</text>

  <g transform="translate(80, 86)">
    <rect width="360" height="34" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tx1 — 범위 쿼리</text>
  </g>
  <g transform="translate(480, 86)">
    <rect width="360" height="34" rx="6" fill="#dcfce7" stroke="#14532d"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">Tx2 — 새 행 INSERT</text>
  </g>

  <line x1="260" y1="130" x2="260" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="660" y1="130" x2="660" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <text x="40" y="158" font-size="11" font-weight="700" fill="#94a3b8">T1</text>
  <g transform="translate(80, 134)">
    <rect width="360" height="50" rx="6" fill="#fff" stroke="#1e3a8a"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#1e3a8a">① BEGIN + SELECT * FROM sales</text>
    <text x="14" y="42" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">→ {p1, p2}</text>
  </g>

  <text x="40" y="220" font-size="11" font-weight="700" fill="#94a3b8">T2</text>
  <g transform="translate(480, 196)">
    <rect width="360" height="50" rx="6" fill="#fff" stroke="#14532d"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#14532d">② BEGIN + INSERT</text>
    <text x="14" y="42" font-size="11.5" fill="#475569">INSERT INTO sales VALUES (p3, 10, 1)</text>
  </g>

  <text x="40" y="278" font-size="11" font-weight="700" fill="#94a3b8">T3</text>
  <g transform="translate(480, 256)">
    <rect width="360" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#14532d">③ COMMIT</text>
  </g>

  <text x="40" y="324" font-size="11" font-weight="700" fill="#94a3b8">T4</text>
  <g transform="translate(80, 302)">
    <rect width="760" height="32" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="380" y="21" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">새로 커밋된 p3가 Tx1의 다음 read 범위에 끼어드는 시점</text>
  </g>

  <text x="40" y="376" font-size="11" font-weight="700" fill="#94a3b8">T5</text>
  <g transform="translate(80, 350)">
    <rect width="360" height="68" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1e3a8a">④ 2차 SELECT SUM(qty*price)</text>
    <text x="14" y="44" font-size="14" fill="#1e3a8a" font-weight="700" font-family="ui-monospace, Menlo, monospace">→ 140  (p3가 합계에 포함)</text>
    <text x="14" y="62" font-size="11" fill="#1e3a8a" font-style="italic">처음엔 보이지 않던 행 — phantom</text>
  </g>
</svg>
