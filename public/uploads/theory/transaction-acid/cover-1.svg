<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="innoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>

  <!-- Series tag -->
  <g transform="translate(80, 80)">
    <rect width="220" height="36" rx="18" fill="none" stroke="url(#glow)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="2">TRANSACTION ACID · ①</text>
  </g>

  <!-- Title -->
  <text x="80" y="200" fill="#f8fafc" font-size="62" font-weight="800">Atomicity는</text>
  <text x="80" y="278" fill="#f8fafc" font-size="62" font-weight="800">어떻게 구현되는가</text>

  <!-- Subtitle -->
  <text x="80" y="332" fill="#94a3b8" font-size="22" font-weight="500">STEAL + NO-FORCE 환경에서 두 진영이 비용을 치르는 방식</text>

  <!-- Two pillars: PG vs InnoDB -->
  <g transform="translate(80, 400)">
    <!-- PostgreSQL -->
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#pgGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="28" y="44" fill="#93c5fd" font-size="18" font-weight="700" letter-spacing="1">POSTGRESQL</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">Append-only + 가시성 규칙</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">ROLLBACK = O(1) abort 마킹</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">비용은 VACUUM이 나중에 청구</text>
  </g>

  <g transform="translate(620, 400)">
    <!-- InnoDB -->
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#innoGrad)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="28" y="44" fill="#fdba74" font-size="18" font-weight="700" letter-spacing="1">INNODB · ORACLE</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">In-place + Undo Log</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">ROLLBACK = O(N) 역재생</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">ARIES 스타일 Redo + Undo 복구</text>
  </g>
</svg>
