<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <marker id="luArr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#be185d"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fff"/>

  <text x="460" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Lost Update — 동시 read-modify-write로 한쪽이 다른 쪽을 덮어쓰는 시나리오</text>
  <text x="460" y="56" font-size="13" fill="#475569" text-anchor="middle">초기: product 1 qty=10  ·  Tx1은 +10, Tx2는 +5  →  정답 25, 실제 20</text>

  <g transform="translate(80, 86)">
    <rect width="360" height="34" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tx1 — qty + 10</text>
  </g>
  <g transform="translate(480, 86)">
    <rect width="360" height="34" rx="6" fill="#fce7f3" stroke="#831843"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#831843">Tx2 — qty + 5</text>
  </g>

  <line x1="260" y1="130" x2="260" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="660" y1="130" x2="660" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Both read 10 -->
  <g transform="translate(80, 134)">
    <rect width="360" height="50" rx="6" fill="#fff" stroke="#1e3a8a"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#1e3a8a">① BEGIN + SELECT qty</text>
    <text x="14" y="42" font-size="13" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">→ qty = 10</text>
  </g>
  <g transform="translate(480, 134)">
    <rect width="360" height="50" rx="6" fill="#fff" stroke="#831843"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#831843">② BEGIN + SELECT qty</text>
    <text x="14" y="42" font-size="13" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">→ qty = 10  (같은 시작값)</text>
  </g>

  <!-- Tx2 commits first -->
  <g transform="translate(480, 196)">
    <rect width="360" height="60" rx="6" fill="#fff" stroke="#831843"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#831843">③ UPDATE qty = 10 + 5 = 15</text>
    <text x="14" y="42" font-size="12" font-weight="700" fill="#831843">④ COMMIT (먼저 커밋)</text>
    <text x="14" y="56" font-size="11" fill="#475569">qty = 15 디스크 반영</text>
  </g>

  <!-- Tx1 commits later, overwriting -->
  <g transform="translate(80, 268)">
    <rect width="360" height="80" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#831843">⑤ UPDATE qty = 10 + 10 = 20</text>
    <text x="14" y="42" font-size="12" font-weight="700" fill="#831843">⑥ COMMIT (나중에 커밋)</text>
    <text x="14" y="60" font-size="11.5" fill="#831843">자기가 본 옛 값(10) 기준으로 계산해 덮어씀</text>
    <text x="14" y="74" font-size="11" fill="#831843" font-style="italic">Tx2의 +5가 사라짐</text>
  </g>

  <line x1="480" y1="252" x2="440" y2="306" stroke="#be185d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#luArr)"/>

  <!-- Result -->
  <g transform="translate(80, 364)">
    <rect width="760" height="74" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="20" y="24" font-size="14" font-weight="700" fill="#7f1d1d">결과: 디스크에 qty = 20  ·  정답은 25</text>
    <text x="20" y="44" font-size="12" fill="#7f1d1d">두 트랜잭션이 같은 시작값(10)을 보고 각자 계산 → 나중 커밋이 먼저 커밋의 변경을 영구히 덮어씀.</text>
    <text x="20" y="62" font-size="12" fill="#7f1d1d">방지: UPDATE qty = qty + ?  ·  SELECT ... FOR UPDATE  ·  버전 조건부 UPDATE (낙관적 잠금)</text>
  </g>
</svg>
