<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <marker id="nrArr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ca8a04"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#fff"/>

  <text x="460" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Non-repeatable Read — 같은 행을 두 번 읽으니 값이 바뀐 시나리오</text>
  <text x="460" y="56" font-size="13" fill="#475569" text-anchor="middle">Tx2가 정상적으로 COMMIT — 그러나 Tx1 안에서는 같은 데이터가 두 가지 값으로 보임</text>

  <g transform="translate(80, 86)">
    <rect width="360" height="34" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tx1 — 보고서</text>
  </g>
  <g transform="translate(480, 86)">
    <rect width="360" height="34" rx="6" fill="#fef3c7" stroke="#713f12"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#713f12">Tx2 — 판매 갱신</text>
  </g>

  <line x1="260" y1="130" x2="260" y2="390" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="660" y1="130" x2="660" y2="390" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Tx1 read 1 -->
  <g transform="translate(80, 134)">
    <rect width="360" height="50" rx="6" fill="#fff" stroke="#1e3a8a"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#1e3a8a">① BEGIN + 1차 SELECT</text>
    <text x="14" y="42" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">{p1: 50, p2: 80}  → 합계 130</text>
  </g>

  <!-- Tx2 update + commit -->
  <g transform="translate(480, 134)">
    <rect width="360" height="50" rx="6" fill="#fff" stroke="#713f12"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#713f12">② BEGIN</text>
    <text x="14" y="42" font-size="11.5" fill="#475569">UPDATE sales SET qty=15 WHERE product_id=1</text>
  </g>
  <g transform="translate(480, 196)">
    <rect width="360" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#14532d">③ COMMIT (정상 커밋)</text>
  </g>

  <!-- Tx1 read 2 -->
  <g transform="translate(80, 252)">
    <rect width="360" height="64" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#713f12">④ 2차 SELECT SUM(qty*price)</text>
    <text x="14" y="42" font-size="13" fill="#713f12" font-family="ui-monospace, Menlo, monospace">→ 155  (커밋된 값이지만 130과 불일치)</text>
    <text x="14" y="58" font-size="11" fill="#713f12" font-style="italic">같은 트랜잭션 안에서 데이터가 변함</text>
  </g>

  <!-- arrow from Tx2 commit to Tx1 second read -->
  <line x1="480" y1="217" x2="440" y2="270" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#nrArr)"/>
  <text x="278" y="244" font-size="11" font-weight="600" fill="#ca8a04" text-anchor="middle">Tx2의 커밋된 변경이 Tx1의 두 번째 read에 반영</text>

  <g transform="translate(80, 332)">
    <rect width="760" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="20" y="20" font-size="12.5" fill="#713f12">Dirty Read와 다른 점: 읽은 값은 모두 커밋된 값. 그래서 더 미묘하다 — </text>
    <text x="20" y="36" font-size="12.5" fill="#713f12">"같은 트랜잭션 안에서 같은 행을 두 번 읽었더니 값이 다르더라"가 핵심.</text>
  </g>
</svg>
