<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arP" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="980" height="540" fill="#f8fafc"/>
  <text x="490" y="40" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">읽기 현상 4가지 — Read Phenomena</text>

  <!-- Dirty Read -->
  <g transform="translate(40, 80)">
    <rect width="440" height="200" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#7f1d1d">① Dirty Read</text>
    <text x="20" y="56" font-size="12" fill="#7f1d1d">미커밋 변경을 읽음 — 롤백되면 존재한 적 없는 값</text>
    <g transform="translate(20, 78)">
      <rect width="180" height="100" rx="6" fill="#fff" stroke="#dc2626"/>
      <text x="90" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx1 (Reader)</text>
      <text x="14" y="50" font-size="11" fill="#475569">SELECT SUM(qty*price)</text>
      <text x="14" y="70" font-size="11" fill="#dc2626">→ 155 (잘못된 값)</text>
      <text x="14" y="88" font-size="11" fill="#475569">합계 ≠ 개별 행 합</text>
    </g>
    <g transform="translate(220, 78)">
      <rect width="200" height="100" rx="6" fill="#fff" stroke="#dc2626"/>
      <text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx2 (Writer)</text>
      <text x="14" y="50" font-size="11" fill="#475569">UPDATE qty=15</text>
      <text x="14" y="70" font-size="11" fill="#dc2626">(아직 COMMIT 안 함)</text>
      <text x="14" y="88" font-size="11" fill="#7f1d1d">→ ROLLBACK</text>
    </g>
  </g>

  <!-- Non-repeatable Read -->
  <g transform="translate(500, 80)">
    <rect width="440" height="200" rx="12" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#713f12">② Non-repeatable Read</text>
    <text x="20" y="56" font-size="12" fill="#713f12">같은 행을 두 번 읽으면 값이 달라짐</text>
    <g transform="translate(20, 78)">
      <rect width="180" height="100" rx="6" fill="#fff" stroke="#ca8a04"/>
      <text x="90" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx1 (Reader)</text>
      <text x="14" y="50" font-size="11" fill="#475569">read 1 → qty=10</text>
      <text x="14" y="70" font-size="11" fill="#475569">read 2 → qty=15</text>
      <text x="14" y="88" font-size="11" fill="#713f12">같은 트랜잭션 내 불일치</text>
    </g>
    <g transform="translate(220, 78)">
      <rect width="200" height="100" rx="6" fill="#fff" stroke="#ca8a04"/>
      <text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx2 (Writer)</text>
      <text x="14" y="50" font-size="11" fill="#475569">UPDATE qty=15</text>
      <text x="14" y="70" font-size="11" fill="#713f12">COMMIT (정상)</text>
    </g>
  </g>

  <!-- Phantom Read -->
  <g transform="translate(40, 300)">
    <rect width="440" height="200" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#1e3a8a">③ Phantom Read</text>
    <text x="20" y="56" font-size="12" fill="#1e3a8a">없던 행이 새로 끼어듦 — 범위 쿼리에서 발생</text>
    <g transform="translate(20, 78)">
      <rect width="180" height="100" rx="6" fill="#fff" stroke="#2563eb"/>
      <text x="90" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx1 (Range Reader)</text>
      <text x="14" y="50" font-size="11" fill="#475569">SELECT * FROM sales</text>
      <text x="14" y="70" font-size="11" fill="#475569">→ {p1, p2}</text>
      <text x="14" y="88" font-size="11" fill="#1e3a8a">두 번째 SUM에 p3 끼어듦</text>
    </g>
    <g transform="translate(220, 78)">
      <rect width="200" height="100" rx="6" fill="#fff" stroke="#2563eb"/>
      <text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx2 (Inserter)</text>
      <text x="14" y="50" font-size="11" fill="#475569">INSERT VALUES (p3,...)</text>
      <text x="14" y="70" font-size="11" fill="#1e3a8a">COMMIT</text>
    </g>
  </g>

  <!-- Lost Update -->
  <g transform="translate(500, 300)">
    <rect width="440" height="200" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#831843">④ Lost Update (표준 외)</text>
    <text x="20" y="56" font-size="12" fill="#831843">동시 read-modify-write — 한쪽이 다른 쪽을 덮어씀</text>
    <g transform="translate(20, 78)">
      <rect width="180" height="100" rx="6" fill="#fff" stroke="#be185d"/>
      <text x="90" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx1: +10</text>
      <text x="14" y="50" font-size="11" fill="#475569">read qty=10</text>
      <text x="14" y="70" font-size="11" fill="#475569">write qty=20</text>
      <text x="14" y="88" font-size="11" fill="#831843">Tx2의 +5가 사라짐</text>
    </g>
    <g transform="translate(220, 78)">
      <rect width="200" height="100" rx="6" fill="#fff" stroke="#be185d"/>
      <text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Tx2: +5 (먼저 커밋)</text>
      <text x="14" y="50" font-size="11" fill="#475569">read qty=10</text>
      <text x="14" y="70" font-size="11" fill="#475569">write qty=15</text>
      <text x="14" y="88" font-size="11" fill="#831843">정답: 25, 실제: 20</text>
    </g>
  </g>
</svg>
