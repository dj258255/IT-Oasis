<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <rect width="980" height="360" fill="#f8fafc"/>
  <text x="490" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Torn Page 방어 — InnoDB doublewrite vs PostgreSQL full_page_writes</text>
  <text x="490" y="56" font-size="12" fill="#475569" text-anchor="middle">DB 페이지(8/16KB)와 OS atomic write 단위(보통 4KB)가 달라 도중에 전원이 나가면 일부만 쓰여진 페이지가 디스크에 남는다</text>

  <!-- InnoDB doublewrite -->
  <g transform="translate(40, 90)">
    <rect width="440" height="240" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#7c2d12">InnoDB — Doublewrite Buffer</text>

    <g transform="translate(20, 50)">
      <rect width="400" height="46" rx="8" fill="#fff" stroke="#fb923c"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#7c2d12">① doublewrite 영역에 먼저 씀</text>
      <text x="14" y="38" font-size="11" fill="#475569">연속 chunk로 한 번의 fsync</text>
    </g>
    <g transform="translate(20, 106)">
      <rect width="400" height="46" rx="8" fill="#fff" stroke="#fb923c"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#7c2d12">② 실제 위치에 씀</text>
    </g>
    <g transform="translate(20, 162)">
      <rect width="400" height="60" rx="8" fill="#fef3c7" stroke="#ca8a04"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#713f12">크래시 후 복구</text>
      <text x="14" y="40" font-size="11" fill="#713f12">실제 위치 깨짐 → doublewrite 복사본 사용</text>
      <text x="14" y="56" font-size="11" fill="#713f12">doublewrite 깨짐 → 실제 위치 사용 (쓰기 전)</text>
    </g>
  </g>

  <!-- PostgreSQL full_page_writes -->
  <g transform="translate(500, 90)">
    <rect width="440" height="240" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#1e3a8a">PostgreSQL — full_page_writes</text>

    <g transform="translate(20, 50)">
      <rect width="400" height="46" rx="8" fill="#fff" stroke="#3b82f6"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#1e3a8a">① 체크포인트 후 첫 변경 시</text>
      <text x="14" y="38" font-size="11" fill="#475569">페이지 전체 이미지를 WAL에 기록</text>
    </g>
    <g transform="translate(20, 106)">
      <rect width="400" height="46" rx="8" fill="#fff" stroke="#3b82f6"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#1e3a8a">② 그 이후 변경은 평소처럼 델타만</text>
    </g>
    <g transform="translate(20, 162)">
      <rect width="400" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1e3a8a">크래시 후 복구</text>
      <text x="14" y="40" font-size="11" fill="#1e3a8a">WAL에 기록된 페이지 전체로 복원</text>
      <text x="14" y="56" font-size="11" fill="#1e3a8a">그 위에 델타 redo</text>
    </g>
  </g>
</svg>
