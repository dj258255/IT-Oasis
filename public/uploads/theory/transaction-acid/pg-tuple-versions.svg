<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <marker id="pgvArr" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L0,14 L13,7 z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#fff"/>

  <text x="460" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">PostgreSQL — 한 페이지 안에 옛/새 튜플이 공존, 가시성으로 분기</text>

  <g transform="translate(80, 70)">
    <rect width="500" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="20" y="34" font-size="14" font-weight="700" fill="#1e3a8a">sales (product_id=1) Heap Page</text>

    <g transform="translate(20, 56)">
      <rect width="460" height="46" rx="8" fill="#fff" stroke="#1e3a8a"/>
      <text x="14" y="20" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">tuple v1   xmin=100   xmax=200   qty=10</text>
      <text x="14" y="38" font-size="11" font-style="italic" fill="#475569">Tx 100이 만든 옛 버전 — Tx 200이 폐기 표시 (xmax=200)</text>
    </g>
    <g transform="translate(20, 110)">
      <rect width="460" height="46" rx="8" fill="#fff" stroke="#16a34a"/>
      <text x="14" y="20" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">tuple v2   xmin=200   xmax=∞    qty=15</text>
      <text x="14" y="38" font-size="11" font-style="italic" fill="#16a34a">Tx 200이 새로 만든 최신 버전</text>
    </g>
  </g>

  <g transform="translate(620, 70)">
    <rect width="220" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="110" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#713f12">Reader (xid=150)</text>
    <text x="110" y="48" font-size="11.5" text-anchor="middle" fill="#713f12">v1을 본다</text>
    <text x="110" y="64" font-size="10.5" text-anchor="middle" fill="#713f12">xmax=200은 미래 → 무시</text>
  </g>
  <g transform="translate(620, 160)">
    <rect width="220" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="110" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">Reader (xid=250)</text>
    <text x="110" y="48" font-size="11.5" text-anchor="middle" fill="#14532d">v2를 본다</text>
    <text x="110" y="64" font-size="10.5" text-anchor="middle" fill="#14532d">xmin=200은 가시</text>
  </g>

  <!-- curved arrows from heap page to readers -->
  <path d="M 580 79 C 600 79, 600 110, 618 110" fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pgvArr)"/>
  <path d="M 580 133 C 600 133, 600 200, 618 200" fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pgvArr)"/>

  <g transform="translate(80, 270)">
    <rect width="760" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#713f12">결과: 두 reader는 잠금 없이 각자 일관된 버전을 본다.</text>
    <text x="20" y="40" font-size="12" fill="#713f12">읽기와 쓰기가 서로를 막지 않음 — MVCC의 핵심 효과.</text>
  </g>

  <g transform="translate(80, 332)">
    <rect width="760" height="58" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#7c2d12">정리 비용 — VACUUM</text>
    <text x="20" y="40" font-size="12" fill="#7c2d12">옛 튜플(v1)이 페이지에 누적되므로 VACUUM이 백그라운드로 회수.</text>
    <text x="20" y="55" font-size="11.5" font-style="italic" fill="#7c2d12">긴 트랜잭션 → bloat + wraparound 위험.</text>
  </g>
</svg>
