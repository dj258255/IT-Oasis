<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <rect width="920" height="360" fill="#f8fafc"/>
  <text x="460" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Instagram 예시 — invariant이 두 테이블에 걸쳐 있다</text>
  <text x="460" y="56" font-size="12" fill="#475569" text-anchor="middle">photos.likes_count = COUNT(*) FROM likes WHERE photo_id = ?</text>

  <!-- photos table -->
  <g transform="translate(80, 90)">
    <text x="160" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">photos 테이블</text>

    <!-- header row -->
    <g transform="translate(0, 14)">
      <rect width="160" height="36" fill="#dbeafe" stroke="#1e3a8a"/>
      <text x="80" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">photo_id</text>
      <rect x="160" y="0" width="160" height="36" fill="#dbeafe" stroke="#1e3a8a"/>
      <text x="240" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">likes_count</text>
    </g>

    <!-- row 1 -->
    <g transform="translate(0, 50)">
      <rect width="160" height="36" fill="#fff" stroke="#1e3a8a"/>
      <text x="80" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">1</text>
      <rect x="160" y="0" width="160" height="36" fill="#fff" stroke="#1e3a8a"/>
      <text x="240" y="24" font-size="13" font-weight="700" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#16a34a">2</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(0, 86)">
      <rect width="160" height="36" fill="#fff" stroke="#1e3a8a"/>
      <text x="80" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">2</text>
      <rect x="160" y="0" width="160" height="36" fill="#fff" stroke="#1e3a8a"/>
      <text x="240" y="24" font-size="13" font-weight="700" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#16a34a">1</text>
    </g>
  </g>

  <!-- likes table -->
  <g transform="translate(500, 90)">
    <text x="160" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#7c2d12">likes 테이블</text>

    <g transform="translate(0, 14)">
      <rect width="160" height="36" fill="#fed7aa" stroke="#7c2d12"/>
      <text x="80" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">user</text>
      <rect x="160" y="0" width="160" height="36" fill="#fed7aa" stroke="#7c2d12"/>
      <text x="240" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">photo_id</text>
    </g>

    <!-- 3 rows -->
    <g transform="translate(0, 50)">
      <rect width="160" height="36" fill="#fff" stroke="#7c2d12"/>
      <text x="80" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">John</text>
      <rect x="160" y="0" width="160" height="36" fill="#fff" stroke="#7c2d12"/>
      <text x="240" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">1</text>
    </g>
    <g transform="translate(0, 86)">
      <rect width="160" height="36" fill="#fff" stroke="#7c2d12"/>
      <text x="80" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">Edmund</text>
      <rect x="160" y="0" width="160" height="36" fill="#fff" stroke="#7c2d12"/>
      <text x="240" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">1</text>
    </g>
    <g transform="translate(0, 122)">
      <rect width="160" height="36" fill="#fff" stroke="#7c2d12"/>
      <text x="80" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">John</text>
      <rect x="160" y="0" width="160" height="36" fill="#fff" stroke="#7c2d12"/>
      <text x="240" y="24" font-size="13" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" fill="#0f172a">2</text>
    </g>
  </g>

  <!-- Invariant boxes -->
  <g transform="translate(80, 246)">
    <rect width="760" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="20" y="20" font-size="12.5" fill="#14532d">photo 1: likes_count = 2  ✓  COUNT(likes WHERE photo_id=1) = 2  → 일관 (John, Edmund)</text>
    <text x="20" y="38" font-size="12.5" fill="#14532d">photo 2: likes_count = 1  ✓  COUNT(likes WHERE photo_id=2) = 1  → 일관 (John)</text>
  </g>

  <g transform="translate(80, 298)">
    <rect width="760" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="20" y="20" font-size="12.5" fill="#7f1d1d">예시 위반: photos.likes_count = 5 인데 likes 행이 2개뿐 → 불일치</text>
    <text x="20" y="38" font-size="12.5" fill="#7f1d1d">예시 위반: likes 테이블에 photo_id = 4 가 있는데 photos에는 4가 없음 → 외래 키 위반</text>
  </g>
</svg>
