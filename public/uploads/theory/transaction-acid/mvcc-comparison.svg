<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arM" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#f8fafc"/>
  <text x="490" y="40" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">MVCC 두 진영 — 옛 버전을 어디에 두는가</text>

  <!-- PostgreSQL -->
  <g transform="translate(40, 80)">
    <rect width="440" height="400" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="220" y="38" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">PostgreSQL — 새 튜플 + 가시성</text>

    <text x="20" y="74" font-size="13" font-weight="600" fill="#0f172a">Heap (sales 테이블)</text>
    <g transform="translate(20, 86)">
      <rect width="400" height="50" rx="6" fill="#fff" stroke="#1e3a8a"/>
      <text x="14" y="22" font-size="12" fill="#0f172a">tuple v1: qty=10  xmin=100  xmax=200</text>
      <text x="14" y="40" font-size="11" fill="#475569" font-style="italic">옛 버전 (Tx 200이 폐기 표시)</text>
    </g>
    <g transform="translate(20, 144)">
      <rect width="400" height="50" rx="6" fill="#fff" stroke="#16a34a"/>
      <text x="14" y="22" font-size="12" fill="#0f172a">tuple v2: qty=15  xmin=200  xmax=∞</text>
      <text x="14" y="40" font-size="11" fill="#16a34a" font-style="italic">새 버전 (Tx 200이 만듦)</text>
    </g>

    <g transform="translate(20, 218)">
      <rect width="190" height="70" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
      <text x="95" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#713f12">Reader (xid=150)</text>
      <text x="95" y="42" font-size="11" text-anchor="middle" fill="#713f12">v1을 본다</text>
      <text x="95" y="58" font-size="10.5" text-anchor="middle" fill="#713f12">(xmax=200은 미래 → 무시)</text>
    </g>
    <g transform="translate(230, 218)">
      <rect width="190" height="70" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="95" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">Reader (xid=250)</text>
      <text x="95" y="42" font-size="11" text-anchor="middle" fill="#14532d">v2를 본다</text>
      <text x="95" y="58" font-size="10.5" text-anchor="middle" fill="#14532d">(xmin=200은 가시)</text>
    </g>

    <text x="20" y="312" font-size="13" font-weight="700" fill="#0f172a">정리 비용</text>
    <text x="20" y="332" font-size="12" fill="#475569">• 읽기 잠금 없음 — 두 reader 모두 자기 버전 봄</text>
    <text x="20" y="350" font-size="12" fill="#475569">• 옛 튜플은 같은 페이지에 누적됨</text>
    <text x="20" y="368" font-size="12" fill="#475569">• VACUUM이 백그라운드로 청소</text>
    <text x="20" y="386" font-size="11.5" fill="#dc2626" font-style="italic">긴 트랜잭션 → bloat + wraparound 위험</text>
  </g>

  <!-- InnoDB -->
  <g transform="translate(500, 80)">
    <rect width="440" height="400" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="220" y="38" font-size="18" font-weight="700" fill="#7c2d12" text-anchor="middle">InnoDB — In-place + Undo Log 체인</text>

    <text x="20" y="74" font-size="13" font-weight="600" fill="#0f172a">Clustered Index (현재 버전만)</text>
    <g transform="translate(20, 86)">
      <rect width="260" height="50" rx="6" fill="#fff" stroke="#7c2d12"/>
      <text x="14" y="22" font-size="12" fill="#0f172a">row id=1  qty=15  roll_ptr →</text>
      <text x="14" y="40" font-size="11" fill="#16a34a" font-style="italic">최신 (in-place)</text>
    </g>
    <line x1="280" y1="111" x2="320" y2="111" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arM)"/>
    <g transform="translate(320, 86)">
      <rect width="100" height="50" rx="6" fill="#fef3c7" stroke="#ca8a04"/>
      <text x="50" y="22" font-size="11.5" font-weight="700" text-anchor="middle" fill="#713f12">Undo entry</text>
      <text x="50" y="40" font-size="11" text-anchor="middle" fill="#713f12">qty=10</text>
    </g>

    <text x="20" y="170" font-size="13" font-weight="600" fill="#0f172a">Reader (옛 스냅샷 필요)</text>
    <g transform="translate(20, 182)">
      <rect width="400" height="60" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#713f12">DB_ROLL_PTR 따라가서 옛 버전 재구성</text>
      <text x="14" y="42" font-size="11.5" fill="#713f12">현재 행 → undo entry 적용 → 옛 버전 (qty=10)</text>
    </g>

    <text x="20" y="278" font-size="13" font-weight="700" fill="#0f172a">주의 — RR의 hybrid 동작</text>
    <text x="20" y="298" font-size="12" fill="#475569">• 일반 SELECT → consistent read (스냅샷)</text>
    <text x="20" y="316" font-size="12" fill="#475569">• UPDATE/FOR UPDATE → most recent state</text>
    <text x="20" y="334" font-size="12" fill="#dc2626">→ read-modify-write에서 Lost Update 누출</text>

    <text x="20" y="362" font-size="13" font-weight="700" fill="#0f172a">정리 비용</text>
    <text x="20" y="382" font-size="12" fill="#475569">• purge thread가 Undo Log 정리</text>
    <text x="20" y="400" font-size="11.5" fill="#dc2626" font-style="italic">긴 트랜잭션 → HLL 증가 + chain 길어짐</text>
  </g>
</svg>
