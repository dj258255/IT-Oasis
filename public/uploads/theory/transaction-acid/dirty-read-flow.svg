<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <rect width="920" height="510" fill="#fff"/>

  <text x="460" y="34" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Dirty Read — 미커밋 값을 읽어 잘못된 결과가 나가는 시나리오</text>
  <text x="460" y="56" font-size="13" fill="#475569" text-anchor="middle">초기: p1 (qty=10, price=$5), p2 (qty=20, price=$4)  ·  Tx2가 p1.qty를 10 → 15로 바꾸려다 ROLLBACK</text>

  <g transform="translate(80, 86)">
    <rect width="360" height="34" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tx1 — 보고서</text>
  </g>
  <g transform="translate(480, 86)">
    <rect width="360" height="34" rx="6" fill="#fee2e2" stroke="#7f1d1d"/>
    <text x="180" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#7f1d1d">Tx2 — 판매 추가</text>
  </g>

  <line x1="260" y1="130" x2="260" y2="480" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="660" y1="130" x2="660" y2="480" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <text x="40" y="158" font-size="11" font-weight="700" fill="#94a3b8">T1</text>
  <g transform="translate(80, 134)">
    <rect width="360" height="64" rx="6" fill="#fff" stroke="#1e3a8a"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#1e3a8a">① BEGIN + 1차 SELECT (행별)</text>
    <text x="14" y="40" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">p1: qty=10 × $5 = 50</text>
    <text x="14" y="56" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">p2: qty=20 × $4 = 80   →  합계 130</text>
  </g>

  <text x="40" y="234" font-size="11" font-weight="700" fill="#94a3b8">T2</text>
  <g transform="translate(480, 210)">
    <rect width="360" height="50" rx="6" fill="#fef3c7" stroke="#ca8a04"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#713f12">② BEGIN + UPDATE p1.qty=15</text>
    <text x="14" y="42" font-size="11.5" fill="#713f12">아직 COMMIT 하지 않음 — 메모리에만 변경 존재</text>
  </g>

  <text x="40" y="294" font-size="11" font-weight="700" fill="#94a3b8">T3</text>
  <g transform="translate(80, 270)">
    <rect width="760" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="380" y="21" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">⚠ Tx2의 미커밋 변경(p1.qty=15)이 Tx1으로 새어나오는 시점</text>
  </g>

  <text x="40" y="346" font-size="11" font-weight="700" fill="#94a3b8">T4</text>
  <g transform="translate(80, 312)">
    <rect width="360" height="84" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7f1d1d">③ 2차 SELECT SUM(qty*price)</text>
    <text x="14" y="40" font-size="11.5" fill="#7f1d1d" font-family="ui-monospace, Menlo, monospace">p1: qty=15 × $5 = 75   ← 미커밋 값을 읽음</text>
    <text x="14" y="56" font-size="11.5" fill="#7f1d1d" font-family="ui-monospace, Menlo, monospace">p2: qty=20 × $4 = 80</text>
    <text x="14" y="76" font-size="13" fill="#7f1d1d" font-weight="700" font-family="ui-monospace, Menlo, monospace">→ SUM = 155  (T1의 130과 불일치)</text>
  </g>

  <text x="40" y="438" font-size="11" font-weight="700" fill="#94a3b8">T5</text>
  <g transform="translate(480, 410)">
    <rect width="360" height="56" rx="6" fill="#fff" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#7f1d1d">④ ROLLBACK</text>
    <text x="14" y="42" font-size="11.5" fill="#7f1d1d">qty=15 변경 폐기 — Tx1이 본 값은 존재한 적 없음</text>
  </g>

  <g transform="translate(80, 478)">
    <rect width="760" height="22" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="20" y="16" font-size="12" fill="#713f12">결과: Tx1 안에서 개별 합(130) ≠ SUM(155). 그 SUM의 근거였던 데이터는 영원히 존재하지 않게 됨.</text>
  </g>
</svg>
