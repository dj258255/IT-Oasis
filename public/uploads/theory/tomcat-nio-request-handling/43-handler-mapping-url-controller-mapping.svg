<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" role="img" aria-label="HandlerMapping 인터페이스 - DispatcherServlet이 HandlerMapping 인터페이스를 사용, 구현체는 BeanNameUrlHandlerMapping과 DefaultAnnotationHandlerMapping">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .client { fill: rgba(255, 107, 107, 0.2); stroke: #FF6B6B; stroke-width: 1.5; }
      .interface { fill: rgba(100, 181, 246, 0.24); stroke: #64B5F6; stroke-width: 1.5; }
      .impl { fill: rgba(76, 175, 80, 0.24); stroke: #4CAF50; stroke-width: 1.25; }
      .lbl { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .ifc { font: 600 11px "Segoe UI", Arial, sans-serif; fill: #cccccc; font-style: italic; }
      .edge-lbl { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
    </style>
    <marker id="hm-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#bbb"/></marker>
  </defs>
  <rect width="580" height="420" class="bg"/>
  <text x="290" y="28" text-anchor="middle" class="title">HandlerMapping 인터페이스 구조</text>

  <rect x="30" y="100" width="200" height="100" rx="8" class="client"/>
  <text x="130" y="154" text-anchor="middle" class="lbl">DispatcherServlet</text>

  <line x1="230" y1="150" x2="340" y2="150" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#hm-a)"/>
  <text x="285" y="140" text-anchor="middle" class="edge-lbl">사용</text>

  <rect x="340" y="100" width="210" height="100" rx="8" class="interface"/>
  <text x="445" y="134" text-anchor="middle" class="ifc">«interface»</text>
  <text x="445" y="158" text-anchor="middle" class="lbl">HandlerMapping</text>

  <line x1="380" y1="200" x2="280" y2="290" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#hm-a)"/>
  <line x1="510" y1="200" x2="500" y2="290" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#hm-a)"/>

  <rect x="120" y="296" width="280" height="70" rx="8" class="impl"/>
  <text x="260" y="340" text-anchor="middle" class="lbl">BeanNameUrlHandlerMapping</text>

  <rect x="320" y="296" width="250" height="70" rx="8" class="impl"/>
  <text x="445" y="340" text-anchor="middle" class="lbl">DefaultAnnotationHandlerMapping</text>
</svg>
