<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" role="img" aria-label="accept-count 동작 - 새 연결 요청이 들어오면 Tomcat 연결 슬롯(maxConnections=20) 확인 후 가득 차면 OS Accept Queue(acceptCount=5) 대기, 그것도 가득 차면 Connection refused">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .req { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .state { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .decision { fill: rgba(255, 183, 77, 0.26); stroke: #FFB74D; stroke-width: 1.25; }
      .reject { fill: rgba(255, 107, 107, 0.24); stroke: #FF6B6B; stroke-width: 1.5; }
      .wait { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.25; }
      .done { fill: rgba(76, 175, 80, 0.28); stroke: #4CAF50; stroke-width: 1.5; }
      .lbl { font: 600 12.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
    </style>
    <marker id="ac-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="520" height="700" class="bg"/>
  <text x="260" y="28" text-anchor="middle" class="title">accept-count 동작</text>

  <rect x="170" y="50" width="180" height="36" rx="6" class="req"/>
  <text x="260" y="74" text-anchor="middle" class="lbl">새 연결 요청</text>
  <line x1="260" y1="86" x2="260" y2="106" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>

  <rect x="140" y="112" width="240" height="58" rx="8" class="state"/>
  <text x="260" y="136" text-anchor="middle" class="lbl">Tomcat 연결 상태</text>
  <text x="260" y="158" text-anchor="middle" class="sub">maxConnections = 20</text>
  <line x1="260" y1="170" x2="260" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>

  <polygon points="260,192 380,226 260,260 140,226" class="decision"/>
  <text x="260" y="222" text-anchor="middle" class="lbl">연결 슬롯</text>
  <text x="260" y="240" text-anchor="middle" class="sub">가득 참?</text>

  <text x="410" y="226" class="sub">No</text>
  <path d="M 380 226 C 430 226, 450 226, 470 274" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ac-a)"/>

  <text x="100" y="244" class="sub">Yes</text>
  <line x1="260" y1="260" x2="260" y2="282" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>

  <rect x="120" y="288" width="280" height="58" rx="8" class="state"/>
  <text x="260" y="312" text-anchor="middle" class="lbl">OS Accept Queue</text>
  <text x="260" y="334" text-anchor="middle" class="sub">acceptCount = 5</text>
  <line x1="260" y1="346" x2="260" y2="364" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>

  <polygon points="260,368 400,400 260,432 120,400" class="decision"/>
  <text x="260" y="396" text-anchor="middle" class="lbl">Accept Queue</text>
  <text x="260" y="414" text-anchor="middle" class="sub">가득 참?</text>

  <text x="60" y="420" class="sub">Yes</text>
  <line x1="120" y1="400" x2="100" y2="442" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>
  <rect x="20" y="448" width="180" height="50" rx="8" class="reject"/>
  <text x="110" y="478" text-anchor="middle" class="lbl">Connection refused</text>

  <text x="410" y="420" class="sub">No</text>
  <line x1="400" y1="400" x2="420" y2="442" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>
  <rect x="320" y="448" width="180" height="50" rx="8" class="wait"/>
  <text x="410" y="468" text-anchor="middle" class="sub">OS 대기 큐에 적재</text>
  <text x="410" y="488" text-anchor="middle" class="sub">(연결 대기)</text>
  <line x1="410" y1="498" x2="410" y2="524" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>

  <rect x="320" y="528" width="180" height="50" rx="8" class="wait"/>
  <text x="410" y="550" text-anchor="middle" class="sub">슬롯이 비면 수락</text>

  <line x1="410" y1="578" x2="310" y2="616" stroke="#888" stroke-width="1.5" marker-end="url(#ac-a)"/>
  <rect x="180" y="620" width="260" height="50" rx="8" class="done"/>
  <text x="310" y="650" text-anchor="middle" class="lbl">연결 수락 · 처리</text>
</svg>
