<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" role="img" aria-label="BIO 커넥터 문제 - 클라이언트가 TCP 연결 후 HTTP 요청/응답을 주고받은 뒤 Keep-Alive 대기 동안 1.9초간 워커 스레드가 계속 점유되어 200 스레드로 최대 200개 연결만 처리 가능">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .actor { fill: rgba(100, 181, 246, 0.2); stroke: #64B5F6; stroke-width: 1.25; }
      .stage { fill: rgba(255, 238, 215, 0.14); stroke: rgba(255,238,215,0.3); stroke-width: 1; }
      .note { fill: rgba(255, 183, 77, 0.22); stroke: #FFB74D; stroke-width: 1.25; }
      .problem { fill: rgba(255, 107, 107, 0.26); stroke: #FF6B6B; stroke-width: 1.5; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 4 4; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .msg { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .stage-lbl { font: 700 11.5px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
    </style>
    <marker id="bio-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bbb"/></marker>
  </defs>
  <rect width="680" height="720" class="bg"/>
  <text x="340" y="26" text-anchor="middle" class="title">BIO 커넥터 문제 — Keep-Alive 중 스레드 점유</text>

  <rect x="30"  y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="110" y="73" text-anchor="middle" class="lbl">클라이언트</text>
  <rect x="260" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="340" y="73" text-anchor="middle" class="lbl">BIO 톰캣</text>
  <rect x="490" y="50" width="160" height="34" rx="6" class="actor"/>
  <text x="570" y="73" text-anchor="middle" class="lbl">워커 스레드</text>
  <line x1="110" y1="84" x2="110" y2="680" class="lifeline"/>
  <line x1="340" y1="84" x2="340" y2="680" class="lifeline"/>
  <line x1="570" y1="84" x2="570" y2="680" class="lifeline"/>

  <rect x="20" y="98" width="640" height="22" rx="4" class="stage"/>
  <text x="340" y="114" text-anchor="middle" class="stage-lbl">0초 · 연결 시작</text>

  <line x1="110" y1="144" x2="338" y2="144" stroke="#bbb" stroke-width="1.25" marker-end="url(#bio-a)"/>
  <text x="220" y="138" text-anchor="middle" class="msg">TCP 연결</text>
  <line x1="340" y1="170" x2="568" y2="170" stroke="#bbb" stroke-width="1.25" marker-end="url(#bio-a)"/>
  <text x="450" y="164" text-anchor="middle" class="msg">스레드 할당</text>

  <rect x="20" y="194" width="640" height="22" rx="4" class="stage"/>
  <text x="340" y="210" text-anchor="middle" class="stage-lbl">0초 · 첫 번째 요청</text>

  <line x1="110" y1="240" x2="338" y2="240" stroke="#bbb" stroke-width="1.25" marker-end="url(#bio-a)"/>
  <text x="220" y="234" text-anchor="middle" class="msg">HTTP 요청</text>
  <line x1="338" y1="266" x2="110" y2="266" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#bio-a)"/>
  <text x="220" y="260" text-anchor="middle" class="msg">HTTP 응답</text>

  <rect x="20" y="290" width="640" height="22" rx="4" class="stage"/>
  <text x="340" y="306" text-anchor="middle" class="stage-lbl">0.1초 ~ 2초 · Keep-Alive 대기</text>

  <rect x="200" y="330" width="280" height="50" rx="8" class="note"/>
  <text x="340" y="354" text-anchor="middle" class="msg">아무것도 안 함</text>
  <text x="340" y="372" text-anchor="middle" class="msg">하지만 스레드는 계속 점유</text>

  <rect x="20" y="398" width="640" height="22" rx="4" class="stage"/>
  <text x="340" y="414" text-anchor="middle" class="stage-lbl">2초 · 두 번째 요청</text>

  <line x1="110" y1="444" x2="338" y2="444" stroke="#bbb" stroke-width="1.25" marker-end="url(#bio-a)"/>
  <text x="220" y="438" text-anchor="middle" class="msg">HTTP 요청</text>
  <line x1="338" y1="470" x2="110" y2="470" stroke="#bbb" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#bio-a)"/>
  <text x="220" y="464" text-anchor="middle" class="msg">HTTP 응답</text>

  <rect x="20" y="494" width="640" height="22" rx="4" class="stage"/>
  <text x="340" y="510" text-anchor="middle" class="stage-lbl">2.1초 · 연결 종료</text>

  <line x1="110" y1="540" x2="338" y2="540" stroke="#bbb" stroke-width="1.25" marker-end="url(#bio-a)"/>
  <text x="220" y="534" text-anchor="middle" class="msg">연결 종료</text>
  <line x1="568" y1="566" x2="340" y2="566" stroke="#bbb" stroke-width="1.25" marker-end="url(#bio-a)"/>
  <text x="450" y="560" text-anchor="middle" class="msg">스레드 반환</text>

  <rect x="60" y="600" width="560" height="56" rx="10" class="problem"/>
  <text x="340" y="624" text-anchor="middle" class="lbl">문제</text>
  <text x="340" y="644" text-anchor="middle" class="msg">1.9초 동안 스레드 낭비 · 200 스레드로 최대 200개 연결만 처리 가능</text>
</svg>
