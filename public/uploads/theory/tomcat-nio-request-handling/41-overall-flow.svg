<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" role="img" aria-label="Tomcat NIO 전체 흐름 - 클라이언트 요청 → Tomcat NIO Connector → Filter Chain → DispatcherServlet(Front Controller) → HandlerMapping → HandlerAdapter → Controller 실행 → HandlerInterceptor → ViewResolver/REST API → MessageConverter → afterCompletion → 응답 반환">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .req { fill: rgba(186, 104, 200, 0.22); stroke: #BA68C8; stroke-width: 1.25; }
      .connector { fill: rgba(100, 181, 246, 0.22); stroke: #64B5F6; stroke-width: 1.25; }
      .filter { fill: rgba(255, 183, 77, 0.2); stroke: #FFB74D; stroke-width: 1.25; }
      .dispatch { fill: rgba(255, 107, 107, 0.22); stroke: #FF6B6B; stroke-width: 1.25; }
      .handler { fill: rgba(186, 104, 200, 0.18); stroke: #BA68C8; stroke-width: 1.25; }
      .controller { fill: rgba(76, 175, 80, 0.26); stroke: #4CAF50; stroke-width: 1.5; }
      .message { fill: rgba(255, 238, 215, 0.18); stroke: #FFB74D; stroke-width: 1.25; }
      .done { fill: rgba(76, 175, 80, 0.18); stroke: #4CAF50; stroke-width: 1.25; }
      .lbl { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 500 11.5px "Segoe UI", Arial, sans-serif; fill: #cccccc; }
    </style>
    <marker id="of-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#888"/></marker>
  </defs>
  <rect width="420" height="880" class="bg"/>
  <text x="210" y="26" text-anchor="middle" class="title">전체 요청 처리 흐름</text>

  <rect x="110" y="50" width="200" height="36" rx="6" class="req"/>
  <text x="210" y="74" text-anchor="middle" class="lbl">클라이언트 요청</text>
  <line x1="210" y1="86" x2="210" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="110" width="260" height="52" rx="8" class="connector"/>
  <text x="210" y="133" text-anchor="middle" class="lbl">[1] Tomcat NIO Connector</text>
  <text x="210" y="152" text-anchor="middle" class="sub">스레드 풀에서 스레드 할당</text>
  <line x1="210" y1="162" x2="210" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="100" y="186" width="220" height="42" rx="6" class="filter"/>
  <text x="210" y="212" text-anchor="middle" class="lbl">[2] Filter Chain</text>
  <line x1="210" y1="228" x2="210" y2="246" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="252" width="260" height="52" rx="8" class="dispatch"/>
  <text x="210" y="275" text-anchor="middle" class="lbl">[3] DispatcherServlet</text>
  <text x="210" y="294" text-anchor="middle" class="sub">Front Controller</text>
  <line x1="210" y1="304" x2="210" y2="322" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="328" width="260" height="52" rx="8" class="handler"/>
  <text x="210" y="351" text-anchor="middle" class="lbl">[4] HandlerMapping</text>
  <text x="210" y="370" text-anchor="middle" class="sub">URL → Controller 매핑</text>
  <line x1="210" y1="380" x2="210" y2="398" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="404" width="260" height="52" rx="8" class="handler"/>
  <text x="210" y="427" text-anchor="middle" class="lbl">[5] HandlerInterceptor</text>
  <text x="210" y="446" text-anchor="middle" class="sub">preHandle</text>
  <line x1="210" y1="456" x2="210" y2="474" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="480" width="260" height="52" rx="8" class="handler"/>
  <text x="210" y="503" text-anchor="middle" class="lbl">[6] HandlerAdapter</text>
  <text x="210" y="522" text-anchor="middle" class="sub">@RestController 실행</text>
  <line x1="210" y1="532" x2="210" y2="550" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="556" width="260" height="42" rx="6" class="controller"/>
  <text x="210" y="582" text-anchor="middle" class="lbl">[7] Controller 메서드 실행</text>
  <line x1="210" y1="598" x2="210" y2="616" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="622" width="260" height="52" rx="8" class="handler"/>
  <text x="210" y="645" text-anchor="middle" class="lbl">[8] HandlerInterceptor</text>
  <text x="210" y="664" text-anchor="middle" class="sub">postHandle</text>
  <line x1="210" y1="674" x2="210" y2="692" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="698" width="260" height="52" rx="8" class="message"/>
  <text x="210" y="721" text-anchor="middle" class="lbl">[9] ViewResolver</text>
  <text x="210" y="740" text-anchor="middle" class="sub">REST API는 건너뜀</text>
  <line x1="210" y1="750" x2="210" y2="768" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="80" y="774" width="260" height="52" rx="8" class="message"/>
  <text x="210" y="797" text-anchor="middle" class="lbl">[10] MessageConverter</text>
  <text x="210" y="816" text-anchor="middle" class="sub">@ResponseBody</text>
  <line x1="210" y1="826" x2="210" y2="844" stroke="#888" stroke-width="1.5" marker-end="url(#of-a)"/>

  <rect x="110" y="850" width="200" height="26" rx="4" class="done"/>
  <text x="210" y="868" text-anchor="middle" class="sub">클라이언트에게 응답</text>
</svg>
