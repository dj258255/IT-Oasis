<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-label="Tomcat Coyote 패키지 구조 - org.apache.coyote 하위의 http11, http2 네임스페이스에 NioProtocol과 Http11NioProtocol 클래스 위치">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .pkg-outer { fill: rgba(255, 238, 215, 0.08); stroke: rgba(255,238,215,0.35); stroke-width: 1.25; }
      .pkg { fill: rgba(100, 181, 246, 0.16); stroke: #64B5F6; stroke-width: 1.25; }
      .file { fill: rgba(255, 238, 215, 0.14); stroke: rgba(255,238,215,0.3); stroke-width: 1; }
      .highlight { fill: rgba(186, 104, 200, 0.28); stroke: #BA68C8; stroke-width: 1.5; }
      .lbl { font: 500 12px "Consolas", "Menlo", monospace; fill: #e0e0e0; }
      .pkg-lbl { font: 600 13px "Consolas", "Menlo", monospace; fill: #BA68C8; }
    </style>
  </defs>
  <rect width="480" height="420" class="bg"/>
  <text x="240" y="28" text-anchor="middle" class="title">Coyote 패키지 내 NioProtocol 위치</text>

  <rect x="20" y="50" width="440" height="350" rx="8" class="pkg-outer"/>
  <text x="40" y="72" class="pkg-lbl">tomcat-embed-core (catalina/coyote)</text>

  <rect x="40" y="90" width="420" height="50" rx="6" class="pkg"/>
  <text x="60" y="114" class="pkg-lbl">org.apache.coyote</text>
  <text x="60" y="130" class="lbl">AbstractProtocol · AbstractHttp11Protocol</text>

  <rect x="40" y="160" width="420" height="100" rx="6" class="pkg"/>
  <text x="60" y="184" class="pkg-lbl">org.apache.coyote.http11</text>
  <rect x="60" y="196" width="380" height="24" rx="4" class="file"/>
  <text x="75" y="213" class="lbl">Constants · ExceptionUtils · …</text>
  <rect x="60" y="226" width="380" height="26" rx="4" class="highlight"/>
  <text x="75" y="244" class="lbl" style="fill:#ffffff;">Http11NioProtocol</text>

  <rect x="40" y="280" width="420" height="100" rx="6" class="pkg"/>
  <text x="60" y="304" class="pkg-lbl">org.apache.coyote.http2</text>
  <rect x="60" y="316" width="380" height="26" rx="4" class="highlight"/>
  <text x="75" y="334" class="lbl" style="fill:#ffffff;">Http2NioProtocol</text>
  <rect x="60" y="348" width="380" height="24" rx="4" class="file"/>
  <text x="75" y="365" class="lbl">AbstractHttp2Protocol · …</text>
</svg>
