<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="300" y="44" font-size="18" font-weight="800" fill="#1f2328" text-anchor="middle">코어 0 (스레드 1)</text>
  <text x="900" y="44" font-size="18" font-weight="800" fill="#1f2328" text-anchor="middle">코어 1 (스레드 2)</text>

  <rect x="150" y="66" width="300" height="64" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="300" y="94" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">x = 1; 그다음 y를 읽음</text>
  <text x="300" y="116" font-size="14" fill="#59636e" text-anchor="middle">프로그램에 쓴 순서</text>
  <rect x="750" y="66" width="300" height="64" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="900" y="94" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">y = 1; 그다음 x를 읽음</text>
  <text x="900" y="116" font-size="14" fill="#59636e" text-anchor="middle">프로그램에 쓴 순서</text>

  <line x1="300" y1="130" x2="300" y2="168" stroke="#868e96" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="900" y1="130" x2="900" y2="168" stroke="#868e96" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="150" y="172" width="300" height="76" rx="8" fill="#fff4e6" stroke="#f0c98a"/>
  <text x="300" y="202" font-size="16" font-weight="800" fill="#1f2328" text-anchor="middle">스토어 버퍼: x = 1</text>
  <text x="300" y="228" font-size="14" fill="#59636e" text-anchor="middle">아직 캐시에 반영되지 않음</text>
  <rect x="750" y="172" width="300" height="76" rx="8" fill="#fff4e6" stroke="#f0c98a"/>
  <text x="900" y="202" font-size="16" font-weight="800" fill="#1f2328" text-anchor="middle">스토어 버퍼: y = 1</text>
  <text x="900" y="228" font-size="14" fill="#59636e" text-anchor="middle">아직 캐시에 반영되지 않음</text>

  <rect x="150" y="290" width="300" height="76" rx="8" fill="#e7f0f8" stroke="#a5c4de"/>
  <text x="300" y="320" font-size="16" font-weight="800" fill="#1f2328" text-anchor="middle">캐시: x = 0, y = 0</text>
  <text x="300" y="346" font-size="14" fill="#59636e" text-anchor="middle">y를 여기서 읽어 0을 얻음</text>
  <rect x="750" y="290" width="300" height="76" rx="8" fill="#e7f0f8" stroke="#a5c4de"/>
  <text x="900" y="320" font-size="16" font-weight="800" fill="#1f2328" text-anchor="middle">캐시: x = 0, y = 0</text>
  <text x="900" y="346" font-size="14" fill="#59636e" text-anchor="middle">x를 여기서 읽어 0을 얻음</text>

  <line x1="300" y1="248" x2="300" y2="286" stroke="#868e96" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="900" y1="248" x2="900" y2="286" stroke="#868e96" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="318" y="272" font-size="13" fill="#868e96">나중에 반영</text>
  <text x="918" y="272" font-size="13" fill="#868e96">나중에 반영</text>

  <rect x="150" y="414" width="900" height="104" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="600" y="446" font-size="17" font-weight="800" fill="#c92a2a" text-anchor="middle">두 스레드가 모두 0을 읽음</text>
  <text x="600" y="474" font-size="15" fill="#1f2328" text-anchor="middle">두 줄을 어떤 순서로 끼워 넣어도 나올 수 없는 결과다. 한쪽이 먼저 썼다면 다른 쪽은 1을 읽어야 한다.</text>
  <text x="600" y="500" font-size="15" fill="#59636e" text-anchor="middle">자기가 쓴 값은 자기 스토어 버퍼에서 바로 읽지만 다른 코어의 스토어 버퍼는 보이지 않는다.</text>
</svg>
