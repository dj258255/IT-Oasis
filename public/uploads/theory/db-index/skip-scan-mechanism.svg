<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgsk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrSK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="url(#bgsk)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">PostgreSQL 18 Skip Scan — leading 컬럼 없는 쿼리도 인덱스 활용</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">(status, customer_id, order_date) 인덱스 + WHERE customer_id = 100</text>

  <g transform="translate(80, 130)">
    <rect width="320" height="60" rx="12" fill="#0f172a" stroke="#22d3ee"/>
    <text x="160" y="28" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">Step 1 — distinct prefix 식별</text>
    <text x="160" y="48" fill="#94a3b8" font-size="12" text-anchor="middle">status: active / pending / shipped</text>
  </g>

  <g transform="translate(80, 220)">
    <rect width="320" height="60" rx="12" fill="#0f172a" stroke="#facc15"/>
    <text x="160" y="28" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Step 2 — 각 prefix 값마다 mini-seek</text>
    <text x="160" y="48" fill="#94a3b8" font-size="12" text-anchor="middle">3번의 작은 인덱스 검색</text>
  </g>

  <g transform="translate(80, 310)">
    <rect width="320" height="60" rx="12" fill="#0f172a" stroke="#22c55e"/>
    <text x="160" y="28" fill="#86efac" font-size="13" font-weight="700" text-anchor="middle">Step 3 — 결과 결합</text>
    <text x="160" y="48" fill="#94a3b8" font-size="12" text-anchor="middle">customer_id=100 매칭 행만</text>
  </g>

  <line x1="240" y1="190" x2="240" y2="218" stroke="#facc15" marker-end="url(#arrSK)"/>
  <line x1="240" y1="280" x2="240" y2="308" stroke="#facc15" marker-end="url(#arrSK)"/>

  <!-- Mini scans -->
  <g transform="translate(480, 130)">
    <text x="0" y="0" fill="#facc15" font-size="13" font-weight="700">3번의 mini-seek</text>
    <g transform="translate(0, 20)">
      <rect width="640" height="50" rx="8" fill="#0f172a" stroke="#854d0e"/>
      <text x="20" y="32" fill="#fde68a" font-size="13">status='active' AND customer_id=100 → leaf seek</text>
    </g>
    <g transform="translate(0, 80)">
      <rect width="640" height="50" rx="8" fill="#0f172a" stroke="#854d0e"/>
      <text x="20" y="32" fill="#fde68a" font-size="13">status='pending' AND customer_id=100 → leaf seek</text>
    </g>
    <g transform="translate(0, 140)">
      <rect width="640" height="50" rx="8" fill="#0f172a" stroke="#854d0e"/>
      <text x="20" y="32" fill="#fde68a" font-size="13">status='shipped' AND customer_id=100 → leaf seek</text>
    </g>
  </g>

  <g transform="translate(80, 410)">
    <rect width="1040" height="100" rx="12" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="20" y="28" fill="#fda4af" font-size="13" font-weight="700">한계</text>
    <text x="20" y="50" fill="#cbd5e1" font-size="13">B-tree 한정 · 낮은 카디널리티 prefix + 후행 equality에서만 효과적 · 통계가 stale하면 잘못된 선택</text>
    <text x="20" y="72" fill="#cbd5e1" font-size="13">옵티마이저가 cost 비교로 자동 선택 (강제 불가) · EXPLAIN의 Index Searches: N 메트릭으로 확인</text>
    <text x="20" y="92" fill="#facc15" font-size="12">정공법은 여전히 leading 컬럼 매칭 — skip scan은 분석/리포팅 워크로드의 보너스</text>
  </g>
</svg>
