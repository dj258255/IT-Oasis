<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgba" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrBA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="url(#bgba)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">BitmapAnd — 두 인덱스의 비트맵을 결합</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">단일 인덱스로 못 풀 쿼리도 다중 인덱스 결합으로 효율 가능</text>

  <!-- Index A bitmap -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" fill="#22d3ee" font-size="13" font-weight="700">idx_a (a = 100) 비트맵</text>
    <g>
      <rect x="0"   y="14" width="40" height="40" fill="#0c4a6e" stroke="#22d3ee"/>
      <text x="20" y="40" fill="#a5f3fc" font-size="11" text-anchor="middle">P0</text>
      <rect x="44"  y="14" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="64" y="40" fill="#475569" font-size="11" text-anchor="middle">P1</text>
      <rect x="88"  y="14" width="40" height="40" fill="#0c4a6e" stroke="#22d3ee"/>
      <text x="108" y="40" fill="#a5f3fc" font-size="11" text-anchor="middle">P2</text>
      <rect x="132" y="14" width="40" height="40" fill="#0c4a6e" stroke="#22d3ee"/>
      <text x="152" y="40" fill="#a5f3fc" font-size="11" text-anchor="middle">P3</text>
      <rect x="176" y="14" width="40" height="40" fill="#0c4a6e" stroke="#22d3ee"/>
      <text x="196" y="40" fill="#a5f3fc" font-size="11" text-anchor="middle">P4</text>
      <rect x="220" y="14" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="240" y="40" fill="#475569" font-size="11" text-anchor="middle">P5</text>
    </g>
  </g>

  <!-- Index B bitmap -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" fill="#f472b6" font-size="13" font-weight="700">idx_b (b = 100) 비트맵</text>
    <g>
      <rect x="0"   y="14" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="20" y="40" fill="#475569" font-size="11" text-anchor="middle">P0</text>
      <rect x="44"  y="14" width="40" height="40" fill="#831843" stroke="#f472b6"/>
      <text x="64" y="40" fill="#fbcfe8" font-size="11" text-anchor="middle">P1</text>
      <rect x="88"  y="14" width="40" height="40" fill="#831843" stroke="#f472b6"/>
      <text x="108" y="40" fill="#fbcfe8" font-size="11" text-anchor="middle">P2</text>
      <rect x="132" y="14" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="152" y="40" fill="#475569" font-size="11" text-anchor="middle">P3</text>
      <rect x="176" y="14" width="40" height="40" fill="#831843" stroke="#f472b6"/>
      <text x="196" y="40" fill="#fbcfe8" font-size="11" text-anchor="middle">P4</text>
      <rect x="220" y="14" width="40" height="40" fill="#831843" stroke="#f472b6"/>
      <text x="240" y="40" fill="#fbcfe8" font-size="11" text-anchor="middle">P5</text>
    </g>
  </g>

  <!-- BitmapAnd op -->
  <g transform="translate(420, 180)">
    <rect width="160" height="80" rx="14" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
    <text x="80" y="34" fill="#facc15" font-size="14" font-weight="700" text-anchor="middle">BitmapAnd</text>
    <text x="80" y="58" fill="#fde68a" font-size="12" text-anchor="middle">교집합</text>
  </g>

  <line x1="340" y1="170" x2="420" y2="200" stroke="#facc15" stroke-dasharray="4 3" marker-end="url(#arrBA)"/>
  <line x1="340" y1="270" x2="420" y2="240" stroke="#facc15" stroke-dasharray="4 3" marker-end="url(#arrBA)"/>

  <!-- Result bitmap -->
  <g transform="translate(640, 200)">
    <text x="0" y="-12" fill="#86efac" font-size="13" font-weight="700">결합 비트맵 (둘 다 매칭)</text>
    <g>
      <rect x="0"   y="0" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="20" y="26" fill="#475569" font-size="11" text-anchor="middle">P0</text>
      <rect x="44"  y="0" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="64" y="26" fill="#475569" font-size="11" text-anchor="middle">P1</text>
      <rect x="88"  y="0" width="40" height="40" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
      <text x="108" y="26" fill="#86efac" font-size="11" text-anchor="middle">P2</text>
      <rect x="132" y="0" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="152" y="26" fill="#475569" font-size="11" text-anchor="middle">P3</text>
      <rect x="176" y="0" width="40" height="40" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
      <text x="196" y="26" fill="#86efac" font-size="11" text-anchor="middle">P4</text>
      <rect x="220" y="0" width="40" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="240" y="26" fill="#475569" font-size="11" text-anchor="middle">P5</text>
    </g>
    <text x="0" y="62" fill="#94a3b8" font-size="11">P2, P4만 남음 → 한 번의 Heap 접근</text>
  </g>

  <line x1="580" y1="220" x2="640" y2="220" stroke="#facc15" stroke-width="2" marker-end="url(#arrBA)"/>

  <!-- EXPLAIN -->
  <g transform="translate(80, 360)">
    <rect width="1040" height="140" rx="12" fill="#0f172a" stroke="#facc15"/>
    <text x="20" y="28" fill="#facc15" font-size="13" font-weight="700">EXPLAIN 출력</text>
    <g font-family="Menlo, monospace" font-size="13" fill="#cbd5e1">
      <text x="20" y="58">Bitmap Heap Scan on test</text>
      <text x="20" y="80">  -&gt; BitmapAnd</text>
      <text x="20" y="100">       -&gt; Bitmap Index Scan on idx_a   Index Cond: (a = 100)</text>
      <text x="20" y="120">       -&gt; Bitmap Index Scan on idx_b   Index Cond: (b = 100)</text>
    </g>
  </g>
</svg>
