<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgi5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowi5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgi5)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>

  <g transform="translate(80, 80)">
    <rect width="240" height="36" rx="18" fill="none" stroke="url(#glowi5)" stroke-width="1.5"/>
    <text x="120" y="24" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">DATABASE INDEX · 5</text>
  </g>

  <text x="80" y="200" fill="#f8fafc" font-size="60" font-weight="800">클러스터형 인덱스와</text>
  <text x="80" y="276" fill="#f8fafc" font-size="60" font-weight="800">DBMS별 차이</text>

  <text x="80" y="332" fill="#94a3b8" font-size="22" font-weight="500">같은 SQL이라도 저장 구조에 따라 plan과 비용이 전혀 달라진다</text>

  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#hpGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="28" y="44" fill="#a5f3fc" font-size="18" font-weight="700" letter-spacing="1">HEAP-ORGANIZED</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">데이터 + 인덱스 분리</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">PostgreSQL 전용 · Oracle 기본 · SQL Server 옵션</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">모든 인덱스가 secondary, heap 직접 포인터</text>
  </g>

  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#iotGrad)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="28" y="44" fill="#fdba74" font-size="18" font-weight="700" letter-spacing="1">INDEX-ORGANIZED</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">PK B-tree가 곧 테이블</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">InnoDB 강제 · Oracle IOT · SQL Server 기본</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">secondary index가 PK 값을 포인터로</text>
  </g>
</svg>
