<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgsv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrSV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="url(#bgsv)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">Seq Scan O(N) vs B-tree Index O(log N)</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">자료구조의 효율 차이가 곧 인덱스의 본질</text>

  <!-- Left: Seq Scan -->
  <g transform="translate(60, 110)">
    <rect width="510" height="380" rx="14" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
    <rect x="0" y="0" width="510" height="44" rx="14" fill="#7f1d1d"/>
    <text x="255" y="29" fill="#fecaca" font-size="16" font-weight="700" text-anchor="middle">Sequential Scan — 모든 페이지 훑기</text>

    <g transform="translate(40, 80)">
      <text x="0" y="0" fill="#fbbf24" font-size="12" font-weight="700">HEAP (1억 행 가정)</text>
      <g>
        <rect x="0"   y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="50"  y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="100" y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="150" y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="200" y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="250" y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="300" y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="350" y="14" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <text x="410" y="40" fill="#94a3b8" font-size="14">…</text>
      </g>
      <g>
        <rect x="0"   y="64" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="50"  y="64" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="100" y="64" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="150" y="64" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="200" y="64" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="250" y="64" width="44" height="40" fill="#7f1d1d" stroke="#ef4444"/>
        <rect x="300" y="64" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <rect x="350" y="64" width="44" height="40" fill="#0f172a" stroke="#475569"/>
        <text x="410" y="90" fill="#94a3b8" font-size="14">…</text>
      </g>
      <text x="0" y="138" fill="#fda4af" font-size="12">target row가 어디 있는지 모름</text>
      <text x="0" y="158" fill="#fda4af" font-size="12">→ 모든 페이지 차례로 비교</text>
    </g>

    <g transform="translate(40, 290)">
      <rect width="430" height="76" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-dasharray="4 4"/>
      <text x="20" y="28" fill="#fda4af" font-size="13" font-weight="700">비용</text>
      <text x="20" y="50" fill="#cbd5e1" font-size="13">최악 N번 비교 = O(N)</text>
      <text x="20" y="70" fill="#cbd5e1" font-size="13">1억 행이면 1억 번 비교 (단 sequential I/O라 readahead 효과)</text>
    </g>
  </g>

  <!-- Right: B-tree -->
  <g transform="translate(630, 110)">
    <rect width="510" height="380" rx="14" fill="#1e293b" stroke="#14532d" stroke-width="1.5"/>
    <rect x="0" y="0" width="510" height="44" rx="14" fill="#14532d"/>
    <text x="255" y="29" fill="#bbf7d0" font-size="16" font-weight="700" text-anchor="middle">B-tree Index — depth만큼만 짚기</text>

    <!-- root -->
    <g>
      <rect x="200" y="80" width="120" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="260" y="101" fill="#bbf7d0" font-size="12" font-weight="700" text-anchor="middle">Root</text>
    </g>
    <!-- internal -->
    <g>
      <rect x="60"  y="160" width="120" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="120" y="181" fill="#bbf7d0" font-size="12" text-anchor="middle">Internal</text>
      <rect x="200" y="160" width="120" height="32" rx="6" fill="#0c4a6e" stroke="#22c55e" stroke-width="2"/>
      <text x="260" y="181" fill="#bbf7d0" font-size="12" font-weight="700" text-anchor="middle">Internal</text>
      <rect x="340" y="160" width="120" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="400" y="181" fill="#bbf7d0" font-size="12" text-anchor="middle">Internal</text>
    </g>
    <!-- leaf -->
    <g>
      <rect x="20"  y="240" width="80" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <rect x="110" y="240" width="80" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <rect x="200" y="240" width="80" height="32" rx="6" fill="#0c4a6e" stroke="#22c55e" stroke-width="2"/>
      <text x="240" y="261" fill="#bbf7d0" font-size="11" font-weight="700" text-anchor="middle">Leaf</text>
      <rect x="290" y="240" width="80" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <rect x="380" y="240" width="80" height="32" rx="6" fill="#0f172a" stroke="#22c55e"/>
    </g>
    <!-- arrows -->
    <g stroke="#22c55e" fill="none" stroke-width="1.5">
      <line x1="240" y1="112" x2="120" y2="160" marker-end="url(#arrSV)"/>
      <line x1="260" y1="112" x2="260" y2="160" stroke="#facc15" marker-end="url(#arrSV)"/>
      <line x1="280" y1="112" x2="400" y2="160" marker-end="url(#arrSV)"/>
      <line x1="240" y1="192" x2="240" y2="240" stroke="#facc15" marker-end="url(#arrSV)"/>
    </g>

    <g transform="translate(40, 300)">
      <rect width="430" height="66" rx="10" fill="#0f172a" stroke="#14532d" stroke-dasharray="4 4"/>
      <text x="20" y="28" fill="#86efac" font-size="13" font-weight="700">비용</text>
      <text x="20" y="50" fill="#cbd5e1" font-size="13">depth 3~5 페이지 접근만으로 leaf 도달 = O(log N)</text>
    </g>
  </g>
</svg>
