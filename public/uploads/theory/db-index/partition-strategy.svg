<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrPS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="url(#bgps)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">수십억 행 — 단일 인덱스의 한계와 분할 전략</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">파티셔닝(같은 인스턴스) → 샤딩(여러 인스턴스) → 외부 검색엔진</text>

  <!-- Single big table -->
  <g transform="translate(80, 130)">
    <rect width="280" height="180" rx="12" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="140" y="32" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle">단일 테이블 (수십억 행)</text>
    <text x="20" y="64" fill="#cbd5e1" font-size="12">- 인덱스가 buffer pool 초과</text>
    <text x="20" y="86" fill="#cbd5e1" font-size="12">- REINDEX/VACUUM 시간 폭증</text>
    <text x="20" y="108" fill="#cbd5e1" font-size="12">- CONCURRENTLY가 며칠</text>
    <text x="20" y="130" fill="#cbd5e1" font-size="12">- maintenance window 사라짐</text>
    <text x="140" y="160" fill="#fda4af" font-size="12" font-weight="700" text-anchor="middle">한계</text>
  </g>

  <line x1="370" y1="220" x2="430" y2="220" stroke="#22d3ee" marker-end="url(#arrPS)"/>

  <!-- Partitioned -->
  <g transform="translate(440, 130)">
    <rect width="320" height="180" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
    <text x="160" y="32" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Partitioning (PG 11+)</text>
    <g transform="translate(20, 50)">
      <rect x="0"  y="0" width="60" height="40" rx="4" fill="#0f172a" stroke="#facc15"/>
      <text x="30" y="18" fill="#fde68a" font-size="10" text-anchor="middle">2026-01</text>
      <text x="30" y="32" fill="#94a3b8" font-size="9" text-anchor="middle">+ idx</text>
      <rect x="70" y="0" width="60" height="40" rx="4" fill="#0f172a" stroke="#facc15"/>
      <text x="100" y="18" fill="#fde68a" font-size="10" text-anchor="middle">2026-02</text>
      <text x="100" y="32" fill="#94a3b8" font-size="9" text-anchor="middle">+ idx</text>
      <rect x="140" y="0" width="60" height="40" rx="4" fill="#0f172a" stroke="#facc15"/>
      <text x="170" y="18" fill="#fde68a" font-size="10" text-anchor="middle">2026-03</text>
      <text x="170" y="32" fill="#94a3b8" font-size="9" text-anchor="middle">+ idx</text>
      <rect x="210" y="0" width="60" height="40" rx="4" fill="#0f172a" stroke="#facc15"/>
      <text x="240" y="18" fill="#fde68a" font-size="10" text-anchor="middle">2026-04</text>
      <text x="240" y="32" fill="#94a3b8" font-size="9" text-anchor="middle">+ idx</text>
    </g>
    <text x="20" y="116" fill="#cbd5e1" font-size="11">- partition pruning</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="11">- 작은 인덱스 단위 운영</text>
    <text x="20" y="152" fill="#cbd5e1" font-size="11">- DROP TABLE로 archiving</text>
  </g>

  <line x1="770" y1="220" x2="830" y2="220" stroke="#22d3ee" marker-end="url(#arrPS)"/>

  <!-- Sharding -->
  <g transform="translate(840, 130)">
    <rect width="280" height="180" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="140" y="32" fill="#86efac" font-size="13" font-weight="700" text-anchor="middle">Sharding (분산)</text>
    <g transform="translate(20, 56)">
      <rect x="0"  y="0" width="60" height="50" rx="4" fill="#0f172a" stroke="#22c55e"/>
      <text x="30" y="22" fill="#bbf7d0" font-size="10" text-anchor="middle">Node 1</text>
      <rect x="80" y="0" width="60" height="50" rx="4" fill="#0f172a" stroke="#22c55e"/>
      <text x="110" y="22" fill="#bbf7d0" font-size="10" text-anchor="middle">Node 2</text>
      <rect x="160" y="0" width="60" height="50" rx="4" fill="#0f172a" stroke="#22c55e"/>
      <text x="190" y="22" fill="#bbf7d0" font-size="10" text-anchor="middle">Node 3</text>
    </g>
    <text x="20" y="132" fill="#cbd5e1" font-size="11">- Citus / Vitess / CRDB</text>
    <text x="20" y="150" fill="#cbd5e1" font-size="11">- cross-shard query 비쌈</text>
  </g>

  <!-- Cache + ES -->
  <g transform="translate(80, 360)">
    <rect width="1040" height="140" rx="12" fill="#0f172a" stroke="#22d3ee"/>
    <text x="20" y="32" fill="#22d3ee" font-size="13" font-weight="700">Composite — 현실적인 운영 패턴</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="13">1. 시간 기준 partition (월/주 단위) — hot range만 인덱스 풀로 운영</text>
    <text x="20" y="80" fill="#cbd5e1" font-size="13">2. 오래된 파티션 압축 + 인덱스 최소화 + archiving</text>
    <text x="20" y="102" fill="#cbd5e1" font-size="13">3. read-heavy 부하는 Redis/Memcached 캐시로 분리</text>
    <text x="20" y="124" fill="#cbd5e1" font-size="13">4. 검색 부하가 크면 Elasticsearch / OpenSearch 별도 (DB는 source of truth)</text>
  </g>
</svg>
