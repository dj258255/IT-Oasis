<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgi3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowi3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="covGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="visGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgi3)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>

  <g transform="translate(80, 80)">
    <rect width="240" height="36" rx="18" fill="none" stroke="url(#glowi3)" stroke-width="1.5"/>
    <text x="120" y="24" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">DATABASE INDEX · 3</text>
  </g>

  <text x="80" y="200" fill="#f8fafc" font-size="60" font-weight="800">Covering Index와</text>
  <text x="80" y="276" fill="#f8fafc" font-size="60" font-weight="800">Index-Only Scan</text>

  <text x="80" y="332" fill="#94a3b8" font-size="22" font-weight="500">Heap Fetches: 0이 진짜 IOS다 — 두 단계 조건이 모두 충족돼야 한다</text>

  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#covGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="28" y="44" fill="#a5f3fc" font-size="18" font-weight="700" letter-spacing="1">COVERING</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">쿼리 컬럼이 인덱스에</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">INCLUDE 절로 leaf-only 저장</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">key 컬럼은 uniqueness, INCLUDE는 payload</text>
  </g>

  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="500" height="170" rx="16" fill="url(#visGrad)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="28" y="44" fill="#86efac" font-size="18" font-weight="700" letter-spacing="1">VISIBILITY</text>
    <text x="28" y="84" fill="#f8fafc" font-size="26" font-weight="700">VM이 all-visible로 표시</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">VACUUM이 갱신, 트랜잭션이 reset</text>
    <text x="28" y="144" fill="#cbd5e1" font-size="17">append-only + VACUUM이 IOS의 최적</text>
  </g>
</svg>
