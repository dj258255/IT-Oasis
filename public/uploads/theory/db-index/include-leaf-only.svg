<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrIL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#bgil)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">INCLUDE 절 — leaf tuple에만 저장, navigation node에는 안 감</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">key 컬럼은 검색 + uniqueness, INCLUDE는 payload만</text>

  <g transform="translate(60, 110)">
    <rect width="510" height="420" rx="14" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
    <rect x="0" y="0" width="510" height="44" rx="14" fill="#7f1d1d"/>
    <text x="255" y="29" fill="#fecaca" font-size="16" font-weight="700" text-anchor="middle">11 이전 — 모든 컬럼을 key로</text>

    <g transform="translate(70, 90)">
      <rect width="370" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="185" y="26" fill="#fda4af" font-size="13" text-anchor="middle">Root: id, name, email</text>
    </g>
    <g transform="translate(40, 170)">
      <rect width="180" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="90" y="26" fill="#fda4af" font-size="13" text-anchor="middle">Internal: id,name,email</text>
      <rect x="240" width="180" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="330" y="26" fill="#fda4af" font-size="13" text-anchor="middle">Internal: id,name,email</text>
    </g>
    <g transform="translate(40, 250)">
      <rect width="100" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="50" y="26" fill="#fda4af" font-size="11" text-anchor="middle">Leaf</text>
      <rect x="120" width="100" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="170" y="26" fill="#fda4af" font-size="11" text-anchor="middle">Leaf</text>
      <rect x="240" width="100" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="290" y="26" fill="#fda4af" font-size="11" text-anchor="middle">Leaf</text>
      <rect x="360" width="100" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="410" y="26" fill="#fda4af" font-size="11" text-anchor="middle">Leaf</text>
    </g>

    <g transform="translate(40, 330)">
      <rect width="430" height="74" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-dasharray="4 4"/>
      <text x="20" y="26" fill="#fda4af" font-size="13" font-weight="700">문제</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="12">- uniqueness가 (id,name,email) 조합에 적용</text>
      <text x="20" y="66" fill="#cbd5e1" font-size="12">- internal node도 모든 컬럼 → 인덱스 비대화</text>
    </g>
  </g>

  <g transform="translate(630, 110)">
    <rect width="510" height="420" rx="14" fill="#1e293b" stroke="#14532d" stroke-width="1.5"/>
    <rect x="0" y="0" width="510" height="44" rx="14" fill="#14532d"/>
    <text x="255" y="29" fill="#bbf7d0" font-size="16" font-weight="700" text-anchor="middle">11+ — INCLUDE (id) INCLUDE (name, email)</text>

    <g transform="translate(140, 90)">
      <rect width="220" height="40" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="110" y="26" fill="#bbf7d0" font-size="13" text-anchor="middle">Root: id</text>
    </g>
    <g transform="translate(40, 170)">
      <rect width="180" height="40" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="90" y="26" fill="#bbf7d0" font-size="13" text-anchor="middle">Internal: id</text>
      <rect x="240" width="180" height="40" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="330" y="26" fill="#bbf7d0" font-size="13" text-anchor="middle">Internal: id</text>
    </g>
    <g transform="translate(20, 250)">
      <rect width="115" height="60" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="57" y="22" fill="#bbf7d0" font-size="11" text-anchor="middle">Leaf</text>
      <text x="57" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">id + name</text>
      <text x="57" y="54" fill="#94a3b8" font-size="10" text-anchor="middle">+ email</text>
      <rect x="125" width="115" height="60" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="182" y="22" fill="#bbf7d0" font-size="11" text-anchor="middle">Leaf</text>
      <text x="182" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">id + name</text>
      <text x="182" y="54" fill="#94a3b8" font-size="10" text-anchor="middle">+ email</text>
      <rect x="245" width="115" height="60" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="302" y="22" fill="#bbf7d0" font-size="11" text-anchor="middle">Leaf</text>
      <text x="302" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">id + name</text>
      <text x="302" y="54" fill="#94a3b8" font-size="10" text-anchor="middle">+ email</text>
      <rect x="365" width="115" height="60" rx="6" fill="#0f172a" stroke="#22c55e"/>
      <text x="422" y="22" fill="#bbf7d0" font-size="11" text-anchor="middle">Leaf</text>
      <text x="422" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">id + name</text>
      <text x="422" y="54" fill="#94a3b8" font-size="10" text-anchor="middle">+ email</text>
    </g>

    <g transform="translate(40, 350)">
      <rect width="430" height="54" rx="10" fill="#0f172a" stroke="#14532d" stroke-dasharray="4 4"/>
      <text x="20" y="26" fill="#86efac" font-size="13" font-weight="700">효과</text>
      <text x="20" y="46" fill="#cbd5e1" font-size="12">uniqueness는 id에만 + navigation 작음 + IOS 가능</text>
    </g>
  </g>
</svg>
