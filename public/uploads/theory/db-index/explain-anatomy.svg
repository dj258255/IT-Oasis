<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="-apple-system, 'Pretendard', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrEA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="url(#bgea)"/>

  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">EXPLAIN 한 줄에 들어있는 4가지 정보</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">Seq Scan on users (cost=0.00..17.00 rows=1000 width=17)</text>

  <!-- The line -->
  <g transform="translate(80, 130)">
    <rect width="1040" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="40" y="50" font-family="Menlo, monospace" font-size="22" font-weight="700">
      <tspan fill="#facc15">Seq Scan on users</tspan>
      <tspan fill="#94a3b8">  (cost=</tspan>
      <tspan fill="#fb923c">0.00..17.00</tspan>
      <tspan fill="#94a3b8"> rows=</tspan>
      <tspan fill="#a5f3fc">1000</tspan>
      <tspan fill="#94a3b8"> width=</tspan>
      <tspan fill="#86efac">17</tspan>
      <tspan fill="#94a3b8">)</tspan>
    </text>
  </g>

  <!-- Boxes -->
  <g transform="translate(80, 280)">
    <rect width="240" height="200" rx="12" fill="#1e293b" stroke="#facc15"/>
    <text x="20" y="32" fill="#facc15" font-size="13" font-weight="700">1. Node Type</text>
    <text x="20" y="60" fill="#fde68a" font-family="Menlo, monospace" font-size="14">Seq Scan</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="12">옵티마이저가 선택한</text>
    <text x="20" y="110" fill="#cbd5e1" font-size="12">실행 전략</text>
    <text x="20" y="138" fill="#94a3b8" font-size="11">Index Scan / IOS /</text>
    <text x="20" y="156" fill="#94a3b8" font-size="11">Bitmap / Hash Join /</text>
    <text x="20" y="174" fill="#94a3b8" font-size="11">Sort 등</text>
  </g>

  <g transform="translate(340, 280)">
    <rect width="240" height="200" rx="12" fill="#1e293b" stroke="#fb923c"/>
    <text x="20" y="32" fill="#fb923c" font-size="13" font-weight="700">2. Cost (시작..총)</text>
    <text x="20" y="60" fill="#fdba74" font-family="Menlo, monospace" font-size="14">0.00..17.00</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="12">임의 단위. 밀리초 아님</text>
    <text x="20" y="110" fill="#cbd5e1" font-size="12">seq_page_cost=1.0 기준</text>
    <text x="20" y="138" fill="#94a3b8" font-size="11">상대 비교용 — 절대값에</text>
    <text x="20" y="156" fill="#94a3b8" font-size="11">의미 없음</text>
    <text x="20" y="174" fill="#94a3b8" font-size="11">LIMIT은 startup 결정적</text>
  </g>

  <g transform="translate(600, 280)">
    <rect width="240" height="200" rx="12" fill="#1e293b" stroke="#22d3ee"/>
    <text x="20" y="32" fill="#22d3ee" font-size="13" font-weight="700">3. Rows</text>
    <text x="20" y="60" fill="#a5f3fc" font-family="Menlo, monospace" font-size="14">1000</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="12">통계 기반 추정</text>
    <text x="20" y="110" fill="#cbd5e1" font-size="12">실제 행 수 아님</text>
    <text x="20" y="138" fill="#94a3b8" font-size="11">ANALYZE/autovacuum이</text>
    <text x="20" y="156" fill="#94a3b8" font-size="11">갱신, pg_statistic 저장</text>
    <text x="20" y="174" fill="#94a3b8" font-size="11">옵티마이저 결정의 기반</text>
  </g>

  <g transform="translate(860, 280)">
    <rect width="240" height="200" rx="12" fill="#1e293b" stroke="#22c55e"/>
    <text x="20" y="32" fill="#22c55e" font-size="13" font-weight="700">4. Width</text>
    <text x="20" y="60" fill="#86efac" font-family="Menlo, monospace" font-size="14">17 (bytes/row)</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="12">행당 평균 바이트</text>
    <text x="20" y="110" fill="#cbd5e1" font-size="12">페이지 IO 효율 지표</text>
    <text x="20" y="138" fill="#94a3b8" font-size="11">sort 메모리 / hash table</text>
    <text x="20" y="156" fill="#94a3b8" font-size="11">/ 네트워크에도 영향</text>
    <text x="20" y="174" fill="#94a3b8" font-size="11">크면 SELECT * 신호일 수</text>
  </g>

  <line x1="200" y1="220" x2="200" y2="278" stroke="#facc15" marker-end="url(#arrEA)"/>
  <line x1="500" y1="220" x2="460" y2="278" stroke="#fb923c" marker-end="url(#arrEA)"/>
  <line x1="780" y1="220" x2="720" y2="278" stroke="#22d3ee" marker-end="url(#arrEA)"/>
  <line x1="950" y1="220" x2="980" y2="278" stroke="#22c55e" marker-end="url(#arrEA)"/>
</svg>
