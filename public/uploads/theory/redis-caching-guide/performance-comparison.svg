<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-label="1000번 조회 성능 비교 - Caffeine 로컬 11ms vs Redis 510ms, 약 50배 차이">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .top-box { fill: rgba(100, 181, 246, 0.18); stroke: #64B5F6; stroke-width: 1.5; }
      .col-frame { fill: rgba(255, 238, 215, 0.06); stroke: rgba(255, 238, 215, 0.35); stroke-width: 1.25; }
      .step-box { fill: rgba(100, 181, 246, 0.16); stroke: #64B5F6; stroke-width: 1.25; }
      .result-good { fill: rgba(76, 175, 80, 0.25); stroke: #4CAF50; stroke-width: 1.75; }
      .result-bad { fill: rgba(255, 183, 77, 0.25); stroke: #FFB74D; stroke-width: 1.75; }
      .diff-box { fill: rgba(255, 183, 77, 0.2); stroke: #FFB74D; stroke-width: 1.5; }
      .col-label { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .lbl { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .val { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
    </style>
    <marker id="pc-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#888"/>
    </marker>
  </defs>
  <rect width="680" height="620" class="bg"/>

  <rect x="240" y="20" width="200" height="60" rx="8" class="top-box"/>
  <text x="340" y="48" text-anchor="middle" class="lbl">동일한 조회 1000번</text>
  <text x="340" y="68" text-anchor="middle" class="lbl">성능 비교</text>

  <path d="M 290 80 C 260 110, 200 120, 180 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#pc-arrow)"/>
  <path d="M 390 80 C 420 110, 480 120, 500 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#pc-arrow)"/>

  <!-- Left: Caffeine -->
  <rect x="40" y="100" width="280" height="410" rx="10" class="col-frame"/>
  <text x="180" y="130" text-anchor="middle" class="col-label">Caffeine 로컬</text>

  <rect x="70" y="148" width="220" height="70" rx="6" class="step-box"/>
  <text x="180" y="172" text-anchor="middle" class="lbl">첫 요청</text>
  <text x="180" y="194" text-anchor="middle" class="val">10ms (DB 조회)</text>
  <line x1="180" y1="220" x2="180" y2="240" stroke="#888" stroke-width="1.5" marker-end="url(#pc-arrow)"/>

  <rect x="70" y="248" width="220" height="90" rx="6" class="step-box"/>
  <text x="180" y="272" text-anchor="middle" class="lbl">캐시 히트 999번</text>
  <text x="180" y="296" text-anchor="middle" class="val">0.001ms × 999</text>
  <text x="180" y="318" text-anchor="middle" class="val">= 1ms</text>
  <line x1="180" y1="340" x2="180" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#pc-arrow)"/>

  <rect x="85" y="368" width="190" height="70" rx="6" class="result-good"/>
  <text x="180" y="394" text-anchor="middle" class="lbl">총 시간</text>
  <text x="180" y="418" text-anchor="middle" class="val">11ms</text>

  <!-- Right: Redis -->
  <rect x="360" y="100" width="280" height="410" rx="10" class="col-frame"/>
  <text x="500" y="130" text-anchor="middle" class="col-label">Redis</text>

  <rect x="390" y="148" width="220" height="70" rx="6" class="step-box"/>
  <text x="500" y="172" text-anchor="middle" class="lbl">첫 요청</text>
  <text x="500" y="194" text-anchor="middle" class="val">10ms (DB 조회)</text>
  <line x1="500" y1="220" x2="500" y2="240" stroke="#888" stroke-width="1.5" marker-end="url(#pc-arrow)"/>

  <rect x="390" y="248" width="220" height="90" rx="6" class="step-box"/>
  <text x="500" y="272" text-anchor="middle" class="lbl">캐시 히트 999번</text>
  <text x="500" y="296" text-anchor="middle" class="val">0.5ms × 999</text>
  <text x="500" y="318" text-anchor="middle" class="val">= 500ms</text>
  <line x1="500" y1="340" x2="500" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#pc-arrow)"/>

  <rect x="405" y="368" width="190" height="70" rx="6" class="result-bad"/>
  <text x="500" y="394" text-anchor="middle" class="lbl">총 시간</text>
  <text x="500" y="418" text-anchor="middle" class="val">510ms</text>

  <!-- Convergence to diff -->
  <path d="M 180 438 C 200 500, 280 540, 320 560" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#pc-arrow)"/>
  <path d="M 500 438 C 480 500, 400 540, 360 560" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#pc-arrow)"/>

  <rect x="230" y="560" width="220" height="50" rx="8" class="diff-box"/>
  <text x="340" y="580" text-anchor="middle" class="lbl">성능 차이</text>
  <text x="340" y="601" text-anchor="middle" class="val">약 50배</text>
</svg>
