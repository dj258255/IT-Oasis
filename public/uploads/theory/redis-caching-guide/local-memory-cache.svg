<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="로컬 메모리 캐시의 3가지 문제점: 서버별 캐시 불일치, 재시작 시 소실, 무한정 증가">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .server-label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .server-box { fill: rgba(100, 181, 246, 0.12); stroke: #64B5F6; stroke-width: 1.75; }
      .cache-box { fill: rgba(255, 183, 77, 0.15); stroke: #FFB74D; stroke-width: 1.25; }
      .cache-text { font: 500 12.5px "Consolas", "Menlo", monospace; fill: #e0e0e0; }
      .cache-title { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #FFB74D; }
      .problem-head { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #FF6B6B; }
      .problem-text { font: 500 13.5px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .bang { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #FF6B6B; }
    </style>
  </defs>
  <rect width="760" height="460" class="bg"/>

  <text x="380" y="40" text-anchor="middle" class="title">로컬 메모리 캐시의 한계</text>

  <!-- 3 server boxes with different caches -->
  <g>
    <!-- Server 1 -->
    <rect x="30" y="70" width="220" height="160" rx="10" class="server-box"/>
    <text x="140" y="98" text-anchor="middle" class="server-label">Server 1</text>
    <rect x="50" y="115" width="180" height="100" rx="6" class="cache-box"/>
    <text x="140" y="135" text-anchor="middle" class="cache-title">local cache</text>
    <text x="66" y="160" class="cache-text">user:1 → "Alice"</text>
    <text x="66" y="182" class="cache-text">cnt:A = 42</text>
    <text x="66" y="204" class="cache-text">cfg:v1</text>
  </g>
  <g>
    <!-- Server 2 -->
    <rect x="270" y="70" width="220" height="160" rx="10" class="server-box"/>
    <text x="380" y="98" text-anchor="middle" class="server-label">Server 2</text>
    <rect x="290" y="115" width="180" height="100" rx="6" class="cache-box"/>
    <text x="380" y="135" text-anchor="middle" class="cache-title">local cache</text>
    <text x="306" y="160" class="cache-text">user:1 → "Alan"</text>
    <text x="306" y="182" class="cache-text">cnt:A = 40</text>
    <text x="306" y="204" class="cache-text">cfg:v2</text>
  </g>
  <g>
    <!-- Server 3 -->
    <rect x="510" y="70" width="220" height="160" rx="10" class="server-box"/>
    <text x="620" y="98" text-anchor="middle" class="server-label">Server 3</text>
    <rect x="530" y="115" width="180" height="100" rx="6" class="cache-box"/>
    <text x="620" y="135" text-anchor="middle" class="cache-title">local cache</text>
    <text x="546" y="160" class="cache-text">user:1 → "Ava"</text>
    <text x="546" y="182" class="cache-text">cnt:A = 41</text>
    <text x="546" y="204" class="cache-text">cfg:v1</text>
  </g>

  <!-- Problem markers -->
  <text x="140" y="256" text-anchor="middle" class="bang">↓</text>
  <text x="380" y="256" text-anchor="middle" class="bang">↓</text>
  <text x="620" y="256" text-anchor="middle" class="bang">↓</text>

  <!-- Three problems -->
  <g>
    <rect x="30" y="275" width="700" height="55" rx="8" fill="rgba(255,107,107,0.08)" stroke="#FF6B6B" stroke-width="1.25"/>
    <text x="52" y="298" class="problem-head">문제 1</text>
    <text x="52" y="318" class="problem-text">서버마다 캐시가 달라서 <tspan fill="#FFB74D">데이터 불일치</tspan>가 발생해요 (동일 키에 서로 다른 값)</text>
  </g>
  <g>
    <rect x="30" y="340" width="700" height="55" rx="8" fill="rgba(255,107,107,0.08)" stroke="#FF6B6B" stroke-width="1.25"/>
    <text x="52" y="363" class="problem-head">문제 2</text>
    <text x="52" y="383" class="problem-text">서버를 재시작하면 <tspan fill="#FFB74D">캐시가 전부 날아가요</tspan> (JVM 프로세스 메모리이기 때문)</text>
  </g>
  <g>
    <rect x="30" y="405" width="700" height="43" rx="8" fill="rgba(255,107,107,0.08)" stroke="#FF6B6B" stroke-width="1.25"/>
    <text x="52" y="432" class="problem-head">문제 3</text>
    <text x="52" y="432" class="problem-text" dx="80">eviction 정책이 없으면 메모리가 <tspan fill="#FFB74D">무한정 증가</tspan>해서 OOM이 나요</text>
  </g>
</svg>
