<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" role="img" aria-label="서버 1대 환경 - Spring이 Caffeine 로컬 캐시와 통신, 로컬 캐시로 충분">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .label-box { fill: rgba(100, 181, 246, 0.18); stroke: #64B5F6; stroke-width: 1.5; }
      .server-frame { fill: rgba(76, 175, 80, 0.1); stroke: #4CAF50; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .app-box { fill: rgba(255, 183, 77, 0.18); stroke: #FFB74D; stroke-width: 1.5; }
      .cache-box { fill: rgba(76, 175, 80, 0.22); stroke: #4CAF50; stroke-width: 1.5; }
      .lbl { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #e0e0e0; }
      .sub { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #a8e6cf; }
    </style>
    <marker id="ssg-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#888"/>
    </marker>
  </defs>
  <rect width="540" height="280" class="bg"/>

  <rect x="180" y="20" width="180" height="40" rx="6" class="label-box"/>
  <text x="270" y="44" text-anchor="middle" class="lbl">서버 1대만 있으면</text>
  <line x1="270" y1="60" x2="270" y2="92" stroke="#888" stroke-width="1.5" marker-end="url(#ssg-arrow)"/>

  <rect x="30" y="100" width="480" height="150" rx="10" class="server-frame"/>
  <text x="270" y="125" text-anchor="middle" class="sub">Server</text>

  <rect x="70" y="160" width="140" height="56" rx="6" class="app-box"/>
  <text x="140" y="192" text-anchor="middle" class="lbl">Spring</text>

  <line x1="210" y1="188" x2="270" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#ssg-arrow)"/>

  <rect x="270" y="155" width="200" height="66" rx="6" class="cache-box"/>
  <text x="370" y="185" text-anchor="middle" class="lbl">Caffeine</text>
  <text x="370" y="207" text-anchor="middle" class="lbl">로컬 캐시면 충분</text>
</svg>
