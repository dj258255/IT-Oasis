<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="70" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle" letter-spacing="4">USER FEEDBACK</text>
  <text x="600" y="120" font-family="sans-serif" font-size="48" fill="#e2e8f0" text-anchor="middle" font-weight="700">24 Improvements</text>

  <!-- Category cards -->
  <!-- Bug Fixes -->
  <g transform="translate(80, 170)">
    <rect width="200" height="160" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="30" cy="30" r="16" fill="#ef4444" opacity="0.15"/>
    <text x="30" y="36" font-family="sans-serif" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700">7</text>
    <text x="56" y="36" font-family="sans-serif" font-size="14" fill="#ef4444" font-weight="600">Bug Fixes</text>
    <text x="20" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">Stale closure fix</text>
    <text x="20" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Checkbox double toggle</text>
    <text x="20" y="105" font-family="sans-serif" font-size="11" fill="#94a3b8">Cell deselection</text>
    <text x="20" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8">Keyboard navigation</text>
    <text x="20" y="145" font-family="sans-serif" font-size="11" fill="#64748b">+3 more</text>
  </g>

  <!-- Performance -->
  <g transform="translate(310, 170)">
    <rect width="200" height="160" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <circle cx="30" cy="30" r="16" fill="#22c55e" opacity="0.15"/>
    <text x="30" y="36" font-family="sans-serif" font-size="18" fill="#22c55e" text-anchor="middle" font-weight="700">3</text>
    <text x="56" y="36" font-family="sans-serif" font-size="14" fill="#22c55e" font-weight="600">Performance</text>
    <text x="20" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">rAF-based drag</text>
    <text x="20" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Direct DOM manipulation</text>
    <text x="20" y="105" font-family="sans-serif" font-size="11" fill="#94a3b8">Bounds caching</text>
    <rect x="20" y="125" width="160" height="20" rx="4" fill="#14532d"/>
    <text x="30" y="139" font-family="monospace" font-size="11" fill="#22c55e">45ms → 3ms (-93%)</text>
  </g>

  <!-- UI -->
  <g transform="translate(540, 170)">
    <rect width="200" height="160" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="30" cy="30" r="16" fill="#3b82f6" opacity="0.15"/>
    <text x="30" y="36" font-family="sans-serif" font-size="18" fill="#3b82f6" text-anchor="middle" font-weight="700">6</text>
    <text x="56" y="36" font-family="sans-serif" font-size="14" fill="#3b82f6" font-weight="600">UI</text>
    <text x="20" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">Font readability</text>
    <text x="20" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Selection contrast</text>
    <text x="20" y="105" font-family="sans-serif" font-size="11" fill="#94a3b8">Layout alignment</text>
    <text x="20" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8">Dark mode favicon</text>
    <text x="20" y="145" font-family="sans-serif" font-size="11" fill="#64748b">+2 more</text>
  </g>

  <!-- UX -->
  <g transform="translate(770, 170)">
    <rect width="200" height="160" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="30" cy="30" r="16" fill="#8b5cf6" opacity="0.15"/>
    <text x="30" y="36" font-family="sans-serif" font-size="18" fill="#8b5cf6" text-anchor="middle" font-weight="700">8</text>
    <text x="56" y="36" font-family="sans-serif" font-size="14" fill="#8b5cf6" font-weight="600">UX</text>
    <text x="20" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">ESC close unified</text>
    <text x="20" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Undo/Redo (50 steps)</text>
    <text x="20" y="105" font-family="sans-serif" font-size="11" fill="#94a3b8">Auto-save indicator</text>
    <text x="20" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8">Help panel linking</text>
    <text x="20" y="145" font-family="sans-serif" font-size="11" fill="#64748b">+4 more</text>
  </g>

  <!-- New Features -->
  <g transform="translate(1000, 170)">
    <rect width="120" height="160" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="30" cy="30" r="16" fill="#f59e0b" opacity="0.15"/>
    <text x="30" y="36" font-family="sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle" font-weight="700">6</text>
    <text x="56" y="36" font-family="sans-serif" font-size="12" fill="#f59e0b" font-weight="600">New</text>
    <text x="16" y="65" font-family="sans-serif" font-size="10" fill="#94a3b8">Resize</text>
    <text x="16" y="83" font-family="sans-serif" font-size="10" fill="#94a3b8">Drag delete</text>
    <text x="16" y="101" font-family="sans-serif" font-size="10" fill="#94a3b8">Formula HL</text>
    <text x="16" y="119" font-family="sans-serif" font-size="10" fill="#64748b">+3 more</text>
  </g>

  <!-- Highlight: Input loss bug -->
  <g transform="translate(80, 380)">
    <rect width="520" height="180" rx="12" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="24" y="30" font-family="sans-serif" font-size="14" fill="#ef4444" font-weight="600">Highlight: Input Value Loss Bug</text>

    <text x="24" y="58" font-family="monospace" font-size="12" fill="#64748b">// Before: stale closure</text>
    <text x="24" y="78" font-family="monospace" font-size="12" fill="#ef4444">saveCell(localValue);</text>
    <text x="260" y="78" font-family="monospace" font-size="11" fill="#475569">// old value</text>

    <line x1="24" y1="95" x2="496" y2="95" stroke="#334155" stroke-width="1"/>

    <text x="24" y="118" font-family="monospace" font-size="12" fill="#64748b">// After: useRef always latest</text>
    <text x="24" y="138" font-family="monospace" font-size="12" fill="#22c55e">saveCell(localValueRef.current);</text>
    <text x="340" y="138" font-family="monospace" font-size="11" fill="#475569">// latest</text>

    <rect x="24" y="152" width="180" height="20" rx="4" fill="#14532d"/>
    <text x="34" y="166" font-family="monospace" font-size="11" fill="#22c55e">5 components fixed</text>
  </g>

  <!-- Highlight: Dock animation -->
  <g transform="translate(630, 380)">
    <rect width="490" height="180" rx="12" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="24" y="30" font-family="sans-serif" font-size="14" fill="#8b5cf6" font-weight="600">Highlight: macOS Dock Animation</text>

    <!-- Dock items simulation -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="50" height="50" rx="10" fill="#374151" stroke="#475569" stroke-width="1"/>
      <rect x="65" y="-5" width="50" height="50" rx="10" fill="#374151" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
      <rect x="130" y="10" width="50" height="50" rx="10" fill="#374151" stroke="#475569" stroke-width="1"/>
      <rect x="195" y="10" width="50" height="50" rx="10" fill="#374151" stroke="#475569" stroke-width="1"/>
      <rect x="260" y="10" width="50" height="50" rx="10" fill="#374151" stroke="#475569" stroke-width="1"/>
      <rect x="325" y="10" width="50" height="50" rx="10" fill="#374151" stroke="#475569" stroke-width="1"/>
    </g>

    <text x="24" y="145" font-family="monospace" font-size="11" fill="#94a3b8">cubic-bezier(0.25, 0.46, 0.45, 0.94)</text>
    <text x="24" y="165" font-family="sans-serif" font-size="11" fill="#64748b">Smooth push-aside on drag reorder</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
