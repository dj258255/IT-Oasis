<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Cell input box -->
  <rect x="120" y="200" width="400" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="232" font-family="monospace" font-size="18" fill="#e2e8f0">= DAMAGE(100, 50)</text>
  <rect x="120" y="200" width="3" height="50" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Arrow -->
  <g transform="translate(560, 225)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 4"/>
    <polygon points="60,-6 72,0 60,6" fill="#3b82f6"/>
  </g>

  <!-- Formula bar -->
  <rect x="660" y="180" width="400" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="670" y="204" font-family="monospace" font-size="13" fill="#64748b">fx</text>
  <text x="700" y="204" font-family="monospace" font-size="13" fill="#e2e8f0">= DAMAGE(100, 50)</text>

  <!-- Sync label -->
  <rect x="660" y="230" width="160" height="30" rx="15" fill="url(#accent)" opacity="0.9"/>
  <text x="668" y="250" font-family="sans-serif" font-size="13" fill="white" font-weight="600">Instant Sync</text>

  <!-- Debounce crossed out -->
  <g transform="translate(840, 230)">
    <rect width="130" height="30" rx="15" fill="#374151" opacity="0.7"/>
    <text x="12" y="20" font-family="sans-serif" font-size="13" fill="#6b7280">debounce 150ms</text>
    <line x1="8" y1="15" x2="122" y2="15" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Bottom comparison -->
  <g transform="translate(120, 340)">
    <!-- debounce -->
    <rect width="280" height="110" rx="10" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#6b7280" font-weight="600">1st: debounce</text>
    <rect x="20" y="45" width="240" height="6" rx="3" fill="#374151"/>
    <rect x="20" y="45" width="80" height="6" rx="3" fill="#ef4444" opacity="0.7"/>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#ef4444">150ms delay</text>
    <text x="20" y="98" font-family="sans-serif" font-size="11" fill="#64748b">UX degradation</text>
  </g>

  <g transform="translate(440, 340)">
    <!-- rafThrottle -->
    <rect width="280" height="110" rx="10" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#6b7280" font-weight="600">2nd: rafThrottle</text>
    <rect x="20" y="45" width="240" height="6" rx="3" fill="#374151"/>
    <rect x="20" y="45" width="180" height="6" rx="3" fill="#f59e0b" opacity="0.7"/>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#f59e0b">16ms (60fps)</text>
    <text x="20" y="98" font-family="sans-serif" font-size="11" fill="#64748b">Per-frame delay</text>
  </g>

  <g transform="translate(760, 340)">
    <!-- Instant -->
    <rect width="320" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#3b82f6" font-weight="600">3rd: Instant Sync</text>
    <rect x="20" y="45" width="280" height="6" rx="3" fill="#374151"/>
    <rect x="20" y="45" width="280" height="6" rx="3" fill="#22c55e" opacity="0.7"/>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#22c55e">0ms - immediate</text>
    <text x="20" y="98" font-family="sans-serif" font-size="11" fill="#94a3b8">Open-source pattern</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
