  <text x="868" y="227" font-size="11.5" fill="#b91c1c">"안내드리겠습니다"로 96% 통과</text>

  <rect x="852" y="246" width="306" height="52" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="868" y="267" font-size="12.5" font-weight="700" fill="#1e293b">② 너무 빡빡했다</text>
  <text x="868" y="287" font-size="11.5" fill="#b91c1c">맞는 답을 오답 처리</text>

  <rect x="852" y="306" width="306" height="52" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="868" y="327" font-size="12.5" font-weight="700" fill="#1e293b">③ 통과했는데 틀렸다</text>
  <text x="868" y="347" font-size="11.5" fill="#b91c1c">근거 없이 "돈은 멀쩡"</text>

  <rect x="852" y="366" width="306" height="52" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="868" y="387" font-size="12.5" font-weight="700" fill="#1e293b">④ 심판이 오탐</text>
