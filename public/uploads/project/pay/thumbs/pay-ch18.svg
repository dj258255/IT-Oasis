  <line x1="852" y1="436" x2="1158" y2="436" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="868" y="468" font-size="13" font-weight="700" fill="#64748b">근거 없는 단정</text>
  <text x="1142" y="468" text-anchor="end" font-size="20" font-weight="900" fill="#1e293b">80% → <tspan fill="#4a8db8">0%</tspan></text>
  <text x="868" y="500" font-size="13" font-weight="700" fill="#64748b">루브릭</text>
  <text x="1142" y="500" text-anchor="end" font-size="20" font-weight="900" fill="#1e293b">4.1 → <tspan fill="#4a8db8">6.0</tspan></text>

  <text x="72" y="120" font-size="19" font-weight="700" fill="#4a8db8" letter-spacing="0.06em">결제 시스템 만들기 · pay</text>
  <text x="72" y="205" font-size="60" font-weight="900" fill="#4a8db8" opacity="0.92">11</text>
  <text x="72" y="300" font-size="48" font-weight="800" fill="#1e293b" letter-spacing="-0.03em">측정을 만들었더니</text><text x="72" y="362" font-size="48" font-weight="800" fill="#1e293b" letter-spacing="-0.03em">내 개선이 가짜였다</text>
  <text x="72" y="446" font-size="19" fill="#64748b">블라인드 리뷰 · 루브릭 · 다른 계열 심판</text>
  <text x="72" y="566" font-size="16" fill="#94a3b8">Spring Modulith · 모듈 경계 · 실패 설계와 정합성 학습기</text>
