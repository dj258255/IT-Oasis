<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#f8fafb"/>
  <rect width="1200" height="8" fill="#4a8db8"/>
  <rect x="820" y="120" width="370" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="1005" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="0.04em">검사가 나를 속인 횟수</text>

  <rect x="852" y="186" width="306" height="52" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
