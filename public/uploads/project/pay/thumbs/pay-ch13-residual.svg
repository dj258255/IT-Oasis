  <text x="72" y="446" font-size="19" fill="#64748b">PG엔 있는데 우리엔 없는 건을 잡아낸다</text>
  <text x="72" y="566" font-size="16" fill="#94a3b8">selective prediction · 가드 6종 · 실패 설계와 정합성 학습기</text>
