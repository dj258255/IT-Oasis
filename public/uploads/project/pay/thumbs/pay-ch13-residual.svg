<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#f8fafb"/>
  <rect width="1200" height="8" fill="#4a8db8"/>
  <rect x="820" y="120" width="370" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="1005" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="0.04em">유형별로 가르니 달랐다</text>

  <rect x="852" y="184" width="306" height="58" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="2.5"/>
  <text x="868" y="207" font-size="12.5" font-weight="700" fill="#1e293b">PG엔 있는데 우리 장부엔 없다</text>
  <text x="868" y="230" font-size="11.5" fill="#94a3b8">세 모델 모두 60건 중 60건</text>

  <text x="868" y="272" font-size="12" fill="#64748b">부분취소 미반영</text>
  <text x="1142" y="272" text-anchor="end" font-size="12.5" font-weight="800" fill="#94a3b8">0%</text>
  <text x="868" y="300" font-size="12" fill="#64748b">같은 거래가 여러 행</text>
  <text x="1142" y="300" text-anchor="end" font-size="12.5" font-weight="800" fill="#94a3b8">0~30%</text>
  <text x="868" y="328" font-size="12" fill="#64748b">기권해야 하는 건</text>
  <text x="1142" y="328" text-anchor="end" font-size="12.5" font-weight="800" fill="#94a3b8">0~50%</text>
  <text x="868" y="356" font-size="12" fill="#64748b">PG엔 있고 우리엔 없음</text>
  <text x="1142" y="356" text-anchor="end" font-size="12.5" font-weight="800" fill="#94a3b8">100%</text>

  <line x1="852" y1="392" x2="1158" y2="392" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="868" y="422" font-size="12.5" font-weight="700" fill="#64748b">일곱 유형을 다 맡기면</text>
  <text x="1142" y="422" text-anchor="end" font-size="17" font-weight="900" fill="#94a3b8">25~40%</text>
  <text x="868" y="462" font-size="12.5" font-weight="700" fill="#64748b">한 유형만 켜면</text>
  <text x="1142" y="462" text-anchor="end" font-size="17" font-weight="900" fill="#4a8db8">91~100%</text>
  <text x="868" y="494" font-size="11.5" fill="#94a3b8">엔진이 만든 272건에서 실측</text>

  <text x="72" y="120" font-size="19" font-weight="700" fill="#4a8db8" letter-spacing="0.06em">결제 시스템 만들기 · pay</text>
  <text x="72" y="205" font-size="60" font-weight="900" fill="#4a8db8" opacity="0.92">13</text>
  <text x="72" y="300" font-size="50" font-weight="800" fill="#1e293b" letter-spacing="-0.03em">대사 AI 자동화:</text>
