<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#f8fafb"/>
  <rect width="1200" height="8" fill="#4a8db8"/>
  <rect x="820" y="120" width="370" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1005" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="0.04em">같은 비용, 반대 방향</text>

  <text x="868" y="200" font-size="12.5" font-weight="700" fill="#64748b">요청마다 하던 BCrypt</text>
  <rect x="852" y="210" width="306" height="44" rx="9" fill="#4a8db810" stroke="#4a8db8" stroke-width="2.5"/>
  <text x="868" y="238" font-size="13" font-weight="700" fill="#1e293b">JWT로 걷어냈다</text>
  <text x="1142" y="238" text-anchor="end" font-size="15" font-weight="900" fill="#4a8db8">568 → 37ms</text>

  <text x="868" y="290" font-size="12.5" font-weight="700" fill="#64748b">로그인 1회의 해싱</text>
  <rect x="852" y="300" width="306" height="44" rx="9" fill="#f8fafb" stroke="#cbd5e1" stroke-width="2"/>
  <text x="868" y="328" font-size="13" font-weight="700" fill="#1e293b">Argon2id로 강화했다</text>
  <text x="1142" y="328" text-anchor="end" font-size="15" font-weight="900" fill="#64748b">87 → 32ms</text>

  <line x1="852" y1="372" x2="1158" y2="372" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="868" y="400" font-size="12.5" font-weight="700" fill="#64748b">그런데 메모리가</text>
  <text x="1142" y="400" text-anchor="end" font-size="17" font-weight="900" fill="#b91c1c">4KB → 19MiB</text>
  <text x="868" y="430" font-size="12.5" font-weight="700" fill="#64748b">해시 1건당이라 동시 100</text>
  <text x="1142" y="430" text-anchor="end" font-size="17" font-weight="900" fill="#b91c1c">2GB</text>
  <text x="868" y="462" font-size="11.5" fill="#94a3b8">강화가 로그인 경로의 DoS 표면을 키웠다</text>
  <text x="868" y="494" font-size="12.5" font-weight="700" fill="#64748b">남은 레거시 해시</text>
  <text x="1142" y="494" text-anchor="end" font-size="17" font-weight="900" fill="#4a8db8">지표로 판정</text>

  <text x="72" y="120" font-size="19" font-weight="700" fill="#4a8db8" letter-spacing="0.06em">결제 시스템 만들기 · pay</text>
  <text x="72" y="205" font-size="60" font-weight="900" fill="#4a8db8" opacity="0.92">7</text>
  <text x="72" y="300" font-size="48" font-weight="800" fill="#1e293b" letter-spacing="-0.03em">인증 비용:</text><text x="72" y="362" font-size="48" font-weight="800" fill="#1e293b" letter-spacing="-0.03em">걷어낸 것과 남긴 것</text>
  <text x="72" y="446" font-size="19" fill="#64748b">성능에선 제거 대상, 보안에선 유지 대상</text>
  <text x="72" y="566" font-size="16" fill="#94a3b8">Spring Modulith · 모듈 경계 · 실패 설계와 정합성 학습기</text>
</svg>
