<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a8db8"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e67e22"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#27ae60"/></marker>
  </defs>

  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">심판 실험 — 순서를 바꿔 두 번 묻고, 뒤집히면 동점</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">생성 qwen3:8b · 심판 llama3.1:8b(계열 다름) · A/B 순서를 바꿔 2회 질의</text>

  <!-- 1. 후보 둘 -->
  <rect x="40" y="150" width="200" height="150" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#sh)"/>
  <rect x="40" y="150" width="200" height="4" rx="10" fill="#4a8db8"/>
  <text x="140" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">같은 사실, 후보 둘</text>
  <text x="140" y="220" text-anchor="middle" font-size="9.5" fill="#64748b">템플릿 문단 (규칙)</text>
  <text x="140" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">모델 문단 (qwen3:8b 생성)</text>
  <text x="140" y="266" text-anchor="middle" font-size="9" fill="#94a3b8">운영자용 요약</text>

  <!-- 2. 심판 -->
  <rect x="280" y="150" width="200" height="150" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="150" width="200" height="4" rx="10" fill="#4a8db8"/>
  <text x="380" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">심판 llama3.1:8b</text>
  <text x="380" y="220" text-anchor="middle" font-size="9.5" fill="#64748b">생성과 계열이 다른 모델</text>
  <text x="380" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">요약의 질을 고르게 함</text>
  <text x="380" y="266" text-anchor="middle" font-size="9" fill="#94a3b8">두 문단을 가린 채 비교</text>

  <!-- 3. 순서 바꿔 2회 질의 -->
  <rect x="520" y="150" width="200" height="150" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#sh)"/>
  <rect x="520" y="150" width="200" height="4" rx="10" fill="#e67e22"/>
  <text x="620" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">A/B 순서 바꿔 2회</text>
  <text x="620" y="220" text-anchor="middle" font-size="9.5" fill="#64748b">1회차  A=템플릿 · B=모델</text>
  <text x="620" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">2회차  A=모델 · B=템플릿</text>
  <text x="620" y="266" text-anchor="middle" font-size="9" fill="#94a3b8">자리만 뒤집음</text>

  <!-- 4. 동점 처리 -->
  <rect x="760" y="150" width="200" height="150" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#sh)"/>
  <rect x="760" y="150" width="200" height="4" rx="10" fill="#27ae60"/>
  <text x="860" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">뒤집히면 동점</text>
  <text x="860" y="220" text-anchor="middle" font-size="9.5" fill="#64748b">두 회차가 다른 쪽 → 동점</text>
  <text x="860" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">같은 쪽이면 그쪽 승</text>
  <text x="860" y="266" text-anchor="middle" font-size="9" fill="#94a3b8">동점으로 셈</text>

  <!-- 5. 결과 -->
  <rect x="1000" y="150" width="160" height="150" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2" filter="url(#sh)"/>
  <rect x="1000" y="150" width="160" height="4" rx="10" fill="#e74c3c"/>
  <text x="1080" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e74c3c">결과 — 전부 뒤집힘</text>
  <text x="1080" y="220" text-anchor="middle" font-size="9.5" fill="#64748b">템플릿 0 · 모델 0</text>
  <text x="1080" y="238" text-anchor="middle" font-size="9.5" fill="#64748b">동점 8</text>
  <text x="1080" y="256" text-anchor="middle" font-size="9" fill="#94a3b8">(순서 뒤집힘 8)</text>

  <!-- Arrows -->
  <line x1="240" y1="225" x2="276" y2="225" stroke="#4a8db8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="480" y1="225" x2="516" y2="225" stroke="#4a8db8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="720" y1="225" x2="756" y2="225" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arO)"/>
  <line x1="960" y1="225" x2="996" y2="225" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arG)"/>

  <!-- Note -->
  <rect x="40" y="360" width="1120" height="110" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="600" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5f8a">심판이 고른 것은 요약의 질이 아니라 앞에 놓인 쪽이었습니다 — 위치 편향</text>
  <text x="600" y="416" text-anchor="middle" font-size="10.5" fill="#334155">문헌의 위치 편향은 순서만 바꿔도 최대 30%가 반전 · 평균 order-flip 0.236 — 우리는 100%(8건)</text>
  <text x="600" y="440" text-anchor="middle" font-size="10.5" fill="#334155">프롬프트에 A/B 자리 표시가 남아 있어 내용보다 자리를 먼저 읽었을 가능성이 큽니다(추정)</text>
</svg>
