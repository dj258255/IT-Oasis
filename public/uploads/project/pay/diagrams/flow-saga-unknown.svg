<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AB"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F04452"/>
    </marker>
  </defs>
  <rect width="1400" height="640" fill="#000000"/>
  <text x="56" y="74" font-size="44" font-weight="800" fill="#FFFFFF">타임아웃은 성공도 실패도 아니다</text>
  <text x="56" y="116" font-size="24" fill="#8B95A1">답이 없다고 실패로 단정하지 않는다. 카드사 호출은 승인도 취소도 트랜잭션 밖에서 한다</text>

  <!-- 3단계 -->
  <g text-anchor="middle">
    <rect x="60" y="166" width="360" height="150" rx="18" fill="#F2F4F6"/>
    <text x="240" y="208" font-size="26" font-weight="700" fill="#191F28">① 자리 잡기 (DB)</text>
    <text x="240" y="246" font-size="23" fill="#4E5968">재고를 조건부로 깎는다</text>
    <text x="240" y="276" font-size="23" fill="#4E5968">주문을 결제 중으로</text>
    <text x="240" y="306" font-size="23" fill="#4E5968">내가 처리한다고 표시</text>

    <rect x="520" y="166" width="360" height="150" rx="18" fill="#F2F4F6"/>
    <text x="700" y="208" font-size="26" font-weight="700" fill="#191F28">② 카드사 승인 (DB 밖)</text>
    <text x="700" y="246" font-size="23" fill="#4E5968">DB 연결을 놓고 부른다</text>
    <text x="700" y="276" font-size="23" fill="#4E5968">장애가 이어지면 안 부른다</text>
    <text x="700" y="306" font-size="23" fill="#4E5968">승인 · 거절 · 타임아웃</text>

    <rect x="980" y="166" width="360" height="150" rx="18" fill="#F2F4F6"/>
    <text x="1160" y="208" font-size="26" font-weight="700" fill="#191F28">③ 확정 또는 되돌리기</text>
    <text x="1160" y="246" font-size="23" fill="#4E5968">성공: 확정하고 소식 발행</text>
    <text x="1160" y="276" font-size="23" fill="#4E5968">재고 부족: 승인을 되돌림</text>
    <text x="1160" y="306" font-size="23" fill="#4E5968">장부·정산은 소식을 받는다</text>
  </g>
  <line x1="420" y1="240" x2="514" y2="240" stroke="#9CA3AB" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="880" y1="240" x2="974" y2="240" stroke="#9CA3AB" stroke-width="2.5" marker-end="url(#aw)"/>

  <!-- 타임아웃 분기 -->
  <line x1="700" y1="316" x2="700" y2="384" stroke="#F04452" stroke-width="2.5" marker-end="url(#ar2)" stroke-dasharray="6 5"/>
  <text x="722" y="358" font-size="24" fill="#F04452" font-weight="700">타임아웃: 성공인지 실패인지 모른다</text>

  <g text-anchor="middle">
    <rect x="520" y="390" width="360" height="126" rx="18" fill="#15181E" stroke="#2A2F38"/>
    <text x="700" y="432" font-size="26" font-weight="700" fill="#F04452">"모른다"로 남긴다</text>
    <text x="700" y="468" font-size="23" fill="#C4C9D0">추측으로 처리하지 않는다</text>
    <text x="700" y="498" font-size="21" fill="#8B95A1">상태로 남기는 것이 핵심</text>
  </g>
  <line x1="880" y1="450" x2="974" y2="450" stroke="#9CA3AB" stroke-width="2.5" marker-end="url(#aw)"/>
  <g text-anchor="middle">
    <rect x="980" y="390" width="360" height="126" rx="18" fill="#F2F4F6"/>
    <text x="1160" y="432" font-size="26" font-weight="700" fill="#191F28">복구가 다시 물어 확정</text>
    <text x="1160" y="468" font-size="23" fill="#4E5968">승인됐으면 완결, 아니면 취소</text>
    <text x="1160" y="498" font-size="21" fill="#8B95A1">멈춘 결제도 같은 작업이 끝낸다</text>
  </g>

  <text x="700" y="580" font-size="24" fill="#8B95A1" text-anchor="middle">실측: DB에 5초 지연 주입. 절반만 저장되는 일 없이 끝났고, 같은 요청을 다시 보내도 이중 결제 0건</text>
</svg>
