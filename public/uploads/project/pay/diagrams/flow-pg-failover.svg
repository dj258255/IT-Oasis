<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="490" viewBox="0 0 1400 490" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AB"/></marker>
    <marker id="for" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F04452"/></marker>
  </defs>
  <rect width="1400" height="490" fill="#000000"/>
  <text x="56" y="72" font-size="46" font-weight="800" fill="#FFFFFF">장애라고 다 넘기면 안 된다</text>
  <text x="56" y="106" font-size="28.7" fill="#8B95A1">PG가 응답했는가, 요청을 받기라도 했는가</text>

  <g text-anchor="middle">
    <rect x="56" y="160" width="220" height="80" rx="16" fill="#F2F4F6"/>
    <text x="166" y="194" font-size="26.91" font-weight="700" fill="#191F28">주 PG에 승인 요청</text>
    <text x="166" y="218" font-size="21.53" fill="#4E5968">가중치 순으로 시도</text>
  </g>
  <line x1="276" y1="200" x2="330" y2="200" stroke="#9CA3AB" stroke-width="2" marker-end="url(#fo)"/>

  <rect x="336" y="140" width="470" height="130" rx="16" fill="#15181E" stroke="#2A2F38"/>
  <text x="571" y="174" font-size="26.01" font-weight="700" fill="#FFFFFF" text-anchor="middle">PG가 응답했다</text>
  <g text-anchor="middle" font-size="22.43" fill="#191F28">
    <rect x="356" y="190" width="136" height="58" rx="12" fill="#F2F4F6"/><text x="424" y="216">승인</text><text x="424" y="236" font-size="19.73" fill="#4E5968">그대로 확정</text>
    <rect x="502" y="190" width="136" height="58" rx="12" fill="#F2F4F6"/><text x="570" y="216">거절</text><text x="570" y="236" font-size="19.73" fill="#4E5968">다른 PG도 거절</text>
    <rect x="648" y="190" width="138" height="58" rx="12" fill="#FDEBEC"/><text x="717" y="216" fill="#C0392B">타임아웃</text><text x="717" y="236" font-size="19.73" fill="#C0392B">미확정</text>
  </g>

  <rect x="836" y="140" width="230" height="130" rx="16" fill="#15181E" stroke="#2A2F38"/>
  <text x="951" y="174" font-size="26.01" font-weight="700" fill="#FFFFFF" text-anchor="middle">요청이 닿지 못했다</text>
  <g text-anchor="middle" font-size="21.53" fill="#4E5968">
    <rect x="856" y="190" width="190" height="26" rx="8" fill="#F2F4F6"/><text x="951" y="208">연결 실패</text>
    <rect x="856" y="222" width="190" height="26" rx="8" fill="#F2F4F6"/><text x="951" y="240">서킷 오픈</text>
  </g>

  <line x1="571" y1="270" x2="571" y2="322" stroke="#F04452" stroke-width="2" marker-end="url(#for)" stroke-dasharray="6 5"/>
  <line x1="951" y1="270" x2="1130" y2="322" stroke="#9CA3AB" stroke-width="2" marker-end="url(#fo)"/>

  <g text-anchor="middle">
    <rect x="336" y="330" width="470" height="76" rx="16" fill="#FDEBEC"/>
    <text x="571" y="360" font-size="26.91" font-weight="700" fill="#C0392B">넘기지 않는다</text>
    <text x="571" y="384" font-size="22.43" fill="#8B1F1F">이미 처리했을 수 있다. 넘기면 두 번 긁힌다</text>

    <rect x="1000" y="330" width="344" height="76" rx="16" fill="#F2F4F6"/>
    <text x="1172" y="360" font-size="26.91" font-weight="700" fill="#191F28">다음 PG로 넘긴다</text>
    <text x="1172" y="384" font-size="22.43" fill="#4E5968">요청 자체가 안 갔으니 중복 위험이 없다</text>
  </g>

  <text x="700" y="458" font-size="25.12" fill="#8B95A1" text-anchor="middle">예외라고 다 "요청 미도달"이 아니다 — 넘김은 전용 신호로만 판정 · 테스트 7종</text>
</svg>
