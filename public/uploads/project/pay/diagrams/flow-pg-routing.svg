<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <filter id="shSm" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a8db8"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#27ae60"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e67e22"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e74c3c"/></marker>
    <marker id="arGr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">멀티 PG 라우팅 — 요청이 미도달일 때만 넘긴다</text>
  <text x="600" y="67" text-anchor="middle" font-size="11.5" fill="#94a3b8">ResilientPgClient가 감싸는 대상(pgDelegate) 자리에 라우터를 넣고, @Primary는 하나로 뒀다</text>

  <!-- 왼쪽: 빈 계층 -->
  <rect x="40" y="104" width="570" height="496" rx="12" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="130" font-size="11" font-weight="700" fill="#64748b">빈 계층 — 하나의 PgClient 뒤에서 갈라진다</text>

  <rect x="110" y="150" width="430" height="72" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#sh)"/>
  <rect x="110" y="150" width="430" height="4" rx="10" fill="#27ae60"/>
  <text x="325" y="182" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">PaymentService</text>
  <text x="325" y="204" text-anchor="middle" font-size="9.5" fill="#64748b">payment 모듈 — 승인·취소·조회</text>

  <line x1="325" y1="222" x2="325" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arGr)"/>
  <text x="337" y="240" font-size="8.5" fill="#94a3b8">@Primary PgClient</text>

  <rect x="110" y="248" width="430" height="90" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#sh)"/>
  <rect x="110" y="248" width="430" height="4" rx="10" fill="#e67e22"/>
  <rect x="464" y="258" width="60" height="18" rx="9" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="494" y="271" text-anchor="middle" font-size="9" font-weight="700" fill="#1e5f8a">@Primary</text>
  <text x="325" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">ResilientPgClient</text>
  <text x="325" y="314" text-anchor="middle" font-size="9.5" fill="#64748b">서킷브레이커 · OPEN이면 호출 없이 폴백</text>
  <text x="325" y="330" text-anchor="middle" font-size="9.5" fill="#64748b">승인은 재시도 안 켬 — 실패·서킷오픈은 UNKNOWN</text>

  <line x1="325" y1="338" x2="325" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arGr)"/>
  <text x="337" y="353" font-size="8.5" fill="#94a3b8">pgDelegate</text>

  <rect x="110" y="360" width="430" height="84" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#sh)"/>
  <rect x="110" y="360" width="430" height="4" rx="10" fill="#4a8db8"/>
  <text x="325" y="388" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">RoutingPgClient</text>
  <text x="325" y="410" text-anchor="middle" font-size="9.5" fill="#64748b">가중치 순 시도 — TOSS(10) → NICE(5)</text>
  <text x="325" y="428" text-anchor="middle" font-size="9" fill="#94a3b8">PgRoute.of("TOSS", tossAdapter, 10) · PgRoute.of("NICE", niceAdapter, 5)</text>

  <line x1="325" y1="444" x2="235" y2="468" stroke="#4a8db8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="325" y1="444" x2="415" y2="468" stroke="#4a8db8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="470" width="170" height="70" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="150" y="470" width="170" height="4" rx="10" fill="#64748b"/>
  <text x="235" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">TOSS 어댑터</text>
  <text x="235" y="522" text-anchor="middle" font-size="9.5" fill="#64748b">가중치 10</text>

  <rect x="330" y="470" width="170" height="70" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="330" y="470" width="170" height="4" rx="10" fill="#64748b"/>
  <text x="415" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">NICE 어댑터</text>
  <text x="415" y="522" text-anchor="middle" font-size="9.5" fill="#64748b">가중치 5</text>

  <rect x="110" y="552" width="430" height="34" rx="8" fill="#fef7ec" stroke="#e67e22" stroke-width="1"/>
  <text x="325" y="574" text-anchor="middle" font-size="9.5" fill="#b45309">모든 PG가 안 되면 UNKNOWN으로 돌려 복구 배치에 맡긴다</text>

  <!-- 오른쪽: failover 판정 -->
  <rect x="650" y="104" width="510" height="496" rx="12" fill="#fef7ec" stroke="#f1d7ab" stroke-width="1"/>
  <text x="670" y="130" font-size="11" font-weight="700" fill="#b45309">failover 판정 — 넘기지 않을 때를 정한다</text>

  <rect x="670" y="148" width="470" height="118" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="670" y="148" width="470" height="4" rx="10" fill="#27ae60"/>
  <text x="692" y="178" font-size="11.5" font-weight="700" fill="#1e293b">SUCCESS / FAILED (카드 거절)</text>
  <line x1="692" y1="190" x2="1118" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <text x="692" y="218" font-size="13.5" font-weight="700" fill="#166534">안 넘김</text>
  <text x="692" y="242" font-size="9.5" fill="#64748b">됐거나, 다른 PG로 가도 똑같이 거절</text>
  <text x="692" y="258" font-size="9.5" fill="#94a3b8">잔액 부족은 어디든 부족</text>

  <rect x="670" y="282" width="470" height="118" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="670" y="282" width="470" height="4" rx="10" fill="#e74c3c"/>
  <text x="692" y="312" font-size="11.5" font-weight="700" fill="#1e293b">TIMEOUT(미확정) / 그 밖의 예외</text>
  <line x1="692" y1="324" x2="1118" y2="324" stroke="#e2e8f0" stroke-width="1"/>
  <text x="692" y="352" font-size="13.5" font-weight="700" fill="#b91c1c">절대 안 넘김</text>
  <text x="692" y="376" font-size="9.5" fill="#64748b">원 PG에서 이미 처리됐을 수 있다</text>
  <text x="692" y="392" font-size="9.5" fill="#b91c1c">넘기면 이중결제</text>

  <rect x="670" y="416" width="470" height="118" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="670" y="416" width="470" height="4" rx="10" fill="#4a8db8"/>
  <text x="692" y="446" font-size="11.5" font-weight="700" fill="#1e293b">요청 미도달 (연결 실패 · 서킷 오픈)</text>
  <line x1="692" y1="458" x2="1118" y2="458" stroke="#e2e8f0" stroke-width="1"/>
  <text x="692" y="486" font-size="13.5" font-weight="700" fill="#1e5f8a">다음 PG로 넘김</text>
  <text x="692" y="510" font-size="9.5" fill="#64748b">PG가 요청을 아예 못 받았다</text>
  <text x="692" y="526" font-size="9.5" fill="#94a3b8">가중치 순서로 다음 PG를 시도</text>

  <text x="670" y="568" font-size="10.5" font-weight="700" fill="#b45309">기준은 「PG가 응답했는가」가 아니라 「요청이 닿았는가」</text>
</svg>
