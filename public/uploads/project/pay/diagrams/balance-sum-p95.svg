<svg viewBox="0 0 1200 720" width="1200" height="720" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">커버링 인덱스를 붙여도 잔액 조회는 O(N)</text>
  <text x="600" y="62" text-anchor="middle" font-size="11" fill="#94a3b8">계정별 전체 조회 p95 · 로컬 실 MySQL 8.4 · 두 축 모두 로그 눈금 · 잰 구간은 24만·162만·1,263만 셋뿐이라 그 사이는 선형으로 가정</text>

  <!-- 범례 -->
  <line x1="48" y1="96" x2="88" y2="96" stroke="#4a8db8" stroke-width="2.5"/>
  <circle cx="68" cy="96" r="4.5" fill="#4a8db8"/>
  <text x="98" y="100" font-size="12" fill="#334155">인덱스 있음</text>

  <circle cx="212" cy="96" r="5.5" fill="#fff" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="226" y="100" font-size="12" fill="#334155">인덱스 없음 (1,263만 행에서만 측정)</text>

  <line x1="524" y1="96" x2="564" y2="96" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="572" y="100" font-size="12" fill="#334155">임계선 200ms</text>

  <!-- 격자 -->
  <line x1="160" y1="150" x2="1120" y2="150" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="312" x2="1120" y2="312" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="473" x2="1120" y2="473" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="199" y1="150" x2="199" y2="570" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="596" y1="150" x2="596" y2="570" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="1025" y1="150" x2="1025" y2="570" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 축 -->
  <line x1="160" y1="570" x2="1120" y2="570" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="150" x2="160" y2="570" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="150" y="154" text-anchor="end" font-size="11" fill="#64748b">10,000ms</text>
  <text x="150" y="316" text-anchor="end" font-size="11" fill="#64748b">1,000ms</text>
  <text x="150" y="477" text-anchor="end" font-size="11" fill="#64748b">100ms</text>

  <text x="199" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">24만</text>
  <text x="199" y="598" text-anchor="middle" font-size="10" fill="#94a3b8">240,692</text>
  <text x="390" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">약 60만</text>
  <text x="596" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">162만</text>
  <text x="596" y="598" text-anchor="middle" font-size="10" fill="#94a3b8">1,616,948</text>
  <text x="1025" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">1,263만</text>
  <text x="1025" y="598" text-anchor="middle" font-size="10" fill="#94a3b8">12,626,996</text>

  <text x="1112" y="558" text-anchor="end" font-size="11.5" fill="#64748b">원장 행수 (로그 눈금) →</text>

  <!-- 임계선 -->
  <line x1="160" y1="424" x2="1120" y2="424" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="168" y="417" font-size="12" font-weight="700" fill="#e74c3c">200ms</text>
  <line x1="390" y1="424" x2="390" y2="570" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="390" cy="424" r="4.5" fill="#e74c3c"/>

  <!-- 인덱스 있음 곡선 -->
  <polyline points="199,487 596,352 1025,201" fill="none" stroke="#4a8db8" stroke-width="2.5"/>
  <circle cx="199" cy="487" r="5" fill="#4a8db8"/>
  <circle cx="596" cy="352" r="5" fill="#4a8db8"/>
  <circle cx="1025" cy="201" r="5" fill="#4a8db8"/>

  <text x="211" y="492" font-size="12.5" font-weight="700" fill="#1e5f8a">82.0ms</text>
  <text x="608" y="357" font-size="12.5" font-weight="700" fill="#1e5f8a">564.4ms</text>
  <text x="1037" y="206" font-size="12.5" font-weight="700" fill="#1e5f8a">4,812.6ms</text>

  <!-- 인덱스 없음 지점 -->
  <line x1="1025" y1="165" x2="1025" y2="201" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="1025" cy="165" r="6" fill="#fff" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="1037" y="170" font-size="12.5" font-weight="700" fill="#b91c1c">8,056.8ms</text>

  <!-- 읽기 -->
  <text x="200" y="210" font-size="12.5" font-weight="700" fill="#475569">행 수가 늘어난 만큼 p95도 는다</text>
  <text x="200" y="232" font-size="11.5" fill="#64748b">커버링 인덱스는 훑는 폭을 줄일 뿐, 합계를 상수 시간으로 만들지 않는다</text>

  <!-- 푸터 -->
  <rect x="48" y="612" width="1104" height="88" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="72" y="642" font-size="12.5" font-weight="700" fill="#1e5f8a">인덱스로 1,000만 행에서 한 계정 조회 2.6배, 계정별 전체 1.7배 — 기울기는 그대로다</text>
  <text x="72" y="666" font-size="10.5" fill="#334155">쓰기 비용도 함께 쟀다. 20만 행 삽입에 인덱스 없이 1,906.8ms, 커버링 인덱스를 더하니 2,149.5ms로 +12.7%였다.</text>
  <text x="72" y="686" font-size="10.5" fill="#334155">그래서 스냅샷은 지금 만들지 않고, 200ms 선을 넘는 지점(계정별 전체 약 60만 행 · 한 계정 약 130만 행)만 숫자로 남겼다.</text>
</svg>
