  <text x="80" y="380" font-size="18.63" font-weight="700" fill="#191F28">기각된 가설 덕에 근거 없는 구조 변경을 하지 않았다</text>
  <text x="80" y="402" font-size="17.25" fill="#4E5968">재현된 둘의 해결책은 실험 코드로 검증까지 해 두었고, 본 코드는 지금 구조를 유지한다</text>
</svg>