<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">

  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">다른 계열 심판도 틀렸다 — 표시가 늘어난 것이 개선은 아니었다</text>
  <text x="600" y="60" text-anchor="middle" font-size="11" fill="#94a3b8">초안은 qwen3:8b · 심판은 계열이 다른 llama3.1:8b · 대사 예외 10건을 2회씩 돌린 초안 20건</text>

  <text x="48" y="100" font-size="11" font-weight="700" fill="#64748b">① 깔때기 — 루브릭을 그냥 통과한 20건에 다른 계열 심판을 붙인다</text>

  <!-- Bar A : 20 -->
  <rect x="60" y="112" width="1080" height="72" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="2"/>
  <rect x="60" y="112" width="1080" height="4" rx="10" fill="#4a8db8"/>
  <text x="600" y="146" text-anchor="middle" font-size="16" font-weight="800" fill="#1e5f8a">초안 20건 — 루브릭을 그냥 통과</text>
  <text x="600" y="170" text-anchor="middle" font-size="10.5" fill="#64748b">대사 예외 10건을 2회씩 돌린 초안 · 케이스당 만점 6</text>

  <!-- arrow A -> B -->
  <line x1="600" y1="186" x2="600" y2="196" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="592,196 608,196 600,205" fill="#94a3b8"/>

  <!-- Bar B : 16 -->
  <rect x="168" y="204" width="864" height="72" rx="10" fill="#fef7ec" stroke="#e67e22" stroke-width="2"/>
  <rect x="168" y="204" width="864" height="4" rx="10" fill="#e67e22"/>
  <text x="600" y="238" text-anchor="middle" font-size="15.5" font-weight="800" fill="#b45309">다른 계열 심판 표시 16 / 20 (80%)</text>
  <text x="600" y="262" text-anchor="middle" font-size="10.5" fill="#64748b">근거 없는 단정으로 표시 — 오탐을 의심했지만 오탐이 아니었다</text>

  <!-- arrow B -> C -->
  <line x1="600" y1="278" x2="600" y2="288" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="592,288 608,288 600,297" fill="#94a3b8"/>

  <!-- Bar C : 11 -->
  <rect x="303" y="296" width="594" height="72" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <rect x="303" y="296" width="594" height="4" rx="10" fill="#27ae60"/>
  <text x="600" y="330" text-anchor="middle" font-size="15.5" font-weight="800" fill="#27ae60">수정 후 11 / 20 (55%)</text>
  <text x="600" y="354" text-anchor="middle" font-size="10.5" fill="#64748b">원인을 모르면 영향을 요구하지 않음 · 예시를 케이스별로 교체</text>

  <!-- arrow C -> D -->
  <line x1="600" y1="370" x2="600" y2="380" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="592,380 608,380 600,389" fill="#94a3b8"/>

  <!-- Bar D : 14 (오탐) -->
  <rect x="222" y="388" width="756" height="72" rx="10" fill="#ffffff" stroke="#e74c3c" stroke-width="2"/>
  <rect x="222" y="388" width="756" height="4" rx="10" fill="#e74c3c"/>
  <text x="600" y="422" text-anchor="middle" font-size="15.5" font-weight="800" fill="#e74c3c">다시 재니 14 / 20 (70%) — 오탐</text>
  <text x="600" y="446" text-anchor="middle" font-size="10.5" fill="#64748b">내부에 없다고 명시돼 있는데 심판이 못 읽었다 · 신뢰 불가</text>

  <!-- 대조 요약 -->
  <rect x="40" y="484" width="1120" height="64" rx="10" fill="#fef7ec" stroke="#e67e22" stroke-width="1"/>
  <text x="600" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">심판 표시 16 → 11 → 14 — 늘어난 몫은 오탐, 그 수치는 신뢰할 수 없다</text>
  <text x="600" y="534" text-anchor="middle" font-size="10.5" fill="#334155">심판은 모르는 결함을 찾는 데 쓰고, 아는 결함은 코드가 지킵니다</text>

  <!-- 원칙 -->
  <rect x="40" y="562" width="1120" height="64" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="600" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5f8a">아는 결함은 코드로 셌다 — 원인이 확정되지 않은 건에 “그대로 유지 / 변동이 없” 류가 있는가</text>
  <text x="600" y="612" text-anchor="middle" font-size="10.5" fill="#334155">→ 0 / 20 · 심판의 정밀도·재현율을 잴 라벨 세트는 아직 없다</text>

</svg>
