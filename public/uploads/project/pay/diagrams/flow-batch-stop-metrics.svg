<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">복구 배치가 멈춰도 요청 지표는 평평하다</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">요청이 없으니 에러율도 응답시간도 안 움직인다 · 멈춤은 배치 지표에서만 드러난다</text>

  <!-- 축 -->
  <line x1="120" y1="140" x2="120" y2="470" stroke="#64748b" stroke-width="1.4"/>
  <line x1="120" y1="470" x2="1050" y2="470" stroke="#64748b" stroke-width="1.4"/>
  <polygon points="1042,464 1056,470 1042,476" fill="#64748b"/>
  <text x="1064" y="474" font-size="10" fill="#64748b">시간</text>

  <!-- 중단 시각 -->
  <line x1="600" y1="140" x2="600" y2="470" stroke="#e74c3c" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="600" y="132" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e74c3c">복구 배치 중단</text>

  <!-- 임계선 -->
  <line x1="120" y1="250" x2="1040" y2="250" stroke="#e74c3c" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="128" y="240" font-size="10" font-weight="700" fill="#b45309">임계 600초</text>

  <!-- 배치 지표 곡선 -->
  <polyline points="132,432 420,432 560,433 600,434 650,422 700,400 750,372 800,340 850,307 900,274 950,242 1000,214 1040,198" fill="none" stroke="#e67e22" stroke-width="2.4"/>
  <text x="132" y="424" font-size="10" font-weight="700" fill="#b45309">payment.unknown.oldest.age</text>

  <!-- 평평한 요청 지표 -->
  <line x1="132" y1="448" x2="1040" y2="448" stroke="#4a8db8" stroke-width="1.8"/>
  <line x1="132" y1="462" x2="1040" y2="462" stroke="#9b59b6" stroke-width="1.8"/>
  <text x="112" y="452" text-anchor="end" font-size="10" fill="#4a8db8">에러율</text>
  <text x="112" y="466" text-anchor="end" font-size="10" fill="#9b59b6">응답시간</text>
  <text x="1030" y="442" text-anchor="end" font-size="10" fill="#94a3b8">평평</text>
  <text x="1030" y="456" text-anchor="end" font-size="10" fill="#94a3b8">평평</text>

  <!-- 알림 -->
  <circle cx="934" cy="250" r="5.5" fill="#e74c3c"/>
  <text x="934" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#e74c3c">알림</text>

  <!-- 결론 -->
  <rect x="120" y="496" width="920" height="76" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="580" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5f8a">배치가 죽으면 결제는 정상으로 보이는데 payment.unknown.oldest.age만 올라간다</text>
  <text x="580" y="550" text-anchor="middle" font-size="10.5" fill="#334155">임계 600초(미확정 결제 방치)를 비롯해 알림 열한 개를 코드에 박아 둔다</text>
</svg>
