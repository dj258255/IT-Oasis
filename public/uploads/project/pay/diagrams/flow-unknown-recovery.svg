<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <filter id="shSm" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a8db8"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#27ae60"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e67e22"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e74c3c"/></marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">타임아웃은 실패가 아니라 미확정 — 복구 배치가 확정한다</text>
  <text x="600" y="67" text-anchor="middle" font-size="11.5" fill="#94a3b8">타임아웃은 UNKNOWN으로 보존하고, 복구 배치가 60초마다 PG에 실제 상태를 묻는다</text>

  <!-- 왼쪽: 미확정 보존 → 복구 흐름 -->
  <rect x="60" y="110" width="500" height="76" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#sh)"/>
  <rect x="60" y="110" width="500" height="4" rx="10" fill="#e67e22"/>
  <text x="310" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">PG 승인 타임아웃</text>
  <text x="310" y="165" text-anchor="middle" font-size="10" fill="#64748b">응답이 오지 않는다 — 결과를 모른다</text>

  <line x1="310" y1="186" x2="310" y2="212" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arO)"/>
  <text x="322" y="202" font-size="9" fill="#94a3b8">TIMEOUT</text>

  <rect x="60" y="216" width="500" height="76" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#sh)"/>
  <rect x="60" y="216" width="500" height="4" rx="10" fill="#e67e22"/>
  <text x="310" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">UNKNOWN 보존</text>
  <text x="310" y="271" text-anchor="middle" font-size="10" fill="#64748b">markUnknown(reason) — 실패로 지우지 않는다</text>

  <line x1="310" y1="292" x2="310" y2="318" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arO)"/>
  <text x="322" y="308" font-size="9" fill="#94a3b8">60초 주기</text>

  <rect x="60" y="322" width="500" height="76" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#sh)"/>
  <rect x="60" y="322" width="500" height="4" rx="10" fill="#4a8db8"/>
  <text x="310" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">복구 배치가 스캔</text>
  <text x="310" y="377" text-anchor="middle" font-size="10" fill="#64748b">PaymentRecoveryScheduler — 미확정 건을 모은다</text>

  <line x1="310" y1="398" x2="310" y2="424" stroke="#4a8db8" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="322" y="414" font-size="9" fill="#94a3b8">상태 조회</text>

  <rect x="60" y="428" width="500" height="76" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#sh)"/>
  <rect x="60" y="428" width="500" height="4" rx="10" fill="#4a8db8"/>
  <text x="310" y="461" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">PG 조회</text>
  <text x="310" y="483" text-anchor="middle" font-size="10" fill="#64748b">승인됐는가 · 결제가 없는가 · 이미 취소됐는가</text>

  <!-- 오른쪽: 확정 결과 세 갈래 -->
  <rect x="640" y="148" width="500" height="104" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="640" y="148" width="500" height="4" rx="10" fill="#27ae60"/>
  <text x="664" y="176" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.04em">APPROVED</text>
  <line x1="664" y1="190" x2="1116" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <text x="664" y="220" font-size="14.5" font-weight="700" fill="#1e293b">전진 복구 → DONE</text>
  <text x="664" y="244" font-size="9.5" fill="#64748b">confirmByRecovery(pg.method()) — 승인돼 있으면 취소하지 않는다</text>

  <rect x="640" y="270" width="500" height="104" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="640" y="270" width="500" height="4" rx="10" fill="#e74c3c"/>
  <text x="664" y="298" font-size="11" font-weight="700" fill="#b91c1c" letter-spacing="0.04em">NOT_FOUND</text>
  <line x1="664" y1="312" x2="1116" y2="312" stroke="#e2e8f0" stroke-width="1"/>
  <text x="664" y="342" font-size="14.5" font-weight="700" fill="#1e293b">상태 확정 → ABORTED</text>
  <text x="664" y="366" font-size="9.5" fill="#64748b">abortByRecovery("PG에 결제 없음") — PG에 결제가 없다</text>

  <rect x="640" y="392" width="500" height="104" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="640" y="392" width="500" height="4" rx="10" fill="#4a8db8"/>
  <text x="664" y="420" font-size="11" font-weight="700" fill="#1e5f8a" letter-spacing="0.04em">CANCELED</text>
  <line x1="664" y1="434" x2="1116" y2="434" stroke="#e2e8f0" stroke-width="1"/>
  <text x="664" y="464" font-size="14.5" font-weight="700" fill="#1e293b">상태 동기화</text>
  <text x="664" y="488" font-size="9.5" fill="#64748b">confirmCanceledByRecovery() — 망취소 아님</text>

  <!-- 갈래 화살표 -->
  <line x1="560" y1="466" x2="634" y2="204" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arG)"/>
  <line x1="560" y1="466" x2="634" y2="322" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#arR)"/>
  <line x1="560" y1="466" x2="634" y2="440" stroke="#4a8db8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 메모 -->
  <rect x="60" y="530" width="1080" height="84" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="82" y="556" font-size="11.5" font-weight="700" fill="#1e5f8a">복구 배치 메모</text>
  <text x="82" y="580" font-size="10.5" fill="#334155">명시적 거절만 FAILED — 타임아웃은 실패로 확정하지 않고 UNKNOWN으로 보존한다</text>
  <text x="82" y="602" font-size="10.5" fill="#334155">10분을 넘기면 알림이 울려 사람이 닫는다 · 반대 정책(무조건 망취소)도 networkCancel로 허용 전이에 뒀다</text>
</svg>
