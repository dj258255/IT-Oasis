<svg width="1000" height="720" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1000" height="720" fill="#ffffff"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">임계 80: 이름만 볼 때와 생년월일·국적을 더한 뒤</text>
  <text x="40" y="66" font-size="12" fill="#64748b">점선 위는 사람에게 보내고 아래는 지나간다. 임계 80 기준으로 오판이 2/4에서 0/4가 됐다.</text>

  <!-- 범례 -->
  <rect x="40" y="86" width="14" height="14" rx="3" fill="#cbd5e1"/>
  <text x="62" y="98" font-size="11.5" fill="#64748b">이름만</text>
  <rect x="126" y="86" width="14" height="14" rx="3" fill="#4a8db8"/>
  <text x="148" y="98" font-size="11.5" fill="#64748b">생년월일·국적을 더한 뒤</text>
  <line x1="316" y1="93" x2="356" y2="93" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="364" y="98" font-size="11.5" font-weight="700" fill="#e74c3c">임계 80</text>

  <!-- 눈금 -->
  <line x1="190" y1="170" x2="920" y2="170" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="190" y1="246" x2="920" y2="246" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="190" y1="322" x2="920" y2="322" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="190" y1="398" x2="920" y2="398" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="190" y1="474" x2="920" y2="474" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="190" y1="550" x2="920" y2="550" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="182" y="174" text-anchor="end" font-size="11" fill="#94a3b8">100</text>
  <text x="182" y="250" text-anchor="end" font-size="11" fill="#94a3b8">80</text>
  <text x="182" y="326" text-anchor="end" font-size="11" fill="#94a3b8">60</text>
  <text x="182" y="402" text-anchor="end" font-size="11" fill="#94a3b8">40</text>
  <text x="182" y="478" text-anchor="end" font-size="11" fill="#94a3b8">20</text>
  <text x="182" y="554" text-anchor="end" font-size="11" fill="#94a3b8">0</text>

  <!-- 강조: 흔한 이름의 남남 -->
  <rect x="740" y="126" width="180" height="500" rx="12" fill="#fef3f2" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 막대 -->
  <rect x="228" y="295" width="46" height="255" rx="3" fill="#cbd5e1"/>
  <rect x="288" y="238" width="46" height="312" rx="3" fill="#4a8db8"/>
  <rect x="411" y="295" width="46" height="255" rx="3" fill="#cbd5e1"/>
  <rect x="471" y="504" width="46" height="46" rx="3" fill="#4a8db8"/>
  <rect x="593" y="235" width="46" height="315" rx="3" fill="#cbd5e1"/>
  <rect x="653" y="178" width="46" height="372" rx="3" fill="#4a8db8"/>
  <rect x="776" y="170" width="46" height="380" rx="3" fill="#cbd5e1"/>
  <rect x="836" y="379" width="46" height="171" rx="3" fill="#4a8db8"/>

  <!-- 임계선 -->
  <line x1="190" y1="246" x2="920" y2="246" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="928" y="251" font-size="12.5" font-weight="700" fill="#e74c3c">임계 80</text>

  <!-- 값 -->
  <text x="251" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">67</text>
  <text x="311" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a8db8">82</text>
  <text x="434" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">67</text>
  <text x="494" y="495" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a8db8">12</text>
  <text x="616" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">83</text>
  <text x="676" y="169" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a8db8">98</text>
  <text x="799" y="161" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">100</text>
  <text x="859" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a8db8">45</text>

  <!-- 이름만 볼 때의 오판 둘 -->
  <text x="251" y="268" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e74c3c">오판</text>
  <text x="799" y="143" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e74c3c">오판</text>

  <!-- 사례 -->
  <text x="281" y="575" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">같은 사람 · 다른 로마자</text>
  <text x="281" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#4a8db8">67 → 82</text>

  <text x="464" y="575" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">다른 사람 · 비슷한 이름</text>
  <text x="464" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#4a8db8">67 → 12</text>

  <text x="646" y="575" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">같은 사람 · 띄어쓰기만 다름</text>
  <text x="646" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#4a8db8">83 → 98</text>

  <text x="829" y="575" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">흔한 이름의 남남</text>
  <text x="829" y="594" text-anchor="middle" font-size="10.5" fill="#94a3b8">Lee Min Ho ↔ Lee Min Ho</text>
  <text x="829" y="616" text-anchor="middle" font-size="14" font-weight="800" fill="#e74c3c">100 → 45</text>

  <!-- 각주 -->
  <rect x="40" y="642" width="920" height="54" rx="10" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="666" font-size="12" fill="#334155">철자가 완전히 같아 이름만으로는 만점(100)이고, 선을 어디에 그어도 걸린다.</text>
  <text x="60" y="686" font-size="12" fill="#334155">생년월일과 국적이 달라 45점으로 떨어지며, 임계 80 아래가 되어 지나간다.</text>
</svg>
