<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">인스턴스 둘이 같은 정산을 두 번 집계한다</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">같은 실행 단위를 둘로 늘리면 스케줄러가 함께 복제된다 · 배치 첫 틱에서 재현</text>

  <!-- 동시 기동 -->
  <rect x="140" y="104" width="920" height="62" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.6"/>
  <rect x="140" y="104" width="920" height="4" rx="2" fill="#4a8db8"/>
  <text x="600" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">인스턴스 둘(8081 · 8082)을 동시에 기동</text>
  <text x="600" y="152" text-anchor="middle" font-size="10" fill="#64748b">진입점 가드 "이미 정산했으면 건너뛴다" · 전일 항목 2만 건을 시드해 둔 상태</text>

  <line x1="340" y1="166" x2="340" y2="180" stroke="#4a8db8" stroke-width="1.6"/>
  <polygon points="334,179 346,179 340,188" fill="#4a8db8"/>
  <line x1="860" y1="166" x2="860" y2="180" stroke="#4a8db8" stroke-width="1.6"/>
  <polygon points="854,179 866,179 860,188" fill="#4a8db8"/>

  <!-- 1단계: 가드 통과 -->
  <rect x="140" y="190" width="400" height="76" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.4"/>
  <rect x="140" y="190" width="400" height="4" rx="2" fill="#4a8db8"/>
  <text x="340" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">8081 · 가드 통과</text>
  <text x="340" y="247" text-anchor="middle" font-size="10" fill="#64748b">"정산 없음"을 보고 통과</text>

  <rect x="660" y="190" width="400" height="76" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.4"/>
  <rect x="660" y="190" width="400" height="4" rx="2" fill="#4a8db8"/>
  <text x="860" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">8082 · 가드 통과</text>
  <text x="860" y="247" text-anchor="middle" font-size="10" fill="#64748b">"정산 없음"을 보고 통과</text>

  <text x="600" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#e67e22">동시 진입</text>

  <line x1="340" y1="266" x2="340" y2="290" stroke="#e67e22" stroke-width="1.6"/>
  <polygon points="334,289 346,289 340,298" fill="#e67e22"/>
  <line x1="860" y1="266" x2="860" y2="290" stroke="#e67e22" stroke-width="1.6"/>
  <polygon points="854,289 866,289 860,298" fill="#e67e22"/>

  <!-- 2단계: 2만 건 중복 집계 -->
  <rect x="140" y="300" width="400" height="76" rx="10" fill="#fff" stroke="#e67e22" stroke-width="1.4"/>
  <rect x="140" y="300" width="400" height="4" rx="2" fill="#e67e22"/>
  <text x="340" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">전일 2만 건 집계</text>
  <text x="340" y="357" text-anchor="middle" font-size="10" fill="#64748b">양쪽 다 첫 틱에서 통째로</text>

  <rect x="660" y="300" width="400" height="76" rx="10" fill="#fff" stroke="#e67e22" stroke-width="1.4"/>
  <rect x="660" y="300" width="400" height="4" rx="2" fill="#e67e22"/>
  <text x="860" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">전일 2만 건 집계</text>
  <text x="860" y="357" text-anchor="middle" font-size="10" fill="#64748b">같은 2만 건을 중복 집계</text>

  <text x="600" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#e67e22">같은 2만 건</text>

  <line x1="340" y1="376" x2="340" y2="400" stroke="#e67e22" stroke-width="1.6"/>
  <polygon points="334,399 346,399 340,408" fill="#e67e22"/>
  <line x1="860" y1="376" x2="860" y2="400" stroke="#e74c3c" stroke-width="1.6"/>
  <polygon points="854,399 866,399 860,408" fill="#e74c3c"/>

  <!-- 3단계: 커밋 결과 -->
  <rect x="140" y="410" width="400" height="88" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.8"/>
  <rect x="140" y="410" width="400" height="4" rx="2" fill="#27ae60"/>
  <text x="340" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">정산 저장 성공</text>
  <text x="340" y="469" text-anchor="middle" font-size="10" fill="#64748b">먼저 커밋한 쪽</text>

  <rect x="660" y="410" width="400" height="88" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1.8"/>
  <rect x="660" y="410" width="400" height="4" rx="2" fill="#e74c3c"/>
  <text x="860" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#e74c3c">커밋 거부</text>
  <text x="860" y="469" text-anchor="middle" font-size="10" fill="#64748b">늦은 쪽이 uk_settlement_date에 막힘</text>

  <!-- 결론 -->
  <rect x="140" y="520" width="920" height="96" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="600" y="550" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e5f8a">돈은 두 번 안 나갔다 — 막은 것은 가드가 아니라 유니크 제약</text>
  <text x="600" y="576" text-anchor="middle" font-size="10.5" fill="#334155">유니크 제약은 중복 결과의 커밋만 막고, 실행권(이 배치를 지금 돌릴 권한)은 못 정한다</text>
  <text x="600" y="598" text-anchor="middle" font-size="10.5" fill="#334155">인스턴스 수만큼 무의미한 집계가 돌고, 로그는 장애처럼 보인다</text>
</svg>
