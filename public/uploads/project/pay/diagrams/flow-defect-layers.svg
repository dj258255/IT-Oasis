<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <filter id="shSm" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arS" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">결함이 어느 층에서 처음 드러나는가</text>
  <text x="600" y="66" text-anchor="middle" font-size="12" fill="#94a3b8">잣대를 세 층으로 넓혀 갈수록, 아래층에서는 안 보이던 결함이 위층에서만 드러났다 · 대사 예외 4건 탐색 실행</text>

  <!-- 층 1 -->
  <rect x="80" y="320" width="310" height="130" rx="12" fill="#eef6fb" stroke="#4a8db8" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="80" y="320" width="310" height="4" rx="2" fill="#4a8db8"/>
  <circle cx="108" cy="352" r="13" fill="#4a8db8"/>
  <text x="108" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="130" y="357" font-size="13.5" font-weight="700" fill="#1e5f8a">실데이터 + 템플릿</text>
  <text x="100" y="387" font-size="10" fill="#94a3b8">처음 드러난 결함</text>
  <text x="100" y="410" font-size="14.5" font-weight="700" fill="#1e293b">분류기 근거 금액 반려</text>
  <text x="100" y="431" font-size="10.5" fill="#64748b">손으로 만든 입력 단위 테스트 7개는 통과</text>

  <!-- 층 2 -->
  <rect x="445" y="245" width="310" height="205" rx="12" fill="#fef7ec" stroke="#e67e22" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="445" y="245" width="310" height="4" rx="2" fill="#e67e22"/>
  <circle cx="473" cy="277" r="13" fill="#e67e22"/>
  <text x="473" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="495" y="282" font-size="13.5" font-weight="700" fill="#b45309">실제 모델만</text>
  <text x="465" y="312" font-size="10" fill="#94a3b8">처음 드러난 결함</text>
  <text x="465" y="335" font-size="14.5" font-weight="700" fill="#1e293b">사실 문장 속 금액 반려</text>
  <text x="465" y="431" font-size="10.5" fill="#64748b">템플릿으로는 절대 못 찾음</text>

  <!-- 층 3 -->
  <rect x="810" y="170" width="310" height="280" rx="12" fill="#f6f0fb" stroke="#9b59b6" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="810" y="170" width="310" height="4" rx="2" fill="#9b59b6"/>
  <circle cx="838" cy="202" r="13" fill="#9b59b6"/>
  <text x="838" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="860" y="207" font-size="13.5" font-weight="700" fill="#7c3a9e">실제 모델 + 12회 반복</text>
  <text x="830" y="237" font-size="10" fill="#94a3b8">처음 드러난 결함</text>
  <text x="830" y="260" font-size="14.5" font-weight="700" fill="#1e293b">사실 문장 속 날짜 반려</text>
  <text x="830" y="410" font-size="10.5" fill="#64748b">반려는 전부 2026-09-06</text>
  <text x="830" y="431" font-size="10.5" fill="#64748b">모델이 매번 다르게 써서 12회를 돌려야 보임</text>

  <!-- 층을 넓히는 화살표 -->
  <line x1="394" y1="316" x2="440" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <line x1="759" y1="241" x2="805" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <!-- 결론 -->
  <rect x="80" y="486" width="1040" height="84" rx="12" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="600" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e5f8a">셋의 뿌리는 하나 — 구조화 필드만 모으고 문장 속 값을 빠뜨렸다</text>
  <text x="600" y="543" text-anchor="middle" font-size="10.5" fill="#334155">허용 목록을 “타임라인에 있는 숫자만”에서 “코드가 낸 숫자만 쓰고, 모델이 지어낸 숫자는 쓰지 마라”로 고쳤다</text>
</svg>
