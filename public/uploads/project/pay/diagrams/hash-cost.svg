<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="32" y="40" font-size="18" font-weight="800" fill="#1e293b">비용을 어디서 가져오는가</text>
  <text x="32" y="64" font-size="13" fill="#64748b">로컬(Apple Silicon), 워밍업 후 7회 중앙값. 메모리는 해시 1건당.</text>

  <text x="32" y="108" font-size="14" font-weight="700" fill="#64748b">BCrypt (strength 10)</text>
  <rect x="200" y="92" width="261" height="26" rx="5" fill="#cbd5e1"/>
  <text x="471" y="111" font-size="14" font-weight="800" fill="#64748b">87ms</text>
  <rect x="200" y="124" width="3" height="20" rx="1.5" fill="#94a3b8"/>
  <text x="213" y="139" font-size="12.5" fill="#94a3b8">4KB</text>

  <text x="32" y="196" font-size="14" font-weight="700" fill="#1e293b">Argon2id (19MiB, t=2)</text>
  <rect x="200" y="180" width="96" height="26" rx="5" fill="#4a8db8"/>
  <text x="306" y="199" font-size="14" font-weight="800" fill="#4a8db8">32ms</text>
  <rect x="200" y="212" width="240" height="20" rx="3" fill="#4a8db8" opacity="0.35"/>
  <text x="450" y="227" font-size="12.5" font-weight="700" fill="#4a8db8">19MiB</text>

  <line x1="32" y1="262" x2="868" y2="262" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="32" y="292" font-size="14" font-weight="800" fill="#1e293b">시간은 줄었는데 새 축이 생겼다</text>
  <text x="32" y="316" font-size="13" fill="#64748b">메모리는 동시 요청 수만큼 곱해진다. 실측 결과 동시 1건당 약 20MB.</text>

  <rect x="32" y="334" width="270" height="58" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="356" font-size="12.5" font-weight="700" fill="#64748b">힙 512MB · 동시 50</text>
  <text x="48" y="378" font-size="13" font-weight="800" fill="#b91c1c">50건 전부 OOM</text>

  <rect x="315" y="334" width="270" height="58" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="331" y="356" font-size="12.5" font-weight="700" fill="#64748b">힙 1GB · 동시 100</text>
  <text x="331" y="378" font-size="13" font-weight="800" fill="#b91c1c">12건 실패</text>

  <rect x="598" y="334" width="270" height="58" rx="8" fill="#4a8db810" stroke="#4a8db8" stroke-width="2"/>
  <text x="614" y="356" font-size="12.5" font-weight="700" fill="#1e293b">힙 2GB · 동시 100</text>
  <text x="614" y="378" font-size="13" font-weight="800" fill="#4a8db8">성공 (1,984MB 사용)</text>
</svg>
