<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AB"/></marker>
  </defs>
  <rect width="1400" height="530" fill="#000000"/>
  <text x="56" y="72" font-size="46" font-weight="800" fill="#FFFFFF">400이라고 다 실패가 아니다</text>
  <text x="56" y="106" font-size="28.7" fill="#8B95A1">같은 400 안에 성격이 완전히 다른 셋이 섞여 있다</text>

  <g text-anchor="middle">
    <rect x="56" y="160" width="200" height="86" rx="16" fill="#F2F4F6"/>
    <text x="156" y="196" font-size="26.91" font-weight="700" fill="#191F28">PG 에러 응답</text>
    <text x="156" y="222" font-size="22.43" fill="#4E5968">{ code, message }</text>
  </g>
  <line x1="256" y1="203" x2="310" y2="203" stroke="#9CA3AB" stroke-width="2" marker-end="url(#ec)"/>

  <g text-anchor="middle" font-size="22.43">
    <rect x="316" y="140" width="330" height="72" rx="14" fill="#FDEBEC"/>
    <text x="481" y="168" font-size="24.22" font-weight="700" fill="#C0392B">REJECT_CARD_COMPANY 403</text>
    <text x="481" y="192" fill="#8B1F1F">INVALID_STOPPED_CARD 400</text>

    <rect x="316" y="228" width="330" height="72" rx="14" fill="#FFF7E6"/>
    <text x="481" y="256" font-size="24.22" font-weight="700" fill="#B45309">PROVIDER_ERROR 400</text>
    <text x="481" y="280" fill="#8A6212">"잠시 후 다시 시도해주세요"</text>

    <rect x="316" y="316" width="330" height="72" rx="14" fill="#EFF8F3"/>
    <text x="481" y="344" font-size="24.22" font-weight="700" fill="#0B7A4B">ALREADY_PROCESSED_PAYMENT 400</text>
    <text x="481" y="368" fill="#14603F">이미 승인이 끝난 결제</text>

    <rect x="316" y="404" width="330" height="60" rx="14" fill="#15181E" stroke="#2A2F38"/>
    <text x="481" y="430" font-size="23.32" font-weight="700" fill="#C4C9D0">문서에 없는 코드</text>
    <text x="481" y="452" fill="#8B95A1">모르는 것은 확정하지 않는다</text>
  </g>

  <line x1="646" y1="176" x2="700" y2="176" stroke="#9CA3AB" stroke-width="2" marker-end="url(#ec)"/>
  <line x1="646" y1="264" x2="700" y2="264" stroke="#9CA3AB" stroke-width="2" marker-end="url(#ec)"/>
  <line x1="646" y1="352" x2="700" y2="352" stroke="#9CA3AB" stroke-width="2" marker-end="url(#ec)"/>
  <line x1="646" y1="434" x2="700" y2="264" stroke="#9CA3AB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ec)"/>

  <g text-anchor="middle">
    <rect x="706" y="146" width="300" height="60" rx="14" fill="#F2F4F6"/>
    <text x="856" y="171" font-size="26.01" font-weight="700" fill="#191F28">실패로 확정</text>
    <text x="856" y="192" font-size="20.63" fill="#4E5968">카드사가 거절했다</text>

    <rect x="706" y="234" width="300" height="60" rx="14" fill="#F2F4F6"/>
    <text x="856" y="259" font-size="26.01" font-weight="700" fill="#191F28">미확정으로 보존</text>
    <text x="856" y="280" font-size="20.63" fill="#4E5968">복구 배치가 나중에 확정</text>

    <rect x="706" y="322" width="300" height="60" rx="14" fill="#F2F4F6"/>
    <text x="856" y="347" font-size="26.01" font-weight="700" fill="#191F28">조회로 확정</text>
    <text x="856" y="368" font-size="20.63" fill="#4E5968">추측하지 않고 다시 묻는다</text>
  </g>

  <rect x="1046" y="146" width="298" height="236" rx="16" fill="#15181E" stroke="#2A2F38"/>
  <text x="1195" y="182" font-size="26.01" font-weight="700" fill="#FFFFFF" text-anchor="middle">이걸 안 가르면</text>
  <text x="1195" y="222" font-size="23.32" fill="#F04452" text-anchor="middle">이미 승인된 결제를</text>
  <text x="1195" y="244" font-size="23.32" fill="#F04452" text-anchor="middle">실패로 기록한다</text>
  <text x="1195" y="284" font-size="22.43" fill="#C4C9D0" text-anchor="middle">고객 돈은 나가고</text>
  <text x="1195" y="306" font-size="22.43" fill="#C4C9D0" text-anchor="middle">우리 장부만 실패</text>
  <text x="1195" y="346" font-size="20.63" fill="#8B95A1" text-anchor="middle">상황 1이 막으려던 사고가</text>
  <text x="1195" y="366" font-size="20.63" fill="#8B95A1" text-anchor="middle">실 PG 경계에서 재현된다</text>

  <text x="700" y="500" font-size="25.12" fill="#8B95A1" text-anchor="middle">분류 6종·진행 중 보존·금액 대조를 테스트로 고정, 전체 521개 통과</text>
</svg>
