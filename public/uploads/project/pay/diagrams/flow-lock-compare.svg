<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1400" height="560" fill="#000000"/>
  <text x="56" y="72" font-size="34" font-weight="800" fill="#FFFFFF">재고 락 3종을 실제 MySQL에서 재서 골랐다</text>
  <text x="56" y="106" font-size="16" fill="#8B95A1">스레드 30개가 재고 20에 동시 차감. 셋 다 초과판매 0으로 정확히 완판됐고, 값은 소요 시간이 갈랐다 (실 MySQL 8.4 InnoDB · 워밍업 후 5회 중앙값)</text>

  <g text-anchor="middle">
    <rect x="56" y="150" width="410" height="150" rx="18" fill="#15181E" stroke="#2A2F38"/>
    <text x="261" y="186" font-size="16" font-weight="700" fill="#FFFFFF">낙관적 락 (@Version)</text>
    <text x="261" y="214" font-size="12.5" fill="#8B95A1">일단 쓰고 충돌하면 처음부터 다시 왕복</text>
    <rect x="86" y="232" width="350" height="30" rx="7" fill="#F04452"/>
    <text x="261" y="288" font-size="22" font-weight="800" fill="#F04452">151ms</text>

    <rect x="495" y="150" width="410" height="150" rx="18" fill="#15181E" stroke="#2A2F38"/>
    <text x="700" y="186" font-size="16" font-weight="700" fill="#FFFFFF">비관적 락 (FOR UPDATE)</text>
    <text x="700" y="214" font-size="12.5" fill="#8B95A1">먼저 잠그고 읽는다. 줄을 서면 왕복은 한 번</text>
    <rect x="525" y="232" width="174" height="30" rx="7" fill="#F5A524"/>
    <text x="700" y="288" font-size="22" font-weight="800" fill="#F5A524">75ms</text>

    <rect x="934" y="150" width="410" height="150" rx="18" fill="#F2F4F6"/>
    <text x="1139" y="186" font-size="16" font-weight="700" fill="#191F28">조건부 UPDATE (채택)</text>
    <text x="1139" y="214" font-size="12.5" fill="#4E5968">WHERE quantity &gt;= n 으로 한 번에</text>
    <rect x="964" y="232" width="93" height="30" rx="7" fill="#0B7A4B"/>
    <text x="1139" y="288" font-size="22" font-weight="800" fill="#0B7A4B">40ms</text>
  </g>

  <rect x="56" y="330" width="1288" height="72" rx="14" fill="#15181E" stroke="#2A2F38"/>
  <text x="80" y="360" font-size="13.5" font-weight="700" fill="#F04452">인메모리에서 잰 순서가 실 DB에서 뒤집혔다</text>
  <text x="80" y="384" font-size="12.5" fill="#C4C9D0">H2에서는 낙관 17ms &lt; 비관 32ms였다. 인메모리에는 왕복도 디스크도 없어 재시도가 공짜였기 때문이다. 실 InnoDB에서는 낙관 151ms &gt; 비관 75ms</text>

  <rect x="56" y="416" width="1288" height="72" rx="14" fill="#15181E" stroke="#2A2F38"/>
  <text x="80" y="446" font-size="13.5" font-weight="700" fill="#FFFFFF">고경합에서 격차가 벌어진다 (스레드 150개)</text>
  <text x="80" y="470" font-size="12.5" fill="#C4C9D0">조건부 79ms 대 낙관적 429ms, 5.4배. 재시도 상한 50회 안에서 완판은 지켰지만 그 상한을 지키느라 지연이 늘었다. 한 행에 쓰기가 몰리는 자리에는 맞지 않는다</text>

  <text x="700" y="530" font-size="14" fill="#8B95A1" text-anchor="middle">조건부 UPDATE는 읽고 비교하고 쓰는 왕복이 없어 락 대기도 재시도도 없다 · 데드락 0건, 락 대기 타임아웃 0건</text>
</svg>
