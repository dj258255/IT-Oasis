<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1400" height="560" fill="#000000"/>
  <text x="56" y="72" font-size="34" font-weight="800" fill="#FFFFFF">정산 집계 키 버그</text>
  <text x="56" y="106" font-size="16" fill="#8B95A1">에러 없이 가맹점 지급이 조용히 누락되던 이유. 주문 하나의 시간선으로 보면</text>

  <!-- 타임라인 -->
  <line x1="140" y1="176" x2="1260" y2="176" stroke="#3A414C" stroke-width="2"/>
  <circle cx="340" cy="176" r="8" fill="#FFFFFF"/>
  <text x="340" y="152" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">승인 (D0)</text>
  <circle cx="1060" cy="176" r="8" fill="#FFFFFF"/>
  <text x="1060" y="152" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">구매확정 (D+5)</text>
  <text x="700" y="202" font-size="12.5" fill="#8B95A1" text-anchor="middle">배송과 확정 대기 5일</text>

  <!-- 개선 전 -->
  <rect x="56" y="232" width="1288" height="118" rx="18" fill="#15181E" stroke="#2A2F38"/>
  <text x="84" y="270" font-size="16" font-weight="700" fill="#F04452">개선 전: 집계 키 = 승인일(D0)</text>
  <text x="84" y="298" font-size="13.5" fill="#C4C9D0">확정 시점(D+5)에 이 건을 D0 날짜로 집계 → D0자 정산은 이미 마감돼 어느 정산에도 잡히지 않음 → 가맹점 지급 누락</text>
  <text x="84" y="326" font-size="13" font-weight="700" fill="#F04452">에러 0건 · 테스트도 초록불: 테스트가 승인일=확정일 조건에서만 돌아 버그를 가렸다</text>

  <!-- 개선 후 -->
  <rect x="56" y="374" width="1288" height="118" rx="18" fill="#F2F4F6"/>
  <text x="84" y="412" font-size="16" font-weight="700" fill="#191F28">개선 후: 집계 키 = 구매확정일(D+5)</text>
  <text x="84" y="440" font-size="13.5" fill="#4E5968">에스크로 릴리스(구매확정) 시각으로 집계 → D+5자 정산에 정상 포함 → 지급예정일 +2영업일 → 지급확정(PAID_OUT)</text>
  <text x="84" y="468" font-size="13" font-weight="700" fill="#1B64DA">승인과 확정 사이에 간격이 있는 테스트를 추가해 재발 차단</text>

  <text x="700" y="532" font-size="14" fill="#8B95A1" text-anchor="middle">실측: 실 MySQL 전 흐름 검증. 구매확정 3건 → 집계 → PAID_OUT 통과 · 수수료 검산 100,000 → 97,030 (2.7% + 부가세 10%, 정수 계산) 테스트 고정</text>
</svg>
