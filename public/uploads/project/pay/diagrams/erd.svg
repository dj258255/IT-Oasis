<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ew4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AB"/>
    </marker>
    <marker id="eg4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0B7A4B"/>
    </marker>
  </defs>
  <rect width="1400" height="620" fill="#000000"/>
  <text x="56" y="74" font-size="42" font-weight="800" fill="#FFFFFF">돈이 지나는 길에는 제약이 서 있다</text>
  <text x="56" y="116" font-size="24" fill="#8B95A1">두 번 처리되면 안 되는 자리마다 유니크 제약을 걸었다</text>

  <!-- 멱등키 -->
  <rect x="56" y="160" width="400" height="106" rx="16" fill="#15181E" stroke="#F5A524" stroke-width="2"/>
  <text x="82" y="202" font-size="28" font-weight="700" fill="#FFFFFF">idempotency_keys</text>
  <text x="82" y="238" font-size="23" fill="#F5A524">UNIQUE (키, 경로, 메서드)</text>
  <line x1="256" y1="266" x2="256" y2="312" stroke="#9CA3AB" stroke-width="2.5" marker-end="url(#ew4)"/>
  <text x="286" y="296" font-size="21" fill="#8B95A1">같은 요청은 한 번만</text>

  <!-- 주문 -->
  <rect x="56" y="318" width="400" height="132" rx="16" fill="#F2F4F6"/>
  <text x="82" y="360" font-size="28" font-weight="700" fill="#191F28">orders</text>
  <text x="82" y="396" font-size="23" fill="#0B7A4B">UNIQUE (order_no)</text>
  <text x="82" y="428" font-size="21" fill="#4E5968">total_amount · 1:N order_items</text>
  <line x1="456" y1="384" x2="484" y2="384" stroke="#9CA3AB" stroke-width="2.5" marker-end="url(#ew4)"/>
  <text x="470" y="366" font-size="21" fill="#8B95A1" text-anchor="middle">1:N</text>

  <!-- 결제 -->
  <rect x="490" y="318" width="390" height="132" rx="16" fill="#F2F4F6"/>
  <text x="516" y="360" font-size="28" font-weight="700" fill="#191F28">payments</text>
  <text x="516" y="396" font-size="22" fill="#C0392B">status: 승인 · 거절 · 미확정</text>
  <text x="516" y="428" font-size="21" fill="#4E5968">payment_key · amount</text>

  <!-- 소식 분기 -->
  <path d="M 880 384 L 898 384 L 898 214 L 910 214" fill="none" stroke="#0B7A4B" stroke-width="2.5" marker-end="url(#eg4)"/>
  <path d="M 898 384 L 898 470 L 910 470" fill="none" stroke="#0B7A4B" stroke-width="2.5" marker-end="url(#eg4)"/>
  <text x="932" y="374" font-size="21" fill="#0B7A4B">소식으로 이어진다</text>

  <!-- 원장 -->
  <rect x="916" y="160" width="428" height="106" rx="16" fill="#15181E" stroke="#F5A524" stroke-width="2"/>
  <text x="942" y="202" font-size="28" font-weight="700" fill="#FFFFFF">ledger_transactions</text>
  <text x="942" y="238" font-size="23" fill="#F5A524">UNIQUE (거래·원천·원천ID)</text>
  <line x1="1130" y1="266" x2="1130" y2="288" stroke="#9CA3AB" stroke-width="2.5" marker-end="url(#ew4)"/>
  <text x="1160" y="284" font-size="21" fill="#8B95A1">1:N</text>
  <rect x="916" y="294" width="428" height="96" rx="16" fill="#15181E" stroke="#2A2F38"/>
  <text x="942" y="334" font-size="28" font-weight="700" fill="#FFFFFF">ledger_entries</text>
  <text x="942" y="368" font-size="23" fill="#0B7A4B">차변 합 = 대변 합</text>

  <!-- 정산 -->
  <rect x="916" y="418" width="428" height="106" rx="16" fill="#15181E" stroke="#F5A524" stroke-width="2"/>
  <text x="942" y="460" font-size="28" font-weight="700" fill="#FFFFFF">settlements</text>
  <text x="942" y="496" font-size="23" fill="#F5A524">UNIQUE (정산일) · (payment_id)</text>

  <text x="700" y="588" font-size="23" fill="#8B95A1" text-anchor="middle">노란 줄이 전부 유니크 제약이다. 중복 결제·중복 분개·이중 정산을 코드가 아니라 DB가 막는다</text>
</svg>
