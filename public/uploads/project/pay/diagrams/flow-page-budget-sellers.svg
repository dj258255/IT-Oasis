<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a8db8"/></marker>
  </defs>

  <rect width="1200" height="460" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">페이지 예산이 가맹점 수보다 적으면</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">max-pages 2 · 가맹점 3 · 상한을 1장씩 줘도 예산이 2장뿐이라 그 틱에 못 읽는 가맹점이 생긴다</text>

  <!-- 틱 1 -->
  <rect x="60" y="90" width="700" height="232" rx="12" fill="#f8fafb" stroke="#e67e22" stroke-width="1.5"/>
  <text x="88" y="120" font-size="13" font-weight="700" fill="#1e293b">틱 1 — 페이지 예산 2장(max-pages 2)</text>
  <text x="88" y="140" font-size="10" fill="#64748b">perSellerPages = ceil(2 / 3) = 1장 · 가맹점마다 상한은 1장</text>

  <rect x="88" y="164" width="200" height="64" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="188" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">가맹점 1</text>
  <text x="188" y="208" text-anchor="middle" font-size="9.5" fill="#64748b">1페이지 읽음</text>

  <rect x="308" y="164" width="200" height="64" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="408" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">가맹점 2</text>
  <text x="408" y="208" text-anchor="middle" font-size="9.5" fill="#64748b">1페이지 읽음</text>

  <rect x="528" y="164" width="200" height="64" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="628" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">가맹점 3</text>
  <text x="628" y="208" text-anchor="middle" font-size="9.5" fill="#e74c3c">읽을 슬롯 없음 — 0건</text>

  <text x="88" y="266" font-size="10.5" fill="#334155">예산 2장이 가맹점 1·2로 다 차서 가맹점 3은 그 틱에 아예 못 읽힌다</text>
  <text x="88" y="288" font-size="10" fill="#94a3b8">셋 다 상한은 1장씩이지만, 그 틱에 읽을 수 있는 페이지는 2장뿐이다</text>

  <!-- 밀림 화살표 -->
  <polyline points="734,196 780,196 780,220 824,220" fill="none" stroke="#4a8db8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 틱 2 -->
  <rect x="830" y="140" width="310" height="150" rx="12" fill="#ffffff" stroke="#4a8db8" stroke-width="1.5"/>
  <text x="854" y="170" font-size="12.5" font-weight="700" fill="#1e293b">틱 2 — 다음 틱</text>
  <text x="854" y="190" font-size="10" fill="#64748b">밀린 가맹점 3이 이때 읽힌다</text>
  <rect x="854" y="206" width="262" height="64" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="985" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">가맹점 3</text>
  <text x="985" y="250" text-anchor="middle" font-size="9.5" fill="#64748b">1페이지 읽음</text>

  <!-- 푸터 -->
  <rect x="60" y="356" width="1080" height="72" rx="10" fill="#fef7ec" stroke="#e67e22" stroke-width="1"/>
  <text x="600" y="384" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">가맹점 수 &gt; max-pages 이면 그 틱에 아예 못 읽는 가맹점이 생긴다</text>
  <text x="600" y="410" text-anchor="middle" font-size="10" fill="#334155">SettlementFairnessTest.roundRobinCannotServeMoreSellersThanPagesBudget 로 고정</text>
</svg>
