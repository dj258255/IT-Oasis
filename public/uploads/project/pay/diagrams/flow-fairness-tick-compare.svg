<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">가맹점 하나가 틱을 다 채우면 뒤가 굶는다</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">틱 용량 1,000건(max-pages 2 × read-chunk-size 500) · 큰 가맹점 2,500건(id 낮음) · 작은 가맹점 10건(id 높음) · 하루 한 틱</text>

  <!-- ══ 패널 헤더 ══ -->
  <rect x="60" y="82" width="520" height="54" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <rect x="60" y="82" width="520" height="4" rx="10" fill="#e74c3c"/>
  <text x="320" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">id 순 — 원래 동작(기본값)</text>
  <text x="320" y="126" text-anchor="middle" font-size="10" fill="#64748b">id 오름차순으로 틱 용량을 다 쓴다</text>

  <rect x="640" y="82" width="520" height="54" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <rect x="640" y="82" width="520" height="4" rx="10" fill="#27ae60"/>
  <text x="900" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">상한+재분배 — 구현(round-robin)</text>
  <text x="900" y="126" text-anchor="middle" font-size="10" fill="#64748b">가맹점마다 상한을 걸고 남은 페이지를 재배분</text>

  <!-- ══ 패널 본문 ══ -->
  <rect x="60" y="148" width="520" height="436" rx="12" fill="#f8fafb" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="640" y="148" width="520" height="436" rx="12" fill="#f8fafb" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ── id 순 : 틱 1 ── -->
  <text x="124" y="209" text-anchor="end" font-size="12" font-weight="700" fill="#334155">틱 1</text>
  <rect x="140" y="176" width="400" height="56" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="140" y="176" width="400" height="56" rx="8" fill="#4a8db8"/>
  <text x="340" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">큰 가맹점 1,000건</text>
  <text x="140" y="252" font-size="10.5" fill="#e74c3c">작은 가맹점 0건 — 틱이 꽉 차 못 읽힘, 다음 틱으로 밀림</text>

  <!-- ── id 순 : 틱 2 ── -->
  <text x="124" y="323" text-anchor="end" font-size="12" font-weight="700" fill="#334155">틱 2</text>
  <rect x="140" y="290" width="400" height="56" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="140" y="290" width="400" height="56" rx="8" fill="#4a8db8"/>
  <text x="340" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">큰 가맹점 1,000건</text>
  <text x="140" y="366" font-size="10.5" fill="#e74c3c">작은 가맹점 0건 — 이틀째도 못 읽힘</text>

  <!-- ── id 순 : 틱 3 ── -->
  <text x="124" y="437" text-anchor="end" font-size="12" font-weight="700" fill="#334155">틱 3</text>
  <rect x="140" y="404" width="400" height="56" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="140" y="404" width="200" height="56" rx="8" fill="#4a8db8"/>
  <text x="240" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">큰 가맹점 500건</text>
  <rect x="343" y="404" width="14" height="56" rx="3" fill="#27ae60"/>
  <text x="343" y="480" font-size="10.5" fill="#27ae60">작은 가맹점 10건 — 이제 읽힘(2일 지연)</text>

  <!-- ── 상한+재분배 : 틱 1 ── -->
  <text x="704" y="209" text-anchor="end" font-size="12" font-weight="700" fill="#334155">틱 1</text>
  <rect x="720" y="176" width="400" height="56" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="720" y="176" width="200" height="56" rx="8" fill="#4a8db8"/>
  <text x="820" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">큰 가맹점 500건</text>
  <rect x="923" y="176" width="14" height="56" rx="3" fill="#27ae60"/>
  <text x="923" y="252" font-size="10.5" fill="#27ae60">작은 가맹점 10건 — 당일 읽힘(0일)</text>

  <!-- ── 상한+재분배 : 틱 2 ── -->
  <text x="704" y="323" text-anchor="end" font-size="12" font-weight="700" fill="#334155">틱 2</text>
  <rect x="720" y="290" width="400" height="56" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="720" y="290" width="400" height="56" rx="8" fill="#4a8db8"/>
  <text x="920" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">큰 가맹점 1,000건</text>
  <text x="720" y="366" font-size="10.5" fill="#64748b">작은 가맹점은 이미 끝 — 남은 가맹점 하나가 틱 전부를 씀</text>

  <!-- ── 상한+재분배 : 틱 3 ── -->
  <text x="704" y="437" text-anchor="end" font-size="12" font-weight="700" fill="#334155">틱 3</text>
  <rect x="720" y="404" width="400" height="56" rx="8" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="720" y="404" width="400" height="56" rx="8" fill="#4a8db8"/>
  <text x="920" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">큰 가맹점 1,000건</text>
  <text x="720" y="480" font-size="10.5" fill="#64748b">큰 가맹점 2,500건 완료(셋째 틱)</text>

  <!-- ══ 패널 요약 ══ -->
  <line x1="84" y1="500" x2="556" y2="500" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">작은 가맹점 전건 정산 — 2일 지연</text>
  <text x="320" y="548" text-anchor="middle" font-size="10.5" fill="#64748b">큰 가맹점 2,500건 완료 — 2일</text>

  <line x1="664" y1="500" x2="1136" y2="500" stroke="#cbd5e1" stroke-width="1"/>
  <text x="900" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">작은 가맹점 전건 정산 — 0일(당일)</text>
  <text x="900" y="548" text-anchor="middle" font-size="10.5" fill="#64748b">큰 가맹점 2,500건 완료 — 2일</text>

  <!-- ══ 푸터 ══ -->
  <rect x="60" y="602" width="1080" height="64" rx="10" fill="#fef7ec" stroke="#e67e22" stroke-width="1"/>
  <text x="600" y="630" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">대가는 큰 가맹점이 낸다 — 첫날 가져가는 몫이 1,000 → 500건(절반)</text>
  <text x="600" y="652" text-anchor="middle" font-size="10.5" fill="#334155">막대 한 줄 = 그 틱의 용량 1,000건, 칠해진 길이가 읽힌 몫 · 작은 가맹점 10건 구간은 보이도록 최소 폭으로 표시</text>
</svg>
