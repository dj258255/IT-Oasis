<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <defs>
    <filter id="f1sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <filter id="f1shSm"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="f1ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1200" height="760" rx="12" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">규칙 잔여 분포 깔때기 — 320건을 심어도 남는 잔여는 40건</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">금액 8종 × 조건 8종 × 변형 5개 = 320건 · 규칙이 아무 후보도 못 낸 건만 남긴다</text>

  <!-- ══════ 깔때기 ══════ -->
  <text x="48" y="96" font-size="11" font-weight="700" fill="#64748b">깔때기 — 320건 → 실제 규칙 잔여 40건 → 남은 문 하나뿐</text>

  <rect x="40" y="108" width="380" height="204" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#f1sh)"/>
  <rect x="40" y="108" width="380" height="4" rx="10" fill="#4a8db8"/>
  <text x="230" y="154" text-anchor="middle" font-size="22" font-weight="800" fill="#4a8db8">320건</text>
  <text x="230" y="180" text-anchor="middle" font-size="10.5" fill="#64748b">사실 문장 — 대사 엔진이 만든 분포</text>
  <text x="230" y="208" text-anchor="middle" font-size="10" fill="#64748b">금액 8종 × 조건 8종 × 변형 5개</text>
  <text x="230" y="226" text-anchor="middle" font-size="10" fill="#64748b">조건 축만 정하고 문장은 엔진이 쓴다</text>
  <text x="230" y="260" text-anchor="middle" font-size="9" fill="#94a3b8">손으로 쓴 표본이 아니라</text>
  <text x="230" y="275" text-anchor="middle" font-size="9" fill="#94a3b8">실제로 오는 분포에서 재기 위한 첫 단계</text>
  <text x="230" y="296" text-anchor="middle" font-size="9" fill="#94a3b8">손으로 만든 27건은 실제로 오지 않을 건들이었음</text>

  <line x1="422" y1="210" x2="446" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1ar)"/>

  <rect x="450" y="126" width="300" height="168" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#f1sh)"/>
  <rect x="450" y="126" width="300" height="4" rx="10" fill="#27ae60"/>
  <text x="600" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#27ae60">40건</text>
  <text x="600" y="198" text-anchor="middle" font-size="10.5" fill="#64748b">실제 규칙 잔여</text>
  <text x="600" y="226" text-anchor="middle" font-size="10" fill="#64748b">규칙이 아무 후보도 못 낸 건만 남김</text>
  <text x="600" y="258" text-anchor="middle" font-size="9" fill="#94a3b8">손으로 쓴 12건·15건 표본과</text>
  <text x="600" y="273" text-anchor="middle" font-size="9" fill="#94a3b8">규모가 다르다</text>

  <line x1="752" y1="210" x2="776" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1ar)"/>

  <rect x="780" y="146" width="380" height="136" rx="10" fill="#fff" stroke="#9b59b6" stroke-width="2" filter="url(#f1sh)"/>
  <rect x="780" y="146" width="380" height="4" rx="10" fill="#9b59b6"/>
  <text x="970" y="194" text-anchor="middle" font-size="20" font-weight="800" fill="#9b59b6">문 하나</text>
  <text x="970" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">규칙이 못 내는 문 = “내부에만 있음” 한 줄</text>
  <text x="970" y="250" text-anchor="middle" font-size="9" fill="#94a3b8">금액 불일치는 배제법으로 걸러지고,</text>
  <text x="970" y="265" text-anchor="middle" font-size="9" fill="#94a3b8">외부에만 있음은 INTERNAL_RECORD_LOST</text>

  <!-- ══════ 결과 ══════ -->
  <rect x="40" y="340" width="1120" height="252" rx="12" fill="#eef6fb" stroke="#4a8db8" stroke-width="1"/>
  <text x="600" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1e5f8a">결과 — 세 모델 모두 0 / 40, 전부 INTERNAL_RECORD_LOST</text>

  <rect x="80" y="390" width="300" height="104" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#f1shSm)"/>
  <text x="230" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">qwen3:8b</text>
  <text x="230" y="458" text-anchor="middle" font-size="22" font-weight="800" fill="#e74c3c">0 / 40</text>
  <text x="230" y="480" text-anchor="middle" font-size="9" fill="#64748b">INTERNAL_RECORD_LOST</text>

  <rect x="450" y="390" width="300" height="104" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#f1shSm)"/>
  <text x="600" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">qwen3:14b</text>
  <text x="600" y="458" text-anchor="middle" font-size="22" font-weight="800" fill="#e74c3c">0 / 40</text>
  <text x="600" y="480" text-anchor="middle" font-size="9" fill="#64748b">INTERNAL_RECORD_LOST</text>

  <rect x="820" y="390" width="300" height="104" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#f1shSm)"/>
  <text x="970" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">llama3.1:8b</text>
  <text x="970" y="458" text-anchor="middle" font-size="22" font-weight="800" fill="#e74c3c">0 / 40</text>
  <text x="970" y="480" text-anchor="middle" font-size="9" fill="#64748b">INTERNAL_RECORD_LOST</text>

  <text x="600" y="526" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">신뢰도 95 · 96 · 100</text>
  <text x="600" y="552" text-anchor="middle" font-size="10.5" fill="#334155">뜻은 “PG에는 있는데 내부에 기록이 없음” — 사실은 정반대였다</text>
  <text x="600" y="574" text-anchor="middle" font-size="10.5" fill="#334155">정의가 없어서 틀린 1차와 달리, 이번엔 정의가 있는데도 틀렸다</text>

  <!-- ══════ 방향 반전 ══════ -->
  <rect x="40" y="612" width="1120" height="124" rx="10" fill="#fef7ec" stroke="#e67e22" stroke-width="1"/>
  <text x="600" y="642" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">방향이 뒤집힌 자리 — 차이를 만든 것은 모델이 아니라 표본</text>
  <line x1="600" y1="660" x2="600" y2="704" stroke="#e67e22" stroke-width="1" opacity="0.4"/>
  <text x="320" y="678" text-anchor="middle" font-size="11" fill="#64748b">손으로 쓴 표본 · qwen3:14b 홀드아웃 15건</text>
  <text x="320" y="702" text-anchor="middle" font-size="16" font-weight="800" fill="#27ae60">14 / 15</text>
  <text x="880" y="678" text-anchor="middle" font-size="11" fill="#64748b">엔진이 만든 분포 · 잔여 40건</text>
  <text x="880" y="702" text-anchor="middle" font-size="16" font-weight="800" fill="#e74c3c">0 / 40</text>
  <text x="600" y="724" text-anchor="middle" font-size="9.5" fill="#94a3b8">두 표본 다 문장은 내가 썼습니다 — 실제로 오는 분포에서 재야 했다</text>
</svg>
