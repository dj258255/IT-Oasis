<svg viewBox="0 0 1200 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <defs>
    <filter id="f2shSm"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="1200" height="1080" rx="12" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">좁혀서 켠 범위 — 잔여 272건 중 60건</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">잔여가 40 → 272건으로 늘어난 뒤, 유형별로 갈라 한 유형만 켰다</text>

  <!-- ══════ ① 켠 범위 ══════ -->
  <text x="48" y="98" font-size="11" font-weight="700" fill="#64748b">① 켠 범위 — 전체 잔여 272건</text>

  <rect x="40" y="110" width="246" height="58" rx="8" fill="#27ae60"/>
  <rect x="292" y="110" width="868" height="58" rx="8" fill="#e2e8f0"/>
  <text x="163" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">켠 유형 60건</text>
  <text x="163" y="155" text-anchor="middle" font-size="10" fill="#d9f2e4">약 22%</text>
  <text x="726" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">사람에게 가는 나머지 · 78%</text>

  <text x="40" y="186" font-size="9" fill="#94a3b8">0</text>
  <text x="286" y="186" text-anchor="middle" font-size="9" fill="#94a3b8">60</text>
  <text x="1160" y="186" text-anchor="end" font-size="9" fill="#94a3b8">272</text>

  <!-- ══════ ② 유형별 정확도 ══════ -->
  <text x="48" y="222" font-size="11" font-weight="700" fill="#64748b">② 유형별 정확도 — 전체는 25~40%, 맨 위 한 유형만 100%</text>

  <rect x="700" y="213" width="10" height="10" rx="2" fill="#4a8db8"/>
  <text x="716" y="222" font-size="9.5" fill="#64748b">qwen3:14b</text>
  <rect x="806" y="213" width="10" height="10" rx="2" fill="#27ae60"/>
  <text x="822" y="222" font-size="9.5" fill="#64748b">qwen3:8b</text>
  <rect x="912" y="213" width="10" height="10" rx="2" fill="#e67e22"/>
  <text x="928" y="222" font-size="9.5" fill="#64748b">llama3.1:8b</text>

  <line x1="70" y1="254" x2="1140" y2="254" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="384" x2="1140" y2="384" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="514" x2="1140" y2="514" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="258" text-anchor="end" font-size="9" fill="#94a3b8">100%</text>
  <text x="62" y="388" text-anchor="end" font-size="9" fill="#94a3b8">50%</text>
  <text x="62" y="518" text-anchor="end" font-size="9" fill="#94a3b8">0%</text>

  <!-- PG엔 있고 우리엔 없음 : 100 / 100 / 100 -->
  <rect x="122" y="254" width="44" height="260" rx="4" fill="#4a8db8"/>
  <rect x="182" y="254" width="44" height="260" rx="4" fill="#27ae60"/>
  <rect x="242" y="254" width="44" height="260" rx="4" fill="#e67e22"/>
  <text x="144" y="246" text-anchor="middle" font-size="9" font-weight="700" fill="#4a8db8">100%</text>
  <text x="204" y="246" text-anchor="middle" font-size="9" font-weight="700" fill="#27ae60">100%</text>
  <text x="264" y="246" text-anchor="middle" font-size="9" font-weight="700" fill="#e67e22">100%</text>

  <!-- 기권해야 하는 건 : 30 / 50 / 0 -->
  <rect x="392" y="436" width="44" height="78" rx="4" fill="#4a8db8"/>
  <rect x="452" y="384" width="44" height="130" rx="4" fill="#27ae60"/>
  <text x="414" y="428" text-anchor="middle" font-size="9" font-weight="700" fill="#4a8db8">30%</text>
  <text x="474" y="376" text-anchor="middle" font-size="9" font-weight="700" fill="#27ae60">50%</text>
  <text x="534" y="508" text-anchor="middle" font-size="9" fill="#94a3b8">0%</text>

  <!-- 같은 거래가 여러 행 : 30 / 0 / 0 -->
  <rect x="662" y="436" width="44" height="78" rx="4" fill="#4a8db8"/>
  <text x="684" y="428" text-anchor="middle" font-size="9" font-weight="700" fill="#4a8db8">30%</text>
  <text x="744" y="508" text-anchor="middle" font-size="9" fill="#94a3b8">0%</text>
  <text x="804" y="508" text-anchor="middle" font-size="9" fill="#94a3b8">0%</text>

  <!-- 부분취소 미반영 : 0 / 0 / 0 -->
  <text x="954" y="508" text-anchor="middle" font-size="9" fill="#94a3b8">0%</text>
  <text x="1014" y="508" text-anchor="middle" font-size="9" fill="#94a3b8">0%</text>
  <text x="1074" y="508" text-anchor="middle" font-size="9" fill="#94a3b8">0%</text>

  <text x="204" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">PG엔 있고 우리엔 없음</text>
  <text x="474" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">기권해야 하는 건</text>
  <text x="744" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">같은 거래가 여러 행</text>
  <text x="1014" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">부분취소 미반영</text>

  <text x="600" y="572" text-anchor="middle" font-size="10.5" fill="#334155">전체는 25~40%인데 한 유형은 60건 중 60건 — 사실이 “파일에 있고 내부에 없다”로 단순하고 안 겹친다</text>
  <text x="600" y="592" text-anchor="middle" font-size="10" fill="#94a3b8">반대로 값을 그 하나로 줄이니 60건 중 대부분을 그 하나로 찍어 정확도가 15%로 떨어졌다</text>

  <!-- ══════ ③ 좁히기 전 → 후 ══════ -->
  <text x="48" y="628" font-size="11" font-weight="700" fill="#64748b">③ 판정 기준을 명시한 뒤 — 같은 60건</text>

  <rect x="70" y="640" width="330" height="120" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#f2shSm)"/>
  <text x="235" y="666" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">qwen3:14b</text>
  <text x="155" y="694" text-anchor="middle" font-size="9" fill="#94a3b8">좁히기 전</text>
  <text x="315" y="694" text-anchor="middle" font-size="9" fill="#94a3b8">후</text>
  <text x="155" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b">40%</text>
  <text x="235" y="720" text-anchor="middle" font-size="14" fill="#94a3b8">→</text>
  <text x="315" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="#27ae60">100%</text>
  <text x="315" y="742" text-anchor="middle" font-size="8.5" fill="#94a3b8">60 / 60</text>

  <rect x="435" y="640" width="330" height="120" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5" filter="url(#f2shSm)"/>
  <text x="600" y="666" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">qwen3:8b</text>
  <text x="520" y="694" text-anchor="middle" font-size="9" fill="#94a3b8">좁히기 전</text>
  <text x="680" y="694" text-anchor="middle" font-size="9" fill="#94a3b8">후</text>
  <text x="520" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b">37%</text>
  <text x="600" y="720" text-anchor="middle" font-size="14" fill="#94a3b8">→</text>
  <text x="680" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="#27ae60">100%</text>
  <text x="680" y="742" text-anchor="middle" font-size="8.5" fill="#94a3b8">60 / 60</text>

  <rect x="800" y="640" width="330" height="120" rx="10" fill="#fff" stroke="#e67e22" stroke-width="1.5" filter="url(#f2shSm)"/>
  <text x="965" y="666" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">llama3.1:8b</text>
  <text x="885" y="694" text-anchor="middle" font-size="9" fill="#94a3b8">좁히기 전</text>
  <text x="1045" y="694" text-anchor="middle" font-size="9" fill="#94a3b8">후</text>
  <text x="885" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b">25%</text>
  <text x="965" y="720" text-anchor="middle" font-size="14" fill="#94a3b8">→</text>
  <text x="1045" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="#27ae60">91%</text>
  <text x="1045" y="742" text-anchor="middle" font-size="8.5" fill="#94a3b8">55 / 60</text>

  <!-- ══════ ④ 새 표본 45건 ══════ -->
  <text x="48" y="794" font-size="11" font-weight="700" fill="#64748b">④ 새 표본 45건 — 프롬프트를 한 글자도 안 바꾸고 다시 잰 결과</text>

  <rect x="40" y="806" width="1120" height="226" rx="10" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="72" y="838" font-size="10.5" font-weight="700" fill="#64748b">유형</text>
  <text x="372" y="838" font-size="10.5" font-weight="700" fill="#64748b">정답</text>
  <text x="660" y="838" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a8db8">qwen3:14b</text>
  <text x="870" y="838" text-anchor="middle" font-size="10.5" font-weight="700" fill="#27ae60">qwen3:8b</text>
  <text x="1075" y="838" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e67e22">llama3.1:8b</text>

  <line x1="52" y1="850" x2="1148" y2="850" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="882" font-size="11.5" fill="#334155">외부에만 있음</text>
  <text x="372" y="882" font-size="11.5" fill="#334155">INTERNAL_RECORD_LOST</text>
  <text x="660" y="882" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">15 / 15</text>
  <text x="870" y="882" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">15 / 15</text>
  <text x="1075" y="882" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">15 / 15</text>

  <line x1="52" y1="894" x2="1148" y2="894" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="926" font-size="11.5" fill="#334155">금액만 다름</text>
  <text x="372" y="926" font-size="11.5" fill="#334155">기권</text>
  <text x="660" y="926" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">15 / 15</text>
  <text x="870" y="926" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">0 / 15</text>
  <text x="1075" y="926" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">10 / 15</text>

  <line x1="52" y1="938" x2="1148" y2="938" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="52" y="944" width="1096" height="42" fill="#e74c3c" fill-opacity="0.08"/>
  <text x="72" y="970" font-size="11.5" font-weight="700" fill="#b91c1c">내부에만 있음</text>
  <text x="372" y="970" font-size="11.5" fill="#334155">기권</text>
  <text x="660" y="970" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">0 / 15</text>
  <text x="870" y="970" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">0 / 15</text>
  <text x="1075" y="970" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">0 / 15</text>

  <line x1="52" y1="998" x2="1148" y2="998" stroke="#cbd5e1" stroke-width="1"/>
  <text x="72" y="1020" font-size="11.5" font-weight="700" fill="#1e293b">전체</text>
  <text x="372" y="1020" font-size="11.5" fill="#94a3b8">—</text>
  <text x="660" y="1020" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">67%</text>
  <text x="870" y="1020" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">33%</text>
  <text x="1075" y="1020" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">56%</text>

  <text x="600" y="1058" text-anchor="middle" font-size="10.5" fill="#334155">켠 유형은 살아남았고 무너진 건 기권해야 할 쪽 — 0 / 15가 전부 그 값이 되고 유형 가드도 신뢰도(95~100)도 다 통과</text>
</svg>
