<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a8db8"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#27ae60"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e74c3c"/></marker>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="600" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">같은 취소 이벤트, 두 가지 기록</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">승인 10,000원(승인일) · 대사 MATCHED 확정(판정 10,000) 뒤에 3,000원 부분취소가 도착</text>

  <!-- 공통 출발점 -->
  <rect x="360" y="84" width="480" height="64" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="1.5"/>
  <text x="600" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e5f8a">공통 출발점</text>
  <text x="600" y="133" text-anchor="middle" font-size="10" fill="#334155">승인 10,000 · MATCHED 확정 · 판정 10,000</text>

  <!-- 갈라지는 화살표 -->
  <polyline points="600,148 600,166 315,166 315,190" fill="none" stroke="#4a8db8" stroke-width="1.6" marker-end="url(#ar)"/>
  <polyline points="600,148 600,166 885,166 885,190" fill="none" stroke="#4a8db8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 열 제목 -->
  <rect x="60" y="196" width="510" height="46" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <rect x="60" y="196" width="510" height="4" rx="10" fill="#e74c3c"/>
  <text x="315" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">고치기 전 · 승인 행을 덮어씀</text>

  <rect x="630" y="196" width="510" height="46" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <rect x="630" y="196" width="510" height="4" rx="10" fill="#27ae60"/>
  <text x="885" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">고친 후 · 취소일 음수 행을 따로 쌓음</text>

  <!-- 고치기 전 시퀀스 -->
  <rect x="60" y="262" width="510" height="50" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="315" y="284" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">취소 이벤트 도착</text>
  <text x="315" y="301" text-anchor="middle" font-size="9.5" fill="#64748b">3,000원 부분취소 · 남은금액 7,000</text>

  <rect x="60" y="330" width="510" height="50" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="315" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">applySettleableBalance(남은금액)</text>
  <text x="315" y="369" text-anchor="middle" font-size="9.5" fill="#64748b">취소 이벤트를 받으면 남은금액으로 반영</text>

  <rect x="60" y="398" width="510" height="50" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="315" y="420" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">승인 행 10,000 → 7,000</text>
  <text x="315" y="437" text-anchor="middle" font-size="9.5" fill="#64748b">덮어씀 · 취소 기록은 남지 않음</text>

  <!-- 고친 후 시퀀스 -->
  <rect x="630" y="262" width="510" height="50" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="885" y="284" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">취소 이벤트 도착</text>
  <text x="885" y="301" text-anchor="middle" font-size="9.5" fill="#64748b">3,000원 부분취소 · 남은금액 7,000</text>

  <rect x="630" y="330" width="510" height="50" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="885" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">취소일 행을 따로 쌓음</text>
  <text x="885" y="369" text-anchor="middle" font-size="9.5" fill="#64748b">원 거래(승인) 행은 손대지 않음</text>

  <rect x="630" y="398" width="510" height="50" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="885" y="420" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">seq 0 : +10,000 (승인일) 그대로</text>
  <text x="885" y="437" text-anchor="middle" font-size="9.5" fill="#64748b">seq 1 : −3,000 (취소일) 새 행</text>

  <!-- 결과 -->
  <rect x="60" y="464" width="510" height="104" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="315" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">내부 스냅샷(지금) 7,000</text>
  <text x="315" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">대사 판정(확정된 것) 10,000</text>
  <text x="315" y="546" text-anchor="middle" font-size="10.5" fill="#64748b">갈라짐 · 다시 돌릴 계기가 없음</text>

  <rect x="630" y="464" width="510" height="104" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="885" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">확정된 판정 10,000 그대로</text>
  <text x="885" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">승인 행 10,000 · 취소 행 −3,000</text>
  <text x="885" y="546" text-anchor="middle" font-size="10.5" fill="#64748b">일치 유지</text>

  <!-- 푸터 -->
  <rect x="60" y="592" width="1080" height="58" rx="10" fill="#fef7ec" stroke="#e67e22" stroke-width="1"/>
  <text x="600" y="618" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">유니크 제약은 없애지 않고 넓혔다</text>
  <text x="600" y="640" text-anchor="middle" font-size="10.5" fill="#334155">order_no 하나 → (order_no, seq) · DB가 마지막 방어선</text>

  <!-- 시퀀스 화살표 -->
  <line x1="315" y1="242" x2="315" y2="258" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#arR)"/>
  <line x1="315" y1="312" x2="315" y2="326" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#arR)"/>
  <line x1="315" y1="380" x2="315" y2="394" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#arR)"/>
  <line x1="315" y1="448" x2="315" y2="460" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#arR)"/>

  <line x1="885" y1="242" x2="885" y2="258" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arG)"/>
  <line x1="885" y1="312" x2="885" y2="326" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arG)"/>
  <line x1="885" y1="380" x2="885" y2="394" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arG)"/>
  <line x1="885" y1="448" x2="885" y2="460" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arG)"/>
</svg>
