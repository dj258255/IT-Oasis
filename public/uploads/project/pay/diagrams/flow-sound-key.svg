<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">한글 이름이 로마자 후보로 펼쳐지고 소리 키로 수렴</text>
  <text x="40" y="66" font-size="12" fill="#64748b">여섯 표기가 하나로 모인다. 소리 키가 맞으면 사람에게 보내는 임계까지만 올린다.</text>

  <!-- 칸 머리 -->
  <text x="475" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">쓸 법한 로마자 후보</text>
  <text x="475" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">여섯 다 맞는 표기 — 잘못 쓴 것이 하나도 없다</text>

  <!-- 펼침 -->
  <line x1="210" y1="301" x2="400" y2="151" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="210" y1="301" x2="400" y2="211" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="210" y1="301" x2="400" y2="271" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="210" y1="301" x2="400" y2="331" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="210" y1="301" x2="400" y2="391" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="210" y1="301" x2="400" y2="451" stroke="#94a3b8" stroke-width="1.3"/>

  <!-- 수렴 -->
  <line x1="550" y1="151" x2="760" y2="301" stroke="#27ae60" stroke-width="1.3"/>
  <line x1="550" y1="211" x2="760" y2="301" stroke="#27ae60" stroke-width="1.3"/>
  <line x1="550" y1="271" x2="760" y2="301" stroke="#27ae60" stroke-width="1.3"/>
  <line x1="550" y1="331" x2="760" y2="301" stroke="#27ae60" stroke-width="1.3"/>
  <line x1="550" y1="391" x2="760" y2="301" stroke="#27ae60" stroke-width="1.3"/>
  <line x1="550" y1="451" x2="760" y2="301" stroke="#27ae60" stroke-width="1.3"/>

  <!-- 단계 이름 -->
  <text x="300" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">펼치기</text>
  <text x="670" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">수렴</text>

  <!-- 한글 이름 -->
  <rect x="60" y="256" width="150" height="90" rx="10" fill="#eef6fb" stroke="#4a8db8" stroke-width="2"/>
  <text x="135" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">한글 이름</text>
  <text x="135" y="322" text-anchor="middle" font-size="10" fill="#64748b">판매자 대표자 이름</text>

  <!-- 후보 여섯 -->
  <rect x="400" y="128" width="150" height="46" rx="8" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="475" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Park</text>
  <rect x="400" y="188" width="150" height="46" rx="8" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="475" y="217" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Bak</text>
  <rect x="400" y="248" width="150" height="46" rx="8" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="475" y="277" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Pak</text>
  <rect x="400" y="308" width="150" height="46" rx="8" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="475" y="337" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Bahk</text>
  <rect x="400" y="368" width="150" height="46" rx="8" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="475" y="397" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Pahk</text>
  <rect x="400" y="428" width="150" height="46" rx="8" fill="#ffffff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="475" y="457" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Back</text>

  <!-- 소리 키 -->
  <rect x="760" y="256" width="150" height="90" rx="10" fill="#f0faf4" stroke="#27ae60" stroke-width="2.5"/>
  <text x="835" y="304" text-anchor="middle" font-size="26" font-weight="800" fill="#1e293b">PAK</text>
  <text x="835" y="326" text-anchor="middle" font-size="10.5" fill="#27ae60">소리 키</text>

  <!-- 각주 -->
  <rect x="40" y="516" width="920" height="72" rx="10" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="542" font-size="12" fill="#334155">여섯 표기가 하나로 모인다 — 잘못 쓴 것이 하나도 없는 표기들이다.</text>
  <text x="60" y="562" font-size="12" fill="#334155">Soundex를 그대로 쓰면 첫 글자가 남아 Park(P620)과 Bak(B200)이 다른 키가 된다.</text>
  <text x="60" y="582" font-size="12" fill="#334155">소리 키가 맞으면 사람에게 보내는 임계까지만 올리고, 일치로 확정하지는 않는다.</text>
</svg>
