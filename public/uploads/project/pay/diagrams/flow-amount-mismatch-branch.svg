<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a8db8"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e67e22"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#27ae60"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e74c3c"/></marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">대사 금액 불일치 갈래 — 위변조 의심 앞에 중복 기록 분기 끼우기</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">중복 기록은 별도 유형으로 오지 않고, 외부가 내부의 정수배인 금액 불일치로 나타난다</text>

  <!-- ══ 기존 ══ -->
  <rect x="40" y="90" width="1120" height="130" rx="14" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="118" font-size="12.5" font-weight="700" fill="#e74c3c">기존 — 수수료·취소가 아니면 곧바로 위변조 의심</text>

  <rect x="64" y="136" width="210" height="72" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="64" y="136" width="210" height="4" rx="10" fill="#4a8db8"/>
  <text x="169" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">금액 불일치</text>
  <text x="169" y="186" text-anchor="middle" font-size="9" fill="#64748b">외부 합계 ≠ 내부 기록</text>

  <rect x="314" y="136" width="230" height="72" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="314" y="136" width="230" height="4" rx="10" fill="#4a8db8"/>
  <text x="429" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">수수료 차이 · 취소 미반영</text>
  <text x="429" y="186" text-anchor="middle" font-size="9" fill="#64748b">앞선 갈래가 먼저 처리</text>

  <rect x="760" y="136" width="300" height="72" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2" filter="url(#sh)"/>
  <rect x="760" y="136" width="300" height="4" rx="10" fill="#e74c3c"/>
  <text x="910" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e74c3c">위변조 의심</text>
  <text x="910" y="186" text-anchor="middle" font-size="9" fill="#64748b">수수료도 취소도 아니면</text>
  <text x="910" y="202" text-anchor="middle" font-size="9" fill="#94a3b8">평범한 PG 파일 중복에도 딱지</text>

  <line x1="274" y1="172" x2="310" y2="172" stroke="#4a8db8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="544" y1="172" x2="756" y2="172" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arO)"/>
  <text x="650" y="164" text-anchor="middle" font-size="9.5" fill="#b45309">아니면 (마지막 갈래)</text>

  <!-- ══ 신규 ══ -->
  <rect x="40" y="250" width="1120" height="290" rx="14" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="278" font-size="12.5" font-weight="700" fill="#27ae60">신규 — 정수배면 중복 기록(유력)으로 갈라 냄</text>

  <rect x="64" y="300" width="190" height="76" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="64" y="300" width="190" height="4" rx="10" fill="#4a8db8"/>
  <text x="159" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">금액 불일치</text>
  <text x="159" y="352" text-anchor="middle" font-size="9" fill="#64748b">외부 합계 ≠ 내부</text>

  <rect x="294" y="300" width="190" height="76" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="294" y="300" width="190" height="4" rx="10" fill="#4a8db8"/>
  <text x="389" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">수수료 · 취소 갈래</text>
  <text x="389" y="352" text-anchor="middle" font-size="9" fill="#64748b">앞선 갈래가 먼저 처리</text>

  <rect x="524" y="300" width="270" height="76" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#sh)"/>
  <rect x="524" y="300" width="270" height="4" rx="10" fill="#e67e22"/>
  <text x="659" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">외부 합계 = 내부 × 정수배?</text>
  <text x="659" y="346" text-anchor="middle" font-size="9" fill="#64748b">(-diff) % internal == 0</text>
  <text x="659" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">배수인지는 나눗셈</text>

  <rect x="860" y="252" width="280" height="76" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#sh)"/>
  <rect x="860" y="252" width="280" height="4" rx="10" fill="#27ae60"/>
  <text x="1000" y="282" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">중복 기록 (유력)</text>
  <text x="1000" y="302" text-anchor="middle" font-size="9" fill="#64748b">DUPLICATE_RECORD</text>
  <text x="1000" y="320" text-anchor="middle" font-size="9" fill="#94a3b8">PG 파일에 같은 줄이 두 번</text>

  <rect x="860" y="396" width="280" height="76" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2" filter="url(#sh)"/>
  <rect x="860" y="396" width="280" height="4" rx="10" fill="#e74c3c"/>
  <text x="1000" y="426" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e74c3c">위변조 의심</text>
  <text x="1000" y="446" text-anchor="middle" font-size="9" fill="#64748b">정수배로도 설명이 안 됨</text>
  <text x="1000" y="464" text-anchor="middle" font-size="9" fill="#94a3b8">사람이 확인</text>

  <line x1="254" y1="338" x2="290" y2="338" stroke="#4a8db8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="484" y1="338" x2="520" y2="338" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arO)"/>
  <text x="502" y="328" text-anchor="middle" font-size="9.5" fill="#b45309">아니면</text>
  <line x1="794" y1="338" x2="856" y2="294" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arG)"/>
  <text x="818" y="300" text-anchor="middle" font-size="9.5" fill="#1e7a45">정수배</text>
  <line x1="794" y1="338" x2="856" y2="430" stroke="#e74c3c" stroke-width="1.8" marker-end="url(#arR)"/>
  <text x="820" y="424" text-anchor="middle" font-size="9.5" fill="#c0392b">아니면</text>

  <!-- Note -->
  <text x="600" y="572" text-anchor="middle" font-size="10.5" fill="#334155">중복으로 설명되면 위변조 의심을 함께 내지 않습니다 · 결정적이 아니라 유력으로 냈습니다</text>
  <text x="600" y="594" text-anchor="middle" font-size="10.5" fill="#334155">결제가 실제로 두 번 일어났는데 한 건만 남은 경우도 숫자가 같아 산수로 안 갈리므로 사람이 봐야 합니다</text>
</svg>
