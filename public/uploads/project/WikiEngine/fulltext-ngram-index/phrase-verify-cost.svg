<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .heading { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .detail { font-size: 11px; fill: #475569; }
    .num { font-size: 11px; fill: #ef4444; font-weight: 700; font-family: 'Consolas', monospace; }
    .note { font-size: 10.5px; fill: #64748b; }
    .box { fill: #fef2f2; stroke: #ef4444; stroke-width: 1; rx: 6; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
  </style>

  <text x="16" y="18" class="heading">"대한"이 한 문서에 50번 등장 시:</text>
  <text x="16" y="38" class="detail">positions 배열에 50개의 바이트 오프셋</text>
  <text x="16" y="54" class="detail">각 위치에서 "한민"이 바로 다음에 오는지 확인 --> "민국"도 확인</text>
  <text x="16" y="70" class="detail">최악: </text><text x="55" y="70" class="num">50 x 2 = 100회 비교</text><text x="215" y="70" class="note">(이 문서 하나에 대해)</text>

  <line x1="16" y1="82" x2="684" y2="82" class="divider"/>

  <rect x="16" y="90" width="668" height="56" class="box"/>
  <text x="28" y="110" class="detail">교집합 후 30,000건이 남는다면:</text>
  <text x="28" y="126" class="num">30,000 문서 x 문서당 평균 N회 위치 확인</text>
  <text x="28" y="140" class="detail">전체: O(후보 문서 수 x 문서당 평균 출현 횟수 x 토큰 수) -- 순차 탐색</text>
</svg>
