<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 130" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .heading { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .token { font-size: 12px; fill: #7c3aed; font-weight: 600; font-family: 'Consolas', monospace; }
    .ok { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 6; }
    .fail { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 6; }
    .ok-text { font-size: 12px; fill: #22c55e; font-weight: 700; }
    .fail-text { font-size: 12px; fill: #ef4444; font-weight: 700; }
    .doc { font-size: 12px; fill: #1e293b; font-weight: 500; }
    .note { font-size: 10.5px; fill: #64748b; }
  </style>

  <text x="16" y="18" class="heading">"한국어" 검색 시 토큰:</text>
  <text x="160" y="18" class="token">["한국", "국어"]</text>

  <rect x="16" y="30" width="620" height="28" class="ok"/>
  <text x="28" y="49" class="ok-text">O</text>
  <text x="50" y="49" class="doc">"한국어 문법"</text>
  <text x="250" y="49" class="note">의도한 결과</text>

  <rect x="16" y="64" width="620" height="28" class="fail"/>
  <text x="28" y="83" class="fail-text">X</text>
  <text x="50" y="83" class="doc">"대한국제공항"</text>
  <text x="250" y="83" class="note">"한국" 토큰이 매칭 (오탐)</text>

  <rect x="16" y="98" width="620" height="28" class="fail"/>
  <text x="28" y="117" class="fail-text">X</text>
  <text x="50" y="117" class="doc">"미국어학연수"</text>
  <text x="250" y="117" class="note">"국어" 토큰이 매칭 (오탐)</text>
</svg>
