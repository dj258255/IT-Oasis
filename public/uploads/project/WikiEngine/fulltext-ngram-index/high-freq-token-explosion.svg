<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .slow { fill: #fef2f2; stroke: #ef4444; }
    .fast { fill: #f0fdf4; stroke: #22c55e; }
    .token { font-size: 13px; fill: #7c3aed; font-weight: 700; font-family: 'Consolas', monospace; }
    .detail { font-size: 11px; fill: #475569; }
    .time { font-size: 13px; font-weight: 700; }
    .time-slow { fill: #ef4444; }
    .time-fast { fill: #22c55e; }
    .count { font-size: 11px; fill: #64748b; font-style: italic; }
  </style>

  <rect x="12" y="8" width="676" height="56" class="box slow"/>
  <text x="28" y="28" class="token">"대한"</text><text x="80" y="28" class="count">토큰 1개 -- 교집합 없음</text>
  <text x="28" y="48" class="detail">posting list에서 196,593개 문서 전부 반환 --> 각 문서 위치 확인 + 랭킹</text>
  <text x="540" y="28" class="detail">O(196,593 x N)</text>
  <text x="540" y="48" class="time time-slow">5초+ 타임아웃</text>

  <rect x="12" y="76" width="676" height="56" class="box fast"/>
  <text x="28" y="96" class="token">"페텔"</text><text x="80" y="96" class="count">토큰 1개 -- 희귀 토큰</text>
  <text x="28" y="116" class="detail">posting list에서 406개 문서만 반환 --> O(406 x N)</text>
  <text x="540" y="116" class="time time-fast">23ms</text>
</svg>
