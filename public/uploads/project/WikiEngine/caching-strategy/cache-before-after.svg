<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .heading { font-size: 13px; fill: #1e293b; font-weight: 700; }
    .badge-red { fill: #ef4444; }
    .badge-green { fill: #22c55e; }
    .badge-text { font-size: 11px; fill: #fff; font-weight: 600; }
    .text { font-size: 12px; fill: #334155; font-weight: 500; }
    .text-bold { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .num { font-size: 13px; fill: #7c3aed; font-weight: 700; font-family: 'Consolas', monospace; }
    .note { font-size: 11px; fill: #94a3b8; }
    .box-before { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
    .box-after { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 8; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#ah2); }
    .icon { font-size: 14px; fill: #64748b; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Before -->
  <rect x="16" y="12" width="688" height="100" class="box-before"/>
  <rect x="28" y="20" width="88" height="22" rx="4" class="badge-red"/>
  <text x="72" y="35" text-anchor="middle" class="badge-text">캐시 없음</text>

  <text x="36" y="60" class="text-bold">100명이 "대한민국" 검색</text>
  <path d="M 250 57 L 290 57" class="arrow"/>
  <text x="300" y="60" class="text">Lucene 검색</text>
  <text x="395" y="60" class="num">100회</text>
  <text x="440" y="60" class="text">+ DB 엔티티 조회</text>
  <text x="580" y="60" class="num">100회</text>

  <text x="36" y="86" class="note">모든 요청이 Lucene BM25 스코어링 + DB SELECT를 반복 실행</text>
  <text x="36" y="102" class="note">99회는 동일한 결과를 다시 계산하는 낭비</text>

  <!-- 화살표 -->
  <text x="350" y="132" text-anchor="middle" class="icon">v</text>

  <!-- After -->
  <rect x="16" y="142" width="688" height="108" class="box-after"/>
  <rect x="28" y="150" width="120" height="22" rx="4" class="badge-green"/>
  <text x="88" y="165" text-anchor="middle" class="badge-text">Caffeine 캐시 적용</text>

  <text x="36" y="192" class="text-bold">100명이 "대한민국" 검색</text>
  <path d="M 250 189 L 290 189" class="arrow"/>
  <text x="300" y="192" class="text">Lucene 검색</text>
  <text x="395" y="192" class="num">1회</text>
  <text x="425" y="192" class="text">+ DB 조회</text>
  <text x="505" y="192" class="num">1회</text>
  <text x="535" y="192" class="text">+ 캐시 반환</text>
  <text x="630" y="192" class="num">99회</text>

  <text x="36" y="218" class="note">첫 요청만 Lucene + DB를 거치고, 나머지 99회는 JVM 메모리에서 즉시 반환</text>
  <text x="36" y="238" class="text-bold">Lucene + DB 부하 99% 감소</text>
  <text x="260" y="238" class="note">(해당 검색어에 대해)</text>
</svg>
