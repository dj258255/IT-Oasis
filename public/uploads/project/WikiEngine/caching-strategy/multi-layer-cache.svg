<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .client { fill: #f0fdf4; stroke: #22c55e; }
    .cdn { fill: #faf5ff; stroke: #a855f7; }
    .api { fill: #eff6ff; stroke: #3b82f6; }
    .caffeine { fill: #fef3c7; stroke: #f59e0b; }
    .redis { fill: #fce7f3; stroke: #ec4899; }
    .mysql { fill: #f1f5f9; stroke: #64748b; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; font-weight: 500; }
    .layer { font-size: 10px; fill: #fff; font-weight: 600; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#ah3); }
    .note { font-size: 10px; fill: #94a3b8; font-style: italic; }
  </style>
  <defs>
    <marker id="ah3" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="16" y="90" width="72" height="44" class="box client"/>
  <text x="52" y="116" text-anchor="middle" class="label">Client</text>

  <path d="M 88 112 L 110 112" class="arrow"/>

  <!-- CDN -->
  <rect x="114" y="70" width="110" height="76" class="box cdn"/>
  <rect x="124" y="76" width="28" height="16" rx="3" fill="#a855f7"/>
  <text x="138" y="88" text-anchor="middle" class="layer">L3</text>
  <text x="160" y="88" class="label">CDN</text>
  <text x="124" y="106" class="sub">정적 자원</text>
  <text x="124" y="120" class="sub">인기 페이지</text>

  <path d="M 224 112 L 248 112" class="arrow"/>

  <!-- API Server box -->
  <rect x="252" y="16" width="444" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="268" y="36" class="label" fill="#64748b">API Server</text>

  <!-- Caffeine L1 -->
  <rect x="274" y="50" width="190" height="70" class="box caffeine"/>
  <rect x="284" y="56" width="28" height="16" rx="3" fill="#f59e0b"/>
  <text x="298" y="68" text-anchor="middle" class="layer">L1</text>
  <text x="320" y="68" class="label">Caffeine</text>
  <text x="284" y="86" class="sub">인기 검색어 + 자동완성</text>
  <text x="284" y="100" class="sub">TTL 5분</text>
  <text x="360" y="100" class="note">< 0.1ms</text>

  <path d="M 370 120 L 370 140" class="arrow"/>

  <!-- Redis L2 -->
  <rect x="274" y="144" width="190" height="62" class="box redis"/>
  <rect x="284" y="150" width="28" height="16" rx="3" fill="#ec4899"/>
  <text x="298" y="162" text-anchor="middle" class="layer">L2</text>
  <text x="320" y="162" class="label">Redis</text>
  <text x="284" y="180" class="sub">전체 검색 결과, TTL 30분</text>
  <text x="284" y="194" class="note">서버 여러 대일 때만</text>

  <!-- MySQL -->
  <rect x="496" y="80" width="180" height="76" class="box mysql"/>
  <text x="516" y="104" class="label">MySQL</text>
  <text x="516" y="120" class="sub">Source of Truth</text>
  <text x="516" y="140" class="sub">posts 1,477만 건</text>

  <!-- Arrows between layers -->
  <path d="M 464 100 L 494 108" class="arrow"/>
  <path d="M 464 175 L 494 138" class="arrow"/>
</svg>
