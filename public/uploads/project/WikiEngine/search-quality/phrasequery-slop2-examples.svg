<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .heading { font-size: 13px; fill: #1e293b; font-weight: 700; }
    .query { font-size: 14px; fill: #7c3aed; font-weight: 600; font-family: 'Consolas', monospace; }
    .doc-text { font-size: 13px; fill: #334155; font-weight: 500; }
    .match-text { font-size: 13px; fill: #3b82f6; font-weight: 700; }
    .move-count { font-size: 11px; fill: #64748b; font-weight: 500; }
    .result-ok { font-size: 13px; fill: #22c55e; font-weight: 700; }
    .result-fail { font-size: 13px; fill: #ef4444; font-weight: 700; }
    .ok-bg { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 8; }
    .fail-bg { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
    .badge { font-size: 11px; fill: #fff; font-weight: 600; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    .note { font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- 헤더 -->
  <rect x="12" y="8" width="180" height="22" rx="4" fill="#7c3aed"/>
  <text x="102" y="23" text-anchor="middle" class="badge">PhraseQuery(slop=2) 매칭</text>

  <text x="20" y="52" class="heading">검색어:</text>
  <text x="75" y="52" class="query">"인공지능 기술"</text>
  <text x="230" y="52" class="note">편집 거리(term 이동 횟수) 2 이내면 매칭</text>

  <!-- 구분선 -->
  <line x1="12" y1="66" x2="688" y2="66" class="divider"/>

  <!-- 예시 1: O 매칭 -->
  <rect x="12" y="76" width="668" height="44" class="ok-bg"/>
  <text x="28" y="96" class="result-ok">O</text>
  <text x="52" y="96" class="doc-text">"<tspan class="match-text">인공지능</tspan> 관련 <tspan class="match-text">기술</tspan>"</text>
  <text x="350" y="96" class="move-count">1회 이동</text>
  <rect x="420" y="84" width="50" height="22" rx="4" fill="#22c55e"/>
  <text x="445" y="99" text-anchor="middle" class="badge">매칭</text>
  <text x="486" y="99" class="note">"관련"이 사이에 삽입 (slop 1 소비)</text>

  <!-- 예시 2: O 매칭 (역전) -->
  <rect x="12" y="130" width="668" height="44" class="ok-bg"/>
  <text x="28" y="150" class="result-ok">O</text>
  <text x="52" y="150" class="doc-text">"<tspan class="match-text">기술</tspan>과 <tspan class="match-text">인공지능</tspan>"</text>
  <text x="350" y="150" class="move-count">2회 이동</text>
  <rect x="420" y="138" width="50" height="22" rx="4" fill="#22c55e"/>
  <text x="445" y="153" text-anchor="middle" class="badge">매칭</text>
  <text x="486" y="153" class="note">순서 역전 = 2회 이동 (slop=2면 허용)</text>

  <!-- 예시 3: X 실패 -->
  <rect x="12" y="184" width="668" height="44" class="fail-bg"/>
  <text x="28" y="204" class="result-fail">X</text>
  <text x="52" y="204" class="doc-text">"<tspan class="match-text">인공지능</tspan>을 활용한 새로운 <tspan class="match-text">기술</tspan>"</text>
  <text x="350" y="204" class="move-count">3회 이동</text>
  <rect x="420" y="192" width="70" height="22" rx="4" fill="#ef4444"/>
  <text x="455" y="207" text-anchor="middle" class="badge">범위 초과</text>
  <text x="506" y="207" class="note">slop=2 초과 (3회 이동 필요)</text>

  <!-- 하단 설명 -->
  <text x="20" y="250" class="note">slop은 단순 position 차이가 아닌 편집 거리(term 이동 횟수). 순서 역전 = 2회 이동이 필요하므로 slop=2면 2-term 역전도 허용됩니다.</text>
</svg>
