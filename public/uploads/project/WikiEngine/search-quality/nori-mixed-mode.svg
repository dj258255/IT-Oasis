<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .heading { font-size: 13px; fill: #1e293b; font-weight: 700; }
    .mode-badge { font-size: 11px; fill: #fff; font-weight: 600; }
    .pos-label { font-size: 11px; fill: #64748b; font-weight: 500; }
    .token { font-size: 14px; fill: #1e293b; font-weight: 600; }
    .token-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
    .token-overlap { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 6; }
    .note { font-size: 11px; fill: #f59e0b; font-weight: 600; }
    .note-gray { font-size: 11px; fill: #94a3b8; }
    .arrow-text { font-size: 12px; fill: #64748b; font-weight: 500; }
    .input { font-size: 14px; fill: #7c3aed; font-weight: 600; font-family: 'Consolas', monospace; }
    .overlap-line { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4,2; }
  </style>

  <!-- 헤더 -->
  <rect x="12" y="8" width="100" height="22" rx="4" fill="#f59e0b"/>
  <text x="62" y="23" text-anchor="middle" class="mode-badge">MIXED mode</text>

  <text x="20" y="58" class="input">"인공지능기술"</text>
  <text x="145" y="58" class="arrow-text">--></text>

  <!-- position 0: 인공 -->
  <text x="185" y="42" class="pos-label">pos 0</text>
  <rect x="183" y="48" width="54" height="32" class="token-box"/>
  <text x="210" y="69" text-anchor="middle" class="token">인공</text>

  <!-- position 0: 인공지능 (겹침!) -->
  <rect x="183" y="88" width="100" height="32" class="token-overlap"/>
  <text x="233" y="109" text-anchor="middle" class="token" fill="#92400e">인공지능</text>
  <text x="183" y="138" class="note">같은 position!</text>

  <!-- 겹침 표시 브레이스 -->
  <line x1="175" y1="52" x2="175" y2="116" class="overlap-line"/>
  <text x="166" y="86" text-anchor="middle" class="pos-label" fill="#f59e0b">}</text>

  <!-- position 1: 지능 -->
  <text x="302" y="42" class="pos-label">pos 1</text>
  <rect x="300" y="48" width="54" height="32" class="token-box"/>
  <text x="327" y="69" text-anchor="middle" class="token">지능</text>

  <!-- position 2: 기술 -->
  <text x="372" y="42" class="pos-label">pos 2</text>
  <rect x="370" y="48" width="54" height="32" class="token-box"/>
  <text x="397" y="69" text-anchor="middle" class="token">기술</text>

  <!-- 설명 -->
  <rect x="12" y="152" width="656" height="38" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="28" y="175" class="note-gray">원형 "인공지능"이 pos 0에 겹쳐서(positionIncrement=0) 구절 검색이 불안정해집니다.</text>
</svg>
