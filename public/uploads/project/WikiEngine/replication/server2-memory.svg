<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .value { font-size: 11px; fill: #0f172a; font-weight: 700; }
    .new-badge { font-size: 9px; fill: #dc2626; font-weight: 700; }
  </style>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" class="heading">서버 2 메모리 배분 (12GB)</text>

  <!-- Full bar background -->
  <rect x="40" y="44" width="560" height="40" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

  <!-- MySQL Replica: 4G / 12G = 33.3% → 187px -->
  <rect x="40" y="44" width="187" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="133" y="62" text-anchor="middle" class="label">MySQL Replica</text>
  <text x="133" y="76" text-anchor="middle" class="sub">4GB</text>

  <!-- Exporter: 0.1G / 12G ≈ 0.8% → 5px min 12px -->
  <rect x="227" y="44" width="14" height="40" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>

  <!-- OS + Future: 7.9G / 12G = 65.8% → 373px offset from 241 -->
  <rect x="241" y="44" width="359" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="420" y="62" text-anchor="middle" class="sub" style="fill: #22c55e; font-weight: 600;">남은 ~7.9GB</text>
  <text x="420" y="76" text-anchor="middle" class="tiny" style="fill: #22c55e;">OS + App 스케일아웃 여유</text>

  <!-- Breakdown table -->
  <rect x="40" y="104" width="560" height="186" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="40" y="104" width="560" height="28" rx="8" fill="#334155"/>
  <text x="60" y="122" font-size="11" fill="white" font-weight="700">컨테이너</text>
  <text x="300" y="122" font-size="11" fill="white" font-weight="700">메모리</text>
  <text x="440" y="122" font-size="11" fill="white" font-weight="700">비고</text>

  <!-- Row 1: MySQL Replica -->
  <line x1="40" y1="156" x2="600" y2="156" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="140" width="8" height="8" rx="2" fill="#f59e0b"/>
  <text x="66" y="148" class="label">wiki-mysql-replica</text>
  <text x="240" y="148" class="new-badge">NEW</text>
  <text x="300" y="148" class="value">4 GB</text>
  <text x="440" y="148" class="sub">InnoDB BP 2GB + MySQL 오버헤드</text>

  <!-- Row 2: MySQL Exporter -->
  <line x1="40" y1="180" x2="600" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="164" width="8" height="8" rx="2" fill="#6366f1"/>
  <text x="66" y="172" class="label">wiki-mysql-exporter</text>
  <text x="240" y="172" class="new-badge">NEW</text>
  <text x="300" y="172" class="value">64 MB</text>
  <text x="440" y="172" class="sub">Replica 메트릭 수집</text>

  <!-- Row 3: Node Exporter -->
  <line x1="40" y1="204" x2="600" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="188" width="8" height="8" rx="2" fill="#a855f7"/>
  <text x="66" y="196" class="label">wiki-node-exporter</text>
  <text x="300" y="196" class="value">64 MB</text>
  <text x="440" y="196" class="sub">호스트 메트릭 수집</text>

  <!-- Divider -->
  <line x1="52" y1="214" x2="590" y2="214" stroke="#334155" stroke-width="1.5"/>

  <!-- Total -->
  <text x="66" y="232" class="label" style="fill: #334155;">합계</text>
  <text x="300" y="232" class="value" style="fill: #334155;">~4.1 GB</text>

  <!-- Remaining -->
  <rect x="50" y="244" width="8" height="8" rx="2" fill="#22c55e"/>
  <text x="66" y="252" class="label" style="fill: #22c55e;">남은 메모리</text>
  <text x="300" y="252" class="value" style="fill: #22c55e;">~7.9 GB</text>
  <text x="440" y="252" class="sub">OS + App2(2G) + Lucene 페이지 캐시(~5G)</text>

  <!-- Footer note -->
  <text x="66" y="280" class="tiny">서버 1은 변경 없음 (~7.3G 사용 중, ~4.7G 여유)</text>
</svg>
