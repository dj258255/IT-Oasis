<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .page-num { fill: #eff6ff; stroke: #3b82f6; }
    .infinite { fill: #f0fdf4; stroke: #22c55e; }
    .heading { font-size: 13px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 11px; fill: #475569; font-weight: 500; }
    .detail { font-size: 10.5px; fill: #64748b; }
    .tech { font-size: 11px; fill: #7c3aed; font-weight: 600; font-family: 'Consolas', monospace; }
    .service { font-size: 10.5px; fill: #94a3b8; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    .badge { font-size: 10px; fill: #fff; font-weight: 600; }
  </style>

  <!-- Page Number UI -->
  <rect x="16" y="12" width="330" height="170" class="box page-num"/>
  <rect x="28" y="20" width="100" height="20" rx="4" fill="#3b82f6"/>
  <text x="78" y="34" text-anchor="middle" class="badge">페이지 번호 UI</text>

  <text x="32" y="58" class="sub">게시판, Google 검색, 위키피디아</text>

  <!-- Mini pagination example -->
  <rect x="32" y="68" width="28" height="24" rx="4" fill="#e2e8f0"/>
  <text x="46" y="84" text-anchor="middle" class="detail">이전</text>
  <rect x="64" y="68" width="24" height="24" rx="4" fill="#3b82f6"/>
  <text x="76" y="84" text-anchor="middle" class="badge">1</text>
  <rect x="92" y="68" width="24" height="24" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="104" y="84" text-anchor="middle" class="detail">2</text>
  <rect x="120" y="68" width="24" height="24" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="132" y="84" text-anchor="middle" class="detail">3</text>
  <text x="155" y="84" class="detail">...</text>
  <rect x="170" y="68" width="28" height="24" rx="4" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="184" y="84" text-anchor="middle" class="detail" fill="#3b82f6">다음</text>

  <text x="32" y="112" class="tech">OFFSET + 페이지 제한</text>
  <text x="32" y="130" class="sub">N번째 페이지로 바로 이동 가능</text>
  <text x="32" y="148" class="detail">Google도 ~30페이지까지만 제공</text>
  <text x="32" y="166" class="detail">깊은 페이지에서 O(N) 느려짐</text>

  <!-- Divider -->
  <line x1="358" y1="20" x2="358" y2="174" class="divider"/>

  <!-- Infinite Scroll UI -->
  <rect x="370" y="12" width="314" height="170" class="box infinite"/>
  <rect x="382" y="20" width="100" height="20" rx="4" fill="#22c55e"/>
  <text x="432" y="34" text-anchor="middle" class="badge">무한 스크롤 UI</text>

  <text x="386" y="58" class="sub">Twitter, Instagram, Slack</text>

  <!-- Mini scroll example -->
  <rect x="386" y="68" width="160" height="24" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="466" y="84" text-anchor="middle" class="detail" fill="#22c55e">스크롤하면 다음 20개 로드...</text>

  <text x="386" y="112" class="tech">Keyset (커서) 기반</text>
  <text x="386" y="130" class="sub">"다음 20개" 요청만 하면 됨</text>
  <text x="386" y="148" class="detail">페이지 깊이와 무관하게 O(1)</text>
  <text x="386" y="166" class="detail">N번째 페이지 바로 이동 불가</text>
</svg>
