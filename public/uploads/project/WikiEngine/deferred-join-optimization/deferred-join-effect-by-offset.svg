<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .label { font-size: 12px; fill: #1e293b; font-weight: 600; }
    .bar-fill { fill: #3b82f6; rx: 3; }
    .bar-empty { fill: #e2e8f0; rx: 3; }
    .pct { font-size: 12px; fill: #3b82f6; font-weight: 700; }
    .note { font-size: 10.5px; fill: #64748b; }
    .heading { font-size: 13px; fill: #1e293b; font-weight: 700; }
  </style>

  <text x="16" y="22" class="heading">OFFSET 크기와 Deferred Join 효과</text>

  <!-- OFFSET 200 -->
  <text x="16" y="56" class="label">OFFSET 200 (page 10)</text>
  <rect x="210" y="42" width="300" height="20" class="bar-empty"/>
  <rect x="210" y="42" width="180" height="20" class="bar-fill"/>
  <text x="400" y="57" class="pct">~60%</text>
  <text x="440" y="57" class="note">클러스터 I/O 비중 큼</text>

  <!-- OFFSET 2,000 -->
  <text x="16" y="96" class="label">OFFSET 2,000 (page 100)</text>
  <rect x="210" y="82" width="300" height="20" class="bar-empty"/>
  <rect x="210" y="82" width="120" height="20" class="bar-fill"/>
  <text x="340" y="97" class="pct">~40%</text>

  <!-- OFFSET 10,000 -->
  <text x="16" y="136" class="label">OFFSET 10,000 (page 500)</text>
  <rect x="210" y="122" width="300" height="20" class="bar-empty"/>
  <rect x="210" y="122" width="60" height="20" class="bar-fill"/>
  <text x="280" y="137" class="pct">~20%</text>

  <!-- OFFSET 20,000 -->
  <text x="16" y="176" class="label">OFFSET 20,000 (page 1000)</text>
  <rect x="210" y="162" width="300" height="20" class="bar-empty"/>
  <rect x="210" y="162" width="39" height="20" class="bar-fill"/>
  <text x="260" y="177" class="pct">~13%</text>
  <text x="300" y="177" class="note">인덱스 스캔이 지배적</text>
</svg>
