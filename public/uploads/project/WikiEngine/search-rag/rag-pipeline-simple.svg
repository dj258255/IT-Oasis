<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrowR2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a8db8"/>
    </marker>
    <filter id="shadowR2">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="160" rx="12" fill="#f8fafb" stroke="#e2e8f0" stroke-width="1"/>

  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">RAG 파이프라인</text>

  <!-- Step 1: Retrieval -->
  <rect x="40" y="54" width="200" height="86" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#shadowR2)"/>
  <rect x="40" y="54" width="200" height="30" rx="10" fill="#4a8db8"/>
  <rect x="40" y="74" width="200" height="10" fill="#4a8db8"/>
  <text x="140" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1. Retrieval</text>
  <text x="140" y="104" text-anchor="middle" font-size="11" fill="#1e293b">사용자 쿼리로</text>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#1e293b">관련 문서 검색</text>
  <text x="140" y="136" text-anchor="middle" font-size="10" fill="#94a3b8">(기존 Lucene BM25)</text>

  <line x1="240" y1="97" x2="274" y2="97" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrowR2)"/>

  <!-- Step 2: Augmentation -->
  <rect x="280" y="54" width="200" height="86" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadowR2)"/>
  <rect x="280" y="54" width="200" height="30" rx="10" fill="#e67e22"/>
  <rect x="280" y="74" width="200" height="10" fill="#e67e22"/>
  <text x="380" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2. Augmentation</text>
  <text x="380" y="104" text-anchor="middle" font-size="11" fill="#1e293b">검색된 문서를</text>
  <text x="380" y="122" text-anchor="middle" font-size="11" fill="#1e293b">LLM 컨텍스트에 주입</text>

  <line x1="480" y1="97" x2="514" y2="97" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrowR2)"/>

  <!-- Step 3: Generation -->
  <rect x="520" y="54" width="200" height="86" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadowR2)"/>
  <rect x="520" y="54" width="200" height="30" rx="10" fill="#27ae60"/>
  <rect x="520" y="74" width="200" height="10" fill="#27ae60"/>
  <text x="620" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3. Generation</text>
  <text x="620" y="104" text-anchor="middle" font-size="11" fill="#1e293b">LLM이 문서 기반</text>
  <text x="620" y="122" text-anchor="middle" font-size="11" fill="#1e293b">답변 생성 + 출처 표시</text>
</svg>
