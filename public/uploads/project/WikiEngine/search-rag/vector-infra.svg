      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="220" rx="12" fill="#f8fafb" stroke="#e2e8f0" stroke-width="1"/>

  <text x="380" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">벡터 검색 도입 시 인프라 비교</text>

