<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrowR3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a8db8"/>
    </marker>
    <filter id="shadowR3">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="340" rx="12" fill="#f8fafb" stroke="#e2e8f0" stroke-width="1"/>

  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Retrieval 개선 로드맵</text>

  <!-- Stage 1: 완료 -->
  <rect x="40" y="50" width="680" height="76" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadowR3)"/>
  <rect x="40" y="50" width="80" height="76" rx="10" fill="#27ae60"/>
  <rect x="107" y="50" width="13" height="76" fill="#27ae60"/>
  <text x="80" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">완료</text>
  <text x="80" y="100" text-anchor="middle" font-size="10" fill="#d4f5e0">쿼리 확장</text>
  <text x="140" y="78" font-size="13" font-weight="600" fill="#1e293b">BM25 + 동의어 확장 (DB 기반)</text>
  <text x="140" y="100" font-size="11" fill="#27ae60" font-weight="600">"AI" 검색 시 "인공지능" 문서도 반환 — 수동 동의어 목록</text>
  <text x="140" y="118" font-size="10" fill="#94a3b8">Lexical(BM25) → Graph(동의어)</text>

  <line x1="380" y1="126" x2="380" y2="140" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrowR3)"/>

  <!-- Stage 2: 현재 -->
  <rect x="40" y="146" width="680" height="76" rx="10" fill="#fff" stroke="#4a8db8" stroke-width="2" filter="url(#shadowR3)"/>
  <rect x="40" y="146" width="80" height="76" rx="10" fill="#4a8db8"/>
  <rect x="107" y="146" width="13" height="76" fill="#4a8db8"/>
  <text x="80" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">현재</text>
  <text x="80" y="196" text-anchor="middle" font-size="10" fill="#d4e8f5">이 글</text>
  <text x="140" y="174" font-size="13" font-weight="600" fill="#1e293b">BM25 + RAG (LLM으로 답변 생성)</text>
  <text x="140" y="196" font-size="11" fill="#4a8db8" font-weight="600">BM25로 Top-5 문서 검색 → LLM 컨텍스트 주입 → 답변 생성</text>
  <text x="140" y="214" font-size="10" fill="#94a3b8">"BM25만으로 Retrieval이 충분한가?" 평가</text>

  <line x1="380" y1="222" x2="380" y2="236" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrowR3)"/>

  <!-- Stage 3: 향후 -->
  <rect x="40" y="242" width="680" height="84" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadowR3)"/>
  <rect x="40" y="242" width="80" height="84" rx="10" fill="#94a3b8"/>
  <rect x="107" y="242" width="13" height="84" fill="#94a3b8"/>
  <text x="80" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">향후</text>
  <text x="80" y="296" text-anchor="middle" font-size="10" fill="#e2e8f0">벡터 도입</text>
  <text x="140" y="268" font-size="13" font-weight="600" fill="#1e293b">Hybrid Retrieval (BM25 + Dense)</text>
  <text x="140" y="290" font-size="11" fill="#64748b">BM25 품질이 부족한 케이스가 실측으로 확인되면:</text>
  <text x="140" y="310" font-size="11" fill="#94a3b8">예) "환경 오염의 영향" → "공해", "대기질" 문서 누락 (키워드 불일치)</text>
  <text x="510" y="268" font-size="10" fill="#94a3b8">Lucene HNSW + RRF</text>
</svg>
