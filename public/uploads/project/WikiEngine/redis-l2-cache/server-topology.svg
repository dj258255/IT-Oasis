<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .server1 { fill: #eff6ff; stroke: #3b82f6; }
    .server2 { fill: #f0fdf4; stroke: #22c55e; }
    .monitor { fill: #f1f5f9; stroke: #94a3b8; }
    .redis-box { fill: #fef3c7; stroke: #f59e0b; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .heading { font-size: 13px; fill: #1e293b; font-weight: 700; }
    .note { font-size: 10px; fill: #64748b; }
    .new-tag { font-size: 9px; fill: #fff; font-weight: 700; }
    .step-tag { font-size: 9px; fill: #64748b; }
    .comp { font-size: 10px; fill: #1e293b; }
  </style>

  <text x="16" y="20" class="heading">11~13단계 서버 토폴로지 — 2대 체제</text>

  <!-- Server 1 -->
  <rect x="16" y="36" width="330" height="180" class="box server1"/>
  <text x="30" y="56" class="label">서버 1 (기존, ARM 2코어 / 12GB)</text>

  <rect x="30" y="66" width="140" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="40" y="82" class="comp">wiki-app-prod (Spring Boot)</text>

  <rect x="30" y="96" width="140" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="40" y="112" class="comp">wiki-mysql-prod (Primary)</text>

  <!-- Redis NEW -->
  <rect x="30" y="126" width="140" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="40" y="142" class="comp">wiki-redis-prod (Redis)</text>
  <rect x="175" y="128" width="46" height="16" rx="4" fill="#f59e0b"/>
  <text x="181" y="140" class="new-tag">11단계</text>

  <rect x="30" y="156" width="140" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="40" y="172" class="comp">Lucene 인덱스 (20GB)</text>

  <rect x="30" y="186" width="140" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="40" y="202" class="comp">사이드카 (Nginx, Promtail...)</text>

  <!-- Server 2 -->
  <rect x="380" y="36" width="330" height="180" class="box server2"/>
  <text x="394" y="56" class="label">서버 2 (신규, ARM 2코어 / 12GB)</text>

  <rect x="394" y="66" width="160" height="24" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1" style="opacity: 0.4;"/>
  <text x="404" y="82" class="comp" style="opacity: 0.4;">wiki-app-prod-2 (13단계)</text>

  <rect x="394" y="96" width="160" height="24" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1" style="opacity: 0.6;"/>
  <text x="404" y="112" class="comp" style="opacity: 0.6;">wiki-mysql-replica (12단계)</text>

  <rect x="394" y="126" width="160" height="24" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1" style="opacity: 0.4;"/>
  <text x="404" y="142" class="comp" style="opacity: 0.4;">Lucene 인덱스 (13단계)</text>

  <rect x="394" y="156" width="160" height="24" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="404" y="172" class="comp">Docker + 방화벽 (11단계 준비)</text>

  <!-- Connection -->
  <line x1="346" y1="110" x2="390" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="350" y="102" class="step-tag">Binlog (12단계)</text>

  <!-- Monitoring -->
  <rect x="200" y="240" width="320" height="50" class="box monitor"/>
  <text x="214" y="260" class="label">모니터링 서버 (1GB)</text>
  <text x="214" y="276" class="sub">Prometheus (서버 1+2 스크랩) · Grafana · Loki · InfluxDB</text>
</svg>