<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="400" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <rect x="20" y="14" width="780" height="38" rx="8" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="410" y="39" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Lucene 핵심 개념 5가지</text>

  <!-- ===== Segment ===== -->
  <rect x="20" y="68" width="150" height="155" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="68" width="150" height="32" rx="10" fill="#3b82f6"/>
  <rect x="20" y="90" width="150" height="10" fill="#3b82f6"/>
  <text x="95" y="90" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Segment</text>
  <!-- icon: lock -->
  <text x="95" y="126" text-anchor="middle" fill="#3b82f6" font-size="24">🔒</text>
  <text x="95" y="150" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">불변(Immutable)</text>
  <text x="95" y="166" text-anchor="middle" fill="#3b82f6" font-size="9">인덱스 파일 묶음</text>
  <text x="95" y="180" text-anchor="middle" fill="#3b82f6" font-size="9">한번 쓰면 수정 안 함</text>
  <text x="95" y="196" text-anchor="middle" fill="#93c5fd" font-size="8">→ 동시성 안전</text>
  <text x="95" y="210" text-anchor="middle" fill="#93c5fd" font-size="8">→ OS 캐시 친화적</text>

  <!-- ===== 역색인 ===== -->
  <rect x="185" y="68" width="150" height="155" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="185" y="68" width="150" height="32" rx="10" fill="#22c55e"/>
  <rect x="185" y="90" width="150" height="10" fill="#22c55e"/>
  <text x="260" y="90" text-anchor="middle" fill="white" font-size="13" font-weight="bold">역색인</text>
  <!-- mini inverted index -->
  <text x="210" y="122" fill="#166534" font-size="9" font-weight="bold">term</text>
  <text x="270" y="122" fill="#166534" font-size="9" font-weight="bold">→ docs</text>
  <line x1="200" y1="126" x2="320" y2="126" stroke="#86efac" stroke-width="0.5"/>
  <text x="210" y="140" fill="#4ade80" font-size="9">"한국"</text>
  <text x="270" y="140" fill="#4ade80" font-size="9">→ [3, 15, 42]</text>
  <text x="210" y="156" fill="#4ade80" font-size="9">"경제"</text>
  <text x="270" y="156" fill="#4ade80" font-size="9">→ [3, 7]</text>
  <text x="210" y="172" fill="#4ade80" font-size="9">"기술"</text>
  <text x="270" y="172" fill="#4ade80" font-size="9">→ [15, 42, 99]</text>
  <text x="260" y="196" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold">term → [doc1, doc2...]</text>
  <text x="260" y="210" text-anchor="middle" fill="#86efac" font-size="8">검색의 핵심 자료구조</text>

  <!-- ===== Flush ===== -->
  <rect x="350" y="68" width="150" height="155" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="350" y="68" width="150" height="32" rx="10" fill="#0ea5e9"/>
  <rect x="350" y="90" width="150" height="10" fill="#0ea5e9"/>
  <text x="425" y="90" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Flush</text>
  <!-- icon: memory to disk -->
  <rect x="375" y="112" width="40" height="24" rx="4" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1"/>
  <text x="395" y="128" text-anchor="middle" fill="#0369a1" font-size="8">RAM</text>
  <text x="425" y="130" fill="#0ea5e9" font-size="14">→</text>
  <rect x="440" y="112" width="40" height="24" rx="4" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1"/>
  <text x="460" y="128" text-anchor="middle" fill="#0369a1" font-size="8">Disk</text>
  <text x="425" y="158" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="bold">메모리 → 디스크</text>
  <text x="425" y="174" text-anchor="middle" fill="#0ea5e9" font-size="9">버퍼가 가득 차면</text>
  <text x="425" y="188" text-anchor="middle" fill="#0ea5e9" font-size="9">새 세그먼트로 저장</text>
  <text x="425" y="210" text-anchor="middle" fill="#7dd3fc" font-size="8">ramBufferSizeMB 도달 시</text>

  <!-- ===== Merge ===== -->
  <rect x="515" y="68" width="150" height="155" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="515" y="68" width="150" height="32" rx="10" fill="#a855f7"/>
  <rect x="515" y="90" width="150" height="10" fill="#a855f7"/>
  <text x="590" y="90" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Merge</text>
  <!-- icon: small segments merging -->
  <rect x="535" y="112" width="24" height="18" rx="3" fill="#e9d5ff" stroke="#a855f7" stroke-width="1"/>
  <rect x="563" y="112" width="24" height="18" rx="3" fill="#e9d5ff" stroke="#a855f7" stroke-width="1"/>
  <rect x="591" y="112" width="24" height="18" rx="3" fill="#e9d5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="619" y="126" fill="#a855f7" font-size="12">→</text>
  <rect x="631" y="108" width="24" height="26" rx="3" fill="#d8b4fe" stroke="#a855f7" stroke-width="1.5"/>
  <text x="590" y="158" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">세그먼트 병합</text>
  <text x="590" y="174" text-anchor="middle" fill="#a855f7" font-size="9">작은 것들 → 큰 하나로</text>
  <text x="590" y="188" text-anchor="middle" fill="#a855f7" font-size="9">삭제 문서 실제 제거</text>
  <text x="590" y="210" text-anchor="middle" fill="#c4b5fd" font-size="8">TieredMergePolicy</text>

  <!-- ===== mmap ===== -->
  <rect x="680" y="68" width="120" height="155" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="680" y="68" width="120" height="32" rx="10" fill="#f97316"/>
  <rect x="680" y="90" width="120" height="10" fill="#f97316"/>
  <text x="740" y="90" text-anchor="middle" fill="white" font-size="13" font-weight="bold">mmap</text>
  <!-- icon: file to memory mapping -->
  <rect x="700" y="112" width="32" height="24" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
  <text x="716" y="128" text-anchor="middle" fill="#c2410c" font-size="7">File</text>
  <text x="740" y="130" fill="#f97316" font-size="10">↔</text>
  <rect x="748" y="112" width="32" height="24" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
  <text x="764" y="128" text-anchor="middle" fill="#c2410c" font-size="7">Mem</text>
  <text x="740" y="158" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="bold">메모리 매핑</text>
  <text x="740" y="174" text-anchor="middle" fill="#f97316" font-size="9">OS가 파일을</text>
  <text x="740" y="188" text-anchor="middle" fill="#f97316" font-size="9">메모리에 매핑</text>
  <text x="740" y="210" text-anchor="middle" fill="#fdba74" font-size="8">MMapDirectory</text>

  <!-- ===== Bottom: Data Flow ===== -->
  <rect x="20" y="244" width="780" height="140" rx="10" fill="#fefce8" stroke="#facc15" stroke-width="1" filter="url(#shadow)"/>
  <text x="40" y="268" font-size="11" font-weight="bold" fill="#854d0e">전체 흐름: 문서 추가 → 검색까지</text>

  <!-- Flow boxes -->
  <rect x="40" y="284" width="120" height="40" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="100" y="300" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">addDocument()</text>
  <text x="100" y="314" text-anchor="middle" fill="#a16207" font-size="8">문서 추가</text>

  <text x="172" y="306" fill="#eab308" font-size="14">→</text>

  <rect x="190" y="284" width="120" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="250" y="300" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="bold">RAM Buffer</text>
  <text x="250" y="314" text-anchor="middle" fill="#0ea5e9" font-size="8">메모리 버퍼링</text>

  <text x="322" y="306" fill="#0ea5e9" font-size="14">→</text>
  <text x="340" y="296" fill="#94a3b8" font-size="8">Flush</text>

  <rect x="360" y="284" width="120" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="420" y="300" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">New Segment</text>
  <text x="420" y="314" text-anchor="middle" fill="#3b82f6" font-size="8">디스크에 기록</text>

  <text x="492" y="306" fill="#a855f7" font-size="14">→</text>
  <text x="502" y="296" fill="#94a3b8" font-size="8">Merge</text>

  <rect x="520" y="284" width="130" height="40" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="585" y="300" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">Merged Segment</text>
  <text x="585" y="314" text-anchor="middle" fill="#a855f7" font-size="8">최적화된 세그먼트</text>

  <text x="662" y="306" fill="#f97316" font-size="14">→</text>
  <text x="672" y="296" fill="#94a3b8" font-size="8">mmap</text>

  <rect x="690" y="284" width="90" height="40" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
  <text x="735" y="300" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="bold">Search</text>
  <text x="735" y="314" text-anchor="middle" fill="#f97316" font-size="8">빠른 검색</text>

  <!-- Bottom note -->
  <text x="410" y="360" text-anchor="middle" fill="#854d0e" font-size="10">모든 세그먼트가 불변이므로 Reader와 Writer가 동시에 동작 가능 — Lock-Free Read</text>
  <text x="410" y="376" text-anchor="middle" fill="#a16207" font-size="9">SearcherManager.acquire() 로 현재 시점의 IndexReader를 안전하게 획득</text>
</svg>
