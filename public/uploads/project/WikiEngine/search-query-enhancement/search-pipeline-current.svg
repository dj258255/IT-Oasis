<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a8db8"/>
    </marker>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="420" rx="12" fill="#f8fafb" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">현재 검색 파이프라인</text>

  <!-- Step 1: Input -->
  <rect x="240" y="56" width="280" height="40" rx="20" fill="#4a8db8" filter="url(#shadow1)"/>
  <text x="380" y="81" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">사용자 입력: "AI"</text>

  <line x1="380" y1="96" x2="380" y2="116" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 2 -->
  <rect x="200" y="120" width="360" height="36" rx="8" fill="#eef5fa" stroke="#4a8db8" stroke-width="1.5"/>
  <text x="380" y="143" text-anchor="middle" font-size="12" fill="#1e293b">URL 디코딩 + 소문자 변환 (정규화)</text>

  <line x1="380" y1="156" x2="380" y2="172" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 3 -->
  <rect x="160" y="176" width="440" height="36" rx="8" fill="#eef5fa" stroke="#4a8db8" stroke-width="1.5"/>
  <text x="380" y="199" text-anchor="middle" font-size="12" fill="#1e293b">MultiFieldQueryParser.parse("ai") → Nori 형태소 분석: "ai" (단일 토큰)</text>

  <line x1="380" y1="212" x2="380" y2="228" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 4: BM25 -->
  <rect x="160" y="232" width="440" height="36" rx="8" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="380" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">BM25 스코어링 (title:3, content:1)</text>

  <line x1="380" y1="268" x2="380" y2="284" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 5: Boosting -->
  <rect x="100" y="288" width="560" height="36" rx="8" fill="#eef5fa" stroke="#4a8db8" stroke-width="1.5"/>
  <text x="380" y="311" text-anchor="middle" font-size="12" fill="#1e293b">FeatureField 부스팅 (viewCount, likeCount) + Recency Decay (30일 반감기)</text>

  <line x1="380" y1="324" x2="380" y2="340" stroke="#4a8db8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 6: Result -->
  <rect x="240" y="344" width="280" height="40" rx="20" fill="#27ae60" filter="url(#shadow1)"/>
  <text x="380" y="369" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">TopDocs → 응답</text>

  <!-- Side labels -->
  <text x="38" y="199" font-size="10" fill="#94a3b8" transform="rotate(-90, 38, 199)">검색 쿼리 처리</text>
</svg>
