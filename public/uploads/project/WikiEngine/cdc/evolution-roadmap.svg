<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 250" width="750" height="250" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .app { fill: #dbeafe; stroke: #3b82f6; }
    .mysql-p { fill: #fef3c7; stroke: #f59e0b; }
    .kafka { fill: #e0e7ff; stroke: #6366f1; }
    .danger { fill: #fef2f2; stroke: #ef4444; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#ah); }
    .section { fill: #f8fafc; stroke: #e2e8f0; rx: 10; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="375" y="24" text-anchor="middle" class="heading">점진적 진화 로드맵</text>

  <!-- Section background -->
  <rect x="20" y="34" width="710" height="205" class="section" filter="url(#shadow)"/>

  <!-- Step 0: 현재 (dual-write) -->
  <rect x="225" y="44" width="300" height="36" class="box danger" filter="url(#shadow)"/>
  <text x="375" y="66" text-anchor="middle" class="label" style="fill:#ef4444;">현재 (dual-write)</text>

  <!-- Arrow 1 -->
  <line x1="375" y1="80" x2="375" y2="94" class="arrow"/>

  <!-- Step 1: Spring ApplicationEvent -->
  <rect x="225" y="94" width="300" height="36" class="box app" filter="url(#shadow)"/>
  <text x="375" y="110" text-anchor="middle" class="label">Step 1: Spring ApplicationEvent</text>
  <text x="375" y="124" text-anchor="middle" class="tiny">단일 서버 디커플링</text>

  <!-- Arrow 2 -->
  <line x1="375" y1="130" x2="375" y2="144" class="arrow"/>

  <!-- Step 2: Transactional Outbox -->
  <rect x="225" y="144" width="300" height="36" class="box mysql-p" filter="url(#shadow)"/>
  <text x="375" y="160" text-anchor="middle" class="label">Step 2: Transactional Outbox</text>
  <text x="375" y="174" text-anchor="middle" class="tiny">이벤트 유실 방지</text>

  <!-- Arrow 3 -->
  <line x1="375" y1="180" x2="375" y2="194" class="arrow"/>

  <!-- Step 3: Debezium + Kafka -->
  <rect x="225" y="194" width="300" height="36" class="box kafka" filter="url(#shadow)"/>
  <text x="375" y="210" text-anchor="middle" class="label">Step 3: Debezium + Kafka</text>
  <text x="375" y="224" text-anchor="middle" class="tiny">프로덕션 CDC</text>
</svg>