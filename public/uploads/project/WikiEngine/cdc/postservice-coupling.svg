<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .app { fill: #dbeafe; stroke: #3b82f6; }
    .mysql-p { fill: #fef3c7; stroke: #f59e0b; }
    .redis { fill: #fce7f3; stroke: #ec4899; }
    .lucene { fill: #d1fae5; stroke: #10b981; }
    .cache { fill: #fef3c7; stroke: #f59e0b; }
    .disconnected { fill: #fef2f2; stroke: #ef4444; stroke-dasharray: 6 3; }
    .arrow-blue { fill: none; stroke: #3b82f6; stroke-width: 2; marker-end: url(#ah-blue); }
    .arrow-red { fill: none; stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6 3; marker-end: url(#ah-red); }
    .section { fill: #f8fafc; stroke: #e2e8f0; rx: 10; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#3b82f6"/></marker>
    <marker id="ah-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#ef4444"/></marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="325" y="24" text-anchor="middle" class="heading">PostService 6개 의존성 (강결합)</text>

  <!-- Section -->
  <rect x="15" y="38" width="620" height="250" class="section" filter="url(#shadow)"/>

  <!-- PostService -->
  <rect x="35" y="118" width="130" height="50" class="box app" filter="url(#shadow)"/>
  <text x="100" y="140" text-anchor="middle" class="label">PostService</text>
  <text x="100" y="156" text-anchor="middle" class="tiny">6개 의존성</text>

  <!-- Dependency 1: PostRepository -->
  <path d="M 165 128 L 270 68" class="arrow-blue"/>
  <rect x="280" y="48" width="170" height="38" class="box mysql-p" filter="url(#shadow)"/>
  <text x="365" y="64" text-anchor="middle" class="label">PostRepository</text>
  <text x="365" y="78" text-anchor="middle" class="tiny">MySQL</text>

  <!-- Dependency 2: LuceneIndexService -->
  <path d="M 165 135 L 270 108" class="arrow-blue"/>
  <rect x="280" y="92" width="170" height="38" class="box lucene" filter="url(#shadow)"/>
  <text x="365" y="108" text-anchor="middle" class="label">LuceneIndexService</text>
  <text x="365" y="122" text-anchor="middle" class="tiny">검색 인덱스</text>

  <!-- Dependency 3: TieredCacheService -->
  <path d="M 165 143 L 270 148" class="arrow-blue"/>
  <rect x="280" y="136" width="170" height="38" class="box cache" filter="url(#shadow)"/>
  <text x="365" y="152" text-anchor="middle" class="label">TieredCacheService</text>
  <text x="365" y="166" text-anchor="middle" class="tiny">게시글 캐시</text>

  <!-- Dependency 4: PostLikeRepository -->
  <path d="M 165 150 L 270 192" class="arrow-blue"/>
  <rect x="280" y="180" width="170" height="38" class="box mysql-p" filter="url(#shadow)"/>
  <text x="365" y="196" text-anchor="middle" class="label">PostLikeRepository</text>
  <text x="365" y="210" text-anchor="middle" class="tiny">좋아요</text>

  <!-- Dependency 5: 검색 결과 캐시 (disconnected) -->
  <path d="M 165 155 L 270 234" class="arrow-red"/>
  <rect x="280" y="224" width="170" height="38" class="box disconnected" filter="url(#shadow)"/>
  <text x="365" y="238" text-anchor="middle" class="label" style="fill: #ef4444;">검색 결과 캐시</text>
  <text x="365" y="252" text-anchor="middle" class="tiny" style="fill: #ef4444;">알아야 하지만 모름</text>
  <!-- Red X -->
  <text x="460" y="244" class="label" style="fill: #ef4444; font-size: 16px;">X</text>

  <!-- Dependency 6: 자동완성 KV (disconnected) -->
  <path d="M 165 160 L 490 234" class="arrow-red"/>
  <rect x="470" y="224" width="150" height="38" class="box disconnected" filter="url(#shadow)"/>
  <text x="545" y="238" text-anchor="middle" class="label" style="fill: #ef4444;">자동완성 KV</text>
  <text x="545" y="252" text-anchor="middle" class="tiny" style="fill: #ef4444;">알아야 하지만 모름</text>
  <!-- Red X -->
  <text x="628" y="244" class="label" style="fill: #ef4444; font-size: 16px;">X</text>
</svg>