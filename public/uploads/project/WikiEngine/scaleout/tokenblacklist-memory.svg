<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .value { font-size: 11px; fill: #0f172a; font-weight: 700; }
    .value-big { font-size: 22px; fill: #0f172a; font-weight: 800; }
    .redis { fill: #fce7f3; stroke: #ec4899; }
    .calc { fill: #f8fafc; stroke: #e2e8f0; rx: 8; }
    .code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; fill: #1e293b; }
  </style>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="heading">TokenBlacklist Redis 메모리 추정</text>

  <!-- Key structure breakdown -->
  <rect x="30" y="46" width="660" height="144" class="calc" filter="url(#shadow)"/>
  <text x="50" y="70" class="label">키-값 구조 분석</text>

  <!-- Key breakdown -->
  <rect x="50" y="82" width="200" height="36" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="60" y="100" class="code" style="fill: #be185d;">Key</text>
  <text x="90" y="100" class="sub" style="fill: #9d174d;">~215 bytes</text>

  <text x="260" y="100" class="sub">+</text>

  <rect x="278" y="82" width="100" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="288" y="100" class="code" style="fill: #4338ca;">Value</text>
  <text x="328" y="100" class="sub" style="fill: #4338ca;">1 byte</text>

  <text x="388" y="100" class="sub">+</text>

  <rect x="406" y="82" width="140" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="416" y="100" class="code" style="fill: #475569;">Overhead</text>
  <text x="486" y="100" class="sub" style="fill: #475569;">~64 bytes</text>

  <text x="556" y="100" class="sub">=</text>

  <rect x="574" y="82" width="100" height="36" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="624" y="100" text-anchor="middle" class="value" style="fill: #92400e;">~280 bytes</text>

  <!-- Key detail -->
  <text x="50" y="140" class="tiny">Key 구성: "token:blacklist:" (17) + JWT 토큰 (~198 bytes, Base64 encoded)</text>
  <text x="50" y="154" class="tiny">Value: "1" (블랙리스트 여부) | Overhead: Redis dictEntry + SDS header + robj</text>
  <text x="50" y="168" class="tiny">TTL: JWT 만료 시간까지 (최대 24시간) → 자동 정리</text>

  <!-- Calculation -->
  <rect x="30" y="200" width="660" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="224" class="label" style="fill: #065f46;">동시 최대 키 수 추정</text>

  <text x="50" y="248" class="sub" style="fill: #065f46;">동시 접속 사용자 ~300명 (피크) x 로그아웃 비율 고려</text>
  <text x="50" y="262" class="code" style="fill: #065f46;">300 keys x 280 bytes = 84,000 bytes ≈ 82 KB</text>

  <!-- Comparison with current Redis -->
  <rect x="30" y="296" width="320" height="70" class="box redis" filter="url(#shadow)"/>
  <text x="50" y="320" class="label">현재 Redis 사용량</text>
  <text x="50" y="340" class="value-big" style="fill: #be185d;">49 MB</text>
  <text x="140" y="340" class="sub" style="fill: #9d174d;">L2 캐시 + 세션</text>
  <text x="50" y="356" class="tiny" style="fill: #9d174d;">maxmemory: 256 MB</text>

  <!-- TokenBlacklist -->
  <rect x="370" y="296" width="320" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="320" class="label" style="fill: #065f46;">TokenBlacklist 추가분</text>
  <text x="390" y="340" class="value-big" style="fill: #16a34a;">~82 KB</text>
  <text x="480" y="340" class="sub" style="fill: #059669;">49MB 대비 0.17%</text>
  <text x="390" y="356" class="tiny" style="fill: #059669; font-weight: 600;">무시 가능한 수준 (negligible)</text>
</svg>