<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .step { fill: #dbeafe; stroke: #3b82f6; }
    .cpu { fill: #fef2f2; stroke: #ef4444; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" class="heading">Lucene 검색 CPU 경로</text>

  <!-- CPU-bound label -->
  <rect x="300" y="42" width="220" height="24" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="410" y="58" text-anchor="middle" class="sub" style="fill: #dc2626; font-weight: 700;">CPU-bound 연산 파이프라인</text>

  <!-- Step 1: 검색 요청 -->
  <rect x="30" y="90" width="120" height="60" class="box step" filter="url(#shadow)"/>
  <text x="90" y="116" text-anchor="middle" class="label">검색 요청</text>
  <text x="90" y="132" text-anchor="middle" class="tiny">GET /search</text>

  <!-- Arrow 1 -->
  <path d="M 150 120 L 178 120" class="arrow"/>

  <!-- Step 2: Nori 형태소 분석 -->
  <rect x="186" y="90" width="120" height="60" class="box cpu" filter="url(#shadow)"/>
  <text x="246" y="112" text-anchor="middle" class="label" style="fill: #991b1b;">Nori</text>
  <text x="246" y="126" text-anchor="middle" class="label" style="fill: #991b1b;">형태소 분석</text>
  <text x="246" y="140" text-anchor="middle" class="tiny">한국어 토큰화</text>

  <!-- Arrow 2 -->
  <path d="M 306 120 L 334 120" class="arrow"/>

  <!-- Step 3: BM25 스코어링 -->
  <rect x="342" y="90" width="140" height="60" class="box cpu" filter="url(#shadow)"/>
  <text x="412" y="112" text-anchor="middle" class="label" style="fill: #991b1b;">BM25 스코어링</text>
  <text x="412" y="128" text-anchor="middle" class="tiny">세그먼트 순회</text>
  <text x="412" y="140" text-anchor="middle" class="tiny">TF-IDF 계산</text>

  <!-- Arrow 3 -->
  <path d="M 482 120 L 510 120" class="arrow"/>

  <!-- Step 4: FeatureField 부스팅 -->
  <rect x="518" y="90" width="140" height="60" class="box cpu" filter="url(#shadow)"/>
  <text x="588" y="108" text-anchor="middle" class="label" style="fill: #991b1b;">FeatureField</text>
  <text x="588" y="122" text-anchor="middle" class="label" style="fill: #991b1b;">부스팅</text>
  <text x="588" y="140" text-anchor="middle" class="tiny">viewCount, likeCount</text>

  <!-- Arrow 4 -->
  <path d="M 658 120 L 686 120" class="arrow"/>

  <!-- Step 5: Recency Decay -->
  <rect x="694" y="90" width="104" height="60" class="box cpu" filter="url(#shadow)"/>
  <text x="746" y="112" text-anchor="middle" class="label" style="fill: #991b1b;">Recency</text>
  <text x="746" y="126" text-anchor="middle" class="label" style="fill: #991b1b;">Decay</text>
  <text x="746" y="140" text-anchor="middle" class="tiny">30일 반감기</text>

  <!-- Bottom annotation box -->
  <rect x="30" y="180" width="768" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Note: Origin 42% -->
  <rect x="50" y="192" width="12" height="12" rx="3" fill="#3b82f6"/>
  <text x="70" y="203" class="label">Origin 42%의 요청이 이 검색 경로를 통과</text>
  <text x="50" y="224" class="sub">L1 (Caffeine) + L2 (Redis) 캐시 미스 시 매번 전체 파이프라인을 CPU에서 실행</text>

  <!-- CPU detail box -->
  <rect x="30" y="260" width="768" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="280" class="label" style="fill: #991b1b;">CPU 병목 원인</text>
  <text x="50" y="298" class="sub" style="fill: #7f1d1d;">2코어 ARM에서 Nori 토큰화 + BM25 세그먼트 순회 + FeatureField 점수 연산이 동시에 실행 → CPU 100% 포화</text>
  <text x="50" y="312" class="tiny" style="fill: #991b1b;">단일 검색 쿼리도 다수의 세그먼트를 순회하며 각 문서에 대해 스코어링 수행</text>
</svg>