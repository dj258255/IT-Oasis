<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .step-num { font-size: 16px; fill: white; font-weight: 800; }
    .app { fill: #dbeafe; stroke: #3b82f6; }
    .lucene { fill: #d1fae5; stroke: #10b981; }
    .step-box { fill: #f8fafc; stroke: #e2e8f0; rx: 10; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#ah); }
    .protect { fill: #fffbeb; stroke: #fbbf24; rx: 8; }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" class="heading">SnapshotDeletionPolicy + Refresh Pause rsync 흐름</text>

  <!-- Server labels -->
  <rect x="50" y="48" width="340" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="220" y="68" text-anchor="middle" class="label">App 1 (Lucene Primary) — 서버 1</text>
  <rect x="470" y="48" width="340" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="640" y="68" text-anchor="middle" class="label">App 2 (Lucene Replica) — 서버 2</text>

  <!-- Timeline lines -->
  <line x1="220" y1="86" x2="220" y2="420" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="640" y1="86" x2="640" y2="420" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ===== Step 1: App 2 pause refresh ===== -->
  <rect x="478" y="96" width="30" height="30" rx="15" fill="#3b82f6"/>
  <text x="493" y="116" text-anchor="middle" class="step-num">1</text>
  <rect x="516" y="90" width="284" height="44" class="box step-box" filter="url(#shadow)"/>
  <text x="532" y="110" class="label">Refresh Pause (App 2)</text>
  <text x="532" y="126" class="sub">DirectoryReader refresh 일시 중단</text>

  <!-- Arrow: Step 1 signal -->
  <path d="M 478 111 L 240 111" class="arrow" style="stroke-dasharray: 4 3;"/>
  <text x="340" y="106" class="tiny" style="fill: #3b82f6;">POST /lucene/pause-refresh</text>

  <!-- ===== Step 2: App 1 commit + snapshot ===== -->
  <rect x="132" y="156" width="30" height="30" rx="15" fill="#3b82f6"/>
  <text x="147" y="176" text-anchor="middle" class="step-num">2</text>
  <rect x="56" y="150" width="284" height="44" class="box step-box" filter="url(#shadow)"/>
  <text x="72" y="170" class="label">Commit + Snapshot (App 1)</text>
  <text x="72" y="186" class="sub">IndexWriter.commit() → 스냅샷 생성</text>

  <!-- ===== Step 3: rsync copy ===== -->
  <rect x="300" y="216" width="30" height="30" rx="15" fill="#10b981"/>
  <text x="315" y="236" text-anchor="middle" class="step-num">3</text>
  <rect x="240" y="210" width="380" height="44" class="box" style="fill: #d1fae5; stroke: #10b981;" filter="url(#shadow)"/>
  <text x="440" y="230" text-anchor="middle" class="label" style="fill: #065f46;">rsync --delete 전송</text>
  <text x="440" y="246" text-anchor="middle" class="sub" style="fill: #065f46;">서버 1 → 서버 2 (private network, 증분 복사)</text>

  <!-- rsync arrow -->
  <path d="M 220 232 L 636 232" style="fill: none; stroke: #10b981; stroke-width: 3; marker-end: url(#ah);" marker-end="url(#ah)"/>

  <!-- ===== Step 4: App 1 release snapshot ===== -->
  <rect x="132" y="276" width="30" height="30" rx="15" fill="#3b82f6"/>
  <text x="147" y="296" text-anchor="middle" class="step-num">4</text>
  <rect x="56" y="270" width="284" height="44" class="box step-box" filter="url(#shadow)"/>
  <text x="72" y="290" class="label">Release Snapshot (App 1)</text>
  <text x="72" y="306" class="sub">SnapshotDeletionPolicy.release()</text>

  <!-- ===== Step 5: App 2 resume refresh ===== -->
  <rect x="478" y="336" width="30" height="30" rx="15" fill="#3b82f6"/>
  <text x="493" y="356" text-anchor="middle" class="step-num">5</text>
  <rect x="516" y="330" width="284" height="44" class="box step-box" filter="url(#shadow)"/>
  <text x="532" y="350" class="label">Resume Refresh (App 2)</text>
  <text x="532" y="366" class="sub">DirectoryReader 재개 → 새 세그먼트 로드</text>

  <!-- Arrow: Step 5 signal -->
  <path d="M 478 351 L 240 351" class="arrow" style="stroke-dasharray: 4 3;"/>
  <text x="330" y="346" class="tiny" style="fill: #3b82f6;">POST /lucene/resume-refresh</text>

  <!-- ===== Protection mechanism boxes ===== -->
  <!-- SnapshotDeletionPolicy (App 1) -->
  <rect x="30" y="400" width="380" height="80" class="protect" filter="url(#shadow)"/>
  <text x="50" y="422" class="label" style="fill: #92400e;">SnapshotDeletionPolicy (App 1)</text>
  <text x="50" y="438" class="sub" style="fill: #92400e;">rsync 전송 중 merge가 세그먼트를 삭제하는 것을 방지</text>
  <text x="50" y="454" class="tiny" style="fill: #a16207;">스냅샷이 참조하는 segments_N + 세그먼트 파일은</text>
  <text x="50" y="466" class="tiny" style="fill: #a16207;">release() 호출 전까지 삭제되지 않음</text>

  <!-- Refresh Pause (App 2) -->
  <rect x="450" y="400" width="380" height="80" class="protect" filter="url(#shadow)"/>
  <text x="470" y="422" class="label" style="fill: #92400e;">Refresh Pause (App 2) — LUCENE-628</text>
  <text x="470" y="438" class="sub" style="fill: #92400e;">rsync 도중 반쯤 복사된 세그먼트를 읽는 것을 방지</text>
  <text x="470" y="454" class="tiny" style="fill: #a16207;">DirectoryReader가 파일 변경을 감지하지 않도록</text>
  <text x="470" y="466" class="tiny" style="fill: #a16207;">refresh를 일시 중단 → rsync 완료 후 재개</text>
</svg>