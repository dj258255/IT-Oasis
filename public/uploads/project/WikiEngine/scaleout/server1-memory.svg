<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .value { font-size: 11px; fill: #0f172a; font-weight: 700; }
  </style>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" class="heading">서버 1 메모리 배분 (12GB)</text>

  <!-- Full bar background -->
  <rect x="40" y="44" width="620" height="40" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

  <!-- App 1: 2G / 12G = 16.7% → 103px -->
  <rect x="40" y="44" width="103" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="91" y="62" text-anchor="middle" class="label">App 1</text>
  <text x="91" y="76" text-anchor="middle" class="sub">2 GB</text>

  <!-- MySQL: 3G / 12G = 25% → 155px -->
  <rect x="143" y="44" width="155" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="62" text-anchor="middle" class="label">MySQL Primary</text>
  <text x="220" y="76" text-anchor="middle" class="sub">3 GB</text>

  <!-- Redis: 256M / 12G ≈ 2.1% → 16px -->
  <rect x="298" y="44" width="16" height="40" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>

  <!-- Nginx: 64M → 10px -->
  <rect x="314" y="44" width="10" height="40" rx="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>

  <!-- Sidecars (Alloy+cAdvisor+Exps): ~0.5G / 12G ≈ 4.2% → 26px -->
  <rect x="324" y="44" width="26" height="40" rx="4" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>

  <!-- Remaining: ~6.2G / 12G = 51.7% → 310px -->
  <rect x="350" y="44" width="310" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="505" y="62" text-anchor="middle" class="sub" style="fill: #22c55e; font-weight: 600;">남은 ~6.2 GB</text>
  <text x="505" y="76" text-anchor="middle" class="tiny" style="fill: #22c55e;">OS + Lucene MMap 페이지 캐시</text>

  <!-- Breakdown table -->
  <rect x="40" y="104" width="620" height="268" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="40" y="104" width="620" height="28" rx="8" fill="#334155"/>
  <text x="60" y="122" font-size="11" fill="white" font-weight="700">컨테이너</text>
  <text x="310" y="122" font-size="11" fill="white" font-weight="700">메모리</text>
  <text x="440" y="122" font-size="11" fill="white" font-weight="700">비고</text>

  <!-- Row 1: App 1 -->
  <line x1="40" y1="156" x2="660" y2="156" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="140" width="8" height="8" rx="2" fill="#3b82f6"/>
  <text x="66" y="148" class="label">wiki-app-prod</text>
  <text x="310" y="148" class="value">2 GB</text>
  <text x="440" y="148" class="sub">Spring Boot + Lucene Primary</text>

  <!-- Row 2: MySQL Primary -->
  <line x1="40" y1="180" x2="660" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="164" width="8" height="8" rx="2" fill="#f59e0b"/>
  <text x="66" y="172" class="label">wiki-mysql-prod</text>
  <text x="310" y="172" class="value">3 GB</text>
  <text x="440" y="172" class="sub">InnoDB BP 2GB + MySQL 오버헤드</text>

  <!-- Row 3: Redis -->
  <line x1="40" y1="204" x2="660" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="188" width="8" height="8" rx="2" fill="#ec4899"/>
  <text x="66" y="196" class="label">wiki-redis-prod</text>
  <text x="310" y="196" class="value">256 MB</text>
  <text x="440" y="196" class="sub">L2 캐시 + 세션 + TokenBlacklist</text>

  <!-- Row 4: Nginx -->
  <line x1="40" y1="228" x2="660" y2="228" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="212" width="8" height="8" rx="2" fill="#6366f1"/>
  <text x="66" y="220" class="label">nginx</text>
  <text x="310" y="220" class="value">64 MB</text>
  <text x="440" y="220" class="sub">리버스 프록시 + least_conn LB</text>

  <!-- Row 5: Alloy -->
  <line x1="40" y1="252" x2="660" y2="252" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="236" width="8" height="8" rx="2" fill="#a855f7"/>
  <text x="66" y="244" class="label">grafana-alloy</text>
  <text x="310" y="244" class="value">128 MB</text>
  <text x="440" y="244" class="sub">메트릭 수집 + 원격 전송</text>

  <!-- Row 6: cAdvisor -->
  <line x1="40" y1="276" x2="660" y2="276" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="260" width="8" height="8" rx="2" fill="#a855f7"/>
  <text x="66" y="268" class="label">cAdvisor</text>
  <text x="310" y="268" class="value">128 MB</text>
  <text x="440" y="268" class="sub">컨테이너 메트릭</text>

  <!-- Row 7: Exporters -->
  <line x1="40" y1="300" x2="660" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="284" width="8" height="8" rx="2" fill="#a855f7"/>
  <text x="66" y="292" class="label">MySQL Exp + Node Exp + Promtail</text>
  <text x="310" y="292" class="value">~200 MB</text>
  <text x="440" y="292" class="sub">각종 메트릭 + 로그 수집</text>

  <!-- Divider -->
  <line x1="52" y1="310" x2="648" y2="310" stroke="#334155" stroke-width="1.5"/>

  <!-- Total -->
  <text x="66" y="328" class="label" style="fill: #334155;">합계</text>
  <text x="310" y="328" class="value" style="fill: #334155;">~5.8 GB</text>
  <text x="440" y="328" class="sub">12GB 중 48.3% 사용</text>

  <!-- Remaining -->
  <rect x="50" y="340" width="8" height="8" rx="2" fill="#22c55e"/>
  <text x="66" y="348" class="label" style="fill: #22c55e;">남은 메모리</text>
  <text x="310" y="348" class="value" style="fill: #22c55e;">~6.2 GB</text>
  <text x="440" y="348" class="sub">OS + Lucene MMap 페이지 캐시 (인덱스 20GB)</text>

  <!-- Footer note -->
  <text x="66" y="370" class="tiny">서버 1은 Scale-out 전후 변경 없음 — Nginx에 upstream 설정만 추가</text>
</svg>