<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .heading { font-size: 13px; fill: #0f172a; font-weight: 800; }
    .value { font-size: 11px; fill: #0f172a; font-weight: 700; }
    .ok { font-size: 11px; fill: #16a34a; font-weight: 700; }
    .danger { font-size: 11px; fill: #dc2626; font-weight: 700; }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/></marker>
    <filter id="s"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#00000010"/></filter>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="heading">실무(AWS) 환경 비용 비교 — 조회수 Redis INCR 전환</text>

  <!-- Before -->
  <rect x="30" y="44" width="310" height="140" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#s)"/>
  <text x="185" y="66" text-anchor="middle" class="label" style="fill: #dc2626;">Before — 매 GET마다 DB UPDATE</text>

  <text x="50" y="90" class="sub">RDS Primary</text>
  <text x="250" y="90" class="danger">매 요청 UPDATE</text>

  <text x="50" y="112" class="sub">Primary CPU/IOPS</text>
  <text x="250" y="112" class="danger">초당 수백 건 소모</text>

  <text x="50" y="134" class="sub">UPDATE 횟수</text>
  <text x="250" y="134" class="danger">초당 수백 건</text>

  <text x="50" y="160" class="sub">다운스케일 여지</text>
  <text x="250" y="160" class="danger">없음 (IOPS 포화)</text>

  <!-- Arrow -->
  <path d="M 340 114 L 376 114" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="358" y="108" class="tiny" style="font-weight: 600;">전환</text>

  <!-- After -->
  <rect x="380" y="44" width="310" height="140" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#s)"/>
  <text x="535" y="66" text-anchor="middle" class="label" style="fill: #16a34a;">After — ElastiCache INCR + 배치 flush</text>

  <text x="400" y="90" class="sub">ElastiCache INCR</text>
  <text x="600" y="90" class="ok">O(1) 원자적</text>

  <text x="400" y="112" class="sub">Primary UPDATE</text>
  <text x="600" y="112" class="ok">30초마다 수십 건</text>

  <text x="400" y="134" class="sub">UPDATE 감소</text>
  <text x="600" y="134" class="ok">99%+ 감소</text>

  <text x="400" y="160" class="sub">ElastiCache 추가 비용</text>
  <text x="600" y="160" class="ok">0원 (기존 운영)</text>

  <!-- Bottom summary -->
  <rect x="30" y="200" width="660" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#s)"/>

  <rect x="45" y="210" width="8" height="8" rx="2" fill="#dc2626"/>
  <text x="60" y="218" class="sub">Primary UPDATE 횟수</text>
  <text x="240" y="218" class="danger">초당 수백 건</text>
  <text x="310" y="218" class="tiny">→</text>
  <text x="330" y="218" class="ok">30초마다 수십 건</text>
  <text x="480" y="218" class="value">(99%+ 감소)</text>

  <rect x="45" y="236" width="8" height="8" rx="2" fill="#16a34a"/>
  <text x="60" y="244" class="sub">Primary 다운스케일</text>
  <text x="240" y="244" class="ok">UPDATE IOPS 감소만큼 여유 확보 → 인스턴스 스펙 절감 가능</text>

  <rect x="45" y="252" width="8" height="8" rx="2" fill="#3b82f6"/>
  <text x="60" y="260" class="sub">ElastiCache 추가 비용</text>
  <text x="240" y="260" class="value">이미 캐시/세션용으로 운영 중이면 0원 추가</text>
</svg>
