<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Nori 형태소 분석 — 비대칭 현상의 전체 흐름</text>

  <!-- ============ ROW 1: 인덱싱 ============ -->
  <rect x="20" y="56" width="860" height="150" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="40" y="80" font-size="12" font-weight="700" fill="#15803d" letter-spacing="1">인덱싱</text>

  <!-- Input -->
  <rect x="40" y="94" width="120" height="36" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="100" y="117" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">"안녕하세요"</text>

  <!-- Arrow -->
  <line x1="164" y1="112" x2="200" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Nori -->
  <rect x="204" y="90" width="60" height="44" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="234" y="117" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Nori</text>

  <!-- Arrow -->
  <line x1="268" y1="112" x2="296" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tokens -->
  <rect x="300" y="90" width="220" height="44" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="310" y="110" font-size="11" fill="#18181b"><tspan font-weight="700" fill="#16a34a">안녕</tspan><tspan font-size="10" fill="#71717a"> NNG</tspan></text>
  <text x="370" y="110" font-size="11" fill="#a1a1aa">+  하 <tspan font-size="10">XSV</tspan>  +  세요 <tspan font-size="10">EF</tspan></text>
  <text x="310" y="126" font-size="10" fill="#71717a">명사 + 동사접미사 + 종결어미</text>

  <!-- Arrow -->
  <line x1="524" y1="112" x2="560" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stop Filter -->
  <rect x="564" y="90" width="90" height="44" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="609" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Stop Filter</text>
  <text x="609" y="124" text-anchor="middle" font-size="10" fill="#a16207">XSV,EF 제거</text>

  <!-- Arrow green -->
  <line x1="658" y1="112" x2="694" y2="112" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Result -->
  <rect x="698" y="90" width="170" height="44" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="783" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">안녕</text>
  <text x="783" y="126" text-anchor="middle" font-size="10" fill="#16a34a">인덱스에 토큰 저장 ✓</text>

  <!-- ============ ROW 2: 검색 "안녕하" ============ -->
  <rect x="20" y="220" width="860" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="1">검색 — 정상 매칭</text>

  <!-- Input -->
  <rect x="40" y="258" width="120" height="36" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="100" y="281" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">"안녕하"</text>

  <!-- Arrow -->
  <line x1="164" y1="276" x2="200" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Nori -->
  <rect x="204" y="254" width="60" height="44" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="234" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Nori</text>

  <!-- Arrow -->
  <line x1="268" y1="276" x2="296" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tokens -->
  <rect x="300" y="254" width="220" height="44" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="310" y="274" font-size="11" fill="#18181b"><tspan font-weight="700" fill="#16a34a">안녕</tspan><tspan font-size="10" fill="#71717a"> NNG</tspan></text>
  <text x="390" y="274" font-size="11" fill="#a1a1aa">+  하 <tspan font-size="10">XSV</tspan></text>
  <text x="310" y="290" font-size="10" fill="#71717a">명사 + 동사접미사</text>

  <!-- Arrow -->
  <line x1="524" y1="276" x2="560" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stop Filter -->
  <rect x="564" y="254" width="90" height="44" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="609" y="274" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Stop Filter</text>
  <text x="609" y="288" text-anchor="middle" font-size="10" fill="#a16207">XSV 제거</text>

  <!-- Arrow green -->
  <line x1="658" y1="276" x2="694" y2="276" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Result -->
  <rect x="698" y="254" width="170" height="44" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="783" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">안녕</text>
  <text x="783" y="290" text-anchor="middle" font-size="10" fill="#16a34a">매칭 성공 ✓</text>

  <!-- Explanation -->
  <text x="40" y="340" font-size="11" fill="#1e40af">쿼리: title:"안녕"^3 OR content:"안녕" → 인덱스의 '안녕' 토큰과 매칭</text>

  <!-- ============ ROW 3: 검색 "안녕" ============ -->
  <rect x="20" y="384" width="860" height="170" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="40" y="408" font-size="12" font-weight="700" fill="#dc2626" letter-spacing="1">검색 — 토큰 소멸 (0건)</text>

  <!-- Input -->
  <rect x="40" y="422" width="120" height="36" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="100" y="445" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">"안녕"</text>

  <!-- Arrow -->
  <line x1="164" y1="440" x2="200" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Nori -->
  <rect x="204" y="418" width="60" height="44" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="234" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Nori</text>

  <!-- Arrow -->
  <line x1="268" y1="440" x2="296" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tokens -->
  <rect x="300" y="418" width="220" height="44" rx="8" fill="#fff" stroke="#fca5a5"/>
  <text x="310" y="438" font-size="11" fill="#18181b"><tspan font-weight="700" fill="#dc2626">안녕</tspan><tspan font-size="10" fill="#dc2626"> IC (감탄사)</tspan></text>
  <text x="310" y="454" font-size="10" fill="#71717a">standalone → 인사말로 분류</text>

  <!-- Arrow -->
  <line x1="524" y1="440" x2="560" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stop Filter -->
  <rect x="564" y="418" width="90" height="44" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="609" y="438" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Stop Filter</text>
  <text x="609" y="452" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">IC 제거!</text>

  <!-- Arrow red -->
  <line x1="658" y1="440" x2="694" y2="440" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Result -->
  <rect x="698" y="418" width="170" height="44" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="783" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">(빈 쿼리)</text>
  <text x="783" y="454" text-anchor="middle" font-size="10" fill="#dc2626">결과 0건 ✗</text>

  <!-- Explanation -->
  <text x="40" y="500" font-size="11" fill="#991b1b">인덱스에 '안녕' 토큰이 존재하지만, 검색 시 쿼리 자체가 사라져서 매칭 불가</text>

  <!-- Bottom note -->
  <rect x="40" y="530" width="820" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="450" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">같은 '안녕' — 문맥에 따라 NNG(명사) 또는 IC(감탄사)로 태깅</text>
  <text x="450" y="572" text-anchor="middle" font-size="11" fill="#64748b">mecab-ko 사전: "안녕하다" 패턴 → NNG  |  standalone "안녕" → IC (인사말 우선)</text>

  <!-- Legend -->
  <circle cx="60" cy="604" r="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="72" y="608" font-size="10" fill="#71717a">토큰 생존</text>
  <circle cx="160" cy="604" r="5" fill="#fee2e2" stroke="#f87171"/>
  <text x="172" y="608" font-size="10" fill="#71717a">토큰 제거</text>
  <rect x="250" y="598" width="30" height="12" rx="3" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="288" y="608" font-size="10" fill="#71717a">Nori 분석기</text>
  <rect x="370" y="598" width="30" height="12" rx="3" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="408" y="608" font-size="10" fill="#71717a">Stop Filter</text>
</svg>
