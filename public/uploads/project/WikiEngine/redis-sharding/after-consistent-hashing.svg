<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .box { rx: 8; stroke-width: 1.5; }
    .heading { font-size: 14px; fill: #0f172a; font-weight: 800; }
    .label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { font-size: 10px; fill: #475569; }
    .tiny { font-size: 9px; fill: #64748b; }
    .app { fill: #dbeafe; stroke: #3b82f6; }
    .redis { fill: #fce7f3; stroke: #ec4899; }
    .redis-ok { fill: #d1fae5; stroke: #10b981; }
    .router { fill: #fef3c7; stroke: #f59e0b; }
    .section { fill: #f8fafc; stroke: #e2e8f0; rx: 10; stroke-width: 1; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#ah); }
    .arrow-green { fill: none; stroke: #10b981; stroke-width: 2; marker-end: url(#ah-green); }
    .arrow-orange { fill: none; stroke: #f59e0b; stroke-width: 2; marker-end: url(#ah-orange); }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/></marker>
    <marker id="ah-green" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#10b981"/></marker>
    <marker id="ah-orange" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#f59e0b"/></marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000010"/>
    </filter>
  </defs>

  <text x="430" y="28" text-anchor="middle" class="heading">After — Consistent Hashing + 용도별 격리</text>

  <rect x="20" y="42" width="820" height="385" class="section" filter="url(#shadow)"/>

  <!-- App -->
  <rect x="50" y="58" width="760" height="120" class="box app" filter="url(#shadow)" style="fill:#eff6ff"/>
  <text x="430" y="78" text-anchor="middle" class="label">Spring Boot App</text>

  <!-- ConsistentHashRouter -->
  <rect x="75" y="90" width="350" height="44" class="box router" filter="url(#shadow)"/>
  <text x="250" y="108" text-anchor="middle" class="sub" style="font-weight:700">ConsistentHashRouter</text>
  <text x="250" y="122" text-anchor="middle" class="tiny">자동완성 KV + 캐시 L2 + 조회수 (해시 링 라우팅)</text>

  <!-- TokenBlacklist (격리) -->
  <rect x="455" y="90" width="330" height="44" class="box redis-ok" filter="url(#shadow)"/>
  <text x="620" y="108" text-anchor="middle" class="sub" style="font-weight:700">RedisTokenBlacklist (격리)</text>
  <text x="620" y="122" text-anchor="middle" class="tiny">기존 단일 Redis 유지 · 보안 크리티컬 · 샤딩 제외</text>

  <!-- Arrows from Router to 3 shards -->
  <path d="M 155 150 L 155 240" class="arrow-orange"/>
  <path d="M 250 150 L 430 240" class="arrow-orange"/>
  <path d="M 340 150 L 690 240" class="arrow-orange"/>

  <!-- Arrow from Blacklist to original Redis -->
  <path d="M 620 150 L 430 320" class="arrow-green"/>

  <!-- Redis Shard 1 -->
  <rect x="60" y="230" width="190" height="60" class="box redis" filter="url(#shadow)"/>
  <text x="155" y="255" text-anchor="middle" class="label">Redis #1</text>
  <text x="155" y="272" text-anchor="middle" class="tiny">:6381 · 128mb · volatile-lru</text>

  <!-- Redis Shard 2 -->
  <rect x="335" y="230" width="190" height="60" class="box redis" filter="url(#shadow)"/>
  <text x="430" y="255" text-anchor="middle" class="label">Redis #2</text>
  <text x="430" y="272" text-anchor="middle" class="tiny">:6382 · 128mb · volatile-lru</text>

  <!-- Redis Shard 3 -->
  <rect x="600" y="230" width="190" height="60" class="box redis" filter="url(#shadow)"/>
  <text x="695" y="255" text-anchor="middle" class="label">Redis #3</text>
  <text x="695" y="272" text-anchor="middle" class="tiny">:6383 · 128mb · volatile-lru</text>

  <!-- Original Redis (블랙리스트 전용) -->
  <rect x="330" y="310" width="200" height="50" class="box redis-ok" filter="url(#shadow)"/>
  <text x="430" y="332" text-anchor="middle" class="label">기존 Redis (블랙리스트 전용)</text>
  <text x="430" y="346" text-anchor="middle" class="tiny">:6379 · noeviction · 보안 격리</text>

  <!-- Benefits -->
  <rect x="50" y="380" width="250" height="34" class="box redis-ok" filter="url(#shadow)"/>
  <text x="175" y="401" text-anchor="middle" class="sub" style="fill:#059669">KEYS→SCAN · 블로킹 제거</text>

  <rect x="310" y="380" width="250" height="34" class="box redis-ok" filter="url(#shadow)"/>
  <text x="435" y="401" text-anchor="middle" class="sub" style="fill:#059669">배치↔실시간 워크로드 격리</text>

  <rect x="570" y="380" width="250" height="34" class="box redis-ok" filter="url(#shadow)"/>
  <text x="695" y="401" text-anchor="middle" class="sub" style="fill:#059669">블랙리스트 eviction 위험 제거</text>
</svg>