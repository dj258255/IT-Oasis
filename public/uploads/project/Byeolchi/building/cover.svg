<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="별찌 Byeolchi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d22"/>
      <stop offset="0.55" stop-color="#2a1030"/>
      <stop offset="1" stop-color="#0f0a18"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D8B"/>
      <stop offset="1" stop-color="#A435F0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3D8B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A435F0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="935" cy="205" r="240" fill="url(#orb)"/>

  <!-- shooting star (별찌 = 별똥별) -->
  <g filter="url(#soft)" opacity="0.85">
    <line x1="250" y1="150" x2="640" y2="330" stroke="url(#brand)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <line x1="250" y1="150" x2="640" y2="330" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="648" cy="334" r="9" fill="#FFFFFF"/>
  <circle cx="648" cy="334" r="20" fill="#FF3D8B" opacity="0.35"/>

  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="300" cy="120" r="2.5"/>
    <circle cx="470" cy="95" r="2"/>
    <circle cx="820" cy="120" r="2.5"/>
    <circle cx="980" cy="430" r="2"/>
    <circle cx="180" cy="430" r="2.5"/>
  </g>

  <text x="100" y="430" font-family="'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif" font-size="150" font-weight="800" fill="#FFFFFF" letter-spacing="-4">별찌</text>
  <text x="108" y="488" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="40" font-weight="600" letter-spacing="6" fill="url(#brand)">BYEOLCHI</text>

  <text x="110" y="552" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="500" fill="#E9D9F2" opacity="0.92">한국형 AI 패션 쇼핑 어시스턴트</text>
  <g>
    <rect x="110" y="572" width="172" height="38" rx="19" fill="none" stroke="url(#brand)" stroke-width="2"/>
    <text x="196" y="597" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="20" font-weight="600" fill="#FF8FBF">만드는 중</text>
  </g>
</svg>
