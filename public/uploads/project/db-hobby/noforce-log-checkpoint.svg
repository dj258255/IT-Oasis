<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="nfarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="1000" height="440" rx="12" fill="#0d1117"/>
  <text x="500" y="38" text-anchor="middle" fill="#8b949e" font-size="18">no-force — 커밋은 로그 fsync 하나로 끝나고, 로그엔 커밋 이력이 쌓인다</text>

  <!-- WAL 로그 스트림: 커밋 구간들 + loser 꼬리 -->
  <text x="48" y="76" fill="#6e7681" font-size="13">WAL 로그 (truncate 안 함 — 진실의 원천)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5">
    <!-- 커밋1 구간 -->
    <rect x="48" y="88" width="86" height="44" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="91" y="114" text-anchor="middle" fill="#58a6ff">PAGE</text>
    <rect x="140" y="88" width="86" height="44" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="183" y="114" text-anchor="middle" fill="#58a6ff">PAGE</text>
    <rect x="232" y="88" width="86" height="44" rx="6" fill="#0e1b12" stroke="#238636"/>
    <text x="275" y="114" text-anchor="middle" fill="#3fb950">COMMIT₁</text>
    <!-- 커밋2 구간 -->
    <rect x="324" y="88" width="86" height="44" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="367" y="114" text-anchor="middle" fill="#58a6ff">PAGE</text>
    <rect x="416" y="88" width="86" height="44" rx="6" fill="#0e1b12" stroke="#238636"/>
    <text x="459" y="114" text-anchor="middle" fill="#3fb950">COMMIT₂</text>
    <!-- loser 꼬리 -->
    <rect x="508" y="88" width="86" height="44" rx="6" fill="#161b22" stroke="#9e6a03" stroke-dasharray="4 3"/>
    <text x="551" y="114" text-anchor="middle" fill="#f0b429">BEGIN</text>
    <rect x="600" y="88" width="86" height="44" rx="6" fill="#161b22" stroke="#9e6a03" stroke-dasharray="4 3"/>
    <text x="643" y="114" text-anchor="middle" fill="#f0b429">UNDO</text>
    <rect x="692" y="88" width="86" height="44" rx="6" fill="#161b22" stroke="#9e6a03" stroke-dasharray="4 3"/>
    <text x="735" y="114" text-anchor="middle" fill="#f0b429">UNDO</text>
    <text x="820" y="114" fill="#6e7681">··· ⚡크래시</text>
  </g>
  <text x="275" y="156" text-anchor="middle" fill="#6e7681" font-size="12">커밋 = 마커 fsync가 전부(내구성 지점)</text>
  <text x="643" y="156" text-anchor="middle" fill="#6e7681" font-size="12">마지막 커밋 뒤 꼬리 = 미완(loser)</text>
  <text x="48" y="186" fill="#8b949e" font-size="13">데이터 파일 반영은 게으르다 — fsync 없이 write-back, 크래시 시 로그가 진실</text>

  <!-- 분기 화살표 -->
  <path d="M300,196 C280,232 250,240 235,258" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#nfarrow)"/>
  <path d="M700,196 C720,232 750,240 765,258" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#nfarrow)"/>

  <!-- 좌: 크래시 복구 -->
  <rect x="48" y="264" width="440" height="130" rx="8" fill="#0e1b12" stroke="#238636"/>
  <text x="68" y="292" fill="#3fb950" font-size="15">크래시 복구 = 역사의 재생</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <text x="68" y="320" fill="#8b949e">Pass 1  커밋 구간을 순서대로 redo</text>
    <text x="68" y="344" fill="#8b949e">Pass 2  꼬리(loser)만 before-image로 undo</text>
    <text x="68" y="368" fill="#6e7681">끝 = 데이터 fsync + 로그 truncate (체크포인트)</text>
  </g>

  <!-- 우: 체크포인트 -->
  <rect x="512" y="264" width="440" height="130" rx="8" fill="#1c1408" stroke="#9e6a03"/>
  <text x="532" y="292" fill="#f0b429" font-size="15">체크포인트 — 로그의 빚 갚기</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <text x="532" y="320" fill="#8b949e">로그 &gt; 4MB 이면 커밋 끝에:</text>
    <text x="532" y="344" fill="#8b949e">① 데이터 fsync (로그를 따라잡음)</text>
    <text x="532" y="368" fill="#8b949e">② 로그 truncate <tspan fill="#6e7681">— 순서가 바뀌면 구멍</tspan></text>
  </g>

  <text x="500" y="424" text-anchor="middle" fill="#6e7681" font-size="13">커밋의 내구성 지점이 로그 하나로 — WAL이 일회용 버퍼에서 진실의 원천이 된다</text>
</svg>
