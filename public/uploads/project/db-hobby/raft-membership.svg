<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="1000" height="470" rx="12" fill="#0d1117"/>
  <text x="500" y="32" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Raft 멤버십 변경 (§6) — 돌아가는 중에 노드를 안전하게 더하고 뺀다</text>
  <text x="500" y="54" text-anchor="middle" fill="#6e7681" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">한 번에 한 노드만 바꾸면 옛 과반과 새 과반이 겹쳐 안전 (joint consensus 불필요)</text>

  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
  </defs>

  <!-- 왜 단일 서버인가 -->
  <rect x="30" y="76" width="940" height="70" rx="8" fill="#010409" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="50" y="100" fill="#f85149" font-size="12.5">위험 — 3→5로 한꺼번에 바꾸면:</text>
  <text x="50" y="122" fill="#c9d1d9" font-size="12">옛 과반(3중 2)과 새 과반(5중 3)이 안 겹치는 순간 → 각 구성이 서로 다른 리더를 뽑아 split-brain</text>
  <text x="50" y="140" fill="#3fb950" font-size="12">해결 — 한 번에 한 노드만(add/remove) → 옛·새 과반이 항상 겹친다(수학적 보장). 코드도 단일 비트 delta만 허용</text>

  <!-- add -->
  <text x="230" y="182" text-anchor="middle" fill="#3fb950" font-size="13">노드 추가</text>
  <g>
    <circle cx="110" cy="230" r="22" fill="#13283f" stroke="#1f6feb"/><text x="110" y="235" text-anchor="middle" fill="#58a6ff" font-size="12">0★</text>
    <circle cx="180" cy="230" r="22" fill="#0e1b12" stroke="#238636"/><text x="180" y="235" text-anchor="middle" fill="#3fb950" font-size="12">1</text>
    <circle cx="250" cy="230" r="22" fill="#0e1b12" stroke="#238636"/><text x="250" y="235" text-anchor="middle" fill="#3fb950" font-size="12">2</text>
    <circle cx="330" cy="230" r="22" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/><text x="330" y="235" text-anchor="middle" fill="#6e7681" font-size="11">3</text>
  </g>
  <text x="230" y="278" text-anchor="middle" fill="#6e7681" font-size="11">{0,1,2} 구성원 · 3은 passive</text>
  <line x1="290" y1="300" x2="290" y2="326" stroke="#8b949e" marker-end="url(#am)"/>
  <text x="230" y="318" fill="#f0b429" font-size="11">리더가 config 엔트리(새 마스크) 추가·복제</text>
  <g>
    <circle cx="330" cy="360" r="22" fill="#0e1b12" stroke="#238636"/><text x="330" y="365" text-anchor="middle" fill="#3fb950" font-size="12">3</text>
  </g>
  <text x="230" y="365" text-anchor="middle" fill="#3fb950" font-size="11.5">3이 '로그에 보자마자' 구성원 →</text>
  <text x="230" y="382" text-anchor="middle" fill="#3fb950" font-size="11.5">AppendEntries로 따라잡고 과반=4중3</text>

  <!-- remove -->
  <line x1="480" y1="270" x2="540" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#am)"/>
  <text x="770" y="182" text-anchor="middle" fill="#f0b429" font-size="13">노드 제거</text>
  <g>
    <circle cx="640" cy="230" r="22" fill="#13283f" stroke="#1f6feb"/><text x="640" y="235" text-anchor="middle" fill="#58a6ff" font-size="12">0★</text>
    <circle cx="710" cy="230" r="22" fill="#0e1b12" stroke="#238636"/><text x="710" y="235" text-anchor="middle" fill="#3fb950" font-size="12">1</text>
    <circle cx="780" cy="230" r="22" fill="#1c0f10" stroke="#f85149" stroke-dasharray="4 3"/><text x="780" y="235" text-anchor="middle" fill="#f85149" font-size="12">2</text>
    <circle cx="850" cy="230" r="22" fill="#0e1b12" stroke="#238636"/><text x="850" y="235" text-anchor="middle" fill="#3fb950" font-size="12">3</text>
  </g>
  <text x="770" y="278" text-anchor="middle" fill="#6e7681" font-size="11">config 엔트리로 2 제거 → 과반=3중2</text>
  <text x="770" y="330" text-anchor="middle" fill="#3fb950" font-size="12">남은 {0,1,3}가 계속 커밋</text>
  <text x="770" y="356" text-anchor="middle" fill="#6e7681" font-size="11">제거된 2는 decommission</text>
  <text x="770" y="374" text-anchor="middle" fill="#f0b429" font-size="11">(live 제거 시 선거 disruption은 프론티어)</text>

  <text x="500" y="418" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">핫패스(과반·투표·복제 대상)를 n_nodes 고정에서 member_mask 비트마스크로 — member_mask=full이면 예전과 동일(그래서 기존 57 테스트가 못 잡음)</text>
  <text x="500" y="444" text-anchor="middle" fill="#6e7681" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">test_raft +12: 추가(가입·따라잡기)·단일 서버 delta 강제·제거(과반 재계산·합의 유지) · 프론티어: live 제거 disruption·joint consensus·리더 자기 제거</text>
</svg>
