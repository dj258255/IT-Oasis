<svg xmlns="http://www.w3.org/2000/svg" width="660" height="476" viewBox="0 0 660 476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5">
  <rect width="660" height="476" rx="10" fill="#0d1117"/>
  <rect width="660" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="660" height="10" fill="#161b22"/>
  <circle cx="22" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="19" r="5.5" fill="#27c93f"/>
  <text x="330" y="24" text-anchor="middle" fill="#6e7681" font-size="12">minidb — SQL REPL</text>

  <g>
    <text x="20" y="64"><tspan fill="#58a6ff">minidb&gt;</tspan> <tspan fill="#e6edf3">CREATE TABLE users (id INT, name TEXT);</tspan></text>
    <text x="20" y="86" fill="#8b949e">테이블 'users' 생성됨 (컬럼 2개)</text>

    <text x="20" y="108"><tspan fill="#58a6ff">minidb&gt;</tspan> <tspan fill="#e6edf3">INSERT INTO users VALUES (1, 'kim');</tspan></text>
    <text x="20" y="130" fill="#8b949e">1개 행 삽입됨</text>
    <text x="20" y="152"><tspan fill="#58a6ff">minidb&gt;</tspan> <tspan fill="#e6edf3">INSERT INTO users VALUES (2, 'lee');</tspan></text>
    <text x="20" y="174" fill="#8b949e">1개 행 삽입됨</text>
    <text x="20" y="196"><tspan fill="#58a6ff">minidb&gt;</tspan> <tspan fill="#e6edf3">INSERT INTO users VALUES (3, 'park');</tspan></text>
    <text x="20" y="218" fill="#8b949e">1개 행 삽입됨</text>

    <text x="20" y="240"><tspan fill="#58a6ff">minidb&gt;</tspan> <tspan fill="#e6edf3">SELECT * FROM users;</tspan></text>
    <text x="20" y="262" fill="#6e7681">id | name</text>
    <text x="20" y="284" fill="#3fb950">1 | kim</text>
    <text x="20" y="306" fill="#3fb950">2 | lee</text>
    <text x="20" y="328" fill="#3fb950">3 | park</text>
    <text x="20" y="350" fill="#6e7681">(3행)</text>

    <text x="20" y="372"><tspan fill="#58a6ff">minidb&gt;</tspan> <tspan fill="#e6edf3">SELECT * FROM users WHERE id = 2;</tspan></text>
    <text x="20" y="394" fill="#6e7681">id | name</text>
    <text x="20" y="416" fill="#f0b429">2 | lee</text>
    <text x="20" y="438" fill="#6e7681">(1행)</text>
  </g>
</svg>
