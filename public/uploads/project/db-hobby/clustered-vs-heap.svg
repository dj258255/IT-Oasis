<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="charrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="1000" height="470" rx="12" fill="#0d1117"/>
  <text x="500" y="34" text-anchor="middle" fill="#8b949e" font-size="18">힙(PostgreSQL) vs 클러스터드(InnoDB) — 저장 구조가 곧 성능</text>

  <!-- 좌: 힙 (PG) -->
  <text x="245" y="66" text-anchor="middle" fill="#58a6ff" font-size="15">힙 (PostgreSQL)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12">
    <rect x="40" y="80" width="180" height="34" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="130" y="102" text-anchor="middle" fill="#58a6ff">PK 인덱스 (key→RID)</text>
    <rect x="270" y="80" width="180" height="34" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="360" y="102" text-anchor="middle" fill="#58a6ff">보조 인덱스 (sk→RID)</text>
    <rect x="120" y="160" width="250" height="40" rx="6" fill="#161b22" stroke="#6e7681"/>
    <text x="245" y="185" text-anchor="middle" fill="#8b949e">힙 파일 (행이 흩어져 쌓임)</text>
  </g>
  <path d="M130,114 L210,160" stroke="#6e7681" stroke-width="1.3" marker-end="url(#charrow)"/>
  <path d="M360,114 L290,160" stroke="#6e7681" stroke-width="1.3" marker-end="url(#charrow)"/>
  <text x="245" y="222" text-anchor="middle" fill="#6e7681" font-size="12">조회 = 인덱스 → RID → 힙 페치 (모든 인덱스 대등)</text>

  <!-- 우: 클러스터드 (InnoDB) -->
  <text x="740" y="66" text-anchor="middle" fill="#f0b429" font-size="15">클러스터드 (InnoDB)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12">
    <rect x="560" y="80" width="200" height="34" rx="6" fill="#1c1408" stroke="#9e6a03"/>
    <text x="660" y="102" text-anchor="middle" fill="#f0b429">보조 인덱스 (sk→PK)</text>
    <rect x="620" y="160" width="260" height="40" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="750" y="185" text-anchor="middle" fill="#58a6ff">PK B+Tree — 리프에 행이 PK 순서로</text>
  </g>
  <path d="M660,114 L730,160" stroke="#6e7681" stroke-width="1.3" marker-end="url(#charrow)"/>
  <text x="740" y="222" text-anchor="middle" fill="#6e7681" font-size="12">조회 = 보조 → PK → 클러스터드 (데이터가 리프에)</text>

  <!-- 벤치 결과 -->
  <text x="500" y="262" text-anchor="middle" fill="#8b949e" font-size="14">실측 (4만 행, 섞어 적재) — 배수 = 힙/클러스터드</text>

  <rect x="60" y="278" width="280" height="86" rx="8" fill="#0e1b12" stroke="#238636"/>
  <text x="80" y="302" fill="#3fb950" font-size="14">PK 점 조회 · PK 범위</text>
  <text x="80" y="326" fill="#8b949e" font-size="12.5">점: 1.2배 · 범위(200행): 3.8배</text>
  <text x="80" y="348" fill="#6e7681" font-size="12">→ 클러스터드 유리 (행이 리프에·지역성)</text>

  <rect x="360" y="278" width="280" height="86" rx="8" fill="#1c1408" stroke="#9e6a03"/>
  <text x="380" y="302" fill="#f0b429" font-size="14">보조 점 조회</text>
  <text x="380" y="326" fill="#8b949e" font-size="12.5">클러스터드 2배 느림 (0.5배)</text>
  <text x="380" y="348" fill="#6e7681" font-size="12">→ 보조→PK→데이터 이중 조회 (InnoDB 특성)</text>

  <rect x="660" y="278" width="280" height="86" rx="8" fill="#161b22" stroke="#6e7681"/>
  <text x="680" y="302" fill="#8b949e" font-size="14">결론</text>
  <text x="680" y="326" fill="#8b949e" font-size="12.5">"더 좋다"가 아니라</text>
  <text x="680" y="348" fill="#6e7681" font-size="12.5">"무엇에 최적화됐나" — 구조가 정한다</text>

  <!-- 하단 요점 -->
  <rect x="60" y="384" width="880" height="52" rx="8" fill="#161b22" stroke="#6e7681"/>
  <text x="80" y="408" fill="#8b949e" font-size="13">InnoDB: 보조 인덱스가 PK를 듦 → PK 길면 보조 인덱스 다 뚱뚱 ("PK 짧게"). PostgreSQL: 인덱스는 다 RID → 보조 페널티 없음</text>
  <text x="80" y="428" fill="#6e7681" font-size="12.5">기존 btree.c·heap.c를 두 방식으로 조합한 벤치·비교 (엔진에 CLUSTERED 모드 배선은 안 함 — 회귀 위험 회피)</text>

  <text x="500" y="458" text-anchor="middle" fill="#6e7681" font-size="12.5">make bench-clustered — 남의 벤치 논쟁이 "어떤 워크로드를 쟀냐"의 문제로 보인다</text>
</svg>
