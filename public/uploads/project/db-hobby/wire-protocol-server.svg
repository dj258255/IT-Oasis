<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="wparrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="1000" height="440" rx="12" fill="#0d1117"/>
  <text x="500" y="36" text-anchor="middle" fill="#8b949e" font-size="18">순정 psql이 붙는다 — wire protocol만 맞으면 클라이언트는 상대를 구분 못 한다</text>

  <!-- 좌: psql 두 개 -->
  <text x="130" y="80" text-anchor="middle" fill="#6e7681" font-size="13">순정 psql 14.19 × 2</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5">
    <rect x="40" y="92" width="180" height="60" rx="8" fill="#13283f" stroke="#1f6feb"/>
    <text x="130" y="116" text-anchor="middle" fill="#58a6ff">psql (터미널 A)</text>
    <text x="130" y="138" text-anchor="middle" fill="#6e7681">BEGIN; UPDATE...</text>
    <rect x="40" y="164" width="180" height="60" rx="8" fill="#13283f" stroke="#1f6feb"/>
    <text x="130" y="188" text-anchor="middle" fill="#58a6ff">psql (터미널 B)</text>
    <text x="130" y="210" text-anchor="middle" fill="#6e7681">SELECT ... → 옛 버전</text>
  </g>

  <!-- 화살표 + 프로토콜 라벨 -->
  <path d="M222,122 C250,122 255,150 283,150" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#wparrow)"/>
  <path d="M222,194 C250,194 255,166 283,166" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#wparrow)"/>
  <text x="252" y="112" text-anchor="middle" fill="#6e7681" font-size="11">TCP</text>

  <!-- 중앙: 서버 -->
  <rect x="286" y="88" width="330" height="230" rx="10" fill="#0e1b12" stroke="#238636"/>
  <text x="451" y="112" text-anchor="middle" fill="#3fb950" font-size="14">db-hobby --serve (단일 스레드 poll 루프)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12">
    <text x="306" y="140" fill="#8b949e">① 핸드셰이크</text>
    <text x="322" y="158" fill="#6e7681">SSLRequest → 'N', startup → AuthOk, Z</text>
    <text x="306" y="184" fill="#8b949e">② 커넥션 = 세션 (18편)</text>
    <text x="322" y="202" fill="#6e7681">cur_session = conn.session</text>
    <text x="306" y="228" fill="#8b949e">③ Query 'Q' → db_exec (무개조)</text>
    <text x="322" y="246" fill="#6e7681">open_memstream으로 텍스트 가로챔</text>
    <text x="306" y="272" fill="#8b949e">④ 텍스트 → wire 번역</text>
    <text x="322" y="290" fill="#6e7681">RowDescription / DataRow / Z(txn 상태)</text>
  </g>

  <!-- 우: 실행기 (재사용) -->
  <path d="M618,203 C646,203 651,203 679,203" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#wparrow)"/>
  <rect x="682" y="120" width="270" height="160" rx="10" fill="#13283f" stroke="#1f6feb"/>
  <text x="817" y="146" text-anchor="middle" fill="#58a6ff" font-size="14">기존 실행기 (2편~18편)</text>
  <g font-size="12.5" fill="#8b949e">
    <text x="702" y="174">파서 · 실행기 · MVCC · WAL</text>
    <text x="702" y="196">한 줄도 안 바꿈</text>
    <text x="702" y="224" fill="#6e7681">FILE*에 사람이 읽는 텍스트를 쓴다</text>
    <text x="702" y="246" fill="#6e7681">→ 서버가 그걸 wire로 번역할 뿐</text>
    <text x="702" y="268" fill="#3fb950">좋은 추상화의 배당금</text>
  </g>

  <!-- 하단: 한계 -->
  <rect x="40" y="336" width="912" height="56" rx="8" fill="#1c1408" stroke="#9e6a03"/>
  <text x="60" y="360" fill="#f0b429" font-size="14">한계 — 여러 커넥션을 받지만 단일 스레드: 한 순간 한 쿼리만. 느린 클라 하나가 서버 전체를 막는다</text>
  <text x="60" y="382" fill="#8b949e" font-size="13">진짜 병렬로 가려면 계층마다 latch가 필요하다 → 다음 편(트랙 D)의 장애 서사</text>
</svg>
