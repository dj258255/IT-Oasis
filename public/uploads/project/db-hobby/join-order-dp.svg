<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="1000" height="520" rx="12" fill="#0d1117"/>
  <text x="500" y="34" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">조인 순서가 비용을 가른다 — 순진한 좌→우 vs Selinger DP</text>
  <text x="500" y="56" text-anchor="middle" fill="#6e7681" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">체인: R0(10000) — R1(1000) — R2(10),  간선 선택도 R0·R1=0.001,  R1·R2=0.01</text>

  <!-- 왼쪽: 순진한 순서 0→1→2 -->
  <rect x="30" y="76" width="450" height="380" rx="10" fill="#010409" stroke="#f85149" stroke-opacity="0.6"/>
  <rect x="30" y="76" width="450" height="26" rx="10" fill="#1c0f10"/>
  <text x="255" y="93" text-anchor="middle" fill="#f85149" font-size="12.5">순진: 쿼리에 적힌 순서 (R0 ▷ R1 ▷ R2)</text>

  <!-- 조인 트리 (왼쪽 깊은) -->
  <!-- 최상위 조인 -->
  <rect x="180" y="118" width="150" height="30" rx="6" fill="#13283f" stroke="#1f6feb"/>
  <text x="255" y="138" text-anchor="middle" fill="#58a6ff">⋈  결과 100</text>
  <line x1="220" y1="148" x2="150" y2="188" stroke="#6e7681"/>
  <line x1="290" y1="148" x2="360" y2="188" stroke="#6e7681"/>

  <!-- 중간 조인 R0⋈R1 -->
  <rect x="70" y="188" width="180" height="46" rx="6" fill="#1c1408" stroke="#9e6a03"/>
  <text x="160" y="207" text-anchor="middle" fill="#f0b429">R0 ⋈ R1</text>
  <text x="160" y="225" text-anchor="middle" fill="#f0b429" font-size="11">중간결과 10000</text>
  <text x="160" y="252" text-anchor="middle" fill="#f85149" font-size="11">← 먼저 큰 걸 곱해 폭발</text>
  <line x1="120" y1="234" x2="95" y2="274" stroke="#6e7681"/>
  <line x1="200" y1="234" x2="225" y2="274" stroke="#6e7681"/>
  <rect x="55" y="274" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="95" y="292" text-anchor="middle" fill="#c9d1d9" font-size="11">R0 10000</text>
  <rect x="185" y="274" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="225" y="292" text-anchor="middle" fill="#c9d1d9" font-size="11">R1 1000</text>

  <rect x="320" y="188" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="360" y="206" text-anchor="middle" fill="#c9d1d9" font-size="11">R2 10</text>

  <rect x="70" y="380" width="360" height="56" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity="0.4"/>
  <text x="90" y="402" fill="#8b949e" font-size="12">비용 = 10000(스캔) + 10000×1000(R1) + 10000×10(R2)</text>
  <text x="90" y="424" fill="#f85149" font-size="15">총 비용 ≈ 31,010</text>

  <!-- 오른쪽: DP 순서 2→1→0 -->
  <rect x="520" y="76" width="450" height="380" rx="10" fill="#010409" stroke="#3fb950" stroke-opacity="0.6"/>
  <rect x="520" y="76" width="450" height="26" rx="10" fill="#0e1b12"/>
  <text x="745" y="93" text-anchor="middle" fill="#3fb950" font-size="12.5">DP: 작은 걸 먼저 (R2 ▷ R1 ▷ R0)</text>

  <rect x="670" y="118" width="150" height="30" rx="6" fill="#13283f" stroke="#1f6feb"/>
  <text x="745" y="138" text-anchor="middle" fill="#58a6ff">⋈  결과 100</text>
  <line x1="710" y1="148" x2="640" y2="188" stroke="#6e7681"/>
  <line x1="780" y1="148" x2="850" y2="188" stroke="#6e7681"/>

  <rect x="560" y="188" width="180" height="46" rx="6" fill="#0e1b12" stroke="#238636"/>
  <text x="650" y="207" text-anchor="middle" fill="#3fb950">R2 ⋈ R1</text>
  <text x="650" y="225" text-anchor="middle" fill="#3fb950" font-size="11">중간결과 100</text>
  <text x="650" y="252" text-anchor="middle" fill="#3fb950" font-size="11">← 작게 유지</text>
  <line x1="610" y1="234" x2="585" y2="274" stroke="#6e7681"/>
  <line x1="690" y1="234" x2="715" y2="274" stroke="#6e7681"/>
  <rect x="545" y="274" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="585" y="292" text-anchor="middle" fill="#c9d1d9" font-size="11">R2 10</text>
  <rect x="675" y="274" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="715" y="292" text-anchor="middle" fill="#c9d1d9" font-size="11">R1 1000</text>

  <rect x="810" y="188" width="90" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="855" y="206" text-anchor="middle" fill="#c9d1d9" font-size="11">R0 10000</text>

  <rect x="560" y="380" width="380" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-opacity="0.4"/>
  <text x="580" y="402" fill="#8b949e" font-size="12">비용 = 10(스캔) + 10×1000(R1) + 100×10000(R0)…최소화</text>
  <text x="580" y="424" fill="#3fb950" font-size="15">총 비용 ≈ 11,120   (2.8× 저렴)</text>

  <text x="500" y="486" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">dp[S] = 관계 집합 S의 최소 비용 계획 · n! 순열 대신 2ⁿ 부분집합만 채운다 · 연결된 관계만 붙여 교차곱 회피</text>
  <text x="500" y="507" text-anchor="middle" fill="#6e7681" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">정직한 경계: 순수 계획기 — 실행기(exec_select_join) 배선은 프론티어(순서 재정렬·ON 재매핑·LEFT JOIN 순서 제약)</text>
</svg>
