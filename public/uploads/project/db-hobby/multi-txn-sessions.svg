<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="mtarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="1000" height="460" rx="12" fill="#0d1117"/>
  <text x="500" y="36" text-anchor="middle" fill="#8b949e" font-size="18">reader는 writer를 기다리지 않는다 — 세션 인터리브 · 스냅샷 · first-updater-wins</text>

  <!-- 좌: 세션 0 (writer) -->
  <text x="70" y="76" fill="#6e7681" font-size="13">세션 0 — writer</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <rect x="70" y="88" width="360" height="98" rx="8" fill="#13283f" stroke="#1f6feb"/>
    <text x="90" y="114" fill="#58a6ff">BEGIN;</text>
    <text x="90" y="138" fill="#58a6ff">UPDATE t SET v=999 WHERE id=1;</text>
    <text x="90" y="162" fill="#6e7681">-- 미커밋 · 테이블 X락 보유</text>
  </g>

  <!-- 우: 세션 1 (reader) -->
  <text x="570" y="76" fill="#6e7681" font-size="13">세션 1 — reader (락 없음)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <rect x="570" y="88" width="360" height="98" rx="8" fill="#0e1b12" stroke="#238636"/>
    <text x="590" y="114" fill="#8b949e">SELECT * FROM t WHERE id=1;</text>
    <text x="590" y="138" fill="#3fb950">1 | 100   ← 옛 버전. 안 막혔다</text>
    <text x="590" y="162" fill="#6e7681">-- 거부도 대기도 없음 (가시성이 격리)</text>
  </g>

  <!-- 힙: 두 버전 -->
  <text x="70" y="228" fill="#6e7681" font-size="13">힙 — 한 행의 두 버전</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5">
    <rect x="70" y="240" width="400" height="38" rx="6" fill="#161b22" stroke="#6e7681"/>
    <text x="270" y="264" text-anchor="middle" fill="#8b949e">v=100 · xmax=<tspan fill="#f0b429">T7(미커밋)</tspan> → reader에게 <tspan fill="#3fb950">보임</tspan></text>
    <rect x="70" y="286" width="400" height="38" rx="6" fill="#161b22" stroke="#6e7681"/>
    <text x="270" y="310" text-anchor="middle" fill="#8b949e">v=999 · xmin=<tspan fill="#f0b429">T7(미커밋)</tspan> → reader에게 <tspan fill="#f85149">안 보임</tspan></text>
  </g>
  <text x="70" y="348" fill="#6e7681" font-size="12.5">PK 인덱스도 버전마다 항목(다중 버전) — 조회가 '보이는' 쪽을 고른다</text>

  <!-- 우하: 쓰기 충돌 -->
  <rect x="570" y="240" width="360" height="84" rx="8" fill="#1c1408" stroke="#9e6a03"/>
  <text x="590" y="266" fill="#f0b429" font-size="14">쓰기만은 충돌 — first-updater-wins</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5">
    <text x="590" y="290" fill="#8b949e">UPDATE t SET v=555 ...;</text>
    <text x="590" y="312" fill="#f85149">ERROR: 쓰기 충돌 (즉시 거부)</text>
  </g>
  <text x="570" y="348" fill="#6e7681" font-size="12.5">X락 = "테이블당 writer 하나" → 테이블별 WAL 복구(14·15편) 무수정 성립</text>

  <!-- 하단: 스냅샷 -->
  <rect x="70" y="376" width="860" height="56" rx="8" fill="#0e1b12" stroke="#238636"/>
  <text x="94" y="400" fill="#3fb950" font-size="14">BEGIN 시점 스냅샷 (REPEATABLE READ) — snap_next(경계) + 진행 중 목록 = PostgreSQL의 xmax·xip 축소판</text>
  <text x="94" y="422" fill="#8b949e" font-size="13">내 시작 이후에 커밋된 남의 변경은, 커밋돼 있어도 내 트랜잭션이 끝날 때까지 안 보인다</text>
</svg>
