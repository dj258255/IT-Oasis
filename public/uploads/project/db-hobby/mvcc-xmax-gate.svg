<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="xgarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="1000" height="450" rx="12" fill="#0d1117"/>
  <text x="500" y="36" text-anchor="middle" fill="#8b949e" font-size="18">DELETE는 지우지 않는다 — xmax 도장, 그리고 아홉 갈래 길 앞의 게이트 하나</text>

  <!-- 좌상: 힙의 버전들 -->
  <text x="60" y="76" fill="#6e7681" font-size="13">힙 (행은 물리적으로 남는다)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <rect x="60" y="88" width="300" height="40" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="210" y="113" text-anchor="middle" fill="#58a6ff">id=1 · xmin=7 xmax=0 <tspan fill="#3fb950">살아있음</tspan></text>
    <rect x="60" y="136" width="300" height="40" rx="6" fill="#161b22" stroke="#6e7681"/>
    <text x="210" y="161" text-anchor="middle" fill="#8b949e">id=2 · xmin=7 <tspan fill="#f85149">xmax=9</tspan> <tspan fill="#6e7681">지워짐(도장)</tspan></text>
    <rect x="60" y="184" width="300" height="40" rx="6" fill="#161b22" stroke="#6e7681"/>
    <text x="210" y="209" text-anchor="middle" fill="#8b949e">id=3 · xmin=7 <tspan fill="#f85149">xmax=9</tspan> <tspan fill="#6e7681">UPDATE 옛 버전</tspan></text>
    <rect x="60" y="232" width="300" height="40" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="210" y="257" text-anchor="middle" fill="#58a6ff">id=3 · xmin=9 xmax=0 <tspan fill="#3fb950">UPDATE 새 버전</tspan></text>
  </g>
  <text x="60" y="298" fill="#f0b429" font-size="13">트랜잭션 9를 ROLLBACK하면? xmax 무효 → id=2·옛 id=3이 되살아난다 (MVCC 롤백)</text>

  <!-- 우상: 아홉 갈래 읽기 경로 -->
  <text x="620" y="76" fill="#6e7681" font-size="13">힙을 읽는 아홉 갈래</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#8b949e">
    <text x="620" y="100">풀스캔        PK 점 조회</text>
    <text x="620" y="124">PK 범위       보조 인덱스</text>
    <text x="620" y="148">조인(스캔)    조인(해시 빌드)</text>
    <text x="620" y="172">조인(인덱스)  집계·정렬·서브쿼리</text>
    <text x="620" y="196">DML 수집 · 인덱스 빌드</text>
  </g>

  <!-- 게이트 -->
  <path d="M760,210 C760,240 745,252 720,268" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#xgarrow)"/>
  <rect x="520" y="274" width="420" height="64" rx="8" fill="#0e1b12" stroke="#238636"/>
  <text x="730" y="300" text-anchor="middle" fill="#3fb950" font-size="15">가시성 게이트 (하나)</text>
  <text x="730" y="324" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="13">rec_visible(db, rec) — xmin/xmax + 트랜잭션 상태</text>

  <!-- 하단: 대가 -->
  <rect x="60" y="368" width="880" height="56" rx="8" fill="#1c1408" stroke="#9e6a03"/>
  <text x="84" y="392" fill="#f0b429" font-size="14">대가 — 죽은 버전이 힙에 쌓인다 (DELETE·UPDATE마다 하나씩, 파일은 자라기만 한다)</text>
  <text x="84" y="414" fill="#8b949e" font-size="13">지우는 것(xmax)과 치우는 것(공간 회수)은 다른 작업 → 다음 편: VACUUM</text>
</svg>
