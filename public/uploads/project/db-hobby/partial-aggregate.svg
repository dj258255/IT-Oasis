<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="1000" height="460" rx="12" fill="#0d1117"/>
  <text x="500" y="34" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">진짜 부분 집계 — 행을 안 모으고 누적만 (메모리 O(1))</text>

  <text x="500" y="62" text-anchor="middle" fill="#c9d1d9" font-size="14">SELECT COUNT(*), SUM(v), MIN(v), MAX(v) FROM big   <tspan fill="#6e7681">(6000행)</tspan></text>

  <!-- LEFT: 38 collect (O(n)) -->
  <rect x="40" y="84" width="440" height="150" rx="10" fill="#1c1408" stroke="#9e6a03"/>
  <text x="260" y="108" text-anchor="middle" fill="#f0b429" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">38편 — 행을 다 모은 뒤 집계</text>
  <text x="60" y="132" fill="#c9d1d9" font-size="12">워커가 매칭 RID를 모은다 → leader가 rows[] 채움</text>
  <g fill="#161b22" stroke="#30363d">
    <rect x="60" y="144" width="360" height="18" rx="3"/>
    <rect x="60" y="166" width="360" height="18" rx="3"/>
    <rect x="60" y="188" width="360" height="18" rx="3"/>
  </g>
  <text x="240" y="157" text-anchor="middle" fill="#8b949e" font-size="11">row · row · row · row …</text>
  <text x="240" y="179" text-anchor="middle" fill="#8b949e" font-size="11">… 매칭 행 전부 …</text>
  <text x="240" y="201" text-anchor="middle" fill="#8b949e" font-size="11">… 6000행 메모리에 …</text>
  <text x="260" y="224" text-anchor="middle" fill="#f0b429" font-size="12">메모리 O(매칭 행수)</text>

  <!-- RIGHT: 39 partial (O(1)) -->
  <rect x="520" y="84" width="440" height="150" rx="10" fill="#0e1b12" stroke="#238636"/>
  <text x="740" y="108" text-anchor="middle" fill="#3fb950" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">39편 — 부분합만 누적</text>
  <text x="540" y="132" fill="#c9d1d9" font-size="12">각 워커가 항목별 누산기만 갖는다(행 안 모음)</text>
  <g>
    <rect x="540" y="144" width="195" height="40" rx="5" fill="#13283f" stroke="#238636"/>
    <text x="552" y="160" fill="#3fb950" font-size="11">worker 0 partial</text>
    <text x="552" y="176" fill="#8b949e" font-size="10">cnt·sum·min·max</text>
    <rect x="745" y="144" width="195" height="40" rx="5" fill="#13283f" stroke="#238636"/>
    <text x="757" y="160" fill="#3fb950" font-size="11">worker 1 partial</text>
    <text x="757" y="176" fill="#8b949e" font-size="10">cnt·sum·min·max</text>
  </g>
  <text x="740" y="204" text-anchor="middle" fill="#8b949e" font-size="11">worker 2 · worker 3 …</text>
  <text x="740" y="224" text-anchor="middle" fill="#3fb950" font-size="12">메모리 O(워커수 × 항목수)</text>

  <!-- Finalize -->
  <rect x="300" y="256" width="400" height="44" rx="8" fill="#13283f" stroke="#1f6feb"/>
  <text x="500" y="276" text-anchor="middle" fill="#58a6ff" font-size="13">Finalize: leader가 부분합을 결합</text>
  <text x="500" y="293" text-anchor="middle" fill="#8b949e" font-size="11">COUNT=Σcnt · SUM=Σsum · MIN=min(min) · MAX=max(max) · AVG=Σsum/Σcnt</text>
  <line x1="640" y1="234" x2="540" y2="256" stroke="#6e7681" marker-end="url(#a)"/>

  <rect x="360" y="312" width="280" height="28" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="331" text-anchor="middle" fill="#c9d1d9" font-size="12">6000 | 18003000 | 1 | 6000</text>
  <line x1="500" y1="300" x2="500" y2="312" stroke="#6e7681" marker-end="url(#a)"/>

  <!-- bottom -->
  <rect x="40" y="356" width="920" height="90" rx="10" fill="#0e1b12" stroke="#238636"/>
  <text x="60" y="380" fill="#3fb950" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">PostgreSQL의 Partial Aggregate → Finalize Aggregate 두 단계</text>
  <text x="60" y="403" fill="#c9d1d9">parscan_foreach(워커별 컨텍스트로 병렬 순회) 프리미티브 위에 얹음. 값은 수학적 정답(oracle)과 대조 · NULL 무시·빈 결과·다중 집계 검증.</text>
  <text x="60" y="424" fill="#8b949e" font-size="12">헤더 + emit_out_rows 재사용으로 출력 형식은 직렬과 동일. 엔진 ThreadSanitizer 클린(data race 0).</text>
  <text x="60" y="441" fill="#6e7681" font-size="12">정직한 경계: GROUP BY·TEXT MIN/MAX·서브쿼리·투영은 38편(수집)/직렬로 폴백 — 그룹별 부분 집계(per-group 해시 병합)는 프론티어.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
</svg>
