<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="coarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="1000" height="440" rx="12" fill="#0d1117"/>
  <text x="500" y="36" text-anchor="middle" fill="#8b949e" font-size="18">비용 기반 옵티마이저 — 규칙("PK면 인덱스")을 데이터가 이긴다</text>

  <!-- 상단: ANALYZE 통계 -->
  <rect x="40" y="60" width="920" height="52" rx="8" fill="#13283f" stroke="#1f6feb"/>
  <text x="60" y="84" fill="#58a6ff" font-size="14">ANALYZE t  →  통계</text>
  <text x="60" y="104" fill="#8b949e" font-size="13" font-family="ui-monospace, Menlo, monospace">행 1000  ·  페이지 7  ·  PK 범위 [1, 1000]   (보이는 행만 — 죽은 버전 제외)</text>

  <!-- 선택도 + 비용 흐름 -->
  <text x="500" y="140" text-anchor="middle" fill="#6e7681" font-size="13">WHERE 조건 → 선택도 → 매칭 행 수 추정 → 비용 비교</text>

  <!-- 세 케이스 카드 -->
  <!-- id = 5 -->
  <rect x="40" y="156" width="290" height="150" rx="10" fill="#0e1b12" stroke="#238636"/>
  <text x="60" y="182" fill="#3fb950" font-size="15" font-family="ui-monospace, Menlo, monospace">id = 5</text>
  <g font-size="12.5" fill="#8b949e" font-family="ui-monospace, Menlo, monospace">
    <text x="60" y="210">선택도 → rows = 1</text>
    <text x="60" y="234">인덱스 cost = 1</text>
    <text x="60" y="258" fill="#6e7681">순차 cost = 7</text>
  </g>
  <text x="60" y="288" fill="#3fb950" font-size="13">→ Index Point Lookup</text>

  <!-- id > 999 -->
  <rect x="355" y="156" width="290" height="150" rx="10" fill="#0e1b12" stroke="#238636"/>
  <text x="375" y="182" fill="#3fb950" font-size="15" font-family="ui-monospace, Menlo, monospace">id > 999  (좁음)</text>
  <g font-size="12.5" fill="#8b949e" font-family="ui-monospace, Menlo, monospace">
    <text x="375" y="210">선택도 → rows = 1</text>
    <text x="375" y="234" fill="#3fb950">인덱스 cost = 2  ✓</text>
    <text x="375" y="258" fill="#6e7681">순차 cost = 7</text>
  </g>
  <text x="375" y="288" fill="#3fb950" font-size="13">→ Index Range Scan</text>

  <!-- id > 100 -->
  <rect x="670" y="156" width="290" height="150" rx="10" fill="#1c1408" stroke="#9e6a03"/>
  <text x="690" y="182" fill="#f0b429" font-size="15" font-family="ui-monospace, Menlo, monospace">id > 100  (넓음)</text>
  <g font-size="12.5" fill="#8b949e" font-family="ui-monospace, Menlo, monospace">
    <text x="690" y="210">선택도 → rows = 901</text>
    <text x="690" y="234" fill="#f85149">인덱스 cost = 902</text>
    <text x="690" y="258" fill="#f0b429">순차 cost = 7  ✓</text>
  </g>
  <text x="690" y="288" fill="#f0b429" font-size="13">→ Seq Scan (규칙이면 인덱스였을 자리)</text>

  <!-- 하단: 크로스오버 원리 -->
  <rect x="40" y="322" width="920" height="52" rx="8" fill="#161b22" stroke="#6e7681"/>
  <text x="60" y="346" fill="#8b949e" font-size="14">크로스오버: 페치할 행 수 &gt; 페이지 수 이면 순차가 이긴다</text>
  <text x="60" y="366" fill="#6e7681" font-size="13">순차 = 페이지 수(순차 I/O) · 인덱스 범위 = 1 + 매칭 행수(랜덤 힙 페치) — PostgreSQL random_page_cost의 직관</text>

  <text x="500" y="404" text-anchor="middle" fill="#6e7681" font-size="13">규칙 기반(데이터를 안 봄)의 멍청한 순간을 통계+선택도+비용이 고친다</text>
  <text x="500" y="426" text-anchor="middle" fill="#6e7681" font-size="12.5">통계 없으면 옛 규칙으로 안전 폴백 · EXPLAIN이 실행과 같은 결정을 rows=/cost=로 보인다</text>
</svg>
