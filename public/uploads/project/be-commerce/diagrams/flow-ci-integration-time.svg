<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">통합 테스트 잡이 PR마다 기다리게 한 시간</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">GitHub Actions에서 실제 MySQL과 Redis를 띄워 도는 잡 하나의 시간 셋</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <text x="233" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">이전</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">18~35분</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">문서 두 줄을 고친 PR도 같은 시간</text>
  <text x="233" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">MySQL을 25번 띄우고</tspan><tspan x="233" dy="28">측정용 테스트가 14분</tspan></text>
  <rect x="163" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">PR마다 기다림</text>

  <text x="700" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">지금, 전부 돌 때</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">3.2분</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">main 푸시와 설정 변경은 늘 전부</text>
  <text x="700" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">MySQL은 한 번만 띄우고</tspan><tspan x="700" dy="28">측정용 테스트는 매일 새벽에</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">전부 돌 때</text>

  <text x="1166" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">지금, 바뀐 모듈만 돌 때</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">1.7분</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">코드 PR의 보통 경우</text>
  <text x="1166" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">Spring Modulith가 바뀐 모듈과</tspan><tspan x="1166" dy="28">거기 기대는 모듈만 고릅니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">바뀐 모듈만</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#1f2328" text-anchor="middle">줄일 자리는 로그의 반복 횟수와 긴 공백에 있었습니다</text>
</svg>
