<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">가설 하나를 재 보니 다른 결함이 나왔습니다</text>
  <text x="700" y="100" font-size="19" fill="#59636e" text-anchor="middle">결제 부하 30VU를 깔고 정산 배치를 7번 연달아 돌렸습니다</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">배치 7번 도는 동안 결제는</text>
  <text x="233" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">54.1ms</text>
  <text x="233" y="298" font-size="19" fill="#59636e" text-anchor="middle">결제 p95, 배치 없을 때는 64.3ms</text>
  <text x="233" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">커넥션 20개 중 15개 사용</tspan><tspan x="233" dy="30">기다린 요청 0</tspan></text>
  <rect x="153" y="400" width="160" height="36" rx="4" fill="#f1f3f5"/>
  <text x="233" y="425" font-size="17" font-weight="700" fill="#59636e" text-anchor="middle">가설 기각</text>

  <!-- 2 -->
  <text x="700" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">1차 실행에서 승인 성공률은</text>
  <text x="700" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">39.6%</text>
  <text x="700" y="298" font-size="19" fill="#59636e" text-anchor="middle">계정 하나로 30VU, 7,625건 중 3,022건</text>
  <text x="700" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">포인트 계좌 한 줄을</tspan><tspan x="700" dy="30">동시에 고치다 충돌</tspan></text>
  <rect x="620" y="400" width="160" height="36" rx="4" fill="#f1f3f5"/>
  <text x="700" y="425" font-size="17" font-weight="700" fill="#59636e" text-anchor="middle">다른 결함</text>

  <!-- 3 -->
  <text x="1166" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">DB에서 바로 더하게 바꾸면</text>
  <text x="1166" y="262" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">100%</text>
  <text x="1166" y="298" font-size="19" fill="#59636e" text-anchor="middle">같은 조건, 6,761건 중 6,761건</text>
  <text x="1166" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">잔액 978,400원이</tspan><tspan x="1166" dy="30">원장 합계와 일치</tspan></text>
  <rect x="1086" y="400" width="160" height="36" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="425" font-size="17" font-weight="700" fill="#0969da" text-anchor="middle">채택</text>

  <line x1="60" y1="474" x2="1340" y2="474" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="518" font-size="21" fill="#1f2328" text-anchor="middle">정산 배치는 결제를 느리게 하지 않았고 느리게 한 것은 포인트 적립이었습니다</text>
</svg>
