<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">이름 점수에 생년월일과 국적을 더하면</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">80점 위는 사람이 확인하고 아래는 지나갑니다</text>

  <line x1="350" y1="140" x2="350" y2="450" stroke="#d0d7de" stroke-width="1"/>
  <line x1="700" y1="140" x2="700" y2="450" stroke="#d0d7de" stroke-width="1"/>
  <line x1="1050" y1="140" x2="1050" y2="450" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="175" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">같은 사람, 다른 로마자</text>
  <text x="175" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">82점</text>
  <text x="175" y="292" font-size="17" fill="#59636e" text-anchor="middle">이름만 보면 67점</text>
  <text x="175" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="175" dy="0">선 위로 올라와</tspan><tspan x="175" dy="28">사람이 확인합니다</tspan></text>
  <rect x="115" y="400" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="175" y="422" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">맞게 잡음</text>

  <!-- 2 -->
  <text x="525" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">다른 사람, 비슷한 이름</text>
  <text x="525" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">12점</text>
  <text x="525" y="292" font-size="17" fill="#59636e" text-anchor="middle">이름만 보면 67점</text>
  <text x="525" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="525" dy="0">선 아래로 내려가</tspan><tspan x="525" dy="28">지나갑니다</tspan></text>
  <rect x="465" y="400" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="525" y="422" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">맞게 보냄</text>

  <!-- 3 -->
  <text x="875" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">같은 사람, 띄어쓰기만 다름</text>
  <text x="875" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">98점</text>
  <text x="875" y="292" font-size="17" fill="#59636e" text-anchor="middle">이름만 보면 83점</text>
  <text x="875" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="875" dy="0">전과 같이</tspan><tspan x="875" dy="28">사람이 확인합니다</tspan></text>
  <rect x="815" y="400" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="875" y="422" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">맞게 잡음</text>

  <!-- 4 -->
  <text x="1225" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">흔한 이름의 남남</text>
  <text x="1225" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">45점</text>
  <text x="1225" y="292" font-size="17" fill="#59636e" text-anchor="middle">이름만 보면 100점</text>
  <text x="1225" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1225" dy="0">철자가 같아도</tspan><tspan x="1225" dy="28">생년월일이 다릅니다</tspan></text>
  <rect x="1165" y="400" width="120" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1225" y="422" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">맞게 보냄</text>

  <line x1="60" y1="482" x2="1340" y2="482" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="524" font-size="20" fill="#212529" text-anchor="middle">이름만 볼 때는 네 쌍 중 둘이 틀렸고 생년월일과 국적을 더하면 틀린 쌍이 없습니다</text>
</svg>
