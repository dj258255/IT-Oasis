<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">CDC의 지연은 커넥터 기본값이 만든 것이었습니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">같은 활동 로그를 같은 토픽, 같은 컨슈머로 받고 토픽에 넣는 주체만 바꿨습니다 (대기 100ms, 로컬 한 대)</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">앱이 직접 넣으면 (아웃박스)</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">14ms</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">활동이 토픽에 닿기까지 p95</text>
  <text x="233" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">반영률 100.0%</tspan><tspan x="233" dy="28">앱의 쓰기 경로가 브로커에 붙습니다</tspan></text>
  <rect x="173" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">기준</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">CDC를 기본 설정 그대로 두면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">1,944ms</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">아웃박스의 139배</text>
  <text x="700" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">반영률 19.5%</tspan><tspan x="700" dy="28">설정 36개 중 지연 관련은 0개</tspan></text>
  <rect x="640" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">기본값 탓</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">커넥터 설정 셋을 적으면</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">13ms</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">아웃박스와 같은 수준</text>
  <text x="1166" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">반영률 98.5%</tspan><tspan x="1166" dy="28">폴링 간격 500ms를 100ms로</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">채택</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#1f2328" text-anchor="middle">CDC로 바꿔도 신선도는 같은 수준이었고 앱과 브로커의 결합은 끊겼습니다</text>
</svg>
