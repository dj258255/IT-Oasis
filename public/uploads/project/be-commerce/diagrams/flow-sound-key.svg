<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">성 하나가 여섯 가지로 적힙니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">박씨를 로마자로 쓰는 방법은 여섯이고 전부 맞는 표기입니다</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">사람들이 실제로 쓰는 표기</text>
  <text x="233" y="246" font-size="34" font-weight="700" fill="#59636e" text-anchor="middle">Park  Bak  Pak</text>
  <text x="233" y="290" font-size="34" font-weight="700" fill="#59636e" text-anchor="middle">Bahk  Pahk  Back</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">글자로 비교하면</tspan><tspan x="233" dy="28">서로 다른 이름입니다</tspan></text>
  <rect x="163" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">여섯 개로 보임</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">소리로 접으면</text>
  <text x="700" y="268" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">PAK</text>
  <text x="700" y="302" font-size="17" fill="#59636e" text-anchor="middle">여섯 표기가 받는 소리 키</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">ㅂ과 ㅍ처럼 섞이는 소리만</tspan><tspan x="700" dy="28">하나로 봅니다</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">하나로 모임</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">소리가 같으면</text>
  <text x="1166" y="268" font-size="40" font-weight="700" fill="#59636e" text-anchor="middle">사람이 확인</text>
  <text x="1166" y="302" font-size="17" fill="#59636e" text-anchor="middle">일치로 확정하지는 않습니다</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">소리를 접을수록</tspan><tspan x="1166" dy="28">남남도 같은 키를 받습니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">확정 아님</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#212529" text-anchor="middle">영어용 Soundex는 첫 글자를 남겨 Park(P620)과 Bak(B200)을 다른 키로 봅니다</text>
</svg>
