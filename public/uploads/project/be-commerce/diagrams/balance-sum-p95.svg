<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="554" viewBox="0 0 1400 554" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="554" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">원장 잔액을 매번 합산하면 행 수만큼 느려집니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">계정별 전체 조회 p95, 커버링 인덱스 있음, 로컬 MySQL 8.4</text>
  <!-- 1 -->
  <text x="273" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">원장 24만 행</text>
  <text x="273" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">82.0ms</text>
  <text x="273" y="292" font-size="17" fill="#59636e" text-anchor="middle">잔액 조회 p95</text>
  <text x="273" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="273" dy="0">아직 200ms 안입니다</tspan></text>
  <rect x="210" y="394" width="126" height="32" rx="4" fill="#f1f3f5"/>
  <text x="273" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">여유 있음</text>
  <line x1="486" y1="140" x2="486" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">원장 162만 행</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">564.4ms</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">잔액 조회 p95</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">200ms 선은 약 60만 행에서</tspan><tspan x="700" dy="28">넘었습니다</tspan></text>
  <rect x="610" y="394" width="180" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="416" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">200ms 초과</text>
  <line x1="913" y1="140" x2="913" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 3 -->
  <text x="1126" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">원장 1,263만 행</text>
  <text x="1126" y="258" font-size="44" font-weight="700" fill="#59636e" text-anchor="middle">4,812.6ms</text>
  <text x="1126" y="292" font-size="17" fill="#59636e" text-anchor="middle">잔액 조회 p95</text>
  <text x="1126" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1126" dy="0">인덱스 없이는 8,056.8ms</tspan><tspan x="1126" dy="28">인덱스는 기울기를 못 바꿉니다</tspan></text>
  <rect x="1036" y="394" width="180" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1126" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">200ms 초과</text>
  <line x1="60" y1="480" x2="1340" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="522" font-size="20" fill="#212529" text-anchor="middle">인덱스는 훑는 폭을 줄일 뿐이고 합계 비용은 행 수에 비례합니다</text>
</svg>
