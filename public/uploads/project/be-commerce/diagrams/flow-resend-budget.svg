<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">재전송의 효과는 PG가 나빠지는 모양에 따라 반대로 나옵니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">확정 실패 비율. 승인 초당 30건을 60초, PG 동시 호출 상한 40, 읽기 타임아웃 2초</text>
  <text x="460" y="150" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">재전송 없음</text>
  <text x="820" y="150" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">재전송 1회</text>
  <text x="1180" y="150" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">빈 자리 4 이상일 때만</text>
  <line x1="60" y1="168" x2="1340" y2="168" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="240" font-size="21" font-weight="700" fill="#212529">PG가 5초 느리면</text>
  <text x="70" y="270" font-size="17" fill="#59636e">(동시 호출 상한 40이 꽉 참)</text>
  <text x="460" y="260" font-size="48" font-weight="700" fill="#59636e" text-anchor="middle">31.56%</text>
  <text x="820" y="260" font-size="48" font-weight="700" fill="#59636e" text-anchor="middle">55.23%</text>
  <text x="1180" y="260" font-size="48" font-weight="700" fill="#0969da" text-anchor="middle">31.40%</text>
  <text x="640" y="300" font-size="17" fill="#59636e" text-anchor="middle">재전송이 자리를 한 번 더 쥐어 뒤에 온 결제가 상한에 막혔습니다</text>
  <text x="1180" y="300" font-size="17" fill="#0969da" text-anchor="middle">재전송 없음과 0.16%p 차이</text>
  <line x1="60" y1="340" x2="1340" y2="340" stroke="#eceff1" stroke-width="1"/>
  <text x="70" y="440" font-size="21" font-weight="700" fill="#212529">PG 응답 15%가 사라지면</text>
  <text x="70" y="470" font-size="17" fill="#59636e">(상한에는 여유)</text>
  <text x="460" y="460" font-size="48" font-weight="700" fill="#59636e" text-anchor="middle">14.29%</text>
  <text x="820" y="460" font-size="48" font-weight="700" fill="#59636e" text-anchor="middle">1.90%</text>
  <text x="1180" y="460" font-size="48" font-weight="700" fill="#0969da" text-anchor="middle">2.82%</text>
  <text x="640" y="500" font-size="17" fill="#59636e" text-anchor="middle">손실된 승인을 다시 뽑아 확정 실패가 크게 줄었습니다</text>
  <text x="1180" y="500" font-size="17" fill="#0969da" text-anchor="middle">재전송 1회와 0.92%p 차이</text>
  <line x1="60" y1="548" x2="1340" y2="548" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="592" font-size="20" fill="#212529" text-anchor="middle">빈 자리 4 이상 조건은 느린 PG에서 재전송 없음과 같고 손실 PG에서는 이득을 남깁니다</text>
</svg>
