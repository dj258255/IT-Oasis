<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="540" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">심판이 표시한 초안 수는 세 번 다르게 나왔습니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">초안 20건(대사 예외 10건을 2회씩), 심판은 계열이 다른 llama3.1:8b</text>

  <line x1="466" y1="140" x2="466" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">처음 재면</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">16건</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">20건 중 근거 없는 단정으로 표시(80%)</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">원인을 모르는데</tspan><tspan x="233" dy="28">청구 유지를 장담했습니다</tspan></text>
  <rect x="163" y="398" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="420" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">초안의 결함</text>

  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">초안을 고친 뒤 재면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">11건</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">20건 중 표시(55%)</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">원인을 모르면 영향을</tspan><tspan x="700" dy="28">요구하지 않게 바꾼 결과입니다</tspan></text>
  <rect x="630" y="398" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="420" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">초안의 결함</text>

  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">한 번 더 재면</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">14건</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">20건 중 표시(70%), 늘어난 몫은 오탐</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">사실에 적힌 "내부 없음"을</tspan><tspan x="1166" dy="28">심판이 못 읽었습니다</tspan></text>
  <rect x="1086" y="398" width="160" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="420" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">심판의 오탐</text>

  <line x1="60" y1="462" x2="1340" y2="462" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="506" font-size="20" fill="#212529" text-anchor="middle">심판의 표시 수에는 초안의 결함과 심판의 오탐이 섞여 있고 아는 결함은 코드가 0/20으로 확인했습니다</text>
</svg>
