<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <rect width="1400" height="600" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">다른 PG로 넘겨도 되는 경우는 하나뿐입니다</text>
  <text x="700" y="102" font-size="19" fill="#59636e" text-anchor="middle">PG 응답을 셋으로 나누면 넘길 수 있는 칸이 하나만 남습니다</text>

  <line x1="80" y1="140" x2="1320" y2="140" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="180" font-size="20" fill="#1f2328" text-anchor="middle">PaymentService  →  차단기(ResilientPgClient)  →  라우터(RoutingPgClient)  →  TOSS 가중치 10  →  NICE 가중치 5</text>
  <line x1="80" y1="210" x2="1320" y2="210" stroke="#d0d7de" stroke-width="1"/>

  <line x1="466" y1="240" x2="466" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="240" x2="933" y2="480" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="270" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">승인됐거나 카드가 거절됐으면</text>
  <text x="233" y="346" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">안 넘김</text>
  <text x="233" y="382" font-size="17" fill="#59636e" text-anchor="middle">결과를 이미 안다</text>
  <text x="233" y="428" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">잔액 부족은 어느 PG로</tspan><tspan x="233" dy="28">가도 똑같이 거절됩니다</tspan></text>

  <!-- 2 -->
  <text x="700" y="270" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">응답이 없거나 예외가 났으면</text>
  <text x="700" y="346" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">절대 안 넘김</text>
  <text x="700" y="382" font-size="17" fill="#59636e" text-anchor="middle">승인됐을 수 있다</text>
  <text x="700" y="428" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">넘기면 두 번 결제될 수 있어</tspan><tspan x="700" dy="28">UNKNOWN으로 남깁니다</tspan></text>

  <!-- 3 -->
  <text x="1166" y="270" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">연결 실패나 차단기 열림이면</text>
  <text x="1166" y="346" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">다음 PG로</text>
  <text x="1166" y="382" font-size="17" fill="#59636e" text-anchor="middle">요청이 PG에 닿지 않았다</text>
  <text x="1166" y="428" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">PG가 요청을 받지 못했으니</tspan><tspan x="1166" dy="28">가중치 순서로 다음을 시도합니다</tspan></text>

  <line x1="80" y1="512" x2="1320" y2="512" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="556" font-size="20" fill="#1f2328" text-anchor="middle">기준은 요청이 그 PG에 닿을 수 있었는지 하나입니다</text>
</svg>
