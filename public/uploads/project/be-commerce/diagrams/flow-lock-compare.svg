<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="554" viewBox="0 0 1400 554" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="554" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">인메모리 DB에서 잰 순위가 실제 MySQL에서 뒤집혔습니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">스레드 30개가 재고 20개를 동시에 차감, 셋 다 초과판매 0, 걸린 시간만 다릅니다</text>
  <!-- 1 -->
  <text x="273" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">H2 인메모리에서 낙관적 락</text>
  <text x="273" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">17ms</text>
  <text x="273" y="292" font-size="17" fill="#59636e" text-anchor="middle">비관적 락 21ms보다 빨랐습니다</text>
  <text x="273" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="273" dy="0">왕복이 거의 공짜라</tspan><tspan x="273" dy="28">재시도가 싸게 먹힙니다</tspan></text>
  <rect x="165" y="394" width="216" height="32" rx="4" fill="#f1f3f5"/>
  <text x="273" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">성능 근거로 안 씀</text>
  <line x1="486" y1="140" x2="486" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">실제 MySQL에서 낙관적 락</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">151ms</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">비관적 락 75ms보다 두 배 느렸습니다</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">충돌마다 조회와 갱신을</tspan><tspan x="700" dy="28">다시 왕복하기 때문입니다</tspan></text>
  <rect x="637" y="394" width="126" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">가장 느림</text>
  <line x1="913" y1="140" x2="913" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 3 -->
  <text x="1126" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">실제 MySQL에서 조건부 UPDATE</text>
  <text x="1126" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">40ms</text>
  <text x="1126" y="292" font-size="17" fill="#59636e" text-anchor="middle">락도 재시도도 없이 한 문장으로 끝</text>
  <text x="1126" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1126" dy="0">150스레드에서는 79ms</tspan><tspan x="1126" dy="28">낙관적 락은 429ms (5.4배)</tspan></text>
  <rect x="1066" y="394" width="120" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1126" y="416" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">채택</text>
  <line x1="60" y1="480" x2="1340" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="522" font-size="20" fill="#212529" text-anchor="middle">실제 DB에서 잰 값이 재고 차감 전략의 근거입니다</text>
</svg>
