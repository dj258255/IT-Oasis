<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="554" viewBox="0 0 1400 554" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="554" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">같은 jar를 배포 단위만 나누면 두 결합이 사라집니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">API 인스턴스는 스케줄러를 끄고 뜨고, 워커 인스턴스만 스케줄러를 켜고 뜹니다</text>
  <!-- 1 -->
  <text x="380" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">인스턴스를 늘렸을 때</text>
  <text x="380" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">중복 0건</text>
  <text x="380" y="292" font-size="17" fill="#59636e" text-anchor="middle">API 2대 + 워커 1대에서 정산 배치 중복</text>
  <text x="380" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="380" dy="0">스케줄러는 워커에서만</tspan><tspan x="380" dy="28">켜지기 때문입니다</tspan></text>
  <rect x="299" y="394" width="162" height="32" rx="4" fill="#f1f3f5"/>
  <text x="380" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">결합 1 해소</text>
  <line x1="700" y1="140" x2="700" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 2 -->
  <text x="1020" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">워커만 다시 배포했을 때</text>
  <text x="1020" y="258" font-size="44" font-weight="700" fill="#0969da" text-anchor="middle">0 / 10,174</text>
  <text x="1020" y="292" font-size="17" fill="#59636e" text-anchor="middle">배포 중 결제 API 실패 건수 (0.00%)</text>
  <text x="1020" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1020" dy="0">모놀리스는 270 / 9,870 실패</tspan><tspan x="1020" dy="28">9초 동안 결제가 멈췄습니다</tspan></text>
  <rect x="939" y="394" width="162" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1020" y="416" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">결합 2 해소</text>
  <line x1="60" y1="480" x2="1340" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="522" font-size="20" fill="#212529" text-anchor="middle">저장소와 브로커는 그대로이고 바뀐 것은 배치를 실행하는 인스턴스뿐입니다</text>
</svg>
