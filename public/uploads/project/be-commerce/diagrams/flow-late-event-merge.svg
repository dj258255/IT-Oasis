<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">늦게 도착한 이벤트를 버리면 같은 로그에서 다른 답이 나옵니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">같은 활동 로그로 만든 온라인 값과 오프라인 재계산이 얼마나 일치했는지</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">순번이 작으면 버리던 병합</text>
  <text x="233" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">0%</text>
  <text x="233" y="296" font-size="17" fill="#59636e" text-anchor="middle">순서가 뒤집히면 20명 전원 불일치</text>
  <text x="233" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">늦게 온 이벤트가</tspan><tspan x="233" dy="28">로그에만 남고 사라집니다</tspan></text>
  <rect x="163" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">전</text>

  <!-- 2 -->
  <text x="700" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">순번 집합에서 큰 것 20개를 두는 병합</text>
  <text x="700" y="262" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">100%</text>
  <text x="700" y="296" font-size="17" fill="#59636e" text-anchor="middle">도착 순서가 달라도 결과가 같음</text>
  <text x="700" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">늦게 와도 제자리에 넣고</tspan><tspan x="700" dy="28">같은 순번은 한 번만 씁니다</tspan></text>
  <rect x="630" y="392" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="414" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">후</text>

  <!-- 3 -->
  <text x="1166" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">목록 길이로 세던 창 집계</text>
  <text x="1166" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">60% → 100%</text>
  <text x="1166" y="296" font-size="17" fill="#59636e" text-anchor="middle">유형별 카운터로 바꾼 뒤</text>
  <text x="1166" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">목록은 20개에서 잘리지만</tspan><tspan x="1166" dy="28">카운터는 잘리지 않습니다</tspan></text>
  <rect x="1086" y="392" width="160" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">세는 그릇을 따로</text>

  <line x1="60" y1="472" x2="1340" y2="472" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="516" font-size="20" fill="#1f2328" text-anchor="middle">병합이 순서에 무관하면 전송이 순서를 보장할 필요가 없습니다</text>
</svg>
