<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">동시 요청이 많을수록 압축이 더 빨랐습니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">스레드 32개가 Redis 연결 하나를 나눠 쓰며 값을 넣고 읽을 때의 p95</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">1KB 값</text>
  <text x="233" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">1.06배</text>
  <text x="233" y="296" font-size="17" fill="#59636e" text-anchor="middle">Snappy 1.57ms, 압축 없음 1.48ms</text>
  <text x="233" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">기준 1.2배 안이라</tspan><tspan x="233" dy="28">1KB 임계값을 그대로 둡니다</tspan></text>
  <rect x="163" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">차이 거의 없음</text>

  <!-- 2 -->
  <text x="700" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">50KB 값</text>
  <text x="700" y="262" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">2.24ms</text>
  <text x="700" y="296" font-size="17" fill="#59636e" text-anchor="middle">압축 없이 넣고 읽으면 5.89ms</text>
  <text x="700" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">CPU는 더 쓰지만</tspan><tspan x="700" dy="28">연결에 줄 서는 바이트가 줄었습니다</tspan></text>
  <rect x="630" y="392" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="414" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">압축이 2.6배 빠름</text>

  <!-- 3 -->
  <text x="1166" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">500KB 값</text>
  <text x="1166" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">11.90ms</text>
  <text x="1166" y="296" font-size="17" fill="#59636e" text-anchor="middle">압축 없이 넣고 읽으면 35.83ms</text>
  <text x="1166" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">값이 클수록</tspan><tspan x="1166" dy="28">줄인 바이트가 그대로 시간이 됩니다</tspan></text>
  <rect x="1086" y="392" width="160" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">압축이 3배 빠름</text>

  <line x1="60" y1="472" x2="1340" y2="472" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="516" font-size="20" fill="#1f2328" text-anchor="middle">연결 하나를 나눠 쓰면 바이트 수가 대기 시간이 됩니다</text>
</svg>
