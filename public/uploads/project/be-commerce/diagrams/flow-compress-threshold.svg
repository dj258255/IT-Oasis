<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="554" viewBox="0 0 1400 554" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="554" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">작은 값은 압축하면 오히려 커집니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">컨텍스트 JSON 모양의 값, 저장 크기 ÷ 원본 크기, 1보다 크면 손해, 로컬 Redis</text>
  <!-- 1 -->
  <text x="273" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">187B 값을 압축하면</text>
  <text x="273" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">1.070배</text>
  <text x="273" y="292" font-size="17" fill="#59636e" text-anchor="middle">LZ4와 SNAPPY 모두 원본보다 7% 커짐</text>
  <text x="273" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="273" dy="0">압축 표식과 base64 팽창이</tspan><tspan x="273" dy="28">줄인 양보다 큽니다</tspan></text>
  <rect x="213" y="394" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="273" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">손해</text>
  <line x1="486" y1="140" x2="486" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">1.1KB 값을 압축하면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">0.338배</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">66% 줄어듦 (SNAPPY는 0.352배)</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">교차점은 187~279B 사이</tspan><tspan x="700" dy="28">임계값은 여유를 둔 1KB</tspan></text>
  <rect x="619" y="394" width="162" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="416" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">여기부터 압축</text>
  <line x1="913" y1="140" x2="913" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 3 -->
  <text x="1126" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">500KB 값을 압축하면</text>
  <text x="1126" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">0.166배</text>
  <text x="1126" y="292" font-size="17" fill="#59636e" text-anchor="middle">get p99는 2.02ms에서 0.27ms로</text>
  <text x="1126" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1126" dy="0">바이트가 줄어 왕복이 짧아집니다</tspan><tspan x="1126" dy="28">CPU는 SNAPPY가 덜 썼습니다</tspan></text>
  <rect x="1036" y="394" width="180" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1126" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">이득이 가장 큼</text>
  <line x1="60" y1="480" x2="1340" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="522" font-size="20" fill="#212529" text-anchor="middle">교차점은 측정한 사실이고 임계값 1KB는 그 위에서 여유를 둔 결정입니다</text>
</svg>
