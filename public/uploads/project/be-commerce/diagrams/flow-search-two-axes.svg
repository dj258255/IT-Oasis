<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">검색 엔진이 필요한지는 두 축으로 나뉩니다</text>
  <text x="700" y="102" font-size="19" fill="#59636e" text-anchor="middle">상품 105,542행 · MySQL 8.4 · 로컬 한 대에서 잰 값</text>

  <line x1="700" y1="150" x2="700" y2="450" stroke="#d0d7de" stroke-width="1"/>

  <!-- 지연 축 -->
  <text x="350" y="190" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">속도 때문에 넣어야 할까?</text>
  <text x="350" y="276" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">82.5%</text>
  <text x="350" y="312" font-size="17" fill="#59636e" text-anchor="middle">목록 지연에서 패싯 개수 세기가 차지한 몫</text>
  <text x="350" y="360" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="350" dy="0">패싯을 60초 캐시하자</tspan><tspan x="350" dy="28">p95가 90.9ms에서 5.7ms로</tspan></text>
  <rect x="270" y="404" width="160" height="34" rx="4" fill="#f1f3f5"/>
  <text x="350" y="427" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">엔진 없이 해결</text>

  <!-- 품질 축 -->
  <text x="1050" y="190" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">품질 때문에 넣어야 할까?</text>
  <text x="1050" y="276" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">미측정</text>
  <text x="1050" y="312" font-size="17" fill="#59636e" text-anchor="middle">관련도 순위 · 오타 · 어형 변화 · 동의어</text>
  <text x="1050" y="360" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1050" dy="0">지금 검색은 LIKE 부분 일치라</tspan><tspan x="1050" dy="28">점수도 오타 허용도 없습니다</tspan></text>
  <rect x="960" y="404" width="180" height="34" rx="4" fill="#ddf4ff"/>
  <text x="1050" y="427" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">다음 측정 대상</text>

  <line x1="80" y1="480" x2="1320" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="522" font-size="20" fill="#1f2328" text-anchor="middle">지연 축과 품질 축은 답이 따로 있습니다</text>
</svg>
