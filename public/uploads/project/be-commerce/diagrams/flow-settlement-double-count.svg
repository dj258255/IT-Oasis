<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">서버를 두 대로 늘리면 정산 배치도 두 개가 됩니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">같은 날짜의 정산을 두 서버가 같은 순간에 시작했습니다</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">서버 8081</text>
  <text x="233" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">20,000건</text>
  <text x="233" y="296" font-size="17" fill="#59636e" text-anchor="middle">전날 결제를 전부 집계</text>
  <text x="233" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">"정산 없음"을 확인하고</tspan><tspan x="233" dy="28">먼저 저장에 성공</tspan></text>
  <rect x="163" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">저장 성공</text>

  <!-- 2 -->
  <text x="700" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">서버 8082</text>
  <text x="700" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">20,000건</text>
  <text x="700" y="296" font-size="17" fill="#59636e" text-anchor="middle">같은 전날 결제를 한 번 더 집계</text>
  <text x="700" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">똑같이 "정산 없음"을 보고</tspan><tspan x="700" dy="28">늦게 저장하다 유니크 제약에 막힘</tspan></text>
  <rect x="630" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">저장 거부</text>

  <!-- 3 -->
  <text x="1166" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">두 번 나간 돈</text>
  <text x="1166" y="262" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">0원</text>
  <text x="1166" y="296" font-size="17" fill="#59636e" text-anchor="middle">DB 유니크 제약이 막았습니다</text>
  <text x="1166" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">제약은 중복 저장만 막고</tspan><tspan x="1166" dy="28">누가 돌릴지는 정하지 못합니다</tspan></text>
  <rect x="1086" y="392" width="160" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="414" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">실행권은 따로</text>

  <line x1="60" y1="472" x2="1340" y2="472" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="516" font-size="20" fill="#1f2328" text-anchor="middle">같은 애플리케이션을 복제하면 그 안의 배치도 함께 복제됩니다</text>
</svg>
