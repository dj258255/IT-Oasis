<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">검색 필터는 엔진 안에서 걸어야 개수가 맞습니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">필터 쿼리 171개, 동시성 10, 지연 예산 p95 100ms에서 잰 숫자 셋</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <text x="233" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">상위 500개를 DB에서 거르면</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">19 / 171</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">결과 수와 패싯이 정답과 같은 쿼리</text>
  <text x="233" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">첫 페이지는 맞아 보여도</tspan><tspan x="233" dy="28">결과 수의 95.5%를 잃습니다</tspan></text>
  <rect x="163" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">개수가 틀림</text>

  <text x="700" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">엔진 안에서 걸면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">171 / 171</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">Lucene도 Elasticsearch도 전부 정답과 같음</text>
  <text x="700" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">전체 일치 집합 위에서 세니</tspan><tspan x="700" dy="28">p95는 37ms입니다</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">채택</text>

  <text x="1166" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">앱 안 Lucene을 300만 건으로 늘리면</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">232ms</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">p95, 예산 100ms를 넘음</text>
  <text x="1166" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">100만 건은 86ms로</tspan><tspan x="1166" dy="28">아직 예산 안입니다</tspan></text>
  <rect x="1086" y="388" width="160" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">100만 건까지</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#1f2328" text-anchor="middle">필터는 엔진 안에서 걸고 앱 안 Lucene은 100만 건까지입니다</text>
</svg>
