<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">요청 제한 숫자와 서버 용량은 다릅니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">같은 서버를 세 가지 방법으로 재면 숫자가 셋 나옵니다</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">사용자 한 명으로 재면</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">10건/초</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">한 사람이 통과시킬 수 있는 최대</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">전체 상한 100건은</tspan><tspan x="233" dy="28">건드리지도 못합니다</tspan></text>
  <rect x="173" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">용량 아님</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">40명이 응답을 기다렸다 보내면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">120건/초</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">이 방법으로 밀어 넣을 수 있었던 양</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">서버가 느려지면</tspan><tspan x="700" dy="28">부하도 같이 줄어듭니다</tspan></text>
  <rect x="640" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">용량 아님</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">초당 보내는 양을 고정하면</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">100~120건/초</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">성공률이 떨어지기 시작하는 구간</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">서버가 느려도 계속 보내니</tspan><tspan x="1166" dy="28">한계가 보입니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">이것이 용량</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#212529" text-anchor="middle">요청 제한에 적은 100건과 서버가 실제로 버티는 양은 다릅니다</text>
</svg>
