<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">읽을 수 있는 페이지가 가맹점 수보다 적으면</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">한 틱에 2장을 읽을 수 있는데 가맹점이 셋입니다</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">가맹점 1</text>
  <text x="233" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">1장</text>
  <text x="233" y="296" font-size="17" fill="#59636e" text-anchor="middle">첫 틱에 읽힘</text>
  <text x="233" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">가맹점마다 상한은</tspan><tspan x="233" dy="28">2장 ÷ 3을 올림한 1장</tspan></text>
  <rect x="163" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">틱 1</text>

  <!-- 2 -->
  <text x="700" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">가맹점 2</text>
  <text x="700" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">1장</text>
  <text x="700" y="296" font-size="17" fill="#59636e" text-anchor="middle">첫 틱에 읽힘</text>
  <text x="700" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">여기서 그 틱의</tspan><tspan x="700" dy="28">2장이 다 찹니다</tspan></text>
  <rect x="630" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">틱 1</text>

  <!-- 3 -->
  <text x="1166" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">가맹점 3</text>
  <text x="1166" y="262" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">0건</text>
  <text x="1166" y="296" font-size="17" fill="#59636e" text-anchor="middle">첫 틱에는 읽을 자리가 없음</text>
  <text x="1166" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">상한 1장이 있어도</tspan><tspan x="1166" dy="28">다음 틱에야 읽힙니다</tspan></text>
  <rect x="1086" y="392" width="160" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="414" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">틱 2로 밀림</text>

  <line x1="60" y1="472" x2="1340" y2="472" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="516" font-size="20" fill="#1f2328" text-anchor="middle">가맹점 수가 페이지 예산을 넘으면 상한만으로는 그 틱에 모두 읽히지 않습니다</text>
</svg>
