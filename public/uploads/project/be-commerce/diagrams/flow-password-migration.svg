  <rect x="990" y="245" width="340" height="176" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="1160" y="324" text-anchor="middle" font-size="24" font-weight="700" fill="#0969da">Argon2id로</text>
  <text x="1160" y="358" text-anchor="middle" font-size="24" font-weight="700" fill="#0969da">다시 저장합니다</text>

