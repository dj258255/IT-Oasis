  <text x="700" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2328">로그인에 성공하면 옛 해시가 Argon2id로 바뀝니다</text>

  <text x="240" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#59636e">저장된 해시</text>
