  <text x="1160" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#59636e">로그인 성공 뒤</text>

  <g fill="#ffffff" stroke="#d0d7de" stroke-width="1.5">
    <rect x="70" y="145" width="340" height="76" rx="8"/>
    <rect x="70" y="245" width="340" height="76" rx="8"/>
