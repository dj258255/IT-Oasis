    <rect x="530" y="145" width="340" height="76" rx="8"/>
    <rect x="530" y="245" width="340" height="76" rx="8"/>
    <rect x="530" y="345" width="340" height="76" rx="8"/>
  </g>
  <g font-size="21" fill="#1f2328" text-anchor="middle">
    <text x="240" y="191">{argon2} 신규 가입</text>
