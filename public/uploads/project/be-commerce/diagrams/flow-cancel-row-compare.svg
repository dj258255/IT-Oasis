<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">같은 취소를 두 방식으로 기록하면 남는 값이 다릅니다</text>
  <text x="700" y="100" font-size="19" fill="#59636e" text-anchor="middle">승인 10,000원으로 대사를 확정한 뒤 3,000원 부분취소가 왔습니다</text>

  <line x1="700" y1="140" x2="700" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 왼쪽: 덮어쓰기 -->
  <text x="350" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">승인 행을 덮어쓰면</text>
  <text x="350" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">7,000원</text>
  <text x="350" y="298" font-size="19" fill="#59636e" text-anchor="middle">남은 금액 하나만 남습니다</text>
  <text x="350" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="350" dy="0">확정된 판정 10,000원과</tspan><tspan x="350" dy="30">맞지 않게 됩니다</tspan></text>
  <rect x="270" y="400" width="160" height="36" rx="4" fill="#f1f3f5"/>
  <text x="350" y="425" font-size="17" font-weight="700" fill="#59636e" text-anchor="middle">근거가 사라짐</text>

  <!-- 오른쪽: 사건 쌓기 -->
  <text x="1050" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">취소를 따로 쌓으면</text>
  <text x="1050" y="262" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">10,000원, −3,000원</text>
  <text x="1050" y="298" font-size="19" fill="#59636e" text-anchor="middle">승인 행과 취소 행 두 줄이 남습니다</text>
  <text x="1050" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="1050" dy="0">확정된 판정 10,000원이</tspan><tspan x="1050" dy="30">그대로 맞습니다</tspan></text>
  <rect x="970" y="400" width="160" height="36" rx="4" fill="#ddf4ff"/>
  <text x="1050" y="425" font-size="17" font-weight="700" fill="#0969da" text-anchor="middle">근거가 남음</text>

  <line x1="60" y1="474" x2="1340" y2="474" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="518" font-size="21" fill="#1f2328" text-anchor="middle">지금 남은 금액과 그날 있었던 거래는 다른 값입니다</text>
</svg>
