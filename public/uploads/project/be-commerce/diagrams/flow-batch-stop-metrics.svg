<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">배치가 멈춰도 요청 지표는 그대로입니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">복구 배치가 죽은 뒤 세 지표가 어떻게 움직였는지</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">에러율</text>
  <text x="233" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">변화 없음</text>
  <text x="233" y="296" font-size="17" fill="#59636e" text-anchor="middle">배치는 요청을 받지 않습니다</text>
  <text x="233" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">실패할 요청이 없으니</tspan><tspan x="233" dy="28">실패율도 오르지 않습니다</tspan></text>
  <rect x="163" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">멈춤이 안 보임</text>

  <!-- 2 -->
  <text x="700" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">응답시간</text>
  <text x="700" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">변화 없음</text>
  <text x="700" y="296" font-size="17" fill="#59636e" text-anchor="middle">결제 API는 정상으로 보입니다</text>
  <text x="700" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">느려질 요청이 없으니</tspan><tspan x="700" dy="28">응답시간도 평평합니다</tspan></text>
  <rect x="630" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">멈춤이 안 보임</text>

  <!-- 3 -->
  <text x="1166" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">가장 오래된 미확정 결제의 나이</text>
  <text x="1166" y="262" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">600초 초과</text>
  <text x="1166" y="296" font-size="17" fill="#59636e" text-anchor="middle">아무도 처리하지 않으니 계속 자랍니다</text>
  <text x="1166" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">임계 600초를 넘는 순간</tspan><tspan x="1166" dy="28">알림이 울립니다</tspan></text>
  <rect x="1086" y="392" width="160" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="414" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">멈춤이 보임</text>

  <line x1="60" y1="472" x2="1340" y2="472" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="516" font-size="20" fill="#1f2328" text-anchor="middle">요청이 없는 작업의 멈춤은 가장 오래된 건의 나이에서만 드러납니다</text>
</svg>
