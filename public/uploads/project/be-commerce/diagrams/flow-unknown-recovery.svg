<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <rect width="1400" height="600" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">타임아웃은 결과를 모르는 상태입니다</text>
  <text x="700" y="102" font-size="19" fill="#59636e" text-anchor="middle">UNKNOWN으로 남겨 두고 복구 배치가 60초마다 PG에 물어서 셋 중 하나로 확정합니다</text>

  <line x1="80" y1="140" x2="1320" y2="140" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="180" font-size="20" fill="#1f2328" text-anchor="middle">타임아웃  →  UNKNOWN 보존  →  60초마다 PG 조회  →  아래 셋 중 하나</text>
  <line x1="80" y1="210" x2="1320" y2="210" stroke="#d0d7de" stroke-width="1"/>

  <line x1="466" y1="240" x2="466" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="240" x2="933" y2="480" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="270" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">PG에 승인돼 있으면</text>
  <text x="233" y="346" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">DONE</text>
  <text x="233" y="382" font-size="17" fill="#59636e" text-anchor="middle">승인된 그대로 확정</text>
  <text x="233" y="428" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">이미 된 승인을</tspan><tspan x="233" dy="28">취소하지 않습니다</tspan></text>

  <!-- 2 -->
  <text x="700" y="270" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">PG에 결제가 없으면</text>
  <text x="700" y="346" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">ABORTED</text>
  <text x="700" y="382" font-size="17" fill="#59636e" text-anchor="middle">승인이 없었던 것으로 확정</text>
  <text x="700" y="428" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">요청이 PG에</tspan><tspan x="700" dy="28">닿지 않았습니다</tspan></text>

  <!-- 3 -->
  <text x="1166" y="270" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">PG에서 이미 취소됐으면</text>
  <text x="1166" y="346" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">취소 동기화</text>
  <text x="1166" y="382" font-size="17" fill="#59636e" text-anchor="middle">PG 상태를 그대로 받아 적음</text>
  <text x="1166" y="428" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">새로 취소를</tspan><tspan x="1166" dy="28">보내지 않습니다</tspan></text>

  <line x1="80" y1="512" x2="1320" y2="512" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="556" font-size="20" fill="#1f2328" text-anchor="middle">10분 안에 확정되지 않으면 알림이 울리고 사람이 닫습니다</text>
</svg>
