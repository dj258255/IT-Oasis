<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">읽는 순서 하나가 작은 가맹점의 지급일을 바꿉니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">한 틱 1,000건, 큰 가맹점 2,500건과 작은 가맹점 10건을 같은 날 넣었습니다</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">id 순서대로 읽으면</text>
  <text x="233" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">2일 지연</text>
  <text x="233" y="296" font-size="17" fill="#59636e" text-anchor="middle">작은 가맹점 10건이 정산되기까지</text>
  <text x="233" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">큰 가맹점이 첫날 1,000건으로</tspan><tspan x="233" dy="28">틱을 전부 채웁니다</tspan></text>
  <rect x="163" y="392" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">용량은 다 씀</text>

  <!-- 2 -->
  <text x="700" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">가맹점마다 상한을 두고 재분배하면</text>
  <text x="700" y="262" font-size="50" font-weight="700" fill="#0969da" text-anchor="middle">당일 완료</text>
  <text x="700" y="296" font-size="17" fill="#59636e" text-anchor="middle">작은 가맹점 10건이 첫 틱에 읽힙니다</text>
  <text x="700" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">큰 가맹점은 첫날 500건,</tspan><tspan x="700" dy="28">다음 날부터 다시 1,000건</tspan></text>
  <rect x="630" y="392" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="414" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">구현한 정책</text>

  <!-- 3 -->
  <text x="1166" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">큰 가맹점이 내는 대가</text>
  <text x="1166" y="262" font-size="50" font-weight="700" fill="#59636e" text-anchor="middle">첫날 절반</text>
  <text x="1166" y="296" font-size="17" fill="#59636e" text-anchor="middle">1,000건이 500건으로</text>
  <text x="1166" y="350" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">2,500건을 다 끝내는 날은</tspan><tspan x="1166" dy="28">두 정책 모두 셋째 틱</tspan></text>
  <rect x="1086" y="392" width="160" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="414" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">완료일은 같음</text>

  <line x1="60" y1="472" x2="1340" y2="472" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="516" font-size="20" fill="#1f2328" text-anchor="middle">처리량과 공정성은 같은 틱 용량을 나눠 씁니다</text>
</svg>
