<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">좁혀서 켠 유형은 규칙과 같은 답을 냅니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">잔여 272건을 유형별로 갈라 하나만 켰을 때의 숫자 셋</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <text x="233" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">잔여 272건 중 켠 유형</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">60건</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">전체의 약 22%</text>
  <text x="233" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">나머지 78%는</tspan><tspan x="233" dy="28">사람에게 갑니다</tspan></text>
  <rect x="163" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">켠 범위</text>

  <text x="700" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">켠 유형의 정확도</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">60 / 60</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">판정 기준을 적은 뒤 14B와 8B가 맞힌 수</text>
  <text x="700" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">새 표본 45건에서도</tspan><tspan x="700" dy="28">이 유형은 15 / 15였습니다</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">모델도 맞힘</text>

  <text x="1166" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">같은 유형에서 규칙 분류기</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">같은 답</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">모델 없이도 INTERNAL_RECORD_LOST</text>
  <text x="1166" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">모델이 더해 주는</tspan><tspan x="1166" dy="28">이득은 0입니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">그래서 껐음</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#1f2328" text-anchor="middle">모델의 정확도와 규칙 대비 이득은 다른 숫자입니다</text>
</svg>
