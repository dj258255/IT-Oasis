<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="554" viewBox="0 0 1400 554" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="554" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">느린 PG 앞에서 워커 100개를 결제와 조회와 웹훅이 나눠 씁니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">PG 지연 5초, 결제 도착률 초당 50건, 가짜 PG, 로컬 실측</text>
  <!-- 1 -->
  <text x="273" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">PG 동시 호출 상한이 없으면</text>
  <text x="273" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">13,056ms</text>
  <text x="273" y="292" font-size="17" fill="#59636e" text-anchor="middle">PG를 부르지도 않는 웹훅의 p95</text>
  <text x="273" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="273" dy="0">상품 조회 p95는 14,080ms</tspan><tspan x="273" dy="28">웹훅 26.1%가 10초를 넘깁니다</tspan></text>
  <rect x="147" y="394" width="252" height="32" rx="4" fill="#f1f3f5"/>
  <text x="273" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">결제가 워커를 다 차지</text>
  <line x1="486" y1="140" x2="486" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">상한 40을 걸면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">9ms</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">같은 조건의 웹훅 p95</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">상품 조회 p95는 7ms</tspan><tspan x="700" dy="28">10초를 넘긴 웹훅 0%</tspan></text>
  <rect x="574" y="394" width="252" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="416" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">조회와 웹훅이 살아남음</text>
  <line x1="913" y1="140" x2="913" y2="448" stroke="#d0d7de" stroke-width="1"/>
  <!-- 3 -->
  <text x="1126" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">상한 40의 대가</text>
  <text x="1126" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">84.0%</text>
  <text x="1126" y="292" font-size="17" fill="#59636e" text-anchor="middle">PG에 보내기 전에 거절된 결제</text>
  <text x="1126" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1126" dy="0">1 − 40 ÷ (50 × 5) = 84.0%</tspan><tspan x="1126" dy="28">실험 전에 나오는 값입니다</tspan></text>
  <rect x="1027" y="394" width="198" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1126" y="416" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">거절률은 계산대로</text>
  <line x1="60" y1="480" x2="1340" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="522" font-size="20" fill="#212529" text-anchor="middle">상한은 어떤 요청을 살리고 어떤 요청을 포기할지 미리 정하는 예산입니다</text>
</svg>
