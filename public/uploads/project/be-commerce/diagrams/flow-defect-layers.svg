<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle">입력을 실제에 가깝게 할수록 다른 결함이 보였습니다</text>
  <text x="700" y="100" font-size="19" fill="#59636e" text-anchor="middle">대사 예외 4건으로 초안 검증기를 세 조건에서 돌렸습니다</text>

  <line x1="466" y1="140" x2="466" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="440" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">실제 데이터에 템플릿만 쓰면</text>
  <text x="233" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">270원</text>
  <text x="233" y="298" font-size="19" fill="#59636e" text-anchor="middle">분류기가 계산한 진짜 금액이 반려됨</text>
  <text x="233" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">손으로 만든 입력의</tspan><tspan x="233" dy="30">단위 테스트 7개는 통과</tspan></text>
  <rect x="143" y="400" width="180" height="36" rx="4" fill="#f1f3f5"/>
  <text x="233" y="425" font-size="17" font-weight="700" fill="#59636e" text-anchor="middle">허용 목록이 좁음</text>

  <!-- 2 -->
  <text x="700" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">실제 모델을 붙이면</text>
  <text x="700" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">10,000원</text>
  <text x="700" y="298" font-size="19" fill="#59636e" text-anchor="middle">사실 문장 속 금액이 반려됨</text>
  <text x="700" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">템플릿으로는</tspan><tspan x="700" dy="30">나오지 않는 결함</tspan></text>
  <rect x="610" y="400" width="180" height="36" rx="4" fill="#f1f3f5"/>
  <text x="700" y="425" font-size="17" font-weight="700" fill="#59636e" text-anchor="middle">모델이 있어야 보임</text>

  <!-- 3 -->
  <text x="1166" y="178" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">같은 입력을 12번 돌리면</text>
  <text x="1166" y="262" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">7 / 12</text>
  <text x="1166" y="298" font-size="19" fill="#59636e" text-anchor="middle">통과 횟수, 반려는 전부 날짜 2026-09-06</text>
  <text x="1166" y="352" font-size="20" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">모델이 매번 다르게 써서</tspan><tspan x="1166" dy="30">반복해야 보임</tspan></text>
  <rect x="1076" y="400" width="180" height="36" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="425" font-size="17" font-weight="700" fill="#0969da" text-anchor="middle">고친 뒤 12 / 12</text>

  <line x1="60" y1="474" x2="1340" y2="474" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="518" font-size="21" fill="#1f2328" text-anchor="middle">세 결함의 뿌리는 문장 속 값을 빠뜨린 허용 목록 하나였습니다</text>
</svg>
