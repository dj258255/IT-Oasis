<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">금액이 안 맞을 때 원인을 고르는 순서</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">PG 정산 파일의 합계와 우리 기록이 다를 때 규칙이 차례로 묻는 질문</text>

  <line x1="700" y1="140" x2="700" y2="540" stroke="#d0d7de" stroke-width="1"/>

  <!-- 전 -->
  <text x="370" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">전에는</text>

  <rect x="190" y="200" width="360" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="370" y="235" font-size="19" fill="#1f2328" text-anchor="middle">수수료 차이인가?</text>
  <line x1="370" y1="256" x2="370" y2="284" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="392" y="276" font-size="15" fill="#59636e">아니면</text>

  <rect x="190" y="284" width="360" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="370" y="319" font-size="19" fill="#1f2328" text-anchor="middle">취소가 반영 안 된 것인가?</text>
  <line x1="370" y1="340" x2="370" y2="368" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="392" y="360" font-size="15" fill="#59636e">아니면</text>

  <rect x="190" y="368" width="360" height="56" rx="6" fill="#f1f3f5" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="370" y="403" font-size="19" font-weight="700" fill="#59636e" text-anchor="middle">전부 위변조 의심</text>

  <text x="370" y="470" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="370" dy="0">PG 파일에 같은 줄이 두 번 실린</tspan><tspan x="370" dy="28">평범한 사고에도 위변조 딱지가 붙었습니다</tspan></text>

  <!-- 후 -->
  <text x="1030" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">지금은</text>

  <rect x="850" y="200" width="360" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="1030" y="235" font-size="19" fill="#1f2328" text-anchor="middle">수수료 차이인가?</text>
  <line x1="1030" y1="256" x2="1030" y2="284" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="1052" y="276" font-size="15" fill="#59636e">아니면</text>

  <rect x="850" y="284" width="360" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="1030" y="319" font-size="19" fill="#1f2328" text-anchor="middle">취소가 반영 안 된 것인가?</text>
  <line x1="1030" y1="340" x2="1030" y2="368" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="1052" y="360" font-size="15" fill="#59636e">아니면</text>

  <rect x="850" y="368" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="1030" y="403" font-size="19" font-weight="700" fill="#0969da" text-anchor="middle">외부 합계가 내부의 정수배인가?</text>

  <line x1="940" y1="424" x2="940" y2="452" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="954" y="444" font-size="15" fill="#59636e">맞으면</text>
  <rect x="850" y="452" width="180" height="56" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="940" y="480" font-size="18" font-weight="700" fill="#0969da" text-anchor="middle">중복 기록</text>
  <text x="940" y="499" font-size="16" fill="#59636e" text-anchor="middle">유력, 사람이 확인</text>

  <line x1="1120" y1="424" x2="1120" y2="452" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="1134" y="444" font-size="15" fill="#59636e">아니면</text>
  <rect x="1040" y="452" width="170" height="56" rx="6" fill="#f1f3f5" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="1125" y="487" font-size="18" font-weight="700" fill="#59636e" text-anchor="middle">위변조 의심</text>

  <line x1="60" y1="572" x2="1340" y2="572" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="612" font-size="20" fill="#1f2328" text-anchor="middle">같은 줄이 두 번 실린 건은 이제 중복 기록으로 분류됩니다</text>
</svg>
