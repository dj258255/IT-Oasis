<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">흩어진 근거를 한 화면에 모으는 방법</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">각 모듈은 자기 조각만 내주고 모으는 일은 조회 전용 모듈 하나가 맡습니다</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">조각을 내주는 곳</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">11곳</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">주문, 결제, 원장, 정산, 감사로그 등</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">서로를 모르는 채</tspan><tspan x="233" dy="28">읽기 전용 조각만 내줍니다</tspan></text>
  <rect x="163" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">경계 유지</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">모으는 모듈</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">1개</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">timeline 조회 전용 모듈</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">의존은 이 모듈에서만</tspan><tspan x="700" dy="28">11곳으로 나갑니다</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">한 방향 의존</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">담당자가 부르는 횟수</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">7회 → 1회</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">주문 하나를 보기 위한 API 호출</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">화면 이동도</tspan><tspan x="1166" dy="28">6개 탭에서 1개가 됩니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">결과</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#212529" text-anchor="middle">모듈 경계를 뚫지 않고도 여러 도메인의 근거가 한 화면에 모입니다</text>
</svg>
