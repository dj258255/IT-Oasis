<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">짧은 PG 타임아웃은 우리 쪽 대기만 줄입니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">읽기 타임아웃 5초와 60초를 같은 조건에서 잰 숫자 넷. 큰 숫자는 5초, 아래 작은 숫자는 60초</text>

  <line x1="350" y1="140" x2="350" y2="460" stroke="#d0d7de" stroke-width="1"/>
  <line x1="700" y1="140" x2="700" y2="460" stroke="#d0d7de" stroke-width="1"/>
  <line x1="1050" y1="140" x2="1050" y2="460" stroke="#d0d7de" stroke-width="1"/>

  <text x="175" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">평소에 결과를 모르게 된 결제</text>
  <text x="175" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">10.2%</text>
  <text x="175" y="296" font-size="17" fill="#59636e" text-anchor="middle">60초로 두면 0%</text>
  <text x="175" y="352" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="175" dy="0">카드사가 가끔 느린</tspan><tspan x="175" dy="28">평소에도 열에 하나입니다</tspan></text>
  <rect x="105" y="412" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="175" y="434" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">5초의 비용</text>

  <text x="525" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">확정까지 걸린 시간 p95</text>
  <text x="525" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">92.7초</text>
  <text x="525" y="296" font-size="17" fill="#59636e" text-anchor="middle">60초로 두면 10초</text>
  <text x="525" y="352" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="525" dy="0">복구 배치가 PG에 다시 물어</tspan><tspan x="525" dy="28">약 2분 뒤에 확정됩니다</tspan></text>
  <rect x="455" y="412" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="525" y="434" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">5초의 비용</text>

  <text x="875" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">PG가 느릴 때 더 판 결제</text>
  <text x="875" y="262" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">1.5배</text>
  <text x="875" y="296" font-size="17" fill="#59636e" text-anchor="middle">240건 대 160건</text>
  <text x="875" y="352" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="875" dy="0">240건은 전부 결과 모름을</tspan><tspan x="875" dy="28">거친 뒤에 확정됐습니다</tspan></text>
  <rect x="805" y="412" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="875" y="434" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">겉보기 이득</text>

  <text x="1225" y="180" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">그때 PG에 보낸 승인 호출</text>
  <text x="1225" y="262" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">16배</text>
  <text x="1225" y="296" font-size="17" fill="#59636e" text-anchor="middle">2,634건 대 160건</text>
  <text x="1225" y="352" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1225" dy="0">끊은 호출도 PG 안에서는</tspan><tspan x="1225" dy="28">20초 동안 계속 처리됩니다</tspan></text>
  <rect x="1145" y="412" width="160" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1225" y="434" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">PG의 일은 그대로</text>

  <line x1="60" y1="492" x2="1340" y2="492" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="534" font-size="20" fill="#1f2328" text-anchor="middle">우리가 연결을 끊어도 PG는 그 호출을 끝까지 처리합니다</text>
</svg>
