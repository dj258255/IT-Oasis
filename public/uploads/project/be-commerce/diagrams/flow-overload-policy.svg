<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">과부하 정책이 바꾼 것은 기다리는 시간입니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">모델 처리량 초당 80건 고정, 유입 1배·2배·4배. 개인화를 받은 비율은 세 정책이 ±0.3%p 안에서 같았습니다</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">기다릴 시간을 정하면 (ADMISSION)</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">160ms</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">서빙 p95, 세 부하 모두 같음</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">100ms를 넘길 요청은</tspan><tspan x="233" dy="28">바로 인기 상품으로 돌립니다</tspan></text>
  <rect x="173" y="388" width="120" height="32" rx="4" fill="#ddf4ff"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">채택</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">줄 길이를 정하면 (BOUNDED)</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">320ms</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">서빙 p95</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">같은 24명이라도 모델 속도가</tspan><tspan x="700" dy="28">바뀌면 기다리는 시간이 바뀝니다</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">지연 고정 안 됨</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">아무도 거절하지 않으면 (UNBOUNDED)</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">454ms</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">서빙 p95</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">4배 부하에서는 요청 3,102건을</tspan><tspan x="1166" dy="28">받지도 못했습니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">API가 먼저 막힘</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#212529" text-anchor="middle">개인화를 받는 비율은 모델 용량이 정하고 정책은 기다리는 시간을 정합니다</text>
</svg>
