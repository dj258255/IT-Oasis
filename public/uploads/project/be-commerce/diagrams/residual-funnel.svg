<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">손으로 쓴 표본과 실제 잔여는 다릅니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">같은 모델을 세 표본으로 재면 숫자가 셋 나옵니다</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <text x="233" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">손으로 쓴 15건으로 재면</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">14 / 15</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">14B 모델이 맞힌 수</text>
  <text x="233" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">실제로는 오지 않는</tspan><tspan x="233" dy="28">건들이었습니다</tspan></text>
  <rect x="163" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">근거 아님</text>

  <text x="700" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">엔진이 320건을 만들면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">40건</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">규칙이 답하지 못하고 남긴 건</text>
  <text x="700" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">모델에 넘어가는 건은</tspan><tspan x="700" dy="28">이 40건뿐입니다</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">실제 분포</text>

  <text x="1166" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">그 40건을 다시 재면</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">0 / 40</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">세 모델 모두 맞힌 수</text>
  <text x="1166" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">전부 같은 답을 냈고</tspan><tspan x="1166" dy="28">신뢰도는 95~100이었습니다</tspan></text>
  <rect x="1086" y="388" width="160" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">이것이 실제 성능</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#1f2328" text-anchor="middle">차이를 만든 것은 표본이었고 모델은 같았습니다</text>
</svg>
