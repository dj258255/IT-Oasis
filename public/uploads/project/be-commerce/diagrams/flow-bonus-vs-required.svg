<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="540" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">필수 점수는 같아도 가점에서 두 모델이 갈립니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">같은 케이스 4건, 루브릭 항목 6개, qwen3:8b 대 프런티어 모델</text>

  <line x1="466" y1="140" x2="466" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">필수 항목으로 재면</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">24 : 24</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">4건 × 6항목, 두 모델 모두 만점</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">읽어 보면 다른 초안인데</tspan><tspan x="233" dy="28">점수는 같습니다</tspan></text>
  <rect x="163" y="398" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="420" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">가르지 못함</text>

  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">안심 문구를 세면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">0 : 3</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">4건 중 "추가 청구는 없다"고 적은 수</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">8B는 추가 청구 여부를</tspan><tspan x="700" dy="28">말하지 않았습니다</tspan></text>
  <rect x="640" y="398" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="420" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">갈림</text>

  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">가점을 더하면</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">28 : 30</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">필수 24에 가점 4와 6을 더한 값</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">원인 불명 2건에서</tspan><tspan x="1166" dy="28">프런티어가 앞섭니다</tspan></text>
  <rect x="1096" y="398" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="420" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">비교에 쓰는 값</text>

  <line x1="60" y1="462" x2="1340" y2="462" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="506" font-size="20" fill="#212529" text-anchor="middle">가점은 프롬프트에 넣지 않았으므로 8B가 못 받은 점수는 모델의 차이입니다</text>
</svg>
