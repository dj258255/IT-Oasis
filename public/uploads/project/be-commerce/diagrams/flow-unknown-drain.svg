<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">쌓인 미확정 결제가 풀리는 시간을 정하는 값</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">PG 타임아웃으로 미확정 887건을 만들고 payments 테이블을 2초마다 직접 셌습니다</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">청크가 넉넉하면</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">1분</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">요청 후 1분이 지나야 복구 대상</text>
  <text x="233" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">887건이 61초에</tspan><tspan x="233" dy="28">전부 풀렸습니다</tspan></text>
  <rect x="173" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">하한</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">청크가 모자라면</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">10건/초</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">청크 50 ÷ 주기 5초</text>
  <text x="700" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">틱마다 50건씩 줄어</tspan><tspan x="700" dy="28">106초가 걸렸습니다</tspan></text>
  <rect x="640" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">상한</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">운영 기본값이면</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">약 20분</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">1만 건이 전부 풀리는 시간</text>
  <text x="1166" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">청크 500 ÷ 주기 60초</tspan><tspan x="1166" dy="28">= 초당 8.3건</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">재지 않고 계산</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#1f2328" text-anchor="middle">풀리는 시간은 1분 상수와 배치 해소율 중 늦은 쪽이 정합니다</text>
</svg>
