<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">심판 모델은 앞에 놓인 쪽을 골랐습니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">같은 사실로 만든 요약 둘을 순서만 바꿔 두 번 물었습니다 (생성 qwen3:8b, 심판 llama3.1:8b, 8건)</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">템플릿 요약이 이긴 횟수</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">0건</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">두 번 다 템플릿을 고른 경우</text>
  <text x="233" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">규칙으로 만든 문단은</tspan><tspan x="233" dy="28">한 번도 이기지 못했습니다</tspan></text>
  <rect x="173" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">승부 없음</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">모델 요약이 이긴 횟수</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">0건</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">두 번 다 모델을 고른 경우</text>
  <text x="700" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">모델이 만든 문단도</tspan><tspan x="700" dy="28">한 번도 이기지 못했습니다</tspan></text>
  <rect x="640" y="388" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">승부 없음</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">순서를 바꾸자 답이 뒤집힌 횟수</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">8건</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">8건 전부, 매번 앞에 놓인 쪽</text>
  <text x="1166" y="346" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">내용과 무관하게</tspan><tspan x="1166" dy="28">자리를 보고 골랐습니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">위치 편향</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#1f2328" text-anchor="middle">이 심판으로는 두 요약의 질을 가릴 수 없습니다</text>
</svg>
