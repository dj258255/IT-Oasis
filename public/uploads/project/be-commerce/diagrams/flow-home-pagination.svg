<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#1f2328" text-anchor="middle">홈 2쪽은 1쪽이 보여 준 것과 그 사이의 행동으로 만듭니다</text>
  <text x="700" y="102" font-size="19" fill="#59636e" text-anchor="middle">사용자 30명으로 잰 값</text>

  <line x1="466" y1="150" x2="466" y2="450" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="150" x2="933" y2="450" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="190" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">커서 없이 2쪽을 받으면</text>
  <text x="233" y="276" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">8.6개</text>
  <text x="233" y="312" font-size="17" fill="#59636e" text-anchor="middle">1쪽과 겹친 상품 수(평균)</text>
  <text x="233" y="360" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="233" dy="0">서버가 앞 쪽에서 무엇을</tspan><tspan x="233" dy="28">보여 줬는지 모릅니다</tspan></text>
  <rect x="173" y="404" width="120" height="34" rx="4" fill="#f1f3f5"/>
  <text x="233" y="427" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">중복 발생</text>

  <!-- 2 -->
  <text x="700" y="190" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">보여 준 상품을 커서에 실으면</text>
  <text x="700" y="276" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">0개</text>
  <text x="700" y="312" font-size="17" fill="#59636e" text-anchor="middle">쪽 사이 중복</text>
  <text x="700" y="360" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="700" dy="0">서버에 상태가 없어</tspan><tspan x="700" dy="28">어느 인스턴스나 같은 답</tspan></text>
  <rect x="640" y="404" width="120" height="34" rx="4" fill="#ddf4ff"/>
  <text x="700" y="427" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">채택</text>

  <!-- 3 -->
  <text x="1166" y="190" font-size="21" font-weight="700" fill="#1f2328" text-anchor="middle">그 사이 본 상품을 다시 읽으면</text>
  <text x="1166" y="276" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">96.7~100%</text>
  <text x="1166" y="312" font-size="17" fill="#59636e" text-anchor="middle">2쪽 첫 행이 방금 본 대분류가 된 비율</text>
  <text x="1166" y="360" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="1166" dy="0">1차 60%는 인기 표에</tspan><tspan x="1166" dy="28">아동복이 0개라 신호가 버려진 탓</tspan></text>
  <rect x="1086" y="404" width="160" height="34" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="427" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">기준 90% 충족</text>

  <line x1="80" y1="480" x2="1320" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="522" font-size="20" fill="#1f2328" text-anchor="middle">쪽 상태는 커서가 들고 다닙니다</text>
</svg>
