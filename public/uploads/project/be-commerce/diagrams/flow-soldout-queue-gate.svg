<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="540" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">매진이면 닫게 했지만 대기열은 한 번도 닫히지 않았습니다</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">재고 100개, 구매자 300명, 입장 50명, 입장 칸 만료 30초, 결과를 모르는 결제 약 10%</text>

  <line x1="466" y1="140" x2="466" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">입장 차례가 와서 매진을 물은 횟수</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">300번</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">구매자 300명이 한 번씩 물었습니다</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">재고 0과 예약 0을</tspan><tspan x="233" dy="28">함께 확인합니다</tspan></text>
  <rect x="173" y="398" width="120" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="420" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">판정 요청</text>

  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">재고는 0인데 닫지 못한 횟수</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">151번</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">결과를 기다리는 예약이 아직 남아 있었습니다</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">그 예약이 실패로 끝나면</tspan><tspan x="700" dy="28">재고가 돌아올 수 있습니다</tspan></text>
  <rect x="620" y="398" width="160" height="32" rx="4" fill="#ddf4ff"/>
  <text x="700" y="420" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">닫을 수 없는 상태</text>

  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">매진으로 닫은 횟수</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">0번</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">헛걸음은 140건 그대로였습니다</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">재고가 돌아올 때는</tspan><tspan x="1166" dy="28">다시 시도할 사람이 없었습니다</tspan></text>
  <rect x="1096" y="398" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="1166" y="420" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">닫힘 없음</text>

  <line x1="60" y1="462" x2="1340" y2="462" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="506" font-size="20" fill="#212529" text-anchor="middle">재고 0과 예약 0이 함께 성립한 순간이 이번 부하에는 없었습니다</text>
</svg>
