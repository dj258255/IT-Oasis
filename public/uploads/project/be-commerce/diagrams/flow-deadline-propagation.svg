<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="64" font-size="32" font-weight="700" fill="#212529" text-anchor="middle">떠난 고객의 결제를 빼면 무엇이 달라질까</text>
  <text x="700" y="100" font-size="18" fill="#59636e" text-anchor="middle">PG 5초 지연, 동시 호출 상한 40, 초당 30건, 요청의 30%가 떠난 고객</text>

  <line x1="466" y1="140" x2="466" y2="420" stroke="#d0d7de" stroke-width="1"/>
  <line x1="933" y1="140" x2="933" y2="420" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1 -->
  <text x="233" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">PG로 나간 호출</text>
  <text x="233" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">8.4% 감소</text>
  <text x="233" y="292" font-size="17" fill="#59636e" text-anchor="middle">1,506건에서 1,379건</text>
  <text x="233" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="233" dy="0">비운 자리를</tspan><tspan x="233" dy="28">남은 결제가 바로 채웁니다</tspan></text>
  <rect x="163" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="233" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">거의 그대로</text>

  <!-- 2 -->
  <text x="700" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">상한에 막힌 결제</text>
  <text x="700" y="258" font-size="52" font-weight="700" fill="#59636e" text-anchor="middle">609 → 169</text>
  <text x="700" y="292" font-size="17" fill="#59636e" text-anchor="middle">상한 거절 건수</text>
  <text x="700" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="700" dy="0">떠난 결제가 상한 앞에서</tspan><tspan x="700" dy="28">먼저 빠집니다</tspan></text>
  <rect x="630" y="388" width="140" height="32" rx="4" fill="#f1f3f5"/>
  <text x="700" y="410" font-size="16" font-weight="700" fill="#59636e" text-anchor="middle">72% 감소</text>

  <!-- 3 -->
  <text x="1166" y="176" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">남은 고객의 결제가 PG에 닿은 비율</text>
  <text x="1166" y="258" font-size="52" font-weight="700" fill="#0969da" text-anchor="middle">68% → 87%</text>
  <text x="1166" y="292" font-size="17" fill="#59636e" text-anchor="middle">68.3%에서 87.4%</text>
  <text x="1166" y="346" font-size="19" fill="#212529" text-anchor="middle"><tspan x="1166" dy="0">자리를 쓰는 사람이</tspan><tspan x="1166" dy="28">기다리는 고객으로 바뀝니다</tspan></text>
  <rect x="1096" y="388" width="140" height="32" rx="4" fill="#ddf4ff"/>
  <text x="1166" y="410" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">이것이 효과</text>

  <line x1="60" y1="452" x2="1340" y2="452" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="494" font-size="20" fill="#212529" text-anchor="middle">상한이 차 있으면 호출 수는 거의 그대로이고 그 자리를 누가 쓰는지가 바뀝니다</text>
</svg>
