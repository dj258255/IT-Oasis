<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#f8fafb"/>
  <rect width="1200" height="8" fill="#4a8db8"/>

  <text x="72" y="150" font-size="42" font-weight="800" fill="#1e293b">큰 가맹점 하나가</text>
  <text x="72" y="206" font-size="42" font-weight="800" fill="#1e293b">배치를 독차지했다</text>
  <text x="72" y="256" font-size="17" fill="#64748b">처리량과 공정성은 같이 살 수 없다 — 누구를 굶길지 정해야 한다</text>

  <rect x="72" y="308" width="1056" height="104" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="96" y="340" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.03em">틱 용량 1,000건 · 대형 2,500 + 소형 10</text>
  <text x="96" y="378" font-size="16" fill="#475569">id 순: 대형이 틱의 100%를 차지 → 소형 지급이 2일 밀림</text>
  <text x="96" y="404" font-size="16" fill="#475569">라운드로빈: 소형 0일 · 대형 첫날 지급 1,000 → 500건</text>

  <rect x="72" y="440" width="1056" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="96" y="474" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.03em">정책은 만들었지만 기본은 꺼 둔다</text>
  <text x="96" y="512" font-size="20" font-weight="700" fill="#b91c1c">지급일 약속이 바뀌는 문제다</text>
  <text x="96" y="542" font-size="16" fill="#475569">기술 결정이 아니라 사업 결정이라 운영이 명시적으로 켠다</text>
</svg>
