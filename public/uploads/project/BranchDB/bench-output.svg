<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
  <rect width="720" height="300" rx="10" fill="#0d1117"/>
  <rect width="720" height="40" rx="10" fill="#161b22"/>
  <rect y="30" width="720" height="10" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="360" y="25" text-anchor="middle" fill="#6e7681" font-size="13">branchdb — fork vs full copy</text>

  <text x="24" y="74" fill="#c9d1d9"><tspan fill="#58a6ff">$</tspan> cargo run --release --example bench</text>

  <!-- header -->
  <g fill="#8b949e">
    <text x="120" y="116" text-anchor="end">데이터셋</text>
    <text x="320" y="116" text-anchor="end">fork ×1000</text>
    <text x="540" y="116" text-anchor="end">전체 복사 ×1000</text>
    <text x="690" y="116" text-anchor="end">배속</text>
  </g>
  <line x1="24" y1="130" x2="696" y2="130" stroke="#30363d" stroke-width="1"/>

  <!-- rows -->
  <g>
    <text x="120" y="158" text-anchor="end" fill="#c9d1d9">100</text>
    <text x="320" y="158" text-anchor="end" fill="#3fb950">638.8 µs</text>
    <text x="540" y="158" text-anchor="end" fill="#8b949e">71.1 ms</text>
    <text x="690" y="158" text-anchor="end" fill="#f97316" font-weight="700">111×</text>

    <text x="120" y="186" text-anchor="end" fill="#c9d1d9">1000</text>
    <text x="320" y="186" text-anchor="end" fill="#3fb950">235.7 µs</text>
    <text x="540" y="186" text-anchor="end" fill="#8b949e">832.8 ms</text>
    <text x="690" y="186" text-anchor="end" fill="#f97316" font-weight="700">3,533×</text>

    <text x="120" y="214" text-anchor="end" fill="#c9d1d9">10000</text>
    <text x="320" y="214" text-anchor="end" fill="#3fb950">225.4 µs</text>
    <text x="540" y="214" text-anchor="end" fill="#8b949e">10.71 s</text>
    <text x="690" y="214" text-anchor="end" fill="#f97316" font-weight="700">47,524×</text>
  </g>

  <text x="24" y="262" fill="#8b949e" font-size="13">fork은 데이터 크기와 무관하게 ~220µs로 일정하다. 복사는 데이터에 비례해 느려진다.</text>
</svg>
