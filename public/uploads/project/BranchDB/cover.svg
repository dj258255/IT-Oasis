<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- branching tree: one root forking into many cheap branches -->
  <g stroke="#30363d" stroke-width="3" fill="none">
    <path d="M180 315 C 320 315, 360 140, 520 140"/>
    <path d="M180 315 C 320 315, 360 250, 520 250"/>
    <path d="M180 315 C 320 315, 360 380, 520 380"/>
    <path d="M180 315 C 320 315, 360 490, 520 490"/>
    <path d="M520 140 C 660 140, 700 90,  840 90"/>
    <path d="M520 140 C 660 140, 700 190, 840 190"/>
    <path d="M520 380 C 660 380, 700 330, 840 330"/>
    <path d="M520 380 C 660 380, 700 440, 840 440"/>
    <path d="M520 490 C 660 490, 700 540, 840 540"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="180" cy="315" r="20" fill="url(#accent)"/>
    <circle cx="520" cy="140" r="12" fill="#58a6ff"/>
    <circle cx="520" cy="250" r="12" fill="#58a6ff"/>
    <circle cx="520" cy="380" r="12" fill="#58a6ff"/>
    <circle cx="520" cy="490" r="12" fill="#58a6ff"/>
    <circle cx="840" cy="90"  r="9"  fill="#3fb950"/>
    <circle cx="840" cy="190" r="9"  fill="#3fb950"/>
    <circle cx="840" cy="330" r="9"  fill="#3fb950"/>
    <circle cx="840" cy="440" r="9"  fill="#3fb950"/>
    <circle cx="840" cy="540" r="9"  fill="#3fb950"/>
  </g>

  <!-- wordmark -->
  <text x="930" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" fill="#f0f6fc">Branch<tspan fill="url(#accent)">DB</tspan></text>
  <text x="932" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#8b949e">포크 가능한 임베디드 DB</text>
  <text x="932" y="388" font-family="ui-monospace, monospace" font-size="20" fill="#6e7681">O(1) branch · zero-copy · Rust</text>
</svg>
