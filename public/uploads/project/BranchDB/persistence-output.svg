<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
  <rect width="900" height="344" rx="10" fill="#0d1117"/>
  <rect width="900" height="40" rx="10" fill="#161b22"/>
  <rect y="30" width="900" height="10" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" fill="#6e7681" font-size="13">branchdb — save / open</text>

  <g fill="#c9d1d9">
    <text x="24" y="76"><tspan fill="#58a6ff">$</tspan> cargo run --example persistence</text>
    <text x="24" y="116">저장 완료 -&gt; /tmp/branchdb_demo.db (<tspan fill="#58a6ff">90 bytes</tspan>)</text>
    <text x="24" y="156">다시 연 뒤:</text>
    <text x="24" y="182">  main user:1 = <tspan fill="#3fb950">alice</tspan></text>
    <text x="24" y="208">  exp  user:1 = <tspan fill="#f97316">bob</tspan></text>
    <text x="24" y="234">  브랜치들: ["exp", "main"]</text>
    <text x="24" y="278">브랜치 1개일 때 <tspan fill="#58a6ff">126 bytes</tspan> -&gt; 1001개여도 <tspan fill="#58a6ff">17016 bytes</tspan></text>
    <text x="24" y="304" fill="#8b949e">트리는 한 번만 저장되고, 늘어난 건 브랜치 이름표뿐이다.</text>
  </g>
</svg>
