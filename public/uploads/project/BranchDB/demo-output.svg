<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
  <rect width="880" height="320" rx="10" fill="#0d1117"/>
  <rect width="880" height="40" rx="10" fill="#161b22"/>
  <rect y="30" width="880" height="10" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="440" y="25" text-anchor="middle" fill="#6e7681" font-size="13">branchdb — cargo run --example demo</text>

  <g fill="#c9d1d9">
    <text x="24" y="78"><tspan fill="#58a6ff">$</tspan> cargo run --example demo</text>
    <text x="24" y="118">1000개 브랜치를 포크하고 try-7만 수정한 뒤:</text>
    <text x="24" y="144">  main     user:1 = <tspan fill="#3fb950">alice</tspan></text>
    <text x="24" y="170">  try-7    user:1 = <tspan fill="#f97316">bob</tspan></text>
    <text x="24" y="196">  try-42   user:1 = <tspan fill="#3fb950">alice</tspan></text>
    <text x="24" y="240">총 브랜치 수: <tspan fill="#58a6ff">1001</tspan></text>
    <text x="24" y="266">포크 1000개를 떴지만, 공유 덕분에 새로 저장된 노드는 한 줌뿐이다.</text>
  </g>
</svg>
