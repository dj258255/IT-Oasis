<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <rect width="1000" height="320" rx="12" fill="#0d1117"/>
  <text x="500" y="40" text-anchor="middle" fill="#8b949e" font-size="18">LIKE 와일드카드 매칭 — 패턴 '%a%' 가 입력 'park' 와 맞나?</text>

  <!-- 패턴 셀 -->
  <text x="120" y="118" fill="#6e7681" font-size="13" text-anchor="end">패턴</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="22">
    <rect x="150" y="92" width="200" height="48" rx="6" fill="#1c1408" stroke="#9e6a03"/>
    <text x="250" y="125" text-anchor="middle" fill="#f0b429">%</text>
    <rect x="410" y="92" width="80"  height="48" rx="6" fill="#13283f" stroke="#1f6feb"/>
    <text x="450" y="125" text-anchor="middle" fill="#58a6ff">a</text>
    <rect x="550" y="92" width="300" height="48" rx="6" fill="#1c1408" stroke="#9e6a03"/>
    <text x="700" y="125" text-anchor="middle" fill="#f0b429">%</text>
  </g>

  <!-- 매칭 연결선 -->
  <line x1="250" y1="140" x2="250" y2="186" stroke="#9e6a03" stroke-dasharray="3 4"/>
  <line x1="450" y1="140" x2="450" y2="186" stroke="#3fb950" stroke-width="2"/>
  <line x1="700" y1="140" x2="700" y2="186" stroke="#9e6a03" stroke-dasharray="3 4"/>

  <!-- 입력 셀 -->
  <text x="120" y="218" fill="#6e7681" font-size="13" text-anchor="end">입력</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="22">
    <rect x="150" y="192" width="200" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="250" y="225" text-anchor="middle" fill="#8b949e">p</text>
    <rect x="410" y="192" width="80"  height="48" rx="6" fill="#0e1b12" stroke="#238636"/>
    <text x="450" y="225" text-anchor="middle" fill="#3fb950">a</text>
    <rect x="550" y="192" width="140" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="620" y="225" text-anchor="middle" fill="#8b949e">r</text>
    <rect x="710" y="192" width="140" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="780" y="225" text-anchor="middle" fill="#8b949e">k</text>
  </g>

  <text x="250" y="268" text-anchor="middle" fill="#6e7681" font-size="12">앞 % 가 "p" 흡수(0+)</text>
  <text x="450" y="268" text-anchor="middle" fill="#3fb950" font-size="12">a 직접 일치</text>
  <text x="700" y="268" text-anchor="middle" fill="#6e7681" font-size="12">뒤 % 가 "rk" 흡수(0+)</text>
  <text x="500" y="298" text-anchor="middle" fill="#8b949e" font-size="13">% = 임의 길이(0글자+), _ = 정확히 한 글자 · 막히면 마지막 % 로 백트래킹</text>
</svg>
