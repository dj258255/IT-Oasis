<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
  <defs>
    <marker id="tearrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="12" fill="#0d1117"/>
  <text x="450" y="42" text-anchor="middle" fill="#8b949e" font-size="18">tuple codec — 행을 스키마대로 바이트로 인코딩</text>

  <!-- 행 + 스키마 -->
  <text x="450" y="86" text-anchor="middle" fill="#c9d1d9" font-family="ui-monospace, Menlo, monospace" font-size="15">VALUES (1, 'kim')   ·   스키마: id INT, name TEXT</text>
  <path d="M450 96 L450 124" stroke="#6e7681" stroke-width="1.5" marker-end="url(#tearrow)"/>

  <!-- 바이트 레이아웃 -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14">
    <!-- id INT: 4 bytes -->
    <g transform="translate(120, 140)">
      <rect width="60" height="44" rx="5" fill="#13283f" stroke="#1f6feb"/><text x="30" y="29" text-anchor="middle" fill="#58a6ff">01</text>
      <rect x="60" width="60" height="44" rx="5" fill="#13283f" stroke="#1f6feb"/><text x="90" y="29" text-anchor="middle" fill="#58a6ff">00</text>
      <rect x="120" width="60" height="44" rx="5" fill="#13283f" stroke="#1f6feb"/><text x="150" y="29" text-anchor="middle" fill="#58a6ff">00</text>
      <rect x="180" width="60" height="44" rx="5" fill="#13283f" stroke="#1f6feb"/><text x="210" y="29" text-anchor="middle" fill="#58a6ff">00</text>
      <text x="120" y="74" text-anchor="middle" fill="#6e7681" font-size="13">id (INT) = 4바이트 → 1</text>
    </g>
    <!-- name TEXT: 2-byte len + bytes -->
    <g transform="translate(390, 140)">
      <rect width="60" height="44" rx="5" fill="#2a2113" stroke="#f0b429"/><text x="30" y="29" text-anchor="middle" fill="#f0b429">03</text>
      <rect x="60" width="60" height="44" rx="5" fill="#2a2113" stroke="#f0b429"/><text x="90" y="29" text-anchor="middle" fill="#f0b429">00</text>
      <rect x="120" width="50" height="44" rx="5" fill="#13281c" stroke="#3fb950"/><text x="145" y="29" text-anchor="middle" fill="#3fb950">'k'</text>
      <rect x="170" width="50" height="44" rx="5" fill="#13281c" stroke="#3fb950"/><text x="195" y="29" text-anchor="middle" fill="#3fb950">'i'</text>
      <rect x="220" width="50" height="44" rx="5" fill="#13281c" stroke="#3fb950"/><text x="245" y="29" text-anchor="middle" fill="#3fb950">'m'</text>
      <text x="135" y="74" text-anchor="middle" fill="#6e7681" font-size="13">name (TEXT) = 길이(2바이트)=3 + 'kim'</text>
    </g>
  </g>

  <text x="450" y="262" text-anchor="middle" fill="#8b949e" font-size="14">이 바이트열이 슬롯 페이지에 그대로 저장된다. 읽을 땐 스키마를 보고 거꾸로 디코딩.</text>
</svg>
