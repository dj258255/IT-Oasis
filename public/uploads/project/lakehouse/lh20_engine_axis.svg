<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="760" height="380" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <text x="32" y="42" font-size="17" font-weight="700" fill="#1a1a1a">기종 축 하나로 흩어진 각주를 회수한다</text>
  <text x="32" y="64" font-size="12.5" fill="#6b6b6b">database_instance는 이미 매 오프로드가 읽던 원천 — 컬럼 둘(name·type)만 더 실었다</text>

  <!-- 왼쪽: 팩트(instance_id만) -->
  <rect x="40" y="100" width="200" height="120" rx="8" fill="#f7f9fc" stroke="#c9d6e5"/>
  <text x="140" y="122" font-size="12.5" font-weight="700" fill="#444" text-anchor="middle">팩트 마트 (기존)</text>
  <g font-size="11" fill="#6b6b6b">
    <text x="56" y="146">mart_wait_top</text>
    <text x="56" y="166">mart_weekly_ops_report</text>
    <text x="56" y="186">mart_backup_rpo …</text>
  </g>
  <text x="140" y="210" font-size="11.5" fill="#c9372c" text-anchor="middle" font-weight="600">instance_id = 1  (숫자뿐)</text>

  <!-- 차원 -->
  <rect x="300" y="120" width="160" height="80" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="380" y="144" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">dim_instance</text>
  <text x="380" y="164" font-size="10.5" fill="#6b6b6b" text-anchor="middle">instance_id → name·engine</text>
  <text x="380" y="182" font-size="10.5" fill="#6b6b6b" text-anchor="middle">MYSQL·PG·MSSQL·…</text>

  <!-- 조인 화살표 -->
  <path d="M240,160 H298" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"/></marker></defs>
  <text x="269" y="152" font-size="10" fill="#2a78d6" text-anchor="middle">join</text>

  <!-- 결과 -->
  <path d="M460,160 H518" fill="none" stroke="#1baf7a" stroke-width="1.5" marker-end="url(#a4)"/>
  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"/></marker></defs>
  <rect x="520" y="128" width="200" height="64" rx="8" fill="#eaf6f0" stroke="#1baf7a"/>
  <text x="620" y="152" font-size="12.5" font-weight="700" fill="#137a55" text-anchor="middle">local-mysql (MYSQL)</text>
  <text x="620" y="172" font-size="10.5" fill="#6b6b6b" text-anchor="middle">읽히고, 기종으로 해석된다</text>

  <!-- 회수되는 각주들 -->
  <text x="32" y="262" font-size="12" font-weight="700" fill="#444">이 조인 하나로 사라지는 각주</text>
  <g font-size="11.5" fill="#6b6b6b">
    <text x="40" y="286">· mart_wait_top: "delta/last 의미(누적·스냅샷·큐)는 소비자가 DBTower 화면에서 기종을 안다" → engine으로 바로 해석</text>
    <text x="40" y="308">· mart_backup_rpo: "no_backup이 미백업인지 기종 미수집인지 창고는 못 구분" → engine으로 판단 재료 확보</text>
    <text x="40" y="330">· 대시보드: instance_id 4 → dbtower-self (POSTGRESQL) 로 읽힘</text>
  </g>
  <text x="40" y="358" font-size="11" fill="#9b9b9b">새 기능이라기보다, 흩어져 있던 "기종은 저쪽에서 보세요"의 회수.</text>
</svg>
