<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <text x="32" y="42" font-size="17" font-weight="700" fill="#1a1a1a">DBTower가 35일 뒤 지우는 up 여부를 장기 SLO로</text>
  <text x="32" y="64" font-size="12.5" fill="#6b6b6b">health_sample(1분 폴링) → 일별 uptime → 목표 대비 에러버짓. 메트릭 아닌 SLO라 lakehouse의 몫</text>

  <!-- 파이프라인 3박스 -->
  <rect x="40" y="96" width="180" height="56" rx="8" fill="#f7f9fc" stroke="#c9d6e5"/>
  <text x="130" y="118" font-size="12.5" font-weight="700" fill="#444" text-anchor="middle">health_sample</text>
  <text x="130" y="137" font-size="10.5" fill="#6b6b6b" text-anchor="middle">1분마다 up·ping (35일 보존)</text>

  <path d="M220,124 H262" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a5)"/>
  <defs><marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8a8a"/></marker></defs>

  <rect x="264" y="96" width="180" height="56" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="354" y="118" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">fct_uptime_daily</text>
  <text x="354" y="137" font-size="10.5" fill="#6b6b6b" text-anchor="middle">up 샘플 / 전체 = uptime %</text>

  <path d="M444,124 H486" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="488" y="96" width="232" height="56" rx="8" fill="#eaf6f0" stroke="#1baf7a"/>
  <text x="604" y="118" font-size="12.5" font-weight="700" fill="#137a55" text-anchor="middle">mart_uptime_slo</text>
  <text x="604" y="137" font-size="10.5" fill="#6b6b6b" text-anchor="middle">최근 30일 vs 목표 → 에러버짓</text>

  <!-- 에러버짓 개념 -->
  <text x="32" y="196" font-size="12" font-weight="700" fill="#444">에러버짓 (허용 다운타임 중 남은 양)</text>
  <text x="32" y="218" font-size="11.5" fill="#6b6b6b">목표 99.5% = 한 달에 다운 허용 ~3.6시간. 그중 얼마나 남았나를 잔량 %로.</text>

  <!-- 라이브 대비 막대 -->
  <g font-size="11.5">
    <text x="40" y="252" fill="#444">local-postgres (PG)</text>
    <rect x="230" y="242" width="360" height="14" rx="3" fill="#eef7f2"/>
    <rect x="230" y="242" width="357" height="14" rx="3" fill="#1baf7a"/>
    <text x="600" y="253" fill="#137a55" font-weight="700">99.9%  meets</text>

    <text x="40" y="282" fill="#444">local-mysql</text>
    <rect x="230" y="272" width="360" height="14" rx="3" fill="#eef7f2"/>
    <rect x="230" y="272" width="356" height="14" rx="3" fill="#e0a848"/>
    <text x="600" y="283" fill="#a5701a" font-weight="700">98.9%  breach</text>

    <text x="40" y="312" fill="#444">local-mssql</text>
    <rect x="230" y="302" width="360" height="14" rx="3" fill="#f7eceb"/>
    <rect x="230" y="302" width="228" height="14" rx="3" fill="#c9372c"/>
    <text x="600" y="313" fill="#a5251a" font-weight="700">63.4%  breach</text>
  </g>
  <text x="40" y="342" font-size="11" fill="#9b9b9b">발화는 안 한다 — SLO 판정까지만. 라이브 실측(4일 창): MSSQL 두 대가 60%대, ping 2~7초.</text>
</svg>
