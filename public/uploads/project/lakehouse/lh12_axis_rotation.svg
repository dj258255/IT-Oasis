<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <!-- 배경 카드 (블로그 라이트/다크 어느 배경에서도 자기 서피스 유지) -->
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- 제목 -->
  <text x="32" y="42" font-size="17" font-weight="700" fill="#1a1a1a">같은 총량, 축만 회전 — 어디가 두 배 아픈가</text>
  <text x="32" y="64" font-size="12.5" fill="#6b6b6b">dt축 365dt×6inst(54.5M행) vs N축 7dt×300inst(52.2M행) · 라이브 실측 2026-07-17</text>

  <!-- 범례 -->
  <g font-size="12" fill="#444444">
    <rect x="540" y="30" width="12" height="12" rx="3" fill="#2a78d6"/>
    <text x="558" y="40.5">dt축 (시간 확장)</text>
    <rect x="540" y="50" width="12" height="12" rx="3" fill="#1baf7a"/>
    <text x="558" y="60.5">N축 (인스턴스 확장)</text>
  </g>

  <!-- ===== 패널 A: full-refresh (초) ===== -->
  <g transform="translate(60,100)">
    <text x="130" y="0" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">fct 전체 재빌드 (s)</text>
    <text x="130" y="18" font-size="11.5" fill="#c9372c" text-anchor="middle" font-weight="600">급소 — 축 회전만으로 1.9배</text>
    <!-- 축/기준선 -->
    <line x1="0" y1="240" x2="260" y2="240" stroke="#d4d4d4" stroke-width="1"/>
    <!-- 그리드 (800s 스케일: 0.25px/s) -->
    <g stroke="#efefef" stroke-width="1">
      <line x1="0" y1="140" x2="260" y2="140"/>
      <line x1="0" y1="40"  x2="260" y2="40"/>
    </g>
    <g font-size="10.5" fill="#9b9b9b">
      <text x="-8" y="243" text-anchor="end">0</text>
      <text x="-8" y="143" text-anchor="end">400</text>
      <text x="-8" y="43"  text-anchor="end">800</text>
    </g>
    <!-- 막대: h = 초 * 0.25 -->
    <path d="M55 240 v-97.9 a4 4 0 0 1 4 -4 h48 a4 4 0 0 1 4 4 v97.9 z" fill="#2a78d6"/>
    <path d="M155 240 v-188.3 a4 4 0 0 1 4 -4 h48 a4 4 0 0 1 4 4 v188.3 z" fill="#1baf7a"/>
    <!-- 직접 라벨 -->
    <text x="83"  y="128" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">407.62</text>
    <text x="183" y="38"  font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">769.21</text>
    <g font-size="11.5" fill="#444444" text-anchor="middle">
      <text x="83"  y="258">dt축</text>
      <text x="183" y="258">N축</text>
    </g>
  </g>

  <!-- ===== 패널 B: 증분 (초) — 별도 축(스케일 다름, 이중축 금지 원칙) ===== -->
  <g transform="translate(440,100)">
    <text x="130" y="0" font-size="13.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">fct 증분 · 새 dt 1개 (s)</text>
    <text x="130" y="18" font-size="11.5" fill="#0b7a4b" text-anchor="middle" font-weight="600">건재 — 일상 경로는 안 무너진다</text>
    <line x1="0" y1="240" x2="260" y2="240" stroke="#d4d4d4" stroke-width="1"/>
    <!-- 그리드 (10s 스케일: 20px/s) -->
    <g stroke="#efefef" stroke-width="1">
      <line x1="0" y1="140" x2="260" y2="140"/>
      <line x1="0" y1="40"  x2="260" y2="40"/>
    </g>
    <g font-size="10.5" fill="#9b9b9b">
      <text x="-8" y="243" text-anchor="end">0</text>
      <text x="-8" y="143" text-anchor="end">5</text>
      <text x="-8" y="43"  text-anchor="end">10</text>
    </g>
    <!-- 막대: h = 초 * 20 -->
    <path d="M55 240 v-76 a4 4 0 0 1 4 -4 h48 a4 4 0 0 1 4 4 v76 z" fill="#2a78d6"/>
    <path d="M155 240 v-156.6 a4 4 0 0 1 4 -4 h48 a4 4 0 0 1 4 4 v156.6 z" fill="#1baf7a"/>
    <text x="83"  y="150" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">4.0</text>
    <text x="183" y="70"  font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">8.03</text>
    <g font-size="11.5" fill="#444444" text-anchor="middle">
      <text x="83"  y="258">dt축</text>
      <text x="183" y="258">N축</text>
    </g>
  </g>

  <!-- 각주 -->
  <text x="32" y="386" font-size="11" fill="#9b9b9b">두 패널은 스케일이 다른 별도 축(좌 0–800s, 우 0–10s). 소파일·글롭·게이트는 두 축 모두 초 단위 이하라 생략.</text>
</svg>
