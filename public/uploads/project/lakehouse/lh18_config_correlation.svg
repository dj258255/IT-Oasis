<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <text x="32" y="42" font-size="17" font-weight="700" fill="#1a1a1a">설정 변경을 성능 회귀의 원인 후보로 겹친다</text>
  <text x="32" y="64" font-size="12.5" fill="#6b6b6b">config_param_change × mart_plan_regression — 장기 설정 이력과 성능 이력이 한 창고에</text>

  <!-- 두 레인: 위=설정 변경, 아래=플랜/지연 -->
  <!-- 공통 타임라인 축 -->
  <line x1="90" y1="330" x2="680" y2="330" stroke="#d4d4d4" stroke-width="1"/>
  <g font-size="10.5" fill="#7a7a7a" text-anchor="middle">
    <text x="150" y="350">06-19</text><text x="240" y="350">06-20</text><text x="330" y="350">06-21</text>
    <text x="420" y="350">06-22</text><text x="510" y="350">06-23</text><text x="600" y="350">06-24</text>
  </g>

  <!-- 레인 1: 설정 변경 -->
  <text x="70" y="120" font-size="11.5" fill="#6b6b6b" text-anchor="end">설정</text>
  <line x1="90" y1="120" x2="680" y2="120" stroke="#f0f0f0" stroke-width="1"/>
  <!-- work_mem 변경 이벤트(06-20) -->
  <line x1="240" y1="104" x2="240" y2="330" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="240" cy="120" r="7" fill="#2a78d6"/>
  <text x="240" y="96" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="middle">work_mem 4MB→1MB</text>

  <!-- 레인 2: 플랜/지연 -->
  <text x="70" y="200" font-size="11.5" fill="#6b6b6b" text-anchor="end">플랜·지연</text>
  <line x1="90" y1="200" x2="680" y2="200" stroke="#f0f0f0" stroke-width="1"/>
  <!-- 플랜 뒤집힘(06-21) -->
  <circle cx="330" cy="200" r="7" fill="#e8833a"/>
  <text x="330" y="228" font-size="11.5" font-weight="700" fill="#a5501a" text-anchor="middle">플랜 뒤집힘 → 지연↑</text>
  <line x1="330" y1="200" x2="330" y2="330" stroke="#e8833a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 상관 화살표: 설정 변경 → 뒤이은 뒤집힘 -->
  <path d="M247,120 C285,150 300,170 323,196" fill="none" stroke="#c9372c" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c9372c"/>
    </marker>
  </defs>
  <text x="300" y="163" font-size="11" fill="#c9372c" font-weight="600">+1일 이내</text>

  <!-- 판정 박스 -->
  <rect x="200" y="360" width="360" height="28" rx="6" fill="#fbecea" stroke="#e0a06a"/>
  <text x="380" y="378" font-size="12.5" font-weight="700" fill="#a5501a" text-anchor="middle">correlation = followed_by_regression (상관이지 인과 아님 — 사람이 판단)</text>
</svg>
