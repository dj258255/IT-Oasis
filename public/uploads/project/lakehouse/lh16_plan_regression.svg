<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="760" height="430" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <text x="32" y="42" font-size="17" font-weight="700" fill="#1a1a1a">플랜이 뒤집힌 그 순간을 지연과 겹쳐 본다</text>
  <text x="32" y="64" font-size="12.5" fill="#6b6b6b">plan_snapshot × fct_query_daily — 창고만 할 수 있는 시점 상관</text>

  <!-- 범례 -->
  <g font-size="12" fill="#444444">
    <rect x="486" y="30" width="12" height="12" rx="3" fill="#2a78d6"/>
    <text x="504" y="40.5">플랜 A</text>
    <rect x="486" y="50" width="12" height="12" rx="3" fill="#e8833a"/>
    <text x="504" y="60.5">플랜 B</text>
    <line x1="600" y1="36" x2="624" y2="36" stroke="#c9372c" stroke-width="2.5"/>
    <text x="630" y="40.5">평균 지연</text>
  </g>

  <!-- 좌표: x는 날짜(dt), 하루 간격 70px, 시작 x=90 -->
  <!-- 날짜: 07-07 .. 07-13, flip_dt = 07-10 (가운데) -->
  <g transform="translate(0,0)">
    <!-- 뒤집힘 세로선 -->
    <line x1="370" y1="96" x2="370" y2="330" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="370" y="90" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">뒤집힘 (flip_dt)</text>

    <!-- 대표 플랜 밴드 -->
    <text x="60" y="128" font-size="11.5" fill="#6b6b6b" text-anchor="end">대표 플랜</text>
    <!-- A: 07-07,08,09 -->
    <rect x="90"  y="112" width="66" height="26" rx="4" fill="#2a78d6"/>
    <rect x="160" y="112" width="66" height="26" rx="4" fill="#2a78d6"/>
    <rect x="230" y="112" width="66" height="26" rx="4" fill="#2a78d6"/>
    <!-- flip day (mixed, 제외) 07-10 -->
    <rect x="337" y="112" width="66" height="26" rx="4" fill="#f0f0f0" stroke="#cfcfcf" stroke-dasharray="3 3"/>
    <text x="370" y="129" font-size="10" fill="#999999" text-anchor="middle">섞임·제외</text>
    <!-- B: 07-11,12,13 -->
    <rect x="444" y="112" width="66" height="26" rx="4" fill="#e8833a"/>
    <rect x="514" y="112" width="66" height="26" rx="4" fill="#e8833a"/>
    <rect x="584" y="112" width="66" height="26" rx="4" fill="#e8833a"/>

    <!-- 지연 축 -->
    <line x1="90" y1="320" x2="670" y2="320" stroke="#d4d4d4" stroke-width="1"/>
    <g stroke="#efefef" stroke-width="1">
      <line x1="90" y1="180" x2="670" y2="180"/>
      <line x1="90" y1="250" x2="670" y2="250"/>
    </g>
    <g font-size="10" fill="#9b9b9b">
      <text x="84" y="323" text-anchor="end">0</text>
      <text x="84" y="253" text-anchor="end">10ms</text>
      <text x="84" y="183" text-anchor="end">30ms</text>
    </g>

    <!-- 지연 점: 전 10ms(y=250), 후 30ms(y=180) -->
    <polyline points="123,250 193,250 263,250" fill="none" stroke="#c9372c" stroke-width="2.5"/>
    <polyline points="477,180 547,180 617,180" fill="none" stroke="#c9372c" stroke-width="2.5"/>
    <g fill="#c9372c">
      <circle cx="123" cy="250" r="4"/><circle cx="193" cy="250" r="4"/><circle cx="263" cy="250" r="4"/>
      <circle cx="477" cy="180" r="4"/><circle cx="547" cy="180" r="4"/><circle cx="617" cy="180" r="4"/>
    </g>

    <!-- 날짜 라벨 -->
    <g font-size="10.5" fill="#7a7a7a" text-anchor="middle">
      <text x="123" y="338">07-07</text><text x="193" y="338">08</text><text x="263" y="338">09</text>
      <text x="370" y="338">10</text>
      <text x="477" y="338">11</text><text x="547" y="338">12</text><text x="617" y="338">13</text>
    </g>

    <!-- 전/후 창 브래킷 -->
    <g stroke="#2a78d6" stroke-width="1.5" fill="none">
      <path d="M90,352 v6 h206 v-6"/>
    </g>
    <text x="193" y="374" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="600">전 N일 평균 = 10ms</text>
    <g stroke="#e8833a" stroke-width="1.5" fill="none">
      <path d="M444,352 v6 h206 v-6"/>
    </g>
    <text x="547" y="374" font-size="11.5" fill="#e8833a" text-anchor="middle" font-weight="600">후 N일 평균 = 30ms</text>
  </g>

  <!-- 판정 박스 -->
  <rect x="230" y="392" width="300" height="26" rx="6" fill="#fbecea" stroke="#e0a06a"/>
  <text x="380" y="409" font-size="12.5" font-weight="700" fill="#a5501a" text-anchor="middle">비율 30/10 = 3.0 ≥ 1.3 → REGRESSED</text>
</svg>
