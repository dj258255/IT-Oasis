<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="1000" height="470" rx="12" fill="#0d1117"/>
  <text x="500" y="32" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Phase C — 세 층의 프로비저닝, 하나의 종점</text>
  <text x="500" y="54" text-anchor="middle" fill="#6e7681" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">DB가 태어나는 곳은 셋이지만, 전부 멱등 PUT 하나로 관제탑에 등록된다 — 재실행해도 중복이 아니라 갱신</text>

  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
  </defs>

  <!-- K8s -->
  <rect x="30" y="80" width="280" height="130" rx="10" fill="#010409" stroke="#1f6feb"/>
  <rect x="30" y="80" width="280" height="26" rx="10" fill="#13283f"/>
  <text x="170" y="97" text-anchor="middle" fill="#58a6ff" font-size="12.5">Kubernetes — CloudNativePG</text>
  <text x="46" y="126" fill="#c9d1d9" font-size="11.5">kubectl apply cluster.yml</text>
  <text x="46" y="146" fill="#c9d1d9" font-size="11.5">Operator가 프로비저닝 (Day-1/2)</text>
  <text x="46" y="166" fill="#c9d1d9" font-size="11.5">-app Secret 자동 생성 (접속 정보)</text>
  <text x="46" y="192" fill="#3fb950" font-size="11">e2e 완주 — kind, PG 16.4 health up</text>

  <!-- Ansible -->
  <rect x="360" y="80" width="280" height="130" rx="10" fill="#010409" stroke="#1f6feb"/>
  <rect x="360" y="80" width="280" height="26" rx="10" fill="#13283f"/>
  <text x="500" y="97" text-anchor="middle" fill="#58a6ff" font-size="12.5">온프레미스/VM — Ansible</text>
  <text x="376" y="126" fill="#c9d1d9" font-size="11.5">register-db.yml 플레이북</text>
  <text x="376" y="146" fill="#c9d1d9" font-size="11.5">최소 권한 모니터링 계정 생성</text>
  <text x="376" y="166" fill="#c9d1d9" font-size="11.5">(pg_read_all_stats)</text>
  <text x="376" y="192" fill="#3fb950" font-size="11">e2e 완주 — 재실행 시 changed=0</text>

  <!-- Terraform -->
  <rect x="690" y="80" width="280" height="130" rx="10" fill="#010409" stroke="#9e6a03"/>
  <rect x="690" y="80" width="280" height="26" rx="10" fill="#2d2305"/>
  <text x="830" y="97" text-anchor="middle" fill="#d29922" font-size="12.5">클라우드 — Terraform(OpenTofu)</text>
  <text x="706" y="126" fill="#c9d1d9" font-size="11.5">aws_db_instance (RDS)</text>
  <text x="706" y="146" fill="#c9d1d9" font-size="11.5">생성 후 local-exec로 등록</text>
  <text x="706" y="176" fill="#d29922" font-size="11">validate까지 — apply는 자격증명</text>
  <text x="706" y="192" fill="#d29922" font-size="11">필요라 미실행 (정직 표기)</text>

  <!-- 화살표 3개 → PUT -->
  <line x1="170" y1="210" x2="440" y2="288" stroke="#8b949e" marker-end="url(#pa)"/>
  <line x1="500" y1="210" x2="500" y2="288" stroke="#8b949e" marker-end="url(#pa)"/>
  <line x1="830" y1="210" x2="560" y2="288" stroke="#8b949e" stroke-dasharray="5,4" marker-end="url(#pa)"/>

  <!-- 멱등 PUT -->
  <rect x="330" y="296" width="340" height="58" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="500" y="320" text-anchor="middle" fill="#3fb950" font-size="13">PUT /api/instances (멱등 등록)</text>
  <text x="500" y="340" text-anchor="middle" fill="#8b949e" font-size="11">같은 이름이면 갱신, 없으면 신규 — 어느 쪽이든 접속 검증</text>

  <line x1="500" y1="354" x2="500" y2="386" stroke="#8b949e" marker-end="url(#pa)"/>

  <!-- DBTower -->
  <rect x="290" y="394" width="420" height="52" rx="10" fill="#010409" stroke="#1f6feb"/>
  <text x="500" y="416" text-anchor="middle" fill="#58a6ff" font-size="13">DBTower 관제탑</text>
  <text x="500" y="435" text-anchor="middle" fill="#8b949e" font-size="11">등록 즉시 health·수집·진단 시작 — 생성과 관제가 이어진다</text>
</svg>
