<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1400" height="620" fill="#000000"/>
  <text x="56" y="76" font-size="46" font-weight="800" fill="#FFFFFF">내가 적어 둔 문장이 틀렸다</text>
  <text x="56" y="114" font-size="28.7" fill="#8B95A1">경보 문서에 "상한까지 여유가 있어 사람이 볼 시간이 남는다" 고 썼는데, 재 보니 아니었다</text>

  <text x="56" y="180" font-size="26" fill="#C4C9D0">무한 큐 OOM 실험의 순증 1,077,906건 / 84초 = 초당 12,832건. 상한 2만으로 환산하면</text>

  <g text-anchor="middle">
    <rect x="56" y="212" width="410" height="170" rx="20" fill="#15181E" stroke="#F04452"/>
    <text x="261" y="260" font-size="30" font-weight="700" fill="#FFFFFF">50% → 100%</text>
    <text x="261" y="330" font-size="52" font-weight="800" fill="#F04452">0.78초</text>

    <rect x="495" y="212" width="410" height="170" rx="20" fill="#15181E" stroke="#2A2F38"/>
    <text x="700" y="260" font-size="30" font-weight="700" fill="#FFFFFF">0 → 100%</text>
    <text x="700" y="330" font-size="52" font-weight="800" fill="#F5A524">1.56초</text>

    <rect x="934" y="212" width="410" height="170" rx="20" fill="#15181E" stroke="#2A2F38"/>
    <text x="1139" y="260" font-size="30" font-weight="700" fill="#FFFFFF">scrape 15s · for 1m</text>
    <text x="1139" y="330" font-size="32" font-weight="800" fill="#F04452">평가 전에 큐가 찬다</text>
  </g>

  <rect x="56" y="414" width="1288" height="90" rx="16" fill="#15181E" stroke="#2A2F38"/>
  <text x="84" y="452" font-size="28" font-weight="700" fill="#F5A524">임계값을 내리는 건 답이 아니다</text>
  <text x="84" y="486" font-size="25" fill="#C4C9D0">90% → 100% 도 0.16초다. 어디에 두든 급성 구간에서는 늦고, 낮출수록 완만한 열화 구간에서 오탐만 는다</text>

  <text x="700" y="560" font-size="26" fill="#0B7A4B" text-anchor="middle">그래서 임계값 대신 경보의 역할을 다시 적었다</text>
  <text x="700" y="596" font-size="26" fill="#8B95A1" text-anchor="middle">급성 붕괴는 상한과 CallerRunsPolicy 가 막고, 경보는 완만한 열화와 사후 기록을 맡는다</text>
</svg>
