<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1400" height="620" fill="#000000"/>
  <text x="56" y="76" font-size="46" font-weight="800" fill="#FFFFFF">배포는 자동인데 컬럼 하나를 못 늘렸다</text>
  <text x="56" y="114" font-size="28.7" fill="#8B95A1">ddl-auto 는 test·perf 프로필에만 있었고, 비임베디드 DB 의 Boot 기본값은 none 이다</text>

  <rect x="56" y="164" width="1288" height="104" rx="20" fill="#15181E" stroke="#F04452"/>
  <text x="84" y="208" font-size="28" font-weight="700" fill="#FFFFFF">그래서 구조가 이랬다</text>
  <text x="84" y="248" font-size="27" fill="#C4C9D0">push → 새 이미지가 뜬다 → 엔티티에는 있는 컬럼이 DB 에는 없다 → <tspan font-weight="800" fill="#F04452">런타임에 죽는다</tspan></text>

  <rect x="56" y="300" width="628" height="180" rx="20" fill="#15181E" stroke="#2A2F38"/>
  <text x="84" y="344" font-size="28" font-weight="700" fill="#FFFFFF">baseline 을 손으로 쓰지 않았다</text>
  <text x="84" y="388" font-size="26" fill="#C4C9D0">엔티티에서 DDL 을 생성했다</text>
  <text x="84" y="424" font-size="26" fill="#8B95A1">18테이블 · FK 16 · UNIQUE 4</text>
  <text x="84" y="462" font-size="25" fill="#F5A524">손으로 쓰면 어긋나는 순간부터 아무도 모른다</text>

  <rect x="716" y="300" width="628" height="180" rx="20" fill="#F2F4F6"/>
  <text x="744" y="344" font-size="28" font-weight="700" fill="#191F28">검증은 진짜 MySQL 8.0 에서</text>
  <text x="744" y="388" font-size="26" fill="#4E5968">Testcontainers. baseline 에 engine=InnoDB,</text>
  <text x="744" y="424" font-size="26" fill="#4E5968">enum(...) 같은 MySQL 전용 문법이 있다</text>
  <text x="744" y="462" font-size="25" fill="#0B7A4B">H2 로는 확인할 수 없다</text>

  <text x="700" y="536" font-size="26" fill="#8B95A1" text-anchor="middle">같은 이유로 동시성도 실 엔진에서 다시 쟀다. 150명이 동시에 들어가자 정원 30인데 34명이 들어갔다</text>
  <text x="700" y="574" font-size="26" fill="#C4C9D0" text-anchor="middle">인메모리 DB 는 왕복이 없어 재시도 기반 전략에 유리하게 나온다. 거기서 고르면 실제 엔진에서 순위가 뒤집힌다</text>
</svg>
