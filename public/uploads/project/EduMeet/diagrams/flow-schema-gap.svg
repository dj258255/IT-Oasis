<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1400" height="640" fill="#000000"/>
  <text x="56" y="76" font-size="46" font-weight="800" fill="#FFFFFF">앱 배포는 자동인데 스키마 배포는 경로가 없었다</text>
  <text x="56" y="114" font-size="28.7" fill="#8B95A1">ddl-auto 는 test·perf 프로필에만 있었고, 비임베디드 DB 의 Boot 기본값은 none 이다</text>

  <rect x="56" y="158" width="1288" height="112" rx="20" fill="#15181E" stroke="#F04452"/>
  <text x="84" y="200" font-size="28" font-weight="700" fill="#FFFFFF">부팅에서 죽지도 않는다</text>
  <text x="84" y="240" font-size="26" fill="#C4C9D0">push → 새 이미지가 뜬다 → 컨테이너는 정상 → <tspan font-weight="800" fill="#F04452">그 엔티티를 처음 쓰는 질의에서 Unknown column</tspan></text>
  <text x="84" y="262" font-size="23" fill="#8B95A1">none 은 "손대지 않는다" 이지 "확인한다" 가 아니다. 헬스체크는 초록인데 기능만 죽는다</text>

  <rect x="56" y="300" width="1288" height="122" rx="20" fill="#15181E" stroke="#F5A524"/>
  <text x="84" y="342" font-size="28" font-weight="700" fill="#F5A524">baseline-on-migrate 가 무엇을 안 해 주는지가 핵심이었다</text>
  <text x="84" y="384" font-size="26" fill="#C4C9D0">스키마가 있고 이력 테이블이 없으면 "이미 V1" 로 <tspan font-weight="800" fill="#FFFFFF">표시만</tspan> 하고 V2 부터 돈다</text>
  <text x="84" y="412" font-size="24" fill="#8B95A1">기존 DB 와 V1 이 어긋나 있어도 조용히 지나간다. 잘못된 DB 를 막던 안전장치를 끄는 옵션이다</text>

  <rect x="56" y="452" width="628" height="130" rx="20" fill="#15181E" stroke="#2A2F38"/>
  <text x="84" y="492" font-size="27" font-weight="700" fill="#FFFFFF">새 DB 경로</text>
  <text x="84" y="530" font-size="25" fill="#C4C9D0">V1 부터 V9 까지 전부 적용된다</text>
  <text x="84" y="562" font-size="23" fill="#8B95A1">원래 있던 시험은 여기까지만 봤다</text>

  <rect x="716" y="452" width="628" height="130" rx="20" fill="#F2F4F6"/>
  <text x="744" y="492" font-size="27" font-weight="700" fill="#191F28">기존 DB 경로 (새로 고정)</text>
  <text x="744" y="530" font-size="25" fill="#4E5968">V1 은 BASELINE 으로 표시만, V2~V9 는 실제로</text>
  <text x="744" y="562" font-size="23" fill="#0B7A4B">ddl-auto validate 로 어긋나면 부팅에서 실패</text>

  <text x="700" y="618" font-size="25" fill="#8B95A1" text-anchor="middle">검증은 진짜 MySQL 8.0(Testcontainers)에서 한다. baseline 에 engine=InnoDB · enum(...) 이 있어 H2 로는 확인할 수 없다</text>
</svg>
