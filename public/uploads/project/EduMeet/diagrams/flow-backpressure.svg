<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1400" height="620" fill="#000000"/>
  <text x="56" y="76" font-size="46" font-weight="800" fill="#FFFFFF">무한 큐가 위험해지는 조건은 발행이 아니라 소비였다</text>
  <text x="56" y="114" font-size="28.7" fill="#8B95A1">구독자 150명 · 발행 4×60/s · 힙 512MB · 4분. 발행률은 그대로 두고 소비 속도만 바꿨다</text>

  <g text-anchor="middle">
    <rect x="56" y="164" width="628" height="230" rx="20" fill="#15181E" stroke="#2A2F38"/>
    <text x="370" y="214" font-size="30" font-weight="700" fill="#FFFFFF">가설: 빠르게 발행하면 OOM</text>
    <text x="370" y="256" font-size="26" fill="#8B95A1">발행률을 올려 부하를 걸었다</text>
    <text x="370" y="318" font-size="42" font-weight="800" fill="#0B7A4B">안 죽었다</text>
    <text x="370" y="360" font-size="26" fill="#C4C9D0">4분 생존 · 큐 최대 525</text>

    <rect x="716" y="164" width="628" height="230" rx="20" fill="#15181E" stroke="#F04452"/>
    <text x="1030" y="214" font-size="30" font-weight="700" fill="#FFFFFF">뒤집은 가설: 소비만 5KB/s 로</text>
    <text x="1030" y="256" font-size="26" fill="#8B95A1">같은 부하 · 같은 힙. 소비자만 조였다</text>
    <text x="1030" y="318" font-size="42" font-weight="800" fill="#F04452">84초에 OOM</text>
    <text x="1030" y="360" font-size="26" fill="#C4C9D0">큐 1,077,906 · 2,053배</text>
  </g>

  <rect x="56" y="426" width="1288" height="90" rx="16" fill="#F2F4F6"/>
  <text x="84" y="464" font-size="28" font-weight="700" fill="#0B7A4B">상한 2만 + CallerRunsPolicy → 84초 OOM 에서 444초 무중단으로</text>
  <text x="84" y="498" font-size="25" fill="#4E5968">Kafka·NATS 는 기각했다. 병목이 브로커가 아니라 아웃바운드 큐라 넣어도 그 큐가 그대로 남는다</text>

  <text x="700" y="570" font-size="26" fill="#F5A524" text-anchor="middle">그 역압이 착지하는 곳은 나중에야 확인했다. brokerChannel 에 실행기가 없어 호출 스레드가 전송을 떠안는다</text>
  <text x="700" y="602" font-size="26" fill="#8B95A1" text-anchor="middle">자막은 http-nio 라, 자막이 채팅을 막는 게 아니라 REST API 전체를 막는다</text>
</svg>
