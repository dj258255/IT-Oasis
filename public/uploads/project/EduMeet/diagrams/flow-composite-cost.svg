<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1400" height="660" fill="#000000"/>
  <text x="56" y="76" font-size="46" font-weight="800" fill="#FFFFFF">요구 사양을 그대로 믿지 않았다</text>
  <text x="56" y="114" font-size="28.7" fill="#8B95A1">LiveKit Egress 가 minimumCpu 4 · available 2 를 찍는데, 바로 아래 줄에 service ready 가 있었다</text>

  <rect x="56" y="158" width="628" height="200" rx="20" fill="#15181E" stroke="#F5A524"/>
  <text x="84" y="200" font-size="28" font-weight="700" fill="#FFFFFF">로그 필드 이름이 틀렸다</text>
  <text x="84" y="244" font-size="24" fill="#C4C9D0">"minimumCpu", requirements[len(requirements)-1]</text>
  <text x="84" y="284" font-size="26" fill="#8B95A1">최솟값이 아니라 요구 목록의 최댓값이 찍힌다</text>
  <text x="84" y="330" font-size="28" font-weight="800" fill="#F5A524">실제 하한은 0.5. 오디오 방송은 2코어에서 돈다</text>

  <rect x="716" y="158" width="628" height="200" rx="20" fill="#15181E" stroke="#2A2F38"/>
  <text x="744" y="200" font-size="28" font-weight="700" fill="#FFFFFF">타입별 CPU 비용은 설정에 값으로 있다</text>
  <text x="744" y="242" font-size="25" fill="#8B95A1">room_composite  3.0      web  3.0</text>
  <text x="744" y="278" font-size="25" fill="#C4C9D0">track_composite  2.0      track  1.0</text>
  <text x="744" y="314" font-size="25" fill="#C4C9D0">audio_room_composite  1.0</text>
  <text x="744" y="344" font-size="23" fill="#8B95A1">비싼 타입이 비싼 이유는 Chrome 으로 화면을 합성해서다</text>

  <rect x="56" y="382" width="1288" height="86" rx="16" fill="#F2F4F6"/>
  <text x="84" y="418" font-size="28" font-weight="700" fill="#191F28">그런데 방송은 발표자 한 명만 나간다. 합성할 것이 없다</text>
  <text x="84" y="452" font-size="25" fill="#4E5968">track_composite 2.0 이 제일 가까운 후보였지만 이 서버의 코어 전부다. 앱·MySQL·Redis 가 이미 그 위에서 돈다</text>

  <text x="56" y="516" font-size="28" font-weight="700" fill="#C4C9D0">H264 리먹싱</text>
  <rect x="380" y="490" width="18" height="38" rx="7" fill="#0B7A4B"/>
  <text x="418" y="520" font-size="34" font-weight="800" fill="#0B7A4B">0.084초</text>

  <text x="56" y="590" font-size="28" font-weight="700" fill="#C4C9D0">VP8 → H264 재인코딩</text>
  <rect x="380" y="564" width="800" height="38" rx="7" fill="#F04452"/>
  <text x="1200" y="594" font-size="34" font-weight="800" fill="#F04452">5.456초</text>

  <text x="700" y="640" font-size="25" fill="#8B95A1" text-anchor="middle">OCI aarch64 2 OCPU · 20초 분량 · 2초 세그먼트 10개. 약 65배라, 브라우저가 H264 를 주면 CPU 를 거의 안 쓴다</text>
</svg>
