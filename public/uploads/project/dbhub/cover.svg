<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 관제탑: 중앙 컨트롤 플레인 -->
  <rect x="450" y="120" width="300" height="120" rx="16" fill="#0ea5e9" opacity="0.14" stroke="url(#accent)" stroke-width="2"/>
  <text x="600" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="34" font-weight="700" fill="#e2e8f0">DBHub</text>
  <text x="600" y="212" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="17" fill="#94a3b8">control plane</text>

  <!-- 연결선 -->
  <path d="M 520 240 L 260 380" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <path d="M 600 240 L 600 380" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <path d="M 680 240 L 940 380" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>

  <!-- 이기종 DB 실린더 3개 -->
  <g font-family="JetBrains Mono, monospace" font-size="19" fill="#cbd5e1">
    <g>
      <ellipse cx="260" cy="395" rx="95" ry="24" fill="#334155"/>
      <rect x="165" y="395" width="190" height="95" fill="#334155"/>
      <ellipse cx="260" cy="490" rx="95" ry="24" fill="#1e293b" stroke="#475569"/>
      <ellipse cx="260" cy="395" rx="95" ry="24" fill="#475569"/>
      <text x="260" y="455" text-anchor="middle">MySQL</text>
    </g>
    <g>
      <ellipse cx="600" cy="395" rx="95" ry="24" fill="#334155"/>
      <rect x="505" y="395" width="190" height="95" fill="#334155"/>
      <ellipse cx="600" cy="490" rx="95" ry="24" fill="#1e293b" stroke="#475569"/>
      <ellipse cx="600" cy="395" rx="95" ry="24" fill="#475569"/>
      <text x="600" y="455" text-anchor="middle">PostgreSQL</text>
    </g>
    <g>
      <ellipse cx="940" cy="395" rx="95" ry="24" fill="#334155"/>
      <rect x="845" y="395" width="190" height="95" fill="#334155"/>
      <ellipse cx="940" cy="490" rx="95" ry="24" fill="#1e293b" stroke="#475569"/>
      <ellipse cx="940" cy="395" rx="95" ry="24" fill="#475569"/>
      <text x="940" y="455" text-anchor="middle">SQL Server</text>
    </g>
  </g>

  <text x="600" y="580" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="21" fill="#64748b">이기종 DBMS 운영 관리 플랫폼 — 등록·모니터링·시점 비교·백업 정책</text>
</svg>
