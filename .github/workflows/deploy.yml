name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro glob 콘텐츠 로더의 content sync가 CI에서 비결정적으로 일부 글을
      # 조용히 누락시킨다(같은 커밋이 빌드마다 585·249·107·51·4편 등으로 출렁,
      # OS 무관). 매 시도 콘텐츠 스토어를 비운 독립 빌드를 반복해, 기대 글 수
      # (초안·unlisted 제외)를 채운 빌드가 나올 때까지 재시도한다. 끝내 미달이면
      # 배포를 막아(fail-closed) 잘린 사이트가 라이브로 나가지 않게 한다.
      - name: Build until content-complete
        run: |
          set +e
          TOTAL=$(find src/content/blog -name '*.md' | wc -l | tr -d ' ')
          DRAFT=$(grep -rlE '^draft:[[:space:]]*true' src/content/blog --include='*.md' | wc -l | tr -d ' ')
          UNLISTED=$(grep -rlE '^unlisted:[[:space:]]*true' src/content/blog --include='*.md' | wc -l | tr -d ' ')
          EXPECTED=$((TOTAL - DRAFT - UNLISTED))
          echo "expected published posts: $EXPECTED (total=$TOTAL draft=$DRAFT unlisted=$UNLISTED)"
          RENDERED=0
          for i in $(seq 1 20); do
            # clean BOTH the root .astro (types/settings) and node_modules/.astro
            # (content data store) so each attempt is a truly independent cold build
            rm -rf .astro node_modules/.astro dist
            pnpm run build
            RENDERED=$(grep -oE 'data-en="All">[^<]*</span>[[:space:]]*<span class="sidebar-count">[0-9]+' dist/index.html 2>/dev/null | grep -oE '[0-9]+$' | head -1)
            RENDERED=${RENDERED:-0}
            echo "::notice::build attempt $i — published $RENDERED / $EXPECTED"
            if [ "$RENDERED" -ge "$EXPECTED" ]; then
              echo "content complete on attempt $i"
              exit 0
            fi
            echo "incomplete ($RENDERED/$EXPECTED), retrying..."
            sleep 3
          done
          echo "::error::content sync incomplete after 20 attempts ($RENDERED/$EXPECTED) — aborting deploy to keep last good site live"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
