name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro glob 콘텐츠 로더가 CI 콜드 빌드에서 일부 글을 비결정적으로 조용히
      # 누락시킨다. 다만 콘텐츠 데이터 스토어(node_modules/.astro)는 빌드 간
      # '누적'되므로, 스토어를 유지한 채 재빌드하면 빠진 글이 채워져 전량에 도달한다.
      # (예전 버전은 매 시도 스토어를 비워 매번 독립 콜드 빌드가 되는 바람에 완성으로
      # 수렴하지 못하고 20연속 미달로 배포가 실패했다 — 그게 실제 실패 원인이었다.)
      # 기대 글 수(초안·unlisted 제외)를 채울 때까지 재시도하고, 끝내 미달이면
      # 배포를 막아(fail-closed) 잘린 사이트가 라이브로 나가지 않게 한다.
      - name: Build until content-complete
        run: |
          set +e
          TOTAL=$(find src/content/blog -name '*.md' | wc -l | tr -d ' ')
          DRAFT=$(grep -rlE '^draft:[[:space:]]*true' src/content/blog --include='*.md' | wc -l | tr -d ' ')
          UNLISTED=$(grep -rlE '^unlisted:[[:space:]]*true' src/content/blog --include='*.md' | wc -l | tr -d ' ')
          EXPECTED=$((TOTAL - DRAFT - UNLISTED))
          echo "expected published posts: $EXPECTED (total=$TOTAL draft=$DRAFT unlisted=$UNLISTED)"
          RENDERED=0
          PREV=-1; STALL=0
          for i in $(seq 1 20); do
            # 이 자리에서 방식을 두 번 뒤집었다. 매 시도 스토어를 비우는 독립 콜드 빌드도,
            # 스토어를 유지하는 누적 빌드도 각각 20연속 미달로 배포를 막은 적이 있다.
            # 두 방식의 실패 모드가 다르다.
            #   독립 콜드: 매번 새 도박이라 운이 나쁘면 20번 다 미달
            #   누적 유지: 소스 mtime 이 안 바뀌면 증분 sync 가 스킵해 같은 수에서 멈춘다
            # 그래서 둘을 섞는다. 기본은 누적이되 **소스 mtime 을 갱신해** 증분 sync 가
            # 반드시 다시 훑게 하고, 진전이 없으면 스토어를 비워 독립 도박으로 전환한다.
            if [ "$STALL" -ge 2 ]; then
              echo "3회째 진전 없음 — 스토어를 비우고 독립 빌드로 전환"
              rm -rf node_modules/.astro
              STALL=0
            else
              find src/content -name '*.md' -exec touch {} +
            fi
            rm -rf dist
            pnpm run build
            RENDERED=$(grep -oE 'data-en="All">[^<]*</span>[[:space:]]*<span class="sidebar-count">[0-9]+' dist/index.html 2>/dev/null | grep -oE '[0-9]+$' | head -1)
            RENDERED=${RENDERED:-0}
            echo "::notice::build attempt $i — published $RENDERED / $EXPECTED"
            if [ "$RENDERED" -ge "$EXPECTED" ]; then
              echo "content complete on attempt $i"
              exit 0
            fi
            if [ "$RENDERED" -le "$PREV" ]; then STALL=$((STALL+1)); else STALL=0; fi
            PREV=$RENDERED
            echo "incomplete ($RENDERED/$EXPECTED) — 재시도 (정체 $STALL 회)"
          done
          echo "::error::content sync incomplete after 20 attempts ($RENDERED/$EXPECTED) — aborting deploy to keep last good site live"

          # 어느 글이 빠졌는지 찍는다. 로컬에서는 재현되지 않아 러너에서만 확인할 수 있다.
          # 기대 슬러그(초안·unlisted 제외)와 dist에 실제로 생성된 페이지를 대조한다.
          echo "--- 누락 진단 ---"
          node -e '
            const fs = require("fs"), path = require("path");
            const slugify = s => s.toLowerCase().replace(/[^\p{L}\p{N}\-_]+/gu, "-").replace(/^-+|-+$/g, "");
            const walk = d => fs.readdirSync(d, {withFileTypes: true}).flatMap(e => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : (e.name.endsWith(".md") ? [p] : []);
            });
            const expected = new Set();
            for (const f of walk("src/content/blog")) {
              const head = fs.readFileSync(f, "utf8").split("\n---")[0];
              if (/^draft:\s*true/m.test(head) || /^unlisted:\s*true/m.test(head)) continue;
              expected.add(f.replace(/^src\/content\/blog\//, "").replace(/\.md$/, "").split("/").map(slugify).join("/"));
            }
            const built = new Set();
            const distBlog = "dist/blog";
            const walkDist = (d, base) => { for (const e of fs.readdirSync(d, {withFileTypes: true})) {
              if (!e.isDirectory()) continue;
              const p = path.join(d, e.name), rel = base ? base + "/" + e.name : e.name;
              if (fs.existsSync(path.join(p, "index.html"))) built.add(rel);
              walkDist(p, rel);
            }};
            if (fs.existsSync(distBlog)) walkDist(distBlog, "");
            const missing = [...expected].filter(s => !built.has(s)).sort();
            console.log("기대 " + expected.size + "편, 생성 " + built.size + "편, 누락 " + missing.length + "편");
            for (const m of missing) console.log("  누락: " + m);
          ' || echo "진단 스크립트 실패"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
