name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro glob 콘텐츠 로더가 CI 콜드 빌드에서 일부 글을 비결정적으로 조용히
      # 누락시킨다. 다만 콘텐츠 데이터 스토어(node_modules/.astro)는 빌드 간
      # '누적'되므로, 스토어를 유지한 채 재빌드하면 빠진 글이 채워져 전량에 도달한다.
      # (예전 버전은 매 시도 스토어를 비워 매번 독립 콜드 빌드가 되는 바람에 완성으로
      # 수렴하지 못하고 20연속 미달로 배포가 실패했다 — 그게 실제 실패 원인이었다.)
      # 전량에 도달할 때까지 재시도하고, 끝내 미달이면 배포를 막아(fail-closed)
      # 잘린 사이트가 라이브로 나가지 않게 한다.
      - name: Build until content-complete
        run: |
          set +e
          PREV_MISSING=999999; STALL=0
          MISSING=999999
          for i in $(seq 1 20); do
            # 이 자리에서 방식을 두 번 뒤집었다. 매 시도 스토어를 비우는 독립 콜드 빌드도,
            # 스토어를 유지하는 누적 빌드도 각각 20연속 미달로 배포를 막은 적이 있다.
            # 두 방식의 실패 모드가 다르다.
            #   독립 콜드: 매번 새 도박이라 운이 나쁘면 20번 다 미달
            #   누적 유지: 소스 mtime 이 안 바뀌면 증분 sync 가 스킵해 같은 수에서 멈춘다
            # 그래서 둘을 섞는다. 기본은 누적이되 **소스 mtime 을 갱신해** 증분 sync 가
            # 반드시 다시 훑게 하고, 진전이 없으면 스토어를 비워 독립 도박으로 전환한다.
            if [ "$STALL" -ge 2 ]; then
              echo "3회째 진전 없음 — 스토어를 비우고 독립 빌드로 전환"
              rm -rf node_modules/.astro
              STALL=0
            else
              find src/content -name '*.md' -exec touch {} +
            fi
            rm -rf dist
            pnpm run build

            # 완성 판정은 화면 마크업이 아니라 생성된 파일로 한다. 예전에는 사이드바 "전체"
            # 뱃지 숫자를 dist/index.html 에서 긁었는데, 그 마크업이 바뀌거나 페이지에서
            # 사라지면 빌드가 멀쩡해도 0으로 읽혀 배포가 영구히 막혔다(2026-08-08, 2026-09-12).
            # 같은 계산을 로컬에서도 그대로 돌릴 수 있게 스크립트 하나로 두고, 판정과 진단이
            # 같은 코드를 쓰게 한다: node scripts/content-gate.mjs
            node scripts/content-gate.mjs > gate-missing.txt 2> gate-log.txt
            cat gate-log.txt
            MISSING=$(tail -1 gate-missing.txt 2>/dev/null)
            case "$MISSING" in
              ''|*[!0-9]*) MISSING=999999 ;;
            esac
            echo "::notice::build attempt $i — missing $MISSING"
            if [ "$MISSING" -eq 0 ]; then
              echo "content complete on attempt $i"
              exit 0
            fi
            if [ "$MISSING" -ge "$PREV_MISSING" ]; then STALL=$((STALL+1)); else STALL=0; fi
            PREV_MISSING=$MISSING
            echo "incomplete (누락 $MISSING편) — 재시도 (정체 $STALL 회)"
          done
          echo "::error::content sync incomplete after 20 attempts (누락 $MISSING편) — aborting deploy to keep last good site live"
          echo "--- 마지막 시도의 누락 진단 ---"
          cat gate-log.txt
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
